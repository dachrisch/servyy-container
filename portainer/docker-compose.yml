services:
  portainer:
    image: portainer/portainer-ce:alpine
    container_name: ${COMPOSE_PROJECT_NAME}.portainer
    # Portainer only accepts the initial admin password via the --admin-password
    # (bcrypt) or --admin-password-file (plaintext) CLI flag — the
    # PORTAINER_ADMIN_PASSWORD env var is NOT read by the entrypoint, so without this
    # the account falls through to the first-run web wizard. --admin-password-file is
    # used (instead of --admin-password, which needs a bcrypt hash) so we avoid a
    # passlib/bcrypt dependency and a non-deterministic hash that would recreate the
    # container every deploy. The flag is ignored once the admin account exists, so
    # this is safe/idempotent across routine deploys. The password file is rendered by
    # the portainer env template (admin-password.txt, mode 0600).
    command: -H unix:///var/run/docker.sock --admin-password-file /run/secrets/portainer-admin
    # Shared secret with the agent (portainer.agent_secret in secrets.yml). Enables
    # secret mode so the server's signed requests to the agent verify. The server
    # reads AGENT_SECRET from the environment (not from Settings), so it must be set
    # here rather than via the API.
    environment:
      AGENT_SECRET: ${AGENT_SECRET}
    labels:
      - traefik.enable=true
      - traefik.http.routers.${SERVICE_NAME}.tls=true
      - traefik.http.routers.${SERVICE_NAME}.rule=Host(`${SERVICE_HOST}`)
      - traefik.http.routers.${SERVICE_NAME}.tls.certresolver=letsencryptdnsresolver
      # Portainer answers unknown paths with a bare 19-byte "404 page not
      # found"; keep the branded page for this host (opt-in, see
      # traefik/dynamic.yaml error-pages-404).
      - traefik.http.routers.${SERVICE_NAME}.middlewares=crawler-ratelimit@file,error-pages-404@file
      - traefik.http.routers.${SERVICE_NAME}.service=portainer
      - traefik.http.services.portainer.loadbalancer.server.port=9000
      - traefik.http.routers.${SERVICE_NAME}_local_qualified.rule=Host(`${SERVICE_NAME}.${LOCAL_HOSTNAME}`)
      - traefik.http.routers.${SERVICE_NAME}_local_qualified.entrypoints=web
      - com.centurylinklabs.watchtower.scope=prod
    volumes:
      - data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      # Plaintext admin password, rendered at deploy time (mode 0600). Consumed by
      # the --admin-password-file flag above; only used on first init.
      - ./admin-password.txt:/run/secrets/portainer-admin:ro
    healthcheck:
      test: wget -q --no-verbose --tries=3 --spider http://127.0.0.1:9000/api/system/status || exit 1
    restart: unless-stopped
    networks:
      - proxy

  # see https://docs.photoprism.app/getting-started/updates/#watchtower
  # openserbia/watchtower: maintained fork of containrrr/watchtower (archived
  # upstream). Adds health-check gating with automatic rollback. DOCKER_API_VERSION
  # is deliberately unset so the fork can negotiate the daemon API version.
  # Tag floats on `latest`: the fork publishes no 1.x tags, so a pin can only
  # ever be a hand-copied digest. Accepted cost — a bad upstream release takes
  # the updater itself down, and nothing pinned is left to fall back to.
  watchtower-prod:
    restart: unless-stopped
    image: openserbia/watchtower:latest
    container_name: ${COMPOSE_PROJECT_NAME}.watchtower-prod
    labels:
      - traefik.enable=false
      - com.centurylinklabs.watchtower.scope=prod
    environment:
      # https://openserbia.github.io/watchtower/arguments/
      WATCHTOWER_SCOPE: "prod"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: 7200 # checks for updates every two hours
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      # Wait for the replacement container to report healthy; roll back to the
      # previous image if it never does. No-op for containers without HEALTHCHECK.
      WATCHTOWER_HEALTH_CHECK_GATED: "true"
      # Global fallback when a container has no HEALTHCHECK-derived timeout
      # (derived = start_period + retries x (interval + timeout) wins otherwise).
      # 2m covers slow-boot frontends that need their backend first.
      WATCHTOWER_HEALTH_CHECK_TIMEOUT: "2m"
      # docker.io answers anonymous HEAD manifest checks with 401; the regular
      # pull fallback works fine, so silence the per-container warnings until a
      # Docker Hub PAT exists in the vault to authenticate HEAD.
      WATCHTOWER_WARN_ON_HEAD_FAILURE: "never"
      # Honor compose depends_on (e.g. www after staging-app) when ordering
      # stop/start during an update.
      WATCHTOWER_COMPOSE_DEPENDS_ON: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    networks:
      - proxy

  watchtower-dev:
    restart: unless-stopped
    image: openserbia/watchtower:latest
    container_name: ${COMPOSE_PROJECT_NAME}.watchtower-dev
    labels:
      - traefik.enable=false
      - com.centurylinklabs.watchtower.scope=dev
    environment:
      WATCHTOWER_SCOPE: "dev"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: 300 # checks for updates every 5 minutes
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_HEALTH_CHECK_GATED: "true"
      WATCHTOWER_HEALTH_CHECK_TIMEOUT: "2m"
      WATCHTOWER_WARN_ON_HEAD_FAILURE: "never"
      WATCHTOWER_COMPOSE_DEPENDS_ON: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    networks:
      - proxy

  ofelia-scheduler:
    image: mcuadros/ofelia:latest
    container_name: ${COMPOSE_PROJECT_NAME}.ofelia
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: "UTC"
    restart: unless-stopped
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "pidof", "ofelia"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - traefik.enable=false
      - com.centurylinklabs.watchtower.scope=prod
      - ofelia.enabled=true
      - ofelia.job-local.heartbeat.schedule=@every 1h
      - ofelia.job-local.heartbeat.command=date

volumes:
  data:

networks:
  proxy:
    external: true
