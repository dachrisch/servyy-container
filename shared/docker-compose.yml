# Shared data layer (consolidated home for stateful services).
# Owns NO app traffic: backend-only, no Traefik labels.
# Consumers attach via:
#   networks:
#     shared_backend:
#       name: shared_backend
#       external: true
# and reach the host shared.redis.
#
# WP-9 (2026-11-19): `shared.mongo` is retired. Its three tenants moved to
# db-business.mongo / db-private.mongo and the container is STOPPED (not
# removed) with `shared_mongo_data` intact as the rollback for one week. The
# service block is deliberately gone, so a deploy of this project can no longer
# start it; `docker start shared.mongo` is the rollback.
#
# WP-10 (2026-11-19): `shared.db` (PostgreSQL 15, Firefly) is retired the same
# way. Firefly now lives on db-private.mariadb; `shared.db` is STOPPED with its
# bind-mounted datadir (`${DOCKER_DATA_ROOT}/finance/db`) untouched as the
# rollback for one month. The `db:` service is gone, so a `shared` deploy can
# neither start it nor remove it (this role runs compose without
# --remove-orphans). `docker start shared.db` is the rollback until the dated
# deletion checklist in history/2026-11-19_db-tier-wp10-postgres.md is run.
# This project is now redis only.
name: ${SERVICE_NAME}

services:
  redis:
    # Floats patches inside 9-alpine (the digest pin froze even patch fixes).
    # Ephemeral job-queue store: a restart loses pending Bull jobs (they retry).
    # leagues-finance uses db 0; queen uses db 1 (see finance/queen.env.j2).
    image: docker.io/valkey/valkey:9-alpine
    container_name: ${COMPOSE_PROJECT_NAME}.redis
    restart: unless-stopped
    networks:
      - backend
    labels:
      - traefik.enable=false
      - com.centurylinklabs.watchtower.scope=prod
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  # db:
  #   RETIRED 2026-11-19 (WP-10): Firefly moved to db-private.mariadb. The
  #   container and its bind-mounted datadir are STOPPED, not deleted, for the
  #   one-month rollback (`docker start shared.db`). The service block is gone
  #   on purpose: a `shared` deploy must not be able to start or remove it.
  #   Deletion checklist + date: history/2026-11-19_db-tier-wp10-postgres.md.
  #   Kept as a comment, not a service, so the datadir path stays documented:
  #     ${DOCKER_DATA_ROOT}/finance/db -> /var/lib/postgresql/data
  #   image: postgres:15
  #   container_name: ${COMPOSE_PROJECT_NAME}.db
  #   env_file: [shared.env]
  #   environment: {POSTGRES_DB: firefly, POSTGRES_USER: firefly}
  #   labels: [com.centurylinklabs.watchtower.scope=db]
  #   healthcheck: pg_isready -U firefly

networks:
  backend:
    internal: true

volumes:
  mongo_data:
    # Kept ONLY as the rollback copy after WP-9: the `shared.mongo` container is
    # stopped and this volume still holds leagues_finance, queen and dontforget
    # exactly as they were at cutover. Nothing mounts it any more. Delete this
    # declaration, the container and the volume together one week after the move
    # (step 6 in history/2026-11-19_db-tier-wp9-mongo-tiers.md) — and only after
    # a restic snapshot of the three tenants is verified restorable.
    #
    # Explicit name on purpose: it is the name the operator types.
    name: shared_mongo_data

# verification-only comment (PR closed unmerged): proves a compose edit runs
# the architecture selftest, the only CI coverage a compose file has.
