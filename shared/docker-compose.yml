# Shared data layer (consolidated home for stateful services).
# Owns NO app traffic: backend-only, no Traefik labels.
# Consumers attach via:
#   networks:
#     shared_backend:
#       name: shared_backend
#       external: true
# and reach hosts shared.redis / shared.db.
#
# WP-9 (2026-11-19): `shared.mongo` is retired. Its three tenants moved to
# db-business.mongo / db-private.mongo and the container is STOPPED (not
# removed) with `shared_mongo_data` intact as the rollback for one week. The
# service block is deliberately gone, so a deploy of this project can no longer
# start it; `docker start shared.mongo` is the rollback. What remains here is
# redis (permanent) and postgres (until WP-10 retires it).
name: ${SERVICE_NAME}

services:
  redis:
    # Floats patches inside 9-alpine (the digest pin froze even patch fixes).
    # Ephemeral job-queue store: a restart loses pending Bull jobs (they retry).
    # leagues-finance uses db 0; queen uses db 1 (see finance/queen.env.j2).
    image: docker.io/valkey/valkey:9-alpine
    container_name: ${COMPOSE_PROJECT_NAME}.redis
    restart: unless-stopped
    networks:
      - backend
    labels:
      - traefik.enable=false
      - com.centurylinklabs.watchtower.scope=prod
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  db:
    # Firefly III postgres. Bind mount keeps the EXISTING finance path:
    # zero data movement, adopted on prod, created fresh on test.
    image: postgres:15
    container_name: ${COMPOSE_PROJECT_NAME}.db
    restart: unless-stopped
    env_file:
      - shared.env
    environment:
      POSTGRES_DB: firefly
      POSTGRES_USER: firefly
    volumes:
      - ${DOCKER_DATA_ROOT}/finance/db:/var/lib/postgresql/data
    networks:
      - backend
    labels:
      - traefik.enable=false
      # Database server: `db` watchtower scope (D15). Postgres 15 patches are
      # same-datadir; the 15 -> 16+ step is a reviewed PR, never a pull. This
      # server is removed in Phase 9 once Firefly moves to db-private.mariadb.
      - com.centurylinklabs.watchtower.scope=db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firefly"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  backend:
    internal: true

volumes:
  mongo_data:
    # Kept ONLY as the rollback copy after WP-9: the `shared.mongo` container is
    # stopped and this volume still holds leagues_finance, queen and dontforget
    # exactly as they were at cutover. Nothing mounts it any more. Delete this
    # declaration, the container and the volume together one week after the move
    # (step 6 in history/2026-11-19_db-tier-wp9-mongo-tiers.md) — and only after
    # a restic snapshot of the three tenants is verified restorable.
    #
    # Explicit name on purpose: it is the name the operator types.
    name: shared_mongo_data
