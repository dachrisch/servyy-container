# Shared data layer (consolidated home for stateful services).
# Owns NO app traffic: backend-only, no Traefik labels.
# Consumers (leagues-finance, finance/queen) attach via:
#   networks:
#     shared_backend:
#       name: shared_backend
#       external: true
# and reach hosts shared.mongo / shared.redis / shared.db.
# Deploy FIRST: the external network and volumes must exist before consumers start.
name: ${SERVICE_NAME}

services:
  mongo:
    # Pinned to 9.0.4. Linux >= 6.19 (servy runs 7.0) breaks the TCMalloc/rseq
    # use of mongo 8.x, and current 8.x builds refuse to start on it
    # (SERVER-121912), so `mongo:8` crash-looped and watchtower rolled back
    # every 2 h. 9.0 cannot open FCV 8.2 data, so the switch was a dump/restore
    # onto a NEW volume (pre_tasks in plays/user.yml). A database gets an exact
    # tag: a major/minor step is a deliberate change, never a watchtower pull.
    # See history/2026-11-03_shared-mongo9-kernel7.md.
    image: mongo:9.0.8
    container_name: ${COMPOSE_PROJECT_NAME}.mongo
    restart: unless-stopped
    # 512m: ~285M resident + ~88M in swap measured 2026-10-29. The cap stops the
    # kernel from pushing the WiredTiger cache to swap under host pressure.
    mem_limit: 512m
    # No `command: ["--auth"]`: with a flag as the first arg the official
    # entrypoint skips its initdb block, so MONGO_INITDB_ROOT_* would never be
    # created on a fresh volume. The entrypoint adds --auth itself whenever
    # the root credentials are set.
    env_file:
      - shared.env
    volumes:
      # mongo 9 data. The pre-9 volume leagues-finance_mongo_data is no longer
      # mounted but kept untouched as the rollback copy.
      - mongo_data:/data/db
    networks:
      - backend
    labels:
      - traefik.enable=false
      - com.centurylinklabs.watchtower.scope=prod
    # Healthcheck interval 30s, not 10s (as are all checks in this repo): every
    # check is a `docker exec`, this host runs ~2.8 of them per second, and each
    # one spawns dockerd+containerd+shim+runc and a burst of runnable tasks on a
    # 4-core box that is queue-bound rather than CPU-bound — that churn is part
    # of why node_load5 sits at ~2x the core count. The cost is detection speed:
    # with `retries: 5` a dead mongo is now marked unhealthy after 2.5min
    # instead of 50s, which no consumer of this check (probe, watchtower) needs.
    # See history/2026-10-30_load-alert-tuning.md.
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 5

  redis:
    # Floats patches inside 9-alpine (the digest pin froze even patch fixes).
    # Ephemeral job-queue store: a restart loses pending Bull jobs (they retry).
    # leagues-finance uses db 0; queen uses db 1 (see finance/queen.env.j2).
    image: docker.io/valkey/valkey:9-alpine
    container_name: ${COMPOSE_PROJECT_NAME}.redis
    restart: unless-stopped
    networks:
      - backend
    labels:
      - traefik.enable=false
      - com.centurylinklabs.watchtower.scope=prod
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  db:
    # Firefly III postgres. Bind mount keeps the EXISTING finance path:
    # zero data movement, adopted on prod, created fresh on test.
    image: postgres:15
    container_name: ${COMPOSE_PROJECT_NAME}.db
    restart: unless-stopped
    env_file:
      - shared.env
    environment:
      POSTGRES_DB: firefly
      POSTGRES_USER: firefly
    volumes:
      - ${DOCKER_DATA_ROOT}/finance/db:/var/lib/postgresql/data
    networks:
      - backend
    labels:
      - traefik.enable=false
      - com.centurylinklabs.watchtower.scope=prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firefly"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  backend:
    internal: true

volumes:
  mongo_data:
    # Explicit name: the migration pre_tasks in plays/user.yml key off it
    # (absent = not migrated yet).
    name: shared_mongo_data
