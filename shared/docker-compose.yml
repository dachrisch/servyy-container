# Shared data layer (consolidated home for stateful services).
# Owns NO app traffic: backend-only, no Traefik labels.
# Consumers (leagues-finance, finance/queen) attach via:
#   networks:
#     shared_backend:
#       name: shared_backend
#       external: true
# and reach hosts shared.mongo / shared.redis / shared.db.
# Deploy FIRST: the external network and volumes must exist before consumers start.
name: ${SERVICE_NAME}

services:
  mongo:
    # Pinned to prod-proven digest (servy.lehel.xyz mongo:8 e0ce8c35124d, healthy 2 weeks)
    image: mongo:8@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3
    container_name: ${COMPOSE_PROJECT_NAME}.mongo
    restart: unless-stopped
    # 512m: ~285M resident + ~88M in swap measured 2026-10-29. The cap stops the
    # kernel from pushing the WiredTiger cache to swap under host pressure.
    mem_limit: 512m
    command: ["--auth"]
    env_file:
      - shared.env
    volumes:
      # KEEPS the leagues-finance volume by explicit name: zero data movement.
      # Adopted on prod, created fresh on test.
      - mongo_data:/data/db
    networks:
      - backend
    labels:
      - traefik.enable=false
      - com.centurylinklabs.watchtower.scope=prod
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # Pinned to prod-proven digest (servy.lehel.xyz valkey:9-alpine ee91f7a174ac, healthy 2 weeks)
    # Ephemeral job-queue store: a restart loses pending Bull jobs (they retry).
    # leagues-finance uses db 0; queen uses db 1 (see finance/queen.env.j2).
    image: docker.io/valkey/valkey:9-alpine@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328
    container_name: ${COMPOSE_PROJECT_NAME}.redis
    restart: unless-stopped
    networks:
      - backend
    labels:
      - traefik.enable=false
      - com.centurylinklabs.watchtower.scope=prod
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    # Firefly III postgres. Bind mount keeps the EXISTING finance path:
    # zero data movement, adopted on prod, created fresh on test.
    image: postgres:18
    container_name: ${COMPOSE_PROJECT_NAME}.db
    restart: unless-stopped
    env_file:
      - shared.env
    environment:
      POSTGRES_DB: firefly
      POSTGRES_USER: firefly
    volumes:
      - ${DOCKER_DATA_ROOT}/finance/db:/var/lib/postgresql/data
    networks:
      - backend
    labels:
      - traefik.enable=false
      - com.centurylinklabs.watchtower.scope=prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firefly"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  backend:
    internal: true

volumes:
  mongo_data:
    # Exact legacy name from the leagues-finance project: adopt, don't migrate.
    name: leagues-finance_mongo_data
