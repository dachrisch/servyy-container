name: dontforget

services:
  mongo:
    image: mongo:9
    container_name: ${COMPOSE_PROJECT_NAME}.mongo
    restart: unless-stopped
    command: ["--auth"]
    env_file:
      - web.env
    volumes:
      - mongo_data:/data/db
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: dachrisch/dontforget:latest
    container_name: ${COMPOSE_PROJECT_NAME}.web
    restart: unless-stopped
    env_file:
      - .env
      - web.env
    environment:
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - internal
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.${SERVICE_NAME}.rule=Host(`${SERVICE_HOST}`)
      - traefik.http.routers.${SERVICE_NAME}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${SERVICE_NAME}.tls=${TRAEFIK_TLS:-true}
      - traefik.http.routers.${SERVICE_NAME}.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencryptdnsresolver}
      # The app is a small SPA: "/" renders the UI, but every other path (even
      # /today) comes back as a raw JSON {"message":"Route GET:... not found"}.
      # Keep the branded 404 so a mistyped or stale deep link still lands on a
      # readable page (opt-in, see traefik/dynamic.yaml error-pages-404).
      - traefik.http.routers.${SERVICE_NAME}.middlewares=error-pages-404@file
      - traefik.http.services.${SERVICE_NAME}.loadbalancer.server.port=3000
      - com.centurylinklabs.watchtower.scope=dev
      # HTTP->HTTPS redirect: webcal:// (used by Google/Apple/Outlook calendar
      # subscriptions) resolves to plain http://, but the router above only
      # listens on websecure — calendar clients were getting a silent 404
      # from Traefik itself before ever reaching the app. TRAEFIK_HTTP_REDIRECT_HOST
      # is only set to the real host when TLS is enabled (see .env.j2); on
      # servyy-test (TRAEFIK_TLS=false, main router already forced onto plain
      # web) it's empty, so this router's rule matches nothing and is a
      # harmless no-op there instead of colliding with the main router.
      - traefik.http.routers.${SERVICE_NAME}-http.entrypoints=web
      - traefik.http.routers.${SERVICE_NAME}-http.rule=Host(`${TRAEFIK_HTTP_REDIRECT_HOST:-dontforget-http-redirect.invalid}`)
      - traefik.http.routers.${SERVICE_NAME}-http.middlewares=${SERVICE_NAME}-https-redirect
      - traefik.http.middlewares.${SERVICE_NAME}-https-redirect.redirectscheme.scheme=https
      # Diagnostic second hostname on an established domain. Google Calendar
      # refuses to subscribe to feeds on dontforget.lehel.xyz without ever
      # fetching them; bumbleflies.de is a long-lived domain on the *same* IP
      # (wildcard A record), so this isolates domain reputation from the IP.
      # Must use letsencrypthttpresolver: the default DNS-01 resolver is bound
      # to Porkbun, and bumbleflies.de is on GoDaddy, so DNS-01 cannot issue.
      # BUMBLEFLIES_HOST is empty when TLS is off (servyy-test), so both
      # routers then match nothing rather than colliding.
      # The two fallback hosts differ on purpose: when BUMBLEFLIES_HOST is
      # empty (servyy-test) these routers must not end up with an identical
      # rule, or they collide with each other the way the -http router nearly
      # collided with the main one. With the var set, both resolve to the same
      # real host, which is what we want.
      - traefik.http.routers.${SERVICE_NAME}-bf.rule=Host(`${BUMBLEFLIES_HOST:-dontforget-bf-unset.invalid}`)
      - traefik.http.routers.${SERVICE_NAME}-bf.entrypoints=websecure
      # tls follows TRAEFIK_TLS, which is false on servyy-test — that is what
      # keeps Traefik from ordering a cert for the .invalid fallback host
      # there (a certresolver name is still rendered, exactly as the main
      # router already does, but with tls off it is never acted on).
      - traefik.http.routers.${SERVICE_NAME}-bf.tls=${TRAEFIK_TLS:-true}
      - traefik.http.routers.${SERVICE_NAME}-bf.tls.certresolver=${BUMBLEFLIES_CERTRESOLVER:-letsencrypthttpresolver}
      - traefik.http.routers.${SERVICE_NAME}-bf.service=${SERVICE_NAME}
      # Same bare-JSON 404 as the main router above.
      - traefik.http.routers.${SERVICE_NAME}-bf.middlewares=error-pages-404@file
      - traefik.http.routers.${SERVICE_NAME}-bf-http.entrypoints=web
      - traefik.http.routers.${SERVICE_NAME}-bf-http.rule=Host(`${BUMBLEFLIES_HOST:-dontforget-bf-http-unset.invalid}`)
      - traefik.http.routers.${SERVICE_NAME}-bf-http.middlewares=${SERVICE_NAME}-https-redirect

volumes:
  mongo_data:

networks:
  internal:
    internal: true
  proxy:
    external: true
