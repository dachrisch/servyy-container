# Forgejo — self-hosted Git + Actions CI platform at ci.lehel.xyz.
#
# One rootless container (uid 1000) serving the web UI, the git-over-HTTPS
# protocol and the Actions API. SQLite database, so the instance is a single
# bind-mounted directory plus the nightly DB dump — no external database.
#
# uid 1000 is deliberate: it is `cda` on servy, i.e. the deploy checkout's
# owner, so ./data works as a bind mount with no chown, and restic's home
# backup (source_path: /home/cda) picks the bare repos up for free. Both
# ./data and ./conf are pre-created by Ansible (user.docker.ci) — Docker would
# create a missing bind source as root and the container could not write its
# database.
#
# Git is served over HTTPS only (tokens). There is deliberately no SSH port:
# the published-ports guard allows only Traefik's 80/443, and SSH is disabled
# in the app config (FORGEJO__server__DISABLE_SSH in forgejo.env).
#
# The image is pinned to the current Forgejo LTS line (15.x, still receiving
# security releases as of 2026-11) and bumped by Renovate. Do not unpin to `latest`: Forgejo majors
# carry breaking changes and the LTS line is what the upgrade runbook targets.
services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:15.0.12-rootless
    container_name: ${COMPOSE_PROJECT_NAME}.forgejo
    # The deploy user (cda) owns ./data and ./conf; its uid differs per host
    # (1000 on servy, 1001 on servyy-test), so take it from the rendered .env.
    user: "${UID}:${GID}"
    restart: unless-stopped
    env_file: forgejo.env
    volumes:
      # Git repositories, the SQLite DB, LFS objects, avatars and the indexers.
      # The live SQLite file itself is excluded from restic (a snapshot of a
      # live DB is worthless); the bare repos under ./data/git/repositories and
      # the nightly DB dump are the backup of record.
      - ./data:/var/lib/gitea
      # Config dir (custom app.ini, if ever needed). The FORGEJO__* env vars in
      # forgejo.env already cover everything this instance configures, so this
      # stays empty for now and is kept for a future app.ini override.
      - ./conf:/etc/gitea
    networks:
      - proxy
    labels:
      - traefik.enable=true
      # Plain HTTP -> HTTPS (the ACME HTTP-01 challenge is answered by Traefik
      # itself on the `web` entrypoint, before any router matches).
      - traefik.http.routers.${SERVICE_NAME}-http.entrypoints=web
      - traefik.http.routers.${SERVICE_NAME}-http.rule=Host(`${SERVICE_HOST}`)
      - traefik.http.routers.${SERVICE_NAME}-http.middlewares=${SERVICE_NAME}-https
      - traefik.http.middlewares.${SERVICE_NAME}-https.redirectscheme.scheme=https
      # The service itself. DNS-01 (letsencryptdnsresolver) rather than HTTP-01:
      # ci.lehel.xyz rides the *.lehel.xyz wildcard on Porkbun, which the
      # DNS-01 resolver issues against.
      - traefik.http.routers.${SERVICE_NAME}.rule=Host(`${SERVICE_HOST}`)
      - traefik.http.routers.${SERVICE_NAME}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${SERVICE_NAME}.tls=${TRAEFIK_TLS:-true}
      - traefik.http.routers.${SERVICE_NAME}.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencryptdnsresolver}
      # Same crawler rate-limit middleware as git.lehel.xyz (aggressive
      # crawler/scanner protection from the shared file-provider).
      - traefik.http.routers.${SERVICE_NAME}.middlewares=crawler-ratelimit@file
      - traefik.http.services.${SERVICE_NAME}.loadbalancer.server.port=3000
      # Local-qualified name for the container-health probe / host ping.
      - traefik.http.routers.${SERVICE_NAME}_local_qualified.rule=Host(`${SERVICE_NAME}.${LOCAL_HOSTNAME}`)
      - traefik.http.routers.${SERVICE_NAME}_local_qualified.entrypoints=web
    healthcheck:
      # Forgejo serves /api/healthz without auth when the app is up. The
      # rootless image is Alpine-based and ships busybox wget.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # ~150 MB resident for the Go binary + SQLite + an in-flight git operation.
    # Generous headroom without letting a runaway clone take the box down.
    mem_limit: 512m

networks:
  proxy:
    external: true
