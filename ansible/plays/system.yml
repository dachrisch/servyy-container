- name: Setup core system
  hosts: all
  strategy: free
  become: true
  remote_user: "{{ root_user | default('root') }}"
  gather_facts: yes
  vars_files:
    - vars/default.yml
    - vars/restic.yml
    - vars/secrets.yml
  roles:
    - system
    - role: system_probe
      tags: ['system.probe']
    - role: monit_cleanup
      tags: ['monit.cleanup', 'never']
    - role: sebthebert.ubuntu_pro
      tags: ['ubuntu_pro']
