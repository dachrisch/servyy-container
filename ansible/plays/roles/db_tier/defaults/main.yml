---
# db_tier — one database tier (high | nonprod | business | private).
# Plan: docs/plans/2026-11-17_db-tier-topology.md (D2/D3/D4/D6/D12/D16, Phase 2.3)
#
# WHAT THIS ROLE DOES
#   * resolves the tier's tenants from plays/vars/db_tenants.yml (the single
#     source of truth),
#   * creates/refreshes the tier's BACKUP user on each MariaDB server that holds
#     the tier's databases (SELECT, SHOW VIEW, TRIGGER, EVENT, LOCK TABLES — never
#     a tenant user, never root from an app container),
#   * enforces the D12 limits (MAX_USER_CONNECTIONS, MAX_STATEMENT_TIME) on the
#     existing per-tenant MariaDB users,
#   * creates/refreshes each MONGO tenant's own db-scoped user on the tier's
#     mongod (WP-9: this role absorbed `shared_mongo_users`),
#   * renders `dbops` (the dump/restore/verify tool), the tier's MariaDB
#     credential file and (since WP-9) the mongo root env file (0600), all
#     driven by the inventory.
#
# WHAT IT DOES NOT DO
#   * It does NOT render compose files: `db-<tier>/docker-compose.yml` is
#     committed like shared/docker-compose.yml so Renovate sees the image tag
#     (D1). Those files arrive with WP-4..6 and carry the tier's `mongo:`
#     service from WP-9 on.
#   * It no longer has to absorb `shared_mongo_users`: that happened in WP-9
#     (Phase 8), when the mongo tenants moved into db-business/db-private. The
#     old role is kept for one rollback week only; nothing invokes it.
#
# The profile below is the single place the tier's runtime shape is described;
# WP-4..6 read the numbers from here when they write the compose files, so the
# limits cannot drift between the role and the server.
db_tier_name: ''

db_tier_profiles:
  high:
    # LeagueSphere prod keeps its existing leaguesphere.db (D6) — these numbers
    # document it; nothing here resizes a running container.
    mem_limit: 512m
    innodb_buffer_pool: 128M
    server_flags: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    healthcheck_interval: 30s
    network: leaguesphere_backend
    dump: physical        # mariadb-backup + binlog PITR (D10)
    restic_scope: db
    probe_tier_label: high
  nonprod:
    mem_limit: 512m
    innodb_buffer_pool: 128M
    server_flags: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    healthcheck_interval: 30s
    network: db_nonprod_backend
    dump: logical
    restic_scope: db
    probe_tier_label: nonprod
  business:
    mem_limit: 1.25g      # sized for Moodle up front, so Phase 6 is not a resize
    innodb_buffer_pool: 384M
    server_flags: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    healthcheck_interval: 30s
    network: db_business_backend
    dump: logical
    restic_scope: db
    probe_tier_label: business
    # WP-9: the mongo profile (D3). One mongod, no replica set, WiredTiger's
    # cache capped so the cgroup limit is not reached by cache growth.
    mongo_mem_limit: 384m
    mongo_cache_gb: 0.25
  private:
    mem_limit: 512m
    innodb_buffer_pool: 128M
    server_flags: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    healthcheck_interval: 30s
    network: db_private_backend
    dump: logical
    restic_scope: db
    probe_tier_label: private
    mongo_mem_limit: 384m
    mongo_cache_gb: 0.25

# Where the rendered, versioned tool + its credentials live (per tier).
db_tier_env_dir: "{{ remote_user_home }}/.dbops"
db_tier_dbops_path: "{{ db_tier_env_dir }}/dbops"
db_tier_env_path: "{{ db_tier_env_dir }}/{{ db_tier_name }}.env"

# The tier SERVER's own root password (rendered into db-<tier>/mariadb.env).
# Same regenerable-seed idiom as the backup user below; one key per tier, added
# to secrets.yml when that tier's server exists.
db_tier_root_password: "{{ lookup('vars', 'db_tier_root_password_' ~ db_tier_name) }}"

# --- Mongo (WP-9, Phase 8) ---------------------------------------------------
# The tier's mongod container and its root account. The name is the convention
# the committed compose uses (container_name `${COMPOSE_PROJECT_NAME}.mongo`).
# One root pair PER TIER, from secrets.yml: the tenants' users are db-scoped,
# but the server accounts must also not be shared, or "a user from one tier
# cannot authenticate against the other" would be false for the admin account
# and a single leaked pair would open both tiers.
db_tier_mongo_server_name: "db-{{ db_tier_name }}.mongo"
db_tier_mongo_root_username: "{{ db_tier_name }}_admin"
# Regenerable only on a FRESH datadir. On an existing one the env is not
# authoritative: rotate with db.changeUserPassword inside the container and
# update the seed in the same sitting (the WP-2 lesson, applied per tier).
db_tier_mongo_root_password: "{{ lookup('vars', 'db_tier_mongo_root_password_' ~ db_tier_name) }}"

# Tenants that must be created on this tier's mongod: same shape as
# db_tier_user_passwords (tenant -> {name, password, database, roles}), filled
# by tasks/tenant_passwords.yml from the secrets the apps already use so a move
# is a hostname change and nothing else. Only members of `mongod_tenants` are
# ever touched (see tasks/mongo.yml).
db_tier_mongo_user_passwords: {}
# Re-apply the vault password on an existing mongo user. Off by default: the
# stored hash cannot be compared with the vault value, so re-applying it would
# report `changed` forever (same rule as the retired shared_mongo_users role).
db_tier_mongo_rotate_passwords: false

# Pass 1 of the role: render the files the tier's compose needs before it can
# start, and stop. plays/user.yml runs it once before `docker_service` and once
# (full) after, because the tier's users can only be created on a running server.
db_tier_render_only: false

# The per-tier backup account. Its password comes from the controller seed
# (secrets.yml: dbops_password_<tier>, regenerable — the role re-sets it).
db_tier_backup_user: "dbops_backup_{{ db_tier_name }}"
db_tier_backup_password: "{{ lookup('vars', 'dbops_password_' ~ db_tier_name) }}"

# Privileges a dump needs, and nothing else (D4: least privilege).
db_tier_backup_privileges:
  - SELECT
  - SHOW VIEW
  - TRIGGER
  - EVENT
  - LOCK TABLES

# Passwords for tenant users that must be CREATED. Existing users are never
# touched beyond their D12 limits — resetting an app password would break the
# running app. WP-4..6 supply entries here when they stand up a fresh tier.
db_tier_user_passwords: {}

# Loud but non-fatal: the tier exists in the inventory before its server does.
db_tier_compose_hint: "{{ docker.local_dir }}/db-{{ db_tier_name }}/docker-compose.yml"
