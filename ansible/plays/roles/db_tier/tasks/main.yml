---
# db_tier task list. Runs per tier; invoked from plays/user.yml with
# `tags: [user.docker, user.docker.db-<tier>]` so a single tier can be deployed
# alone (Phase 10's version hop depends on that).
#
# TWO PASSES, because the tier's compose file must find its env file already
# rendered and the tier's users can only be created once the server runs:
#   1. `db_tier_render_only: true`  — before `docker_service` deploys the tier:
#      render db-<tier>/mariadb.env, dbops and the tier credential file.
#   2. the default (full) pass      — after the compose is up: create the tier's
#      users/limits on the tier server and refresh dbops.

- name: Resolve the tier's tenants from the inventory
  ansible.builtin.set_fact:
    db_tier_tenants: "{{ db_tenants | default([]) | selectattr('tier', 'equalto', db_tier_name) | list }}"
    db_tier_service_dir: "db-{{ db_tier_name }}"
    db_tier_server_name: "db-{{ db_tier_name }}.mariadb"

- name: Fail when a tier is enabled but the inventory has no tenant for it
  ansible.builtin.assert:
    that:
      - db_tier_name in db_tier_profiles
      - db_tier_tenants | length > 0
    fail_msg: >-
      db_tier_name '{{ db_tier_name }}' is not a known tier, or
      plays/vars/db_tenants.yml has no tenant with that tier. Known tiers:
      {{ db_tier_profiles.keys() | list | join(', ') }}; tiers with tenants:
      {{ db_tenants | default([]) | map(attribute='tier') | unique | list | join(', ') }}.
    quiet: true

- name: Say so loudly when the tier's server has no compose file yet
  ansible.builtin.debug:
    msg: >-
      db_tier '{{ db_tier_name }}': {{ db_tier_compose_hint }} does not exist yet,
      so this run only renders the tier env, the backup user's credentials and
      dbops. The tier SERVER itself arrives with WP-4..6 (D6:
      db-<tier>/docker-compose.yml is committed, never rendered). Tenants still
      run on their current servers:
      {{ db_tier_tenants | map(attribute='server') | unique | join(', ') }}.
  vars:
    db_tier_compose_exists: "{{ lookup('ansible.builtin.fileglob', db_tier_compose_hint) }}"
  when: db_tier_compose_exists | length == 0

# Kept as a fact: render.yml decides from it whether the tier's compose file is
# there yet (rendering mariadb.env only makes sense once it is).
- name: Record whether the tier's compose file exists
  ansible.builtin.set_fact:
    db_tier_compose_exists: "{{ lookup('ansible.builtin.fileglob', db_tier_compose_hint) }}"

# --- pass 1: files the tier's compose needs before it can start ---------------
- name: Render the tier's env file, dbops and credentials
  ansible.builtin.include_tasks: render.yml

# --- pass 2: users + limits on the server that now exists ---------------------
- name: Configure the tier's server
  ansible.builtin.include_tasks: configure.yml
  when: not (db_tier_render_only | default(false) | bool)
