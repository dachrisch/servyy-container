---
# Per-server setup for one tier. `db_tier_target` is {server, tenants} from
# tasks/configure.yml — the tier's own server once it exists, otherwise the
# servers the tenants still run on.

- name: Inspect {{ db_tier_target.server }}
  ansible.builtin.command:
    argv: [docker, inspect, --format, "{{ '{{.State.Running}}' }}", "{{ db_tier_target.server }}"]
  register: db_tier_server_state
  changed_when: false
  failed_when: false
  check_mode: false   # read-only; must also resolve under --check

- name: Skip a server that is not on this host
  ansible.builtin.debug:
    msg: >-
      {{ db_tier_target.server }} is not running on {{ inventory_hostname }};
      the tenant that lives there is handled on its own host.
  when: db_tier_server_state.stdout | default('') != 'true'

- name: Configure {{ db_tier_target.server }} for tier {{ db_tier_name }}
  when: db_tier_server_state.stdout | default('') == 'true'
  block:
    - name: Read the tier's tenant accounts on {{ db_tier_target.server }}
      community.docker.docker_container_exec:
        container: "{{ db_tier_target.server }}"
        command: >-
          sh -c 'exec mariadb -uroot -p"$MARIADB_ROOT_PASSWORD" --skip-ssl --batch --skip-column-names -e "SELECT User FROM mysql.user"'
      register: db_tier_accounts
      changed_when: false

    # Fingerprint of every account (name, host, D12 limits, password hash): the
    # comparison at the end of this block is what makes the role's `changed`
    # honest — the SQL tasks themselves are `changed_when: false` because
    # CREATE/ALTER/GREANT report no affected-row count, and pretending otherwise
    # would lie in the other direction. Idempotent: an unchanged fingerprint is
    # `changed: false`.
    - name: Fingerprint the account state before the tier SQL on {{ db_tier_target.server }}
      community.docker.docker_container_exec:
        container: "{{ db_tier_target.server }}"
        command: >-
          sh -c 'exec mariadb -uroot -p"$MARIADB_ROOT_PASSWORD" --skip-ssl --batch --skip-column-names -e "SELECT MD5(GROUP_CONCAT(CONCAT(User,\":\",Host,\":\",Max_user_connections,\":\",Max_statement_time,\":\",authentication_string) ORDER BY User,Host)) FROM mysql.user"'
      register: db_tier_fingerprint_before
      changed_when: false
      no_log: true

    - name: Fail when a tenant user is missing and no password was supplied
      ansible.builtin.assert:
        that:
          - item.user in (db_tier_accounts.stdout_lines | default([]))
        fail_msg: >-
          Tenant '{{ item.tenant }}': user '{{ item.user }}' does not exist on
          {{ db_tier_target.server }}. Either the tenant is not created yet
          (supply db_tier_user_passwords.{{ item.tenant }} to let this role create
          it) or the inventory's `user` for that tenant is wrong.
        quiet: true
      loop: "{{ db_tier_target.tenants
                | rejectattr('tenant', 'in', db_tier_user_passwords.keys() | list) | list }}"
      loop_control:
        label: "{{ item.tenant }}"

    # The SQL goes in on STDIN, never inside the shell command: the grants use
    # backticks (`db`.*), and inside a double-quoted -e "..." the shell treats
    # them as command substitution — it ran `mysql` and `user` as commands and
    # handed mariadb the mangled "SELECT 1 FROM . LIMIT 0". Found on the first
    # WP-4a deploy (2026-11-18), where it failed the backup-user task.
    - name: Create or refresh the tier's backup user on {{ db_tier_target.server }}
      community.docker.docker_container_exec:
        container: "{{ db_tier_target.server }}"
        command: sh -c 'exec mariadb -uroot -p"$MARIADB_ROOT_PASSWORD" --skip-ssl'
        stdin: "{{ lookup('ansible.builtin.template', 'backup_user.sql.j2') }}"
      register: db_tier_backup_result
      # The statement text contains the backup password.
      no_log: true
      changed_when: false

    - name: Create the tenants and enforce their D12 limits on {{ db_tier_target.server }}
      community.docker.docker_container_exec:
        container: "{{ db_tier_target.server }}"
        command: sh -c 'exec mariadb -uroot -p"$MARIADB_ROOT_PASSWORD" --skip-ssl'
        stdin: "{{ lookup('ansible.builtin.template', 'tenant_limits.sql.j2') }}"
      register: db_tier_limits_result
      # The statement text contains any newly created tenant's password.
      no_log: true
      changed_when: false

    - name: Fingerprint the account state after the tier SQL on {{ db_tier_target.server }}
      community.docker.docker_container_exec:
        container: "{{ db_tier_target.server }}"
        command: >-
          sh -c 'exec mariadb -uroot -p"$MARIADB_ROOT_PASSWORD" --skip-ssl --batch --skip-column-names -e "SELECT MD5(GROUP_CONCAT(CONCAT(User,\":\",Host,\":\",Max_user_connections,\":\",Max_statement_time,\":\",authentication_string) ORDER BY User,Host)) FROM mysql.user"'
      register: db_tier_fingerprint_after
      no_log: true
      # THIS is the role's change signal: the accounts differ from before the
      # SQL, so something was created or adjusted. Same fingerprint -> no change.
      changed_when: >-
        (db_tier_fingerprint_after.stdout | default('')) !=
        (db_tier_fingerprint_before.stdout | default(''))

    - name: Report the tier's account changes on {{ db_tier_target.server }}
      ansible.builtin.debug:
        msg: >-
          {{ db_tier_target.server }}: accounts {{ 'changed' if
             (db_tier_fingerprint_after.stdout | default('')) !=
             (db_tier_fingerprint_before.stdout | default('')) else 'unchanged' }}
          ({{ db_tier_target.tenants | map(attribute='tenant') | join(', ') }}).
