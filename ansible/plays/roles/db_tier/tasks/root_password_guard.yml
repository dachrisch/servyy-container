---
# PRE-FLIGHT: the rendered root password must already be the one this datadir
# holds. Runs BEFORE render.yml and therefore before anything recreates the
# server container.
#
# WHY (measured 2026-11-19, WP-9): `db_tier_root_password_<tier>` used to be a
# `lookup('password', 'vars/.db_tier_root_password_<tier> …')` seed. A deploy from
# a fresh clone (the WP-9 branch clone) had no seed files, so the lookup GENERATED
# new values, the tier compose was re-rendered with them and `docker_service`
# recreated db-business.mariadb. MariaDB applies MARIADB_ROOT_PASSWORD only when
# it initialises a datadir, so the server came back with an env password that did
# not match the datadir: root logins failed 1045, the healthcheck failed, and the
# tier's SQL was dead until the old seed was found and re-deployed.
#
# Two things changed as a result:
#   1. the root passwords are LITERAL values in the encrypted vars/secrets.yml,
#      so a missing seed can no longer invent one (see the comment there);
#   2. this guard, because a literal can still be edited wrongly, and because a
#      wrong value must fail HERE — loudly, with the server untouched — instead
#      of after a recreate that takes the tier down.
#
# The password never reaches a command line or the log: it is piped on stdin into
# `read`, exported as MYSQL_PWD inside the container's shell, and the task is
# `no_log`. `mariadb` reads MYSQL_PWD instead of argv, so `ps` on the host shows
# nothing either.
#
# Set `db_tier_root_password_guard: false` ONLY for a deliberate rotation or a
# restore where the datadir and the secret are known to disagree.

- name: Read the tier server's container state
  ansible.builtin.command:
    argv: [docker, inspect, --format, "{{ '{{.State.Running}}' }}", "{{ db_tier_server_name }}"]
  register: db_tier_root_guard_state
  changed_when: false
  failed_when: false
  check_mode: false

- name: Warn that the tier's root password cannot be verified while the server is stopped
  ansible.builtin.debug:
    msg: >-
      db_tier '{{ db_tier_name }}': {{ db_tier_server_name }} exists but is not running, so the
      rendered root password cannot be checked against its datadir. If
      db_tier_root_password_{{ db_tier_name }} has changed since that datadir was
      initialised, the next start will fail authentication (1045) — see the
      comment in tasks/root_password_guard.yml.
  when:
    - db_tier_root_guard_state.rc == 0
    - db_tier_root_guard_state.stdout | default('') | trim == 'false'

- name: Verify the rendered root password against the running tier server
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - "{{ db_tier_server_name }}"
      - sh
      - -c
      - 'read -r p; MYSQL_PWD="$p" exec mariadb -u root -N -B -e "SELECT 1"'
    stdin: "{{ lookup('vars', 'db_tier_root_password_' ~ db_tier_name) }}"
  register: db_tier_root_guard_probe
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  when:
    - db_tier_root_password_guard | default(true) | bool
    - db_tier_root_guard_state.rc == 0
    - db_tier_root_guard_state.stdout | default('') | trim == 'true'

- name: Fail when the rendered root password is not the one this datadir holds
  ansible.builtin.fail:
    msg: |
      db_tier '{{ db_tier_name }}': the root password this deploy would render does NOT
      authenticate on {{ db_tier_server_name }} (mariadb exited {{ db_tier_root_guard_probe.rc | default('?') }}).

      Nothing has been changed: the server and its datadir are as they were. That is the
      point of this check — the next step in a deploy is to recreate this container with
      MARIADB_ROOT_PASSWORD from that value, and MariaDB applies it only on datadir
      initialisation, so a mismatch takes the whole tier's SQL down (1045 on every
      connection) instead of failing here.

      Almost always this means one of:
        * db_tier_root_password_{{ db_tier_name }} in plays/vars/secrets.yml was replaced
          (it used to be a lookup() seed, which GENERATED a new value when a checkout had
          no seed file — that is what broke db-business.mariadb on 2026-11-19);
        * the secret was edited by hand after the datadir was initialised;
        * the datadir was restored from a backup that predates a deliberate rotation.

      Fix: put the password the datadir actually holds back into secrets.yml (offline copy,
      the pre-change git revision of that file, or the previous seed file if it still
      exists) and re-run. To change the password on purpose instead, run inside the
      container
        ALTER USER 'root'@'%' IDENTIFIED BY '<new>';
        ALTER USER 'root'@'localhost' IDENTIFIED BY '<new>';
      then set the same value in secrets.yml. `db_tier_root_password_guard: false` exists
      for a rotation or a restore where the two are KNOWN to disagree — do not set it to
      get past this message.
  when:
    - db_tier_root_password_guard | default(true) | bool
    - db_tier_root_guard_probe is defined
    - db_tier_root_guard_probe.rc is defined
    - db_tier_root_guard_probe.rc != 0
