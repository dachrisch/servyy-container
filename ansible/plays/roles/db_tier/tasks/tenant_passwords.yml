---
# Passwords for tenants that move into this tier with the credential their app
# ALREADY uses (Phase 3: LS stage + demo). Inventing a new password here would
# force a change in the app's repo at cutover, so the value is read from the same
# git-crypt'd file the app's own role renders from. Phase 4/6 add their block
# when their tenants move (moodle: vault_moodle_db_*, bnb: bnb_office.db_password).
#
# The paths are resolved from THIS role's directory, so they work whether the
# play is entered through servyy.yml (cwd ansible/) or plays/user.yml directly.
- name: Load the LeagueSphere stage secrets for the nonprod tenants
  ansible.builtin.include_vars:
    file: "{{ (role_path, '../ls_app/vars/secret_stage.yaml') | path_join }}"
    name: db_tier_ls_stage_secret
  no_log: true
  when: db_tier_name == 'nonprod'

- name: Load the LeagueSphere demo secrets for the nonprod tenants
  ansible.builtin.include_vars:
    file: "{{ (role_path, '../ls_demo/vars/secret_demo.yaml') | path_join }}"
    name: db_tier_ls_demo_secret
  no_log: true
  when: db_tier_name == 'nonprod'

- name: Use the tenants' existing credentials when creating them on this tier
  ansible.builtin.set_fact:
    db_tier_user_passwords: >-
      {{ (db_tier_user_passwords | default({})) | combine({
           'leaguesphere_stage': db_tier_ls_stage_secret.app.db_password,
           'leaguesphere_demo': db_tier_ls_demo_secret.demo_config.mysql.password }) }}
  no_log: true
  when: db_tier_name == 'nonprod'

# WP-5a: bnb's app user gets the password the app ALREADY uses (secrets.yml:
# bnb_office.db_password, the same key bnb-office's own compose reads), so the
# WP-5b cutover is a hostname change and nothing else. `secrets.yml` is a
# vars_file of plays/user.yml, which is the only play that invokes this role.
# Moodle is NOT here yet: its row still names moodle.db and it moves in WP-7 -
# configure.yml only demands accounts for tenants placed on this tier (see the
# comment there), so creating a Moodle account early is not forced and would
# commit the tier to a credential the app has not adopted.
- name: Use the tenant's existing credential when creating it on this tier
  ansible.builtin.set_fact:
    db_tier_user_passwords: >-
      {{ (db_tier_user_passwords | default({})) | combine({
           'bnb_office': bnb_office.db_password }) }}
  no_log: true
  when: db_tier_name == 'business'

# WP-6a: PhotoPrism's app user keeps the password it ALREADY uses (secrets.yml:
# photoprism.db_password - the same key photoprism.env renders into both
# PHOTOPRISM_DATABASE_PASSWORD and MARIADB_PASSWORD), so the WP-6b cutover does
# not touch the app's env. The private tier's other tenants (dontforget's mongo,
# firefly's postgres) are not supplied here: configure.yml only creates accounts
# for tenants placed on the tier or supplied, and neither is a MariaDB tenant of
# this server.
- name: Use the tenant's existing credential when creating it on this tier
  ansible.builtin.set_fact:
    db_tier_user_passwords: >-
      {{ (db_tier_user_passwords | default({})) | combine({
           'photoprism': photoprism.db_password }) }}
  no_log: true
  when: db_tier_name == 'private'
