---
# Pass 1: everything the tier's compose needs BEFORE it can start, plus the
# tools. The compose file is committed (D6) — this role only renders the files it
# reads at run time.

- name: Ensure the dbops directory exists
  ansible.builtin.file:
    path: "{{ db_tier_env_dir }}"
    state: directory
    mode: '0700'

# `mariadb.env` sits next to the committed compose file because compose's
# `env_file:` is relative to it, and it must be 0600: it holds the server's root
# password. It is gitignored, so a checkout can never commit or revert it.
- name: Render the tier's server env file ({{ db_tier_name }})
  ansible.builtin.template:
    src: mariadb.env.j2
    dest: "{{ (docker.remote_dir, db_tier_service_dir, 'mariadb.env') | path_join }}"
    mode: '0600'
  no_log: true
  when: db_tier_compose_exists | default([]) | length > 0

# WP-9: the same idiom for the tier's mongod. Rendered only for a tier that
# actually owns a mongo tenant — a MariaDB-only tier must not sprout a mongo
# env file (or the compose would start a mongod no tenant asked for).
- name: Render the tier's mongo server env file ({{ db_tier_name }})
  ansible.builtin.template:
    src: mongo.env.j2
    dest: "{{ (docker.remote_dir, db_tier_service_dir, 'mongo.env') | path_join }}"
    mode: '0600'
  no_log: true
  when:
    - db_tier_compose_exists | default([]) | length > 0
    - db_tier_tenants | selectattr('engine', 'equalto', 'mongo') | list | length > 0

- name: Render dbops
  ansible.builtin.template:
    src: dbops.sh.j2
    dest: "{{ db_tier_dbops_path }}"
    mode: '0755'

- name: Render the tier credential file (backup user only)
  ansible.builtin.template:
    src: tier_env.j2
    dest: "{{ db_tier_env_path }}"
    mode: '0600'
  no_log: true
