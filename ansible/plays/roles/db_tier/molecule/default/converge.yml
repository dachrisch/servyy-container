---
# Run the role for a two-tenant MariaDB tier whose server is the container the
# prepare step started. `db_tenants` is passed inline: the real inventory lives in
# plays/vars/db_tenants.yml, which the role expects the play to load.
- name: Converge — roles/db_tier on a two-tenant tier
  hosts: all
  gather_facts: true
  vars:
    # The role's own defaults need these two from the play.
    remote_user_home: "/home/{{ ansible_user | default('root') }}"
    docker:
      local_dir: "/tmp"           # no compose file for this tier: the role must say so, not fail
    db_tier_name: business
    db_tier_user_passwords: {}
    dbops_password_business: "molecule-backup-pw"
    # The role's tenant_passwords.yml reads these from the play's vars on a real
    # host (secrets.yml). The scenario must supply them or the run dies on an
    # undefined var before it reaches the assertions.
    bnb_office:
      db_password: molecule-bnb-pw
    vault_moodle_db_password: molecule-moodle-pw
    vault_leagues_finance_mongo_username: leagues_finance
    vault_leagues_finance_mongo_password: molecule-tenant-c
    vault_queen_mongo_username: queen
    vault_queen_mongo_password: molecule-tenant-d
    db_tenants:
      - tenant: tenant_a
        tier: business
        engine: mariadb
        server: db-tier-test.mariadb
        db: tenant_a
        user: tenant_a
        dump_schedule: none
        dump_dir: "/tmp/dbops-dumps"
        restic_repo: ''
        max_user_connections: 5
        max_statement_time: 30
        retiring: false
        compose_dir: ''
        compose_service: ''
      - tenant: tenant_b
        tier: business
        engine: mariadb
        server: db-tier-test.mariadb
        db: tenant_b
        user: tenant_b
        dump_schedule: none
        dump_dir: "/tmp/dbops-dumps"
        restic_repo: ''
        max_user_connections: 5
        max_statement_time: 30
        retiring: false
        compose_dir: ''
        compose_service: ''
  # The business play deliberately has NO mongo tenant: it proves the MariaDB
  # path does not reach for a mongod when the inventory has none (WP-9's split).
  # The mongo path is its own play below.
  #
  # include_role (not a play-level `roles:` entry) so the role is resolved at
  # run time from ANSIBLE_ROLES_PATH, like the docker_service scenario — and so
  # `ansible-lint` can check this playbook without molecule's roles path.
  tasks:
    - name: Apply the tier
      ansible.builtin.include_role:
        name: db_tier

# WP-9: the mongo side of the same role. A mongo tier gets db-scoped users on
# its mongod; the MariaDB play above must not have created any (it has no mongo
# tenant, and tasks/mongo.yml is gated on one). Isolation is asserted across
# TENANTS on the one server: no user may read the other's database.
- name: Converge — roles/db_tier on a two-tenant mongo tier
  hosts: all
  gather_facts: true
  vars:
    remote_user_home: "/home/{{ ansible_user | default('root') }}"
    docker:
      local_dir: "/tmp"           # no compose file for this tier: render skips
    db_tier_name: private
    db_tier_user_passwords: {}
    dbops_password_private: "molecule-backup-pw-private"
    photoprism:
      db_password: molecule-photoprism-pw
    vault_dontforget_mongo_username: dontforget_app
    vault_dontforget_mongo_password: molecule-tenant-c
    # Stands in for db-private.mongo, which the committed compose owns.
    db_tier_mongo_server_name: db-tier-test.mongo
    db_tier_mongo_root_password: molecule-mongo-root
    # Same shape tasks/tenant_passwords.yml builds from secrets.yml.
    db_tier_mongo_user_passwords:
      tenant_c:
        name: tenant_c
        password: molecule-tenant-c
        database: tenant_c
        roles: [readWrite, dbAdmin]
      tenant_d:
        name: tenant_d
        password: molecule-tenant-d
        database: tenant_d
        roles: [readWrite, dbAdmin]
    db_tenants:
      - tenant: tenant_c
        tier: private
        engine: mongo
        server: db-tier-test.mongo
        db: tenant_c
        user: tenant_c
        dump_schedule: none
        dump_dir: "/tmp/dbops-dumps"
        restic_repo: ''
        max_user_connections: 0
        max_statement_time: 0
        retiring: false
        compose_dir: ''
        compose_service: ''
      - tenant: tenant_d
        tier: private
        engine: mongo
        server: db-tier-test.mongo
        db: tenant_d
        user: tenant_d
        dump_schedule: none
        dump_dir: "/tmp/dbops-dumps"
        restic_repo: ''
        max_user_connections: 0
        max_statement_time: 0
        retiring: false
        compose_dir: ''
        compose_service: ''
  tasks:
    - name: Apply the tier's mongo users
      ansible.builtin.include_role:
        name: db_tier
