---
- name: restart opencode container
  # NOTE: this must stay on docker_compose_v2 with state=restarted, which maps
  # to `docker compose restart` and never recreates the container. An earlier
  # version used a bare container-module task with only {name, state, restart};
  # that module compared those (mostly unspecified) params against the running
  # container and, on any perceived drift, RECREATED it using only the params
  # given there -- silently dropping compose's volumes/env/networks/labels and
  # taking code.lehel.xyz off the proxy network (incident #109/#110).
  # `docker compose restart` cannot do that: it only re-execs the entrypoint
  # (re-running startup.sh), which is all this handler is meant to do.
  community.docker.docker_compose_v2:
    project_src: "{{ ('/home/', create_user, 'servyy-container/opencode') | path_join }}"
    project_name: opencode
    files:
      - docker-compose.yml
    state: restarted
  listen: restart opencode container

- name: push opencode ssh key to vaultwarden
  ansible.builtin.include_tasks: vaultwarden_push.yml
  listen: push opencode ssh key to vaultwarden
  when: inventory_hostname == 'codey.lehel.xyz'
