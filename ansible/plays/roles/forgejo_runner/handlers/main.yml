---
# Restart the rootless runner (forgejo-runner user service) when its config or
# unit file changes. Runs as the rootless user against its runtime dir.
- name: restart rootless runner
  ansible.builtin.systemd:
    name: forgejo-runner
    scope: user
    state: restarted
  become_user: "{{ forgejo_runner_rootless_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ forgejo_runner_rootless_uid }}"
