---
# forgejo_runner — deploys the Forgejo Actions runner from the `runny/` service
# dir to the runner hosts (codey = dind backend, runny = host-socket backend,
# runny-test = rootless backend).
#
# The compose is TEMPLATED (not a committed static file) because the Docker
# backend is chosen per host by `forgejo_runner_docker`:
#   * `dind` — a privileged `docker:dind` sidecar on an internal network, used
#     on codey (mounting codey's host socket would expose the claude-hub and
#     opencode credentials to CI jobs);
#   * `host` — the host socket, used on runny (saves ~100 MB; the box holds no
#     secrets);
#   * `rootless` — the forgejo-runner binary + a rootless dockerd as systemd
#     --user services of an unprivileged user, on runner-only hosts (runny's
#     migration target). No compose, no root-run daemon.
# The runner image is multi-arch (`data.forgejo.org/forgejo/runner`), so the
# same file serves both amd64 (runny) and arm64 (codey).

forgejo_runner_version: "13.2.1"
forgejo_runner_image: "data.forgejo.org/forgejo/runner:{{ forgejo_runner_version }}"

# The Forgejo instance the runner registers against and polls for jobs.
forgejo_runner_instance: "https://ci.lehel.xyz"

# Registered runner NAME (labels/secret identify it on the Forgejo side).
# codey -> "codey", runny -> "runny", servyy-test -> "test".
forgejo_runner_name: "{{ inventory_hostname | regex_replace('\\..*$', '') }}"

# Runner labels (name:value). Value is `host` (run on the host) or
# `docker://<image>` (run in a container). Set per host in the inventory.
forgejo_runner_labels: []

# Max concurrent jobs this runner accepts.
forgejo_runner_capacity: 1

# Docker backend: `host` (host socket), `dind` (docker-in-docker sidecar) or
# `rootless` (binary runner + rootless dockerd as user services).
forgejo_runner_docker: host

# Install amd64 binfmt emulation (QEMU) so arm64 codey can build amd64 images.
forgejo_runner_qemu: false

# Extra `docker create` options applied to every job container, e.g. memory
# caps. Rendered into config.yml's container.options.
forgejo_runner_container_options: ""

# Run node-exporter on this runner host (the only monitoring piece on runny).
forgejo_runner_node_exporter: false

# --- rootless backend (forgejo_runner_docker: rootless) --------------------
# The unprivileged user that owns the rootless dockerd and the runner binary.
forgejo_runner_rootless_user: runner
# subuid/subgid range handed to that user (next free range on runny).
forgejo_runner_rootless_subid: "296608:65536"
# The standalone runner binary (replaces the container image).
forgejo_runner_binary_arch: "{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}"
forgejo_runner_binary_url: >-
  https://code.forgejo.org/forgejo/runner/releases/download/v{{ forgejo_runner_version }}/forgejo-runner-{{ forgejo_runner_version }}-linux-{{ forgejo_runner_binary_arch }}
forgejo_runner_binary_path: /usr/local/bin/forgejo-runner
# Cache listener port, fixed so it can be firewalled and checked. 0 = runner picks.
forgejo_runner_cache_port: 0
forgejo_runner_prune_schedule: "*-*-* 02:00"
forgejo_runner_prune_flags: "-a -f --volumes"
# RootlessKit network driver (slirp4netns|pasta|vpnkit). pasta is faster and
# preserves source IPs; it is the default now that passt ships on 26.04.
forgejo_runner_rootless_net: "pasta"
# The old container-backend service dir, removed once the rootless runner is up.
forgejo_runner_legacy_service_dir: "/home/{{ create_user }}/runny"

# Where the service dir lives on the host. The runner's config.yml and .runner
# both live in ./data (bind-mounted to /data, the runner's working dir). The
# rootless backend keeps them under the rootless user's home instead of the
# deploy checkout.
forgejo_runner_service_dir: >-
  {{ ('/home/' ~ forgejo_runner_rootless_user ~ '/runny') if forgejo_runner_docker == 'rootless'
     else (docker.remote_dir, 'runny') | path_join }}
forgejo_runner_data_dir: "{{ (forgejo_runner_service_dir, 'data') | path_join }}"

# The Docker host the runner daemon talks to (per backend). For rootless this is
# the rootless socket under the user's runtime dir; the uid is a fact set in
# tasks/rootless.yml (getent) and referenced lazily here.
forgejo_runner_docker_host: >-
  {{ 'unix:///var/run/dind/docker.sock' if forgejo_runner_docker == 'dind'
     else ('unix:///run/user/' ~ (forgejo_runner_rootless_uid | string) ~ '/docker.sock' if forgejo_runner_docker == 'rootless'
     else 'unix:///var/run/docker.sock') }}

# What JOB containers get as /var/run/docker.sock (config.yml container.docker_host).
# Separate from forgejo_runner_docker_host, which the RUNNER itself needs.
# "-" = never mount. Empty is NOT auto-detect on runner 13.2.1: it also mounts nothing.
# host: "-" because the host socket is root on the host (history/2026-11-22_runny-docker-socket-fix.md).
# rootless: jobs get the rootless socket on purpose — it is the runner user's rights, not root.
forgejo_runner_job_docker_host: >-
  {{ '-' if forgejo_runner_docker == 'host' else forgejo_runner_docker_host }}

# Extra host:ip mappings for the runner AND its job containers (as --add-host).
# Only servyy-test needs it: ci.servyy-test.lxd has no DNS there, so it maps to
# the host gateway where Traefik listens.
forgejo_runner_extra_hosts: []
