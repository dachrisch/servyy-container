---
- name: Verify
  hosts: all
  become: true
  tasks:
    # --- dind variant (codey) ---------------------------------------------
    - name: Check dind config.yml exists
      ansible.builtin.stat:
        path: /home/testuser/runny-dind/data/config.yml
      register: dind_config
      failed_when: not dind_config.stat.exists

    - name: Verify dind config.yml carries codey's labels and capacity
      ansible.builtin.command:
        cmd: "grep -qE 'capacity: 2|ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-22.04|docker:docker://node:20-bookworm|arm64:host' /home/testuser/runny-dind/data/config.yml"
      changed_when: false

    - name: Verify the dind compose mounts the TLS certs, not the host socket
      ansible.builtin.command:
        cmd: "grep -q 'dind-sock:/var/run/dind' /home/testuser/runny-dind/docker-compose.yml"
      changed_when: false

    - name: Verify the dind compose has no host-socket mount
      ansible.builtin.command:
        cmd: "grep -q '/var/run/docker.sock' /home/testuser/runny-dind/docker-compose.yml"
      register: dind_socket
      changed_when: false
      failed_when: dind_socket.rc == 0

    - name: Verify the dind compose has the dind sidecar
      ansible.builtin.command:
        cmd: "grep -q 'image: docker:29-dind' /home/testuser/runny-dind/docker-compose.yml"
      changed_when: false

    - name: Verify the dind compose sets DOCKER_HOST to the sidecar
      ansible.builtin.command:
        cmd: "grep -q 'DOCKER_HOST=unix:///var/run/dind/docker.sock' /home/testuser/runny-dind/docker-compose.yml"
      changed_when: false

    # --- host variant (runny) ---------------------------------------------
    - name: Check host config.yml exists
      ansible.builtin.stat:
        path: /home/testuser/runny-host/data/config.yml
      register: host_config
      failed_when: not host_config.stat.exists

    - name: Verify host config.yml carries runny's label, capacity and memory options
      ansible.builtin.command:
        cmd: "grep -qE 'capacity: 1|amd64:docker://ghcr.io/catthehacker/ubuntu:act-22.04|--memory=900m --memory-swap=4g' /home/testuser/runny-host/data/config.yml"
      changed_when: false

    - name: Verify the host compose mounts the host socket
      ansible.builtin.command:
        cmd: "grep -q '/var/run/docker.sock:/var/run/docker.sock' /home/testuser/runny-host/docker-compose.yml"
      changed_when: false

    - name: Verify the dind config hands the dind socket to job containers
      ansible.builtin.command:
        cmd: "grep -qF 'docker_host: \"unix:///var/run/dind/docker.sock\"' /home/testuser/runny-dind/data/config.yml"
      changed_when: false

    - name: Verify the host config gives job containers NO daemon socket
      ansible.builtin.command:
        cmd: "grep -qF 'docker_host: \"-\"' /home/testuser/runny-host/data/config.yml"
      changed_when: false

    - name: Verify the host compose has no dind sidecar
      ansible.builtin.command:
        cmd: "grep -q 'image: docker:29-dind' /home/testuser/runny-host/docker-compose.yml"
      register: host_dind
      changed_when: false
      failed_when: host_dind.rc == 0

    # --- rootless variant (runny-test) ------------------------------------
    - name: Verify the rootless user exists with no supplementary groups
      ansible.builtin.shell:
        cmd: "getent passwd runner >/dev/null && [ \"$(id -Gn runner)\" = \"runner\" ]"
      changed_when: false

    - name: Verify /etc/subuid has exactly one runner line
      ansible.builtin.shell:
        cmd: "[ \"$(grep -c '^runner:' /etc/subuid)\" = \"1\" ] && [ \"$(grep -c '^runner:' /etc/subgid)\" = \"1\" ]"
      changed_when: false

    - name: Verify the rootless docker user unit exists and runs dockerd-rootless.sh
      ansible.builtin.shell:
        cmd: "grep -q 'ExecStart=/usr/share/docker.io/contrib/dockerd-rootless.sh' /home/runner/.config/systemd/user/docker.service && grep -q 'Delegate=yes' /home/runner/.config/systemd/user/docker.service"
      changed_when: false

    - name: Verify the rootless forgejo-runner unit sets the rootless DOCKER_HOST
      ansible.builtin.shell:
        cmd: "grep -q 'DOCKER_HOST=unix://%t/docker.sock' /home/runner/.config/systemd/user/forgejo-runner.service"
      changed_when: false

    - name: Verify the rootless config.yml hands jobs the rootless socket and fixes the cache port
      ansible.builtin.shell:
        cmd: "grep -qF 'docker_host: \"unix:///run/user/' /home/runner/runny/data/config.yml && grep -q 'port: 41500' /home/runner/runny/data/config.yml"
      changed_when: false

    - name: Verify the rootless service dir has NO compose file and is runner-owned
      ansible.builtin.shell:
        cmd: "test ! -e /home/runner/runny/docker-compose.yml && [ \"$(stat -c %U /home/runner/runny/data)\" = \"runner\" ]"
      changed_when: false

    - name: Verify prometheus-node-exporter is installed
      ansible.builtin.shell:
        cmd: "dpkg -s prometheus-node-exporter >/dev/null 2>&1"
      changed_when: false
