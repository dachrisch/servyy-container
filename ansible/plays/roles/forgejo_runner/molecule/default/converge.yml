---
# Render the runny/ runner for BOTH backends: `dind` (codey) and `host` (runny).
# The compose + config.yml are templates, so the scenario renders each variant
# into its own directory and verifies the backend-conditional wiring (socket
# mount vs dind sidecar, labels, capacity, container options).
- name: Converge
  hosts: all
  become: true
  vars:
    create_user: testuser
    remote_user_home: /home/testuser
    remote_user_systemd: /home/testuser/.config/systemd/user
    forgejo_runner_instance: https://ci.lehel.xyz
    forgejo_runner_name: codey
    forgejo_runner_labels:
      - "ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-22.04"
      - "docker:docker://node:20-bookworm"
      - "arm64:host"
    forgejo_runner_capacity: 2
    forgejo_runner_qemu: true
  tasks:
    - name: Render the dind variant (codey)
      ansible.builtin.include_role:
        name: forgejo_runner
      vars:
        forgejo_runner_docker: dind
        forgejo_runner_service_dir: /home/testuser/runny-dind
        forgejo_runner_data_dir: /home/testuser/runny-dind/data

    - name: Render the host variant (runny)
      ansible.builtin.include_role:
        name: forgejo_runner
      vars:
        forgejo_runner_docker: host
        forgejo_runner_name: runny
        forgejo_runner_labels:
          - "amd64:docker://ghcr.io/catthehacker/ubuntu:act-22.04"
        forgejo_runner_capacity: 1
        forgejo_runner_container_options: --memory=900m --memory-swap=4g
        forgejo_runner_service_dir: /home/testuser/runny-host
        forgejo_runner_data_dir: /home/testuser/runny-host/data
