---
# Codey shape: no LeagueSphere. Stale db timers (pre-seeded below, simulating
# the previously unconditional deploy) must be removed; home/root timers stay.
- name: Converge
  hosts: all
  become: true
  become_user: testuser
  vars:
    create_user: testuser
    remote_user_home: /home/testuser
    remote_user_systemd: /home/testuser/.config/systemd/user
    leaguesphere_enabled: false
    restic:
      home:
        source_path: /home/testuser
      root:
        source_path: /
      db:
        source_path: /var/jail/home/leaguesphere/container/deployed/mysql-backup/current
      schedules:
        backup_home: hourly
        backup_root: daily
        backup_ls_db: hourly
        backup_ls_db_dump: '*-*-* *:40:00'
      logs:
        backup_home: /var/log/restic/backup-home.log
        backup_root: /var/log/restic/backup-root.log
        backup_ls_db: /var/log/restic/backup-ls-db.log
        forget: /var/log/restic/forget.log
        check: /var/log/restic/check.log
      exclude_caches: true
  tasks:
    - name: Create stale db timer directories
      file:
        path: "{{ item }}"
        state: directory
        owner: testuser
        group: testuser
        mode: "0755"
      loop:
        - /home/testuser/.config/systemd/user
        - /home/testuser/.backup-scripts
      tags: [restic.backup]

    - name: Pre-seed stale db backup units and scripts
      copy:
        dest: "{{ item }}"
        content: "# stale fixture\n"
        owner: testuser
        group: testuser
        mode: "0644"
      loop:
        - /home/testuser/.config/systemd/user/mariadb-backup-ls.service
        - /home/testuser/.config/systemd/user/mariadb-backup-ls.timer
        - /home/testuser/.backup-scripts/mariadb-backup-ls.sh
        - /home/testuser/.config/systemd/user/restic-backup-ls-db.service
        - /home/testuser/.config/systemd/user/restic-backup-ls-db.timer
        - /home/testuser/.backup-scripts/restic-backup-ls-db.sh
      tags: [restic.backup]

    - name: Run restic backup schedules  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../"
        tasks_from: backup
      tags: [restic.backup]
