---
- name: "Verify (LeagueSphere host: all backup timers deployed)"
  hosts: all
  become: true
  vars:
    unit_dir: /home/testuser/.config/systemd/user
    script_dir: /home/testuser/.backup-scripts
  tasks:
    - name: Check backup timer units exist
      stat:
        path: "{{ unit_dir }}/{{ item }}.timer"
      loop:
        - restic-backup-home
        - restic-backup-root
        - restic-backup-ls-db
        - mariadb-backup-ls
        - moodle-dump
        - restic-backup-moodle-db
        - restic-backup-moodle-files
      register: backup_timers

    - name: Assert all backup timers deployed
      assert:
        that:
          - item.stat.exists
      loop: "{{ backup_timers.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Check backup scripts exist and are executable
      stat:
        path: "{{ script_dir }}/{{ item }}.sh"
      loop:
        - restic-backup-home
        - restic-backup-root
        - restic-backup-ls-db
        - mariadb-backup-ls
        - moodle-dump
        - restic-backup-moodle-db
        - restic-backup-moodle-files
      register: backup_scripts

    - name: Assert backup scripts deployed executable
      assert:
        that:
          - item.stat.exists
          - item.stat.executable
      loop: "{{ backup_scripts.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read ls-db backup script
      slurp:
        src: "{{ script_dir }}/restic-backup-ls-db.sh"
      register: ls_db_script

    - name: Assert ls-db script targets the db repo
      assert:
        that:
          - "'backup_type=\"db\"' in (ls_db_script.content | b64decode)"
          - "'/etc/restic/env.db' in (ls_db_script.content | b64decode)"

    - name: Read moodle backup scripts
      slurp:
        src: "{{ script_dir }}/restic-backup-{{ item }}.sh"
      loop:
        - moodle-files
        - moodle-db
      register: moodle_scripts

    - name: Assert moodle scripts target their own repos and run with sudo
      assert:
        that:
          - "'backup_type=\"{{ item.item }}\"' in (item.content | b64decode)"
          - "'/etc/restic/env.{{ item.item }}' in (item.content | b64decode)"
          - "'sudo bash -c' in (item.content | b64decode)"
      loop: "{{ moodle_scripts.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read moodle dump script
      slurp:
        src: "{{ script_dir }}/moodle-dump.sh"
      register: moodle_dump_script

    - name: Assert dump script uses the container's own credentials and a single-transaction dump
      assert:
        that:
          - "'--single-transaction' in (moodle_dump_script.content | b64decode)"
          - "'MARIADB_ROOT_PASSWORD' in (moodle_dump_script.content | b64decode)"
          - "'/moodle/data/db-backup' in (moodle_dump_script.content | b64decode)"
          # The precondition check must be privileged: on servy `data/` is
          # root:root 0750, so a bare `[ -d "$CUR" ]` as the deploy user is
          # always false and the swap silently nests the new dump inside the old.
          - "'sudo test -d \"$CUR\"' in (moodle_dump_script.content | b64decode)"
          - "'Swap did not take effect' in (moodle_dump_script.content | b64decode)"

    - name: Assert the moodle-db restic script refuses stale source data
      assert:
        that:
          - "'Source data is stale' in (moodle_scripts.results[1].content | b64decode)"
