---
- name: "Verify (LeagueSphere host: all backup timers deployed)"
  hosts: all
  become: true
  vars:
    unit_dir: /home/testuser/.config/systemd/user
    script_dir: /home/testuser/.backup-scripts
  tasks:
    - name: Check backup timer units exist
      stat:
        path: "{{ unit_dir }}/{{ item }}.timer"
      loop:
        - restic-backup-home
        - restic-backup-root
        - restic-backup-ls-db
        - mariadb-backup-ls
        - binlog-ship
        - restic-backup-ls-binlog
        - moodle-dump
        - restic-backup-moodle-db
        - restic-backup-moodle-files
      register: backup_timers

    - name: Assert all backup timers deployed
      assert:
        that:
          - item.stat.exists
      loop: "{{ backup_timers.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Check backup scripts exist and are executable
      stat:
        path: "{{ script_dir }}/{{ item }}.sh"
      loop:
        - restic-backup-home
        - restic-backup-root
        - restic-backup-ls-db
        - mariadb-backup-ls
        - binlog-ship
        - restic-backup-ls-binlog
        - moodle-dump
        - restic-backup-moodle-db
        - restic-backup-moodle-files
      register: backup_scripts

    - name: Assert backup scripts deployed executable
      assert:
        that:
          - item.stat.exists
          - item.stat.executable
      loop: "{{ backup_scripts.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read ls-db backup script
      slurp:
        src: "{{ script_dir }}/restic-backup-ls-db.sh"
      register: ls_db_script

    - name: Assert ls-db script targets the db repo
      assert:
        that:
          - "'backup_type=\"db\"' in (ls_db_script.content | b64decode)"
          - "'/etc/restic/env.db' in (ls_db_script.content | b64decode)"

    - name: Read the home and root backup scripts
      slurp:
        src: "{{ script_dir }}/restic-backup-{{ item }}.sh"
      loop:
        - home
        - root
      register: plain_scripts

    - name: Assert every rendered script stages its temp pack off /tmp
      assert:
        that:
          # The unit that failed on 2026-11-18 died with "disk quota exceeded"
          # because restic staged a 1.6 GB pack in the /tmp tmpfs. The variable
          # is mirrored in the scenario vars precisely so this line exists.
          - "'export TMPDIR=\"/home/testuser/.cache/restic-tmp\"' in (item.content | b64decode)"
      loop: "{{ plain_scripts.results }}"
      loop_control:
        label: "restic-backup-{{ item.item }}"

    - name: Assert the sudo branch re-exports TMPDIR
      vars:
        tmpdir: /home/testuser/.cache/restic-tmp
      assert:
        that:
          # sudo resets the environment, so the export above is not inherited.
          - "('export TMPDIR=' ~ tmpdir ~ '; mkdir -p -m 0700 ' ~ tmpdir) in (plain_scripts.results[1].content | b64decode)"

    - name: Read moodle backup scripts
      slurp:
        src: "{{ script_dir }}/restic-backup-{{ item }}.sh"
      loop:
        - moodle-files
        - moodle-db
      register: moodle_scripts

    - name: Assert moodle scripts target their own repos and run with sudo
      assert:
        that:
          - "'backup_type=\"{{ item.item }}\"' in (item.content | b64decode)"
          - "'/etc/restic/env.{{ item.item }}' in (item.content | b64decode)"
          - "'sudo bash -c' in (item.content | b64decode)"
      loop: "{{ moodle_scripts.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read moodle dump script
      slurp:
        src: "{{ script_dir }}/moodle-dump.sh"
      register: moodle_dump_script

    - name: Assert dump script uses the container's own credentials and a single-transaction dump
      assert:
        that:
          - "'--single-transaction' in (moodle_dump_script.content | b64decode)"
          - "'MARIADB_ROOT_PASSWORD' in (moodle_dump_script.content | b64decode)"
          - "'/moodle/data/db-backup' in (moodle_dump_script.content | b64decode)"
          # The precondition check must be privileged: on servy `data/` is
          # root:root 0750, so a bare `[ -d "$CUR" ]` as the deploy user is
          # always false and the swap silently nests the new dump inside the old.
          - "'sudo test -d \"$CUR\"' in (moodle_dump_script.content | b64decode)"
          - "'Swap did not take effect' in (moodle_dump_script.content | b64decode)"

    - name: Assert the moodle-db restic script refuses stale source data
      assert:
        that:
          - "'Source data is stale' in (moodle_scripts.results[1].content | b64decode)"

    # WP-8R R5: the binlog pair is a 5-MINUTE cadence. The shared timer template
    # defaults to RandomizedDelaySec=5m, which turns such a timer into 5-10
    # minutes (double the stated RPO) and can put the snapshot before the ship.
    # Assert the override actually reached the rendered unit, and that the hourly
    # jobs kept their jitter.
    - name: Read the rendered binlog timers
      slurp:
        src: "{{ unit_dir }}/{{ item }}.timer"
      loop:
        - binlog-ship
        - restic-backup-ls-binlog
      register: binlog_timers

    - name: Assert the binlog timers carry no random delay
      assert:
        that:
          - "'RandomizedDelaySec=0' in (item.content | b64decode)"
          - "'OnCalendar=*-*-* *:0' in (item.content | b64decode)"
      loop: "{{ binlog_timers.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read the hourly db timer
      slurp:
        src: "{{ unit_dir }}/restic-backup-ls-db.timer"
      register: db_timer

    - name: Assert the hourly job kept its 5-minute jitter
      assert:
        that:
          - "'RandomizedDelaySec=5m' in (db_timer.content | b64decode)"

    - name: Read the rendered binlog ship script
      slurp:
        src: "{{ script_dir }}/binlog-ship.sh"
      register: ship_script

    - name: Assert the ship script carries the retention pairing constants
      assert:
        that:
          - "'KEEP_DAYS=3' in (ship_script.content | b64decode)"
          - "'REPO_DAYS=2' in (ship_script.content | b64decode)"
          - "'last_ship_ok' in (ship_script.content | b64decode)"

    # --- WP-8R R8: one db-backup@<tier> unit pair, and the per-tenant dump units
    # are GONE (removed, not merely stopped). The template pair is deployed once;
    # systemd's %i is the tier.
    - name: Check the tier unit template pair exists
      stat:
        path: "{{ unit_dir }}/{{ item }}"
      loop:
        - db-backup@.service
        - db-backup@.timer
      register: tier_unit_pair

    - name: Assert the tier unit template pair was deployed
      assert:
        that:
          - item.stat.exists
      loop: "{{ tier_unit_pair.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read the rendered tier service unit
      slurp:
        src: "{{ unit_dir }}/db-backup@.service"
      register: tier_service

    - name: Assert the service runs the runner with the instance name
      assert:
        that:
          - "'db-backup-tier.sh %i' in (tier_service.content | b64decode)"
          - "'Type=oneshot' in (tier_service.content | b64decode)"

    - name: Read the rendered tier timer unit
      slurp:
        src: "{{ unit_dir }}/db-backup@.timer"
      register: tier_timer

    - name: Assert the timer ticks every 5 minutes with no jitter
      assert:
        that:
          # The tenant TIMES are not here — they live in the inventory rows.
          - "'OnCalendar=*-*-* *:00/5:00' in (tier_timer.content | b64decode)"
          - "'RandomizedDelaySec=0' in (tier_timer.content | b64decode)"

    - name: Read the rendered tier runner
      slurp:
        src: "{{ script_dir }}/db-backup-tier.sh"
      register: tier_runner

    - name: Assert the runner is inventory-driven, serialised and failure-isolated
      assert:
        that:
          - "'dump-due' in (tier_runner.content | b64decode)"
          - "'flock -n 9' in (tier_runner.content | b64decode)"
          # The tier this host serves is rendered from the inventory (one case
          # arm per tier that has a dump_via: dbops tenant).
          - "'    business) ;;' in (tier_runner.content | b64decode)"
          # Failure isolation: the loop must NOT exit on the first failure.
          - "'tenant dump failed' in (tier_runner.content | b64decode)"
          - "'FAILED_LIST' in (tier_runner.content | b64decode)"
          # It must never write a dump itself — it runs the per-tenant script.
          - "'dump-$t.sh' in (tier_runner.content | b64decode)"

    # `is-active` (and even `is-enabled`) needs a running systemd USER manager,
    # which a molecule container does not have — it runs systemd as PID 1, not
    # per-user. Asserting on them tests the harness, not the role: measured in CI,
    # everything up to here passed and then this failed with stdout 'unknown'.
    # What the role is responsible for is ENABLEMENT, and that is a symlink the
    # `systemd` module writes — filesystem state, observable here.
    - name: Stat the enablement symlink for the business tier timer
      ansible.builtin.stat:
        path: "{{ unit_dir }}/timers.target.wants/db-backup@business.timer"
      register: tier_enabled_link

    - name: Assert the business tier timer is enabled on this host
      assert:
        that:
          - tier_enabled_link.stat.exists and tier_enabled_link.stat.islnk
          # A TEMPLATE unit: the instance file db-backup@business.timer never
          # exists on disk — enabling it writes a symlink to db-backup@.timer.
          # Asserting on a file of the instance name can never pass.
          - (tier_enabled_link.stat.lnk_target | basename) == 'db-backup@.timer'
        fail_msg: >-
          db-backup@business.timer is not enabled (symlink exists:
          {{ tier_enabled_link.stat.exists | default(false) }}, target:
          {{ tier_enabled_link.stat.lnk_target | default('-') }}) — without it nothing
          drives `dbops dump-due` and every dump silently ages.
        quiet: true

    - name: Check the legacy per-tenant dump units are gone
      stat:
        path: "{{ item }}"
      loop:
        - "{{ unit_dir }}/db-dump-bnb_office.service"
        - "{{ unit_dir }}/db-dump-bnb_office.timer"
        - "{{ unit_dir }}/docker-bnb-office-dump.service"
        - "{{ unit_dir }}/docker-bnb-office-dump.timer"
      register: legacy_units

    - name: Assert the deploy removed every per-tenant dump unit
      assert:
        that:
          - not item.stat.exists
      loop: "{{ legacy_units.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Assert the per-tenant dump SCRIPT is still deployed for the runner
      stat:
        path: "{{ script_dir }}/dump-bnb_office.sh"
      register: tenant_dump_script

    - name: Assert the runner's per-tenant script survived the unit removal
      assert:
        that:
          - tenant_dump_script.stat.exists
          - tenant_dump_script.stat.executable

    # WP-8R follow-up: the tenant dump root must hold `new/` + `current/` and
    # nothing else — a loose file there is in no snapshot and no probe sees it
    # (a 107 MB PhotoPrism dump sat invisible that way for a day). Two halves of
    # that rule are observable in the rendered script: the run stages through
    # DBOPS_DUMP_DIR=$NEW, and the last check FAILS the run when the root holds
    # anything else. Without the guard the layout can drift back silently.
    - name: Read the rendered per-tenant dump script
      slurp:
        src: "{{ script_dir }}/dump-bnb_office.sh"
      register: tenant_dump_body

    - name: Assert the dump script stages into new/ and enforces the root layout
      assert:
        that:
          - "'DBOPS_DUMP_DIR=\"$NEW\"' in (tenant_dump_body.content | b64decode)"
          - "'! -name new ! -name current' in (tenant_dump_body.content | b64decode)"
          - "'dump root holds entries outside new/ and current/' in (tenant_dump_body.content | b64decode)"
        fail_msg: >-
          dump-bnb_office.sh does not enforce the dump-root layout: it must stage
          into new/ (DBOPS_DUMP_DIR=$NEW) and fail when <dump_dir> holds anything
          besides new/ and current/. See roles/restic/templates/dbops_dump.sh.j2.
        quiet: true
