---
- name: "Verify (LeagueSphere host: all backup timers deployed)"
  hosts: all
  become: true
  vars:
    unit_dir: /home/testuser/.config/systemd/user
    script_dir: /home/testuser/.backup-scripts
  tasks:
    - name: Check backup timer units exist
      stat:
        path: "{{ unit_dir }}/{{ item }}.timer"
      loop:
        - restic-backup-home
        - restic-backup-root
        - restic-backup-ls-db
        - mariadb-backup-ls
        - binlog-ship
        - restic-backup-ls-binlog
        - moodle-dump
        - restic-backup-moodle-db
        - restic-backup-moodle-files
      register: backup_timers

    - name: Assert all backup timers deployed
      assert:
        that:
          - item.stat.exists
      loop: "{{ backup_timers.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Check backup scripts exist and are executable
      stat:
        path: "{{ script_dir }}/{{ item }}.sh"
      loop:
        - restic-backup-home
        - restic-backup-root
        - restic-backup-ls-db
        - mariadb-backup-ls
        - binlog-ship
        - restic-backup-ls-binlog
        - moodle-dump
        - restic-backup-moodle-db
        - restic-backup-moodle-files
      register: backup_scripts

    - name: Assert backup scripts deployed executable
      assert:
        that:
          - item.stat.exists
          - item.stat.executable
      loop: "{{ backup_scripts.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read ls-db backup script
      slurp:
        src: "{{ script_dir }}/restic-backup-ls-db.sh"
      register: ls_db_script

    - name: Assert ls-db script targets the db repo
      assert:
        that:
          - "'backup_type=\"db\"' in (ls_db_script.content | b64decode)"
          - "'/etc/restic/env.db' in (ls_db_script.content | b64decode)"

    - name: Read the home and root backup scripts
      slurp:
        src: "{{ script_dir }}/restic-backup-{{ item }}.sh"
      loop:
        - home
        - root
      register: plain_scripts

    - name: Assert every rendered script stages its temp pack off /tmp
      assert:
        that:
          # The unit that failed on 2026-11-18 died with "disk quota exceeded"
          # because restic staged a 1.6 GB pack in the /tmp tmpfs. The variable
          # is mirrored in the scenario vars precisely so this line exists.
          - "'export TMPDIR=\"/home/testuser/.cache/restic-tmp\"' in (item.content | b64decode)"
      loop: "{{ plain_scripts.results }}"
      loop_control:
        label: "restic-backup-{{ item.item }}"

    - name: Assert the sudo branch re-exports TMPDIR
      vars:
        tmpdir: /home/testuser/.cache/restic-tmp
      assert:
        that:
          # sudo resets the environment, so the export above is not inherited.
          - "('export TMPDIR=' ~ tmpdir ~ '; mkdir -p -m 0700 ' ~ tmpdir) in (plain_scripts.results[1].content | b64decode)"

    - name: Read moodle backup scripts
      slurp:
        src: "{{ script_dir }}/restic-backup-{{ item }}.sh"
      loop:
        - moodle-files
        - moodle-db
      register: moodle_scripts

    - name: Assert moodle scripts target their own repos and run with sudo
      assert:
        that:
          - "'backup_type=\"{{ item.item }}\"' in (item.content | b64decode)"
          - "'/etc/restic/env.{{ item.item }}' in (item.content | b64decode)"
          - "'sudo bash -c' in (item.content | b64decode)"
      loop: "{{ moodle_scripts.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read moodle dump script
      slurp:
        src: "{{ script_dir }}/moodle-dump.sh"
      register: moodle_dump_script

    - name: Assert dump script uses the container's own credentials and a single-transaction dump
      assert:
        that:
          - "'--single-transaction' in (moodle_dump_script.content | b64decode)"
          - "'MARIADB_ROOT_PASSWORD' in (moodle_dump_script.content | b64decode)"
          - "'/moodle/data/db-backup' in (moodle_dump_script.content | b64decode)"
          # The precondition check must be privileged: on servy `data/` is
          # root:root 0750, so a bare `[ -d "$CUR" ]` as the deploy user is
          # always false and the swap silently nests the new dump inside the old.
          - "'sudo test -d \"$CUR\"' in (moodle_dump_script.content | b64decode)"
          - "'Swap did not take effect' in (moodle_dump_script.content | b64decode)"

    - name: Assert the moodle-db restic script refuses stale source data
      assert:
        that:
          - "'Source data is stale' in (moodle_scripts.results[1].content | b64decode)"

    # WP-8R R5: the binlog pair is a 5-MINUTE cadence. The shared timer template
    # defaults to RandomizedDelaySec=5m, which turns such a timer into 5-10
    # minutes (double the stated RPO) and can put the snapshot before the ship.
    # Assert the override actually reached the rendered unit, and that the hourly
    # jobs kept their jitter.
    - name: Read the rendered binlog timers
      slurp:
        src: "{{ unit_dir }}/{{ item }}.timer"
      loop:
        - binlog-ship
        - restic-backup-ls-binlog
      register: binlog_timers

    - name: Assert the binlog timers carry no random delay
      assert:
        that:
          - "'RandomizedDelaySec=0' in (item.content | b64decode)"
          - "'OnCalendar=*-*-* *:0' in (item.content | b64decode)"
      loop: "{{ binlog_timers.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read the hourly db timer
      slurp:
        src: "{{ unit_dir }}/restic-backup-ls-db.timer"
      register: db_timer

    - name: Assert the hourly job kept its 5-minute jitter
      assert:
        that:
          - "'RandomizedDelaySec=5m' in (db_timer.content | b64decode)"

    - name: Read the rendered binlog ship script
      slurp:
        src: "{{ script_dir }}/binlog-ship.sh"
      register: ship_script

    - name: Assert the ship script carries the retention pairing constants
      assert:
        that:
          - "'KEEP_DAYS=3' in (ship_script.content | b64decode)"
          - "'REPO_DAYS=2' in (ship_script.content | b64decode)"
          - "'last_ship_ok' in (ship_script.content | b64decode)"
