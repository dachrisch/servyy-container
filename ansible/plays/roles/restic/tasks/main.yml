---
# Orchestrator for Restic role

# Pre-flight: recover missing restic password seed files from Vaultwarden (or
# prompt the operator) BEFORE any restic_password_* var is dereferenced, so a
# missing seed never silently generates a new password. Tagged for init AND
# recreate so it guards the destructive recreate path too.
# `apply.tags` is REQUIRED: with dynamic include_tasks, tags on the include
# statement do NOT propagate to the included tasks, so under `--tags restic.init`
# / `--tags restic.recreate` the guard's inner tasks would be skipped (no-op)
# without it — defeating the guard on exactly the recreate path it must protect.
- name: Guard restic password seed files
  include_tasks:
    file: seed_guard.yml
    apply:
      tags:
        - restic
        - restic.init
        - restic.recreate
  tags:
    - restic
    - restic.init
    - restic.recreate

- name: Initialize Restic Infrastructure
  include_tasks: init.yml
  tags:
    - restic
    - restic.init

- name: Setup Test Environment
  include_tasks: test_setup.yml
  when: inventory_hostname == 'servyy-test.lxd'
  tags:
    - restic
    - restic.test

- name: Manual Lockout Recovery
  include_tasks: recreate.yml
  when: ansible_run_tags | intersect(['restic.recreate']) | length > 0
  tags:
    - restic.recreate

# ----------------------------------------------------------------------------
# INTEGRATED RESTORE (Critical for recovery)
# ----------------------------------------------------------------------------
# These tasks always run to ensure data is "re-hydrated" on fresh hosts.
# The decision matrix inside restore.yml ensures they SKIP on healthy hosts.

- name: Restore Gitea Data
  include_tasks: restore.yml
  vars:
    restore_path: "{{ (docker.remote_dir, 'git', 'repos') | path_join }}"
    backup_name: "{{ (inventory_hostname == 'servyy-test.lxd') | ternary('test', 'home') }}"
    owner: "root"
  when: (with_containers | default(false)) | bool
  tags:
    - restic
    - restic.restore

- name: Restore PhotoPrism Database
  include_tasks: restore.yml
  vars:
    restore_path: "{{ (docker.remote_dir, 'photoprism', 'database') | path_join }}"
    backup_name: "{{ (inventory_hostname == 'servyy-test.lxd') | ternary('test', 'home') }}"
    owner: "{{ create_user }}"
  when: (with_containers | default(false)) | bool
  tags:
    - restic
    - restic.restore

- name: Restore Vaultwarden Data
  include_tasks: restore.yml
  vars:
    restore_path: "{{ (docker.remote_dir, 'pass', 'vw-data') | path_join }}"
    backup_name: "{{ (inventory_hostname == 'servyy-test.lxd') | ternary('test', 'home') }}"
    owner: "root"
  when: (with_containers | default(false)) | bool
  tags:
    - restic
    - restic.restore

# ----------------------------------------------------------------------------
# MOODLE (OFFD / Flag Academy) — two scopes, both gated on moodle_enabled.
#
# Caveat: restore.yml's "containers are running" guard looks for a
# docker-compose.yml in the restore target's PARENT. For the moodle paths the
# parent is the data directory (no compose file there), so that guard is inert
# — the only protection against overwriting a live site is restore.yml's
# empty-target rule (or an explicit force_restore). Set force_restore only with
# `docker compose -p moodle down` already done.
# ----------------------------------------------------------------------------
- name: Restore Moodle dataroot
  include_tasks: restore.yml
  vars:
    restore_path: "{{ moodle_data_root_path }}/moodledata"
    backup_name: "moodle-files"
    owner: "65534"
    group: "65534"
    post_restore_notice: |
      ════════════════════════════════════════════════════════════════════
      ⚠️  MOODLE DATAROOT RESTORED — the DATABASE is a separate restore
      ════════════════════════════════════════════════════════════════════
      restic restored moodledata from the `moodle-files` repo to:
        {{ moodle_data_root_path }}/moodledata

      It is only half of a usable instance. The database is restored by the
      `moodle-db` include (dump files) and must then be IMPORTED — see that
      notice. Until then Moodle has files it cannot reference and a DB whose
      rows point at files that are not there.

      Afterwards verify: owner 65534:65534 on the tree. Moodle re-applies its
      own $CFG->directorypermissions (02777) to the dataroot on the next boot,
      so a restored tree legitimately ends up at 2777 rather than the 2770 the
      2026-11-04 import used, and `docker exec -u 65534 moodle.moodle php
      admin/cli/purge_caches.php` should run clean.
      ════════════════════════════════════════════════════════════════════
  when:
    - (with_containers | default(false)) | bool
    - moodle_enabled | default(false) | bool
  tags:
    - restic
    - restic.restore

- name: Restore Moodle database dump
  include_tasks: restore.yml
  vars:
    restore_path: "{{ moodle_data_root_path }}/db-backup/current"
    backup_name: "moodle-db"
    owner: "root"
    post_restore_notice: |
      ════════════════════════════════════════════════════════════════════
      ⚠️  MOODLE DB DUMP RESTORED — DB is NOT live yet
      ════════════════════════════════════════════════════════════════════
      restic restored the logical dump to:
        {{ moodle_data_root_path }}/db-backup/current/moodle.sql.gz

      The dump is a `mariadb-dump --databases moodle` and is NOT loaded into
      the live database. Import it by hand (one-time, after a disaster):

        cd {{ docker.remote_dir }}/moodle
        docker compose -p moodle stop moodle
        sudo gunzip -c data/db-backup/current/moodle.sql.gz \
          | docker exec -i moodle.db sh -c \
              'exec mariadb -uroot -p"$MARIADB_ROOT_PASSWORD"'
        docker compose -p moodle start moodle

      A fresh/empty `data/mariadb` also needs the container to initialise it
      first (start moodle.db once, let it become healthy, then import).
      Then purge caches and confirm `upgrade.php --is-pending` exits 0.
      ════════════════════════════════════════════════════════════════════
  when:
    - (with_containers | default(false)) | bool
    - moodle_enabled | default(false) | bool
  tags:
    - restic
    - restic.restore

# RECOVERY (manual, after restore.yml repopulates current/):
#   1. docker compose -p leaguesphere stop db
#   2. empty /var/jail/home/leaguesphere/container/deployed/mysql-data
#   3. docker run --rm \
#        -v /var/jail/home/leaguesphere/container/deployed/mysql-data:/var/lib/mysql \
#        -v /var/jail/home/leaguesphere/container/deployed/mysql-backup/current:/backup \
#        mariadb:latest mariadb-backup --copy-back --target-dir=/backup
#   4. chown -R 999:999 /var/jail/home/leaguesphere/container/deployed/mysql-data
#   5. docker compose -p leaguesphere start db ; verify health
# The jail (and its mysql-backup/current target) is created by the leaguesphere
# play, which runs AFTER the restic play. On a host that will run LeagueSphere
# but has no jail yet (first test deploy), there is nothing to restore into —
# skip instead of failing. Hosts WITH a jail but no snapshots still fail fast
# via restore.yml's test-env guard (intended backup-tripwire behavior).
- name: Check if LeagueSphere jail exists (db restore target)
  stat:
    path: "/var/jail/home/leaguesphere/container/deployed"
  register: ls_jail_stat
  when: leaguesphere_enabled | default(false) | bool
  tags:
    - restic
    - restic.restore

- name: Restore LeagueSphere Prod DB Backup
  include_tasks: restore.yml
  vars:
    restore_path: "/var/jail/home/leaguesphere/container/deployed/mysql-backup/current"
    backup_name: "db"
    owner: "root"
    # Shown ONLY when restic actually restored the set (fresh/empty host or
    # force_restore). restic restores the backup FILES into current/; loading
    # them into the live DB is a deliberate manual copy-back — see below.
    post_restore_notice: |
      ════════════════════════════════════════════════════════════════════
      ⚠️  LEAGUESPHERE DB RESTORE: backup FILES restored — DB is NOT live yet
      ════════════════════════════════════════════════════════════════════
      restic restored the prepared mariadb-backup set to:
        /var/jail/home/leaguesphere/container/deployed/mysql-backup/current

      The leaguesphere.db container is still on a FRESH/EMPTY data dir. To
      load the backup into the live database you MUST run copy-back manually
      on this host (one-time, after a disaster rebuild or data loss):

        cd /var/jail/home/leaguesphere/container/deployed
        docker compose -p leaguesphere stop db
        sudo rm -rf mysql-data/*
        docker run --rm \
          -v $(pwd)/mysql-data:/var/lib/mysql \
          -v $(pwd)/mysql-backup/current:/backup \
          mariadb:latest mariadb-backup --copy-back --target-dir=/backup
        sudo chown -R 999:999 mysql-data    # mariadb uid inside the image
        docker compose -p leaguesphere start db

      Until copy-back runs, leaguesphere.db serves an EMPTY schema.
      Full runbook: docs/leaguesphere-environments.md → "Prod DB restore procedure"
      ════════════════════════════════════════════════════════════════════
  when:
    - (with_containers | default(false)) | bool
    - leaguesphere_enabled | default(false) | bool
    - ls_jail_stat.stat.exists | default(false)
  tags:
    - restic
    - restic.restore

# ----------------------------------------------------------------------------
# OPERATIONALIZE (Backup schedules)
# ----------------------------------------------------------------------------

- name: Deploy Backup Schedules and Timers
  include_tasks: backup.yml
  tags:
    - restic
    - restic.backup
