---
# Deploy restic backup scripts and timers
- name: Create backup scripts directory
  file:
    path: "{{ remote_user_home }}/.backup-scripts"
    state: directory
    mode: '0755'
  tags:
    - restic.backup

# Home backup
- name: Deploy restic backup script for home
  template:
    src: restic_backup.sh.j2
    dest: "{{ remote_user_home }}/.backup-scripts/restic-backup-home.sh"
    mode: '0750'
  vars:
    backup_name: "home"
    source_path: "{{ restic.home.source_path }}"
    excludes: "{{ restic.home.excludes }}"
    exclude_caches: "{{ restic.exclude_caches }}"
    log_file: "{{ restic.logs.backup_home }}"
  tags:
    - restic.backup

- import_tasks: oneshot_include.yml
  vars:
    service:
      name: restic-backup-home
      description: 'Restic backup - home directory'
      schedule: '{{ restic.schedules.backup_home }}'
      command: "{{ remote_user_home }}/.backup-scripts/restic-backup-home.sh"
  tags:
    - restic.backup

# Root backup
- name: Deploy restic backup script for root
  template:
    src: restic_backup.sh.j2
    dest: "{{ remote_user_home }}/.backup-scripts/restic-backup-root.sh"
    mode: '0750'
  vars:
    backup_name: "root"
    source_path: "{{ restic.root.source_path }}"
    includes: "{{ restic.root.includes }}"
    excludes: "{{ restic.root.excludes }}"
    exclude_caches: "{{ restic.exclude_caches }}"
    log_file: "{{ restic.logs.backup_root }}"
    with_sudo: true
  tags:
    - restic.backup

- import_tasks: oneshot_include.yml
  vars:
    service:
      name: restic-backup-root
      description: 'Restic backup - root filesystem'
      schedule: '{{ restic.schedules.backup_root }}'
      command: "{{ remote_user_home }}/.backup-scripts/restic-backup-root.sh"
  tags:
    - restic.backup

# LeagueSphere prod DB backup (mariadb-backup -> prepared current set).
# Scoped to LeagueSphere hosts only (leaguesphere_enabled): other hosts have no
# jail path to dump from. `ls_prod` may be injected by the caller (molecule);
# otherwise it is loaded from the (git-crypt encrypted) secret_main.yaml.
- name: Load prod app vars for backup creds
  include_vars:
    file: "{{ playbook_dir }}/roles/ls_app/vars/secret_main.yaml"
    name: ls_prod
  when:
    - leaguesphere_enabled | default(false) | bool
    - ls_prod is not defined
  tags: [restic.backup]

- name: Deploy mariadb-backup script
  template:
    src: mariadb_backup.sh.j2
    dest: "{{ remote_user_home }}/.backup-scripts/mariadb-backup-ls.sh"
    mode: '0750'
  vars:
    ls_backup_host_dir: "/var/jail/home/leaguesphere/container/deployed/mysql-backup"
    ls_backup_user: "{{ ls_prod.app.db_backup_user }}"
    ls_backup_password: "{{ ls_prod.app.db_backup_password }}"
  no_log: true
  when: leaguesphere_enabled | default(false) | bool
  tags: [restic.backup]

- import_tasks: oneshot_include.yml
  vars:
    service:
      name: mariadb-backup-ls
      description: 'mariadb-backup of leaguesphere prod db'
      schedule: '{{ restic.schedules.backup_ls_db_dump | default("*-*-* *:40:00") }}'
      command: "{{ remote_user_home }}/.backup-scripts/mariadb-backup-ls.sh"
  when: leaguesphere_enabled | default(false) | bool
  tags: [restic.backup]

# LeagueSphere prod DB restic backup (hourly, reads prepared current set)
- name: Deploy restic backup script for ls-db
  template:
    src: restic_backup.sh.j2
    dest: "{{ remote_user_home }}/.backup-scripts/restic-backup-ls-db.sh"
    mode: '0750'
  vars:
    backup_name: "db"
    source_path: "{{ restic.db.source_path }}"
    exclude_caches: false
    log_file: "{{ restic.logs.backup_ls_db }}"
    with_sudo: true
  when: leaguesphere_enabled | default(false) | bool
  tags:
    - restic.backup

- import_tasks: oneshot_include.yml
  vars:
    service:
      name: restic-backup-ls-db
      description: 'Restic backup - leaguesphere prod db'
      schedule: '{{ restic.schedules.backup_ls_db }}'
      command: "{{ remote_user_home }}/.backup-scripts/restic-backup-ls-db.sh"
  when: leaguesphere_enabled | default(false) | bool
  tags:
    - restic.backup

# ---------------------------------------------------------------------------
# WP-8R R5 — the binlog tail: 5-minute ship + 5-minute snapshot.
#
# Two units, in this order of dependence:
#   binlog-ship          :01/5 — stages the server's binlogs into
#                                {{ restic['ls-binlog'].source_path }}
#   restic-backup-ls-binlog :03/5 — snapshots that directory into `ls-binlog`
#
# `randomized_delay: '0'` for BOTH: the shared timer template's 5-minute jitter
# is right for hourly/daily jobs (it spreads load) and wrong here — it would make
# a 5-minute cadence 5–10 minutes, i.e. double the stated RPO, and it could put
# the snapshot before the ship it is supposed to capture.
#
# The snapshot job carries the stale-source guard pointed at the stage's
# `last_ship_ok` marker. That is the whole alerting chain for a stalled tail:
# a failing or CHECK-FAILED ship does not refresh the marker, the guard refuses
# to snapshot after 15 minutes, the repo's snapshot age crosses 20 minutes, and
# `stale_restic_snapshot_high` pages on repo="ls-binlog". Without the guard the
# snapshot would keep landing happily on unchanging files and every dashboard
# would stay green while the recovery window silently stopped growing.
- name: Create the binlog staging directory
  ansible.builtin.file:
    path: "{{ restic['ls-binlog'].source_path }}"
    state: directory
    owner: "{{ create_user }}"
    group: "{{ create_user }}"
    mode: '0750'
  when: leaguesphere_enabled | default(false) | bool
  tags: [restic.backup]

- name: Deploy the binlog ship script
  ansible.builtin.template:
    src: binlog_ship.sh.j2
    dest: "{{ (remote_user_home, '.backup-scripts', 'binlog-ship.sh') | path_join }}"
    mode: '0750'
  vars:
    binlog_container: leaguesphere.db
    binlog_src_dir: /var/lib/mysql
    binlog_stage_dir: "{{ restic['ls-binlog'].source_path }}"
    # 3 days in the stage vs the repo's 2-day keep: a file pruned from the stage
    # at exactly the repo's retention would disappear from the NEWEST snapshots
    # while the older snapshots still holding it are already being forgotten.
    binlog_stage_keep_days: 3
    binlog_repo_keep_days: 2
    binlog_log_file: "{{ restic.logs.binlog_ship }}"
    ls_backup_current_dir: "{{ restic.db.source_path }}"
  when: leaguesphere_enabled | default(false) | bool
  tags: [restic.backup]

- import_tasks: oneshot_include.yml
  vars:
    service:
      name: binlog-ship
      description: 'Ship MariaDB binlogs for PITR into the ls-binlog stage'
      schedule: '{{ restic.schedules.ship_binlog }}'
      command: "{{ (remote_user_home, '.backup-scripts', 'binlog-ship.sh') | path_join }}"
      randomized_delay: '0'
  when: leaguesphere_enabled | default(false) | bool
  tags: [restic.backup]

- name: Deploy restic backup script for ls-binlog
  ansible.builtin.template:
    src: restic_backup.sh.j2
    dest: "{{ (remote_user_home, '.backup-scripts', 'restic-backup-ls-binlog.sh') | path_join }}"
    mode: '0750'
  vars:
    backup_name: "ls-binlog"
    source_path: "{{ restic['ls-binlog'].source_path }}"
    excludes: "{{ restic['ls-binlog'].excludes }}"
    exclude_caches: false
    log_file: "{{ restic.logs.backup_ls_binlog }}"
    # A ship that stopped (or whose pairing check failed) must not keep
    # producing fresh-looking snapshots of the same old binlogs.
    stale_guard_path: "{{ (restic['ls-binlog'].source_path, 'last_ship_ok') | path_join }}"
    stale_guard_max_age_minutes: 15
  when: leaguesphere_enabled | default(false) | bool
  tags: [restic.backup]

- import_tasks: oneshot_include.yml
  vars:
    service:
      name: restic-backup-ls-binlog
      description: 'Restic backup - leaguesphere binlog tail (PITR)'
      schedule: '{{ restic.schedules.backup_ls_binlog }}'
      command: "{{ (remote_user_home, '.backup-scripts', 'restic-backup-ls-binlog.sh') | path_join }}"
      randomized_delay: '0'
  when: leaguesphere_enabled | default(false) | bool
  tags: [restic.backup]

# ---------------------------------------------------------------------------
# Moodle (OFFD / Flag Academy) — gated on moodle_enabled.
#
# Two independent scopes instead of one (see vars/restic.yml): the hourly DB
# stream and the ~6 GB daily file stream must not share locks/prune, and the
# snapshot-age probe reports one age per repo — a single repo would hide stale
# files behind a fresh hourly DB snapshot.
#
# The dump is the pattern already proven in production: bnb-office.db's daily
# `mariadb-dump` one-liner and the nightly LeagueSphere prod->stage sync. The
# password is read from the container's own MARIADB_ROOT_PASSWORD, so nothing
# secret is templated here and `no_log` is not needed.
# ---------------------------------------------------------------------------
- name: Create moodle backup directory
  file:
    path: "{{ moodle_data_root_path }}/db-backup"
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  become_user: root
  when: moodle_enabled | default(false) | bool
  tags:
    - restic.backup

- name: Deploy moodle database dump script
  template:
    src: moodle_dump.sh.j2
    dest: "{{ remote_user_home }}/.backup-scripts/moodle-dump.sh"
    mode: '0750'
  vars:
    # WP-7b (2026-11-18): the dump follows the database. Until the cutover the
    # container is this project's own `moodle.db`; from the moment
    # `moodle_db_host` is set (db-business.mariadb on servy) it is the business
    # tier's container, which carries MARIADB_ROOT_PASSWORD in its own env - the
    # only thing this script reads. Derived from the same variable the app's
    # DB_HOST comes from, so a rollback moves the dump back with it and no host
    # can keep dumping a server nobody reads.
    moodle_db_container: "{{ moodle_db_host | default('moodle.db') }}"
    moodle_dump_root: "{{ moodle_data_root_path }}/db-backup"
    log_file: "{{ restic.logs.moodle_dump }}"
  when: moodle_enabled | default(false) | bool
  tags:
    - restic.backup

- import_tasks: oneshot_include.yml
  vars:
    service:
      name: moodle-dump
      description: 'Logical MariaDB dump of the Moodle database'
      schedule: '{{ restic.schedules.backup_moodle_dump }}'
      command: "{{ remote_user_home }}/.backup-scripts/moodle-dump.sh"
  when: moodle_enabled | default(false) | bool
  tags:
    - restic.backup

- name: Deploy restic backup script for moodle-db
  template:
    src: restic_backup.sh.j2
    dest: "{{ remote_user_home }}/.backup-scripts/restic-backup-moodle-db.sh"
    mode: '0750'
  vars:
    backup_name: "moodle-db"
    source_path: "{{ restic['moodle-db'].source_path }}"
    exclude_caches: false
    log_file: "{{ restic.logs.backup_moodle_db }}"
    with_sudo: true
    # A dump that stopped refreshing must not keep producing snapshots that look
    # current: fail instead, so the newest-snapshot age crosses the 2 h alert.
    stale_guard_path: "{{ restic['moodle-db'].source_path }}"
    stale_guard_max_age_minutes: 120
  when: moodle_enabled | default(false) | bool
  tags:
    - restic.backup

- import_tasks: oneshot_include.yml
  vars:
    service:
      name: restic-backup-moodle-db
      description: 'Restic backup - moodle database dump'
      schedule: '{{ restic.schedules.backup_moodle_db }}'
      command: "{{ remote_user_home }}/.backup-scripts/restic-backup-moodle-db.sh"
  when: moodle_enabled | default(false) | bool
  tags:
    - restic.backup

# --- WP-8R R3/R4/R6: the dump-backed repos (servy only) --------------------
# PhotoPrism (private), leagues_finance + queen (business), dontforget (private
# mongo), firefly (private MariaDB) and — since R7 — bnb_office (business). Each
# target is one restic snapshot job, rendered from its `backup_targets` row; the
# DUMP side is one unit per TIER since R8 (see below), not one per tenant.
#
# `servy` targets are gated on inventory_hostname in vars/restic.yml, so on any
# other host `db_dump_targets` is empty and every loop below is a no-op (the
# same mechanism that keeps moodle/leaguesphere off hosts that do not run them).
- name: Select the dump-backed backup targets that run on this host
  ansible.builtin.set_fact:
    db_dump_targets: >-
      {{ restic_targets_enabled | default([])
         | selectattr('enabled_by', 'equalto', 'servy') | list }}
    db_snapshot_units: []
  tags:
    - restic.backup

# The canonical root (R7). Created here, not by the dump script, so a fresh host
# has the directory (and its ownership) before the first timer ever fires and
# before restic is pointed at <root>/current.
- name: Create the canonical dump directory for each dump-backed tenant
  ansible.builtin.file:
    path: "{{ tenant_row.dump_dir }}"
    state: directory
    owner: "{{ create_user }}"
    group: "{{ create_user }}"
    mode: '0770'
  vars:
    tenant_row: "{{ db_tenants | selectattr('tenant', 'equalto', item.tenant) | first }}"
  loop: "{{ db_dump_targets }}"
  loop_control:
    label: "{{ item.tenant }}"
  tags:
    - restic.backup

- name: Deploy the database dump script for each dump-backed tenant
  ansible.builtin.template:
    # ENGINE, not tenant name: WP-10 moved firefly to MariaDB and the ordinary
    # `dbops dump` path must take over with the SAME dump dir and repo. The
    # postgres template is kept only for the rollback (a reverted inventory row
    # must render a working pg_dump again) until shared.db is deleted.
    src: "{{ 'firefly_dump.sh.j2' if tenant_row.engine == 'postgres' else 'dbops_dump.sh.j2' }}"
    dest: "{{ (remote_user_home, '.backup-scripts', 'dump-' ~ item.tenant ~ '.sh') | path_join }}"
    mode: '0750'
  vars:
    tenant_row: "{{ db_tenants | selectattr('tenant', 'equalto', item.tenant) | first }}"
    dump_root: "{{ tenant_row.dump_dir }}"
    # From the TENANT row, not the target row: the floor is a property of the
    # tenant's data, and restic_wiring.yml fails the run if the two ever differ.
    dump_size_floor_bytes: "{{ tenant_row.size_floor_bytes }}"
    dump_log: "{{ restic.logs[item.dump_log_key] }}"
    # dbops is rendered by the db_tier role. Its path is a db_tier role default,
    # which a different role cannot see, hence the fallback — same value, one
    # owner (roles/db_tier/defaults/main.yml: db_tier_dbops_path).
    dbops_path: "{{ db_tier_dbops_path | default((remote_user_home, '.dbops', 'dbops') | path_join) }}"
  loop: "{{ db_dump_targets }}"
  loop_control:
    label: "dump-{{ item.tenant }}"
  tags:
    - restic.backup

- name: Deploy the restic script for each dump-backed repo
  ansible.builtin.template:
    src: restic_backup.sh.j2
    dest: "{{ (remote_user_home, '.backup-scripts', 'restic-backup-' ~ item.name ~ '.sh') | path_join }}"
    mode: '0750'
  vars:
    backup_name: "{{ item.name }}"
    source_path: "{{ restic[item.name].source_path }}"
    exclude_caches: "{{ restic.exclude_caches }}"
    log_file: "{{ restic.logs[item.log_key] }}"
  loop: "{{ db_dump_targets }}"
  loop_control:
    label: "restic-backup-{{ item.name }}"
  tags:
    - restic.backup

# --- WP-8R R8: ONE db-backup@<tier> unit per tier --------------------------
# Before this file submitted ten per-tenant oneshot units (five dump + five
# snapshot) and the legacy bnb one-liner made it eleven; every new tenant meant
# another 02:30/01:25-shaped timer written by hand. Now:
#   * the SNAPSHOT side stays one timer per repo (a repo's cadence is its own
#     promise, and the snapshot-age probe expects exactly that), below;
#   * the DUMP side is one template unit per tier — `db-backup@business`,
#     `db-backup@private` — ticking every 5 minutes, and `dbops dump-due <tier>`
#     decides who is due from the rows. No tenant name and no dump time appears
#     in the unit or in this task list.
#
# WHICH TIERS GET A UNIT is derived, not listed: a tier gets one iff it has at
# least one tenant whose row says `dump_via: dbops` AND whose repo is enabled on
# this host. On servy that is business + private. The high tier deliberately has
# none (its protection is the physical prepared set + the 5-minute binlog tail,
# R5, with their own units) and nonprod has none (nothing dumps it, by design) —
# rendering an empty unit for either would claim a protection that does not
# exist.
- name: Select the tenants whose dump runs through the tier units
  ansible.builtin.set_fact:
    db_backup_tenants: >-
      {{ db_tenants | default([]) | selectattr('dump_via', 'defined')
         | selectattr('dump_via', 'equalto', 'dbops')
         | selectattr('restic_repo', 'in',
                      restic_targets_enabled | default([]) | map(attribute='name') | list)
         | list }}
  tags:
    - restic.backup

- name: Build the tier roster (one db-backup@<tier> instance per tier)
  ansible.builtin.set_fact:
    db_backup_tiers: "{{ db_backup_tenants | map(attribute='tier') | unique | sort | list }}"
  tags:
    - restic.backup

- name: Report the tier roster this host will run
  ansible.builtin.debug:
    msg: >-
      db-backup@<tier> instances: {{ db_backup_tiers | join(', ') | default('(none)', true) }};
      tenants: {{ db_backup_tenants | map(attribute='tenant') | join(', ') | default('(none)', true) }}
  tags:
    - restic.backup

- name: Deploy the tier dump runner
  ansible.builtin.template:
    src: db-backup-tier.sh.j2
    dest: "{{ (remote_user_home, '.backup-scripts', 'db-backup-tier.sh') | path_join }}"
    mode: '0750'
  vars:
    dbops_path: "{{ db_tier_dbops_path | default((remote_user_home, '.dbops', 'dbops') | path_join) }}"
    tier_log_dir: "{{ restic.log_dir | default('/var/log/restic') }}"
  when: db_backup_tiers | length > 0
  tags:
    - restic.backup

# One file pair for ALL tiers (a real systemd template unit): `%i` is the tier.
# `systemctl --user enable db-backup@business.timer` is the only per-tier action.
- name: Deploy the db-backup@ template unit pair
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ (remote_user_systemd, item.dest) | path_join }}"
    mode: '0644'
  loop:
    - {src: 'db-backup@.service.j2', dest: 'db-backup@.service'}
    - {src: 'db-backup@.timer.j2', dest: 'db-backup@.timer'}
  loop_control:
    label: "{{ item.dest }}"
  when: db_backup_tiers | length > 0
  tags:
    - restic.backup
    - restic.systemd

# The runner logs one file per tier; create them as root with the same ownership
# the other restic logs have (the runner is the deploy user, /var/log is root's).
# The DIRECTORY first: on a fresh host (and in molecule) /var/log/restic does not
# exist yet, and `state: touch` on a path whose parent is missing fails with
# "Error, could not touch target" instead of saying the directory is absent.
- name: Ensure the restic log directory exists
  ansible.builtin.file:
    path: "{{ restic.log_dir | default('/var/log/restic') }}"
    state: directory
    owner: "{{ create_user }}"
    group: "{{ create_user }}"
    mode: '0755'
  become: true
  become_user: root
  when: db_backup_tiers | length > 0
  tags:
    - restic.backup

- name: Create the per-tier dump log files
  ansible.builtin.file:
    path: "{{ (restic.log_dir | default('/var/log/restic'), 'db-backup-' ~ tier ~ '.log') | path_join }}"
    state: touch
    owner: "{{ create_user }}"
    group: "{{ create_user }}"
    mode: '0644'
    modification_time: preserve
    access_time: preserve
  loop: "{{ db_backup_tiers }}"
  loop_control:
    loop_var: tier
    label: "db-backup-{{ tier }}.log"
  become: true
  become_user: root
  when: db_backup_tiers | length > 0
  tags:
    - restic.backup

- name: Enable the db-backup@<tier>.timer for each tier
  ansible.builtin.systemd:
    scope: user
    name: "db-backup@{{ tier }}.timer"
    state: started
    enabled: true
    daemon_reload: true
  loop: "{{ db_backup_tiers }}"
  loop_control:
    loop_var: tier
    label: "db-backup@{{ tier }}.timer"
  when: db_backup_tiers | length > 0
  tags:
    - restic.backup
    - restic.systemd

# --- WP-8R R8: remove the per-tenant dump units the tier units replace ------
# "Removed by the deploy" is the requirement, not "left stopped": a stopped unit
# that is still enabled is one `systemctl --user start` (or a `Persistent=true`
# catch-up) away from running in parallel with the tier unit. Stop, disable, then
# delete the file pair — for exactly the tenants this host serves FROM a tier
# unit. The dump SCRIPT stays: it is what the tier runner executes.
- name: Stop and disable the per-tenant dump timers now served by a tier unit
  ansible.builtin.systemd:
    scope: user
    name: "db-dump-{{ item.tenant }}.timer"
    state: stopped
    enabled: false
    daemon_reload: false
  loop: "{{ db_backup_tenants }}"
  loop_control:
    label: "db-dump-{{ item.tenant }}.timer"
  register: legacy_tenant_timer_stop
  # Optional legacy units: a tenant may never have had one, and systemd also
  # rejects these stub units inside molecule. Removal below is what matters.
  failed_when: false
  changed_when: legacy_tenant_timer_stop.changed | default(false)
  when: db_backup_tenants | length > 0
  tags:
    - restic.backup
    - restic.systemd

- name: Remove the per-tenant dump unit files now served by a tier unit
  ansible.builtin.file:
    path: "{{ (remote_user_systemd, item) | path_join }}"
    state: absent
  loop: >-
    {{ db_backup_tenants | map(attribute='tenant')
       | map('regex_replace', '^(.*)$', 'db-dump-\1.service') | list
       + db_backup_tenants | map(attribute='tenant')
       | map('regex_replace', '^(.*)$', 'db-dump-\1.timer') | list }}
  loop_control:
    label: "{{ item }}"
  when: db_backup_tenants | length > 0
  tags:
    - restic.backup
    - restic.systemd

# The pre-R8 bnb unit lived in roles/user (a one-liner in ExecStart=), not in this
# role, so no loop above can find it. It is removed here — not merely un-managed —
# because deleting its task from roles/user leaves the FILE and its timer running
# until something removes them. Gated on bnb being tier-managed on this host.
- name: Remove the legacy bnb dump unit replaced by db-backup@business
  vars:
    bnb_tenant: "{{ db_backup_tenants | selectattr('tenant', 'equalto', 'bnb_office') | list }}"
  when: bnb_tenant | length > 0
  block:
    - name: Stop and disable the legacy bnb dump timer
      ansible.builtin.systemd:
        scope: user
        name: docker-bnb-office-dump.timer
        state: stopped
        enabled: false
      register: legacy_bnb_timer_stop
      # Pre-R8 cleanup: the unit can be absent or un-loadable; the file removal
      # below is the state we actually enforce.
      failed_when: false
      changed_when: legacy_bnb_timer_stop.changed | default(false)
    - name: Remove the legacy bnb dump unit files
      ansible.builtin.file:
        path: "{{ (remote_user_systemd, item) | path_join }}"
        state: absent
      loop:
        - docker-bnb-office-dump.service
        - docker-bnb-office-dump.timer
  tags:
    - restic.backup
    - restic.systemd

# One list, then ONE loop over the snapshot unit template: "add a tenant" stays
# "add a backup_targets row" (R1). The DUMP unit is no longer in this list — the
# tier unit is (above).
- name: Build the oneshot unit list (one snapshot job per dump-backed repo)
  ansible.builtin.set_fact:
    db_snapshot_units: >-
      {{ db_snapshot_units + [
           {'name': 'restic-backup-' ~ t.name,
            'description': 'Restic backup - ' ~ t.name ~ ' (' ~ t.tenant ~ ' dumps)',
            'schedule': restic.schedules['backup_' ~ (t.name | replace('-', '_'))],
            'command': (remote_user_home, '.backup-scripts', 'restic-backup-' ~ t.name ~ '.sh') | path_join}
         ] }}
  loop: "{{ db_dump_targets }}"
  loop_control:
    loop_var: t
    label: "{{ t.name }}"
  tags:
    - restic.backup

- name: Deploy the snapshot timers for the dump-backed repos
  ansible.builtin.include_tasks:
    file: oneshot_include.yml
    # Dynamic include + tags: tags on an include statement do NOT propagate into
    # the included tasks, so without `apply` a `--tags restic.backup` run would
    # deploy the scripts and leave the timers behind.
    apply:
      tags:
        - restic.backup
        - restic.systemd
  vars:
    service: "{{ unit }}"
  loop: "{{ db_snapshot_units }}"
  loop_control:
    loop_var: unit
    label: "{{ unit.name }}"
  tags:
    - restic.backup
    - restic.systemd

- name: Deploy restic backup script for moodle-files
  template:
    src: restic_backup.sh.j2
    dest: "{{ remote_user_home }}/.backup-scripts/restic-backup-moodle-files.sh"
    mode: '0750'
  vars:
    backup_name: "moodle-files"
    source_path: "{{ restic['moodle-files'].source_path }}"
    excludes: "{{ restic['moodle-files'].excludes }}"
    exclude_caches: "{{ restic.exclude_caches }}"
    log_file: "{{ restic.logs.backup_moodle_files }}"
    with_sudo: true
  when: moodle_enabled | default(false) | bool
  tags:
    - restic.backup

- import_tasks: oneshot_include.yml
  vars:
    service:
      name: restic-backup-moodle-files
      description: 'Restic backup - moodle dataroot'
      schedule: '{{ restic.schedules.backup_moodle_files }}'
      command: "{{ remote_user_home }}/.backup-scripts/restic-backup-moodle-files.sh"
  when: moodle_enabled | default(false) | bool
  tags:
    - restic.backup

- name: Clean up Moodle backup timers on hosts where Moodle is not enabled
  when: not (moodle_enabled | default(false) | bool)
  block:
    - name: Stop Moodle backup timers
      systemd:
        scope: user
        name: "{{ item }}.timer"
        state: stopped
        enabled: false
      loop:
        - moodle-dump
        - restic-backup-moodle-db
        - restic-backup-moodle-files
      register: moodle_timer_stop
      # Cleanup: hosts that never had Moodle have no such units, and molecule
      # cannot load these stubs. The file removal below is what matters.
      failed_when: false
      changed_when: moodle_timer_stop.changed | default(false)
      tags:
        - restic.backup
    - name: Remove Moodle backup units and scripts
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ (remote_user_systemd, 'moodle-dump.service') | path_join }}"
        - "{{ (remote_user_systemd, 'moodle-dump.timer') | path_join }}"
        - "{{ (remote_user_home, '.backup-scripts', 'moodle-dump.sh') | path_join }}"
        - "{{ (remote_user_systemd, 'restic-backup-moodle-db.service') | path_join }}"
        - "{{ (remote_user_systemd, 'restic-backup-moodle-db.timer') | path_join }}"
        - "{{ (remote_user_home, '.backup-scripts', 'restic-backup-moodle-db.sh') | path_join }}"
        - "{{ (remote_user_systemd, 'restic-backup-moodle-files.service') | path_join }}"
        - "{{ (remote_user_systemd, 'restic-backup-moodle-files.timer') | path_join }}"
        - "{{ (remote_user_home, '.backup-scripts', 'restic-backup-moodle-files.sh') | path_join }}"
      tags:
        - restic.backup

# Clean up DB backup timers on hosts where LeagueSphere is not enabled
# (e.g. codey): they were deployed unconditionally before the leaguesphere
# scoping, and would otherwise keep failing against the missing jail path.
- name: Clean up LeagueSphere DB backup timers
  when: not (leaguesphere_enabled | default(false) | bool)
  block:
    - name: Stop DB backup timers
      systemd:
        scope: user
        name: "{{ item }}.timer"
        state: stopped
        enabled: false
      loop:
        - mariadb-backup-ls
        - restic-backup-ls-db
        - binlog-ship
        - restic-backup-ls-binlog
      register: db_backup_timer_stop
      # Legacy units may be absent or un-loadable on hosts without LeagueSphere;
      # the file removal below is the state we actually enforce.
      failed_when: false
      changed_when: db_backup_timer_stop.changed | default(false)
      tags:
        - restic.backup
    - name: Remove DB backup units and scripts
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ (remote_user_systemd, 'mariadb-backup-ls.service') | path_join }}"
        - "{{ (remote_user_systemd, 'mariadb-backup-ls.timer') | path_join }}"
        - "{{ (remote_user_home, '.backup-scripts', 'mariadb-backup-ls.sh') | path_join }}"
        - "{{ (remote_user_systemd, 'restic-backup-ls-db.service') | path_join }}"
        - "{{ (remote_user_systemd, 'restic-backup-ls-db.timer') | path_join }}"
        - "{{ (remote_user_home, '.backup-scripts', 'restic-backup-ls-db.sh') | path_join }}"
        # WP-8R R5: the binlog pair must be removed together with the db pair —
        # a leftover binlog-ship timer on a host without LeagueSphere would spin
        # forever against a container that does not exist.
        - "{{ (remote_user_systemd, 'binlog-ship.service') | path_join }}"
        - "{{ (remote_user_systemd, 'binlog-ship.timer') | path_join }}"
        - "{{ (remote_user_home, '.backup-scripts', 'binlog-ship.sh') | path_join }}"
        - "{{ (remote_user_systemd, 'restic-backup-ls-binlog.service') | path_join }}"
        - "{{ (remote_user_systemd, 'restic-backup-ls-binlog.timer') | path_join }}"
        - "{{ (remote_user_home, '.backup-scripts', 'restic-backup-ls-binlog.sh') | path_join }}"
      tags:
        - restic.backup
