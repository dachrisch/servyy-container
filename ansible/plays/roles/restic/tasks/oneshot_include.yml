---
- name: Create the systemd directory if it does not exist
  ansible.builtin.file:
    path: "{{ remote_user_systemd }}"
    state: directory
    mode: '0755'

- name: Create {{service.name}} service
  template:
    src: oneshot.service.j2
    dest: "{{ (remote_user_systemd, service.name) | path_join }}.service"
    mode: '0644'
  tags:
    - restic.backup
    - restic.systemd

- name: Create timer for {{ service.name }}
  template:
    src: oneshot.timer.j2
    dest: "{{ (remote_user_systemd, service.name) | path_join }}.timer"
    mode: '0644'
  vars:
    timer:
      description: 'Trigger for {{ service.name }}'
      schedule: '{{ service.schedule }}'
      # Per-unit override: hourly/daily jobs keep the 5-minute spread, a
      # 5-minute job (the binlog ship pair) must pass `'0'` or its cadence
      # becomes 5–10 minutes and its RPO doubles.
      randomized_delay: '{{ service.randomized_delay | default("5m") }}'
  tags:
    - restic.backup
    - restic.systemd

- name: Start timer for {{ service. name }}
  systemd:
    scope: user
    name: '{{service.name}}.timer'
    state: started
    enabled: yes
    # daemon_reload: a REWRITTEN unit file is not the one systemd has loaded, so
    # until the next unrelated reload the timer keeps firing the OLD ExecStart.
    # Measured twice in this repo — on WP-5b (2026-11-18, docker-bnb-office-dump:
    # `systemctl --user cat` said "the version systemd has loaded is outdated",
    # so the next fire would still have run the previous command line) and again
    # on the WP-8R timers. The sibling includes (system_probe,
    # ls_maintenance_probe, user/oneshot) already did this; this file was the one
    # that did not, and it is the include every restic timer goes through.
    daemon_reload: yes
  tags:
    - restic.backup
    - restic.systemd
