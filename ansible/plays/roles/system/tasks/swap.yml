- name: set swap_file variable
  set_fact:
    swap_file: /{{ swap_space }}B.swap
  tags:
    - system.swap.file
    - system.swap.file.check
    - system.swap.file.permission
    - system.swap.file.format
    - system.swap.fstab
    - system.swap.create
    - system.swap.on
    - system.swap.swappiness

# swap_file's name encodes swap_space (e.g. /5GB.swap), so changing swap_space
# (or swap_space_override) points at a brand-new file — the old one would
# otherwise be left behind on disk and in fstab, doubling swap usage instead
# of resizing it.
#
# Task ORDER matters here and is not cosmetic: the desired swap file is
# created and activated BEFORE any stale file is switched off. On a host under
# memory pressure the old swap still holds live pages, and swapoff has to fault
# every one of them back into RAM. Doing that with no swap active at all is how
# you OOM a machine in the middle of a resize; doing it with the new swap
# already on gives the kernel somewhere to evict cold pages to.
- name: check if swap file exists
  stat:
    path: "{{ swap_file }}"
  register: swap_file_check
  tags:
    - system.swap.file.check
    - system.swap.file.format
    - system.swap.on
    - system.swap.create

- name: Calculate blocks
  command: 'numfmt --from iec --format "%8.0f" {{ swap_space }}'
  register: size_int
  changed_when: false

- set_fact:
    dd_count: "{{ (size_int.stdout | int) / 1000000 }}"

- name: Create swap space
  command: dd if=/dev/zero of={{ swap_file }} bs=1M count={{dd_count|int}}
  tags:
    - system.swap.space.create
  when: not swap_file_check.stat.exists

- name: set permissions on swap file
  file:
    path: "{{ swap_file }}"
    mode: 0600
  # In --check mode the file has not been created yet (dd is skipped), so
  # `file` would fail with "absent, cannot continue".
  when: swap_file_check.stat.exists or not ansible_check_mode
  tags:
    - system.swap.file.permission

- name: format swap file
  command: mkswap {{ swap_file }}
  when: not swap_file_check.stat.exists
  tags:
    - system.swap.file.format

- name: add to fstab
  lineinfile:
    dest: /etc/fstab
    regexp: '^\s*{{ swap_file | regex_escape }}\s+none\s+swap\s+'
    line: "{{ swap_file }} none swap sw 0 0"
  tags:
    - system.swap.fstab

# Activated explicitly (not via `swapon -a`) so that stale fstab entries still
# present at this point do not get switched on just to be switched off again.
- name: read active swap devices
  command: swapon --show=NAME --noheadings
  register: active_swap_devices
  changed_when: false
  tags:
    - system.swap.on

- name: turn on swap
  command: swapon {{ swap_file }}
  when: swap_file not in active_swap_devices.stdout_lines
  tags:
    - system.swap.on

# Retire leftovers: fstab entries pointing at a different size, and any *.swap
# file sitting on disk from an earlier swap_space value (which may be active
# but missing from fstab, e.g. after an interrupted resize).
- name: find existing swap file entries in fstab
  shell: grep -oP '^/\S+\.swap(?=\s+none\s+swap)' /etc/fstab || true
  register: fstab_swap_files
  changed_when: false
  tags:
    - system.swap.stale.cleanup

- name: find swap files on disk
  ansible.builtin.find:
    paths: /
    patterns: '*.swap'
    file_type: file
    depth: 1
  register: swap_files_on_disk
  tags:
    - system.swap.stale.cleanup

- name: identify stale swap files (different size than desired)
  set_fact:
    stale_swap_files: >-
      {{ (fstab_swap_files.stdout_lines + (swap_files_on_disk.files | map(attribute='path') | list))
         | reject('equalto', swap_file) | unique | list }}
  tags:
    - system.swap.stale.cleanup

- name: turn off stale swap files
  command: swapoff {{ item }}
  loop: "{{ stale_swap_files }}"
  failed_when: false
  tags:
    - system.swap.stale.cleanup

# A swapoff can fail with ENOMEM when the host cannot fault every page of the
# old file back into RAM. Deleting the file anyway would unlink it while the
# kernel still holds it, so the space stays allocated but becomes invisible
# (neither df nor swapon accounting explains it). Refuse to continue instead:
# the new swap is already active, so a retry after memory pressure drops works.
- name: re-read active swap devices
  command: swapon --show=NAME --noheadings
  register: active_swap_devices_after
  changed_when: false
  when: not ansible_check_mode
  tags:
    - system.swap.stale.cleanup

- name: abort if a stale swap file is still in use
  ansible.builtin.assert:
    that: (stale_swap_files | intersect(active_swap_devices_after.stdout_lines)) | length == 0
    fail_msg: >-
      Still active after swapoff:
      {{ stale_swap_files | intersect(active_swap_devices_after.stdout_lines) | join(', ') }}.
      Not deleting them — the new {{ swap_space }} swap is already enabled, so
      re-run once memory pressure has dropped.
    success_msg: "Stale swap files are switched off."
  when: not ansible_check_mode
  tags:
    - system.swap.stale.cleanup

- name: remove stale swap fstab entries
  lineinfile:
    path: /etc/fstab
    regexp: '^\s*{{ item | regex_escape }}\s+none\s+swap\s+'
    state: absent
  loop: "{{ stale_swap_files }}"
  tags:
    - system.swap.stale.cleanup

- name: delete stale swap files
  file:
    path: "{{ item }}"
    state: absent
  loop: "{{ stale_swap_files }}"
  tags:
    - system.swap.stale.cleanup

- name: set swapiness
  sysctl:
    name: vm.swappiness
    value: "1"
  tags:
    - system.swap.swappiness
