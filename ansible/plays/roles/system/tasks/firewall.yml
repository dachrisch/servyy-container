---
# Host-level filter for Docker-published ports. See history/2026-10-29_exposure-triage.md.
#
# Docker bypasses ufw: it writes its own FORWARD rules, so anything in a compose `ports:`
# entry is reachable from outside unless the provider blocks it. This adds a HOST-EDGE chain
# (hooked from DOCKER-USER) that allows only {22,80,443} in on the public interface.

- name: Deploy the Docker edge filter script
  template:
    src: docker-user-firewall.sh.j2
    dest: /usr/local/sbin/docker-user-firewall.sh
    mode: '0700'
    owner: root
    group: root
  become: true
  notify: restart docker edge filter
  when: edge_filter_enabled | default(true)
  tags:
    - system.firewall
    - system.firewall.edge

- name: Deploy the Docker edge filter unit
  template:
    src: docker-user-firewall.service.j2
    dest: /etc/systemd/system/docker-user-firewall.service
    mode: '0644'
    owner: root
    group: root
  become: true
  notify: reload systemd
  when: edge_filter_enabled | default(true)
  tags:
    - system.firewall
    - system.firewall.edge

- name: Enable and start the Docker edge filter
  systemd:
    name: docker-user-firewall.service
    enabled: true
    state: started
  become: true
  when:
    - edge_filter_enabled | default(true)
    - ansible_facts['virtualization_type'] | default('') != 'docker'
  tags:
    - system.firewall
    - system.firewall.edge

# runny runs node-exporter on the host network (the one monitoring piece on the
# 1 GB box); servy's Prometheus scrapes :9100 over the public internet. The edge
# filter above only guards DOCKER-USER (container FORWARD traffic), so a host
# process like node-exporter needs its own INPUT rule: allow :9100 from servy
# only, drop it from everywhere else. The Oracle security list (provider) also
# restricts 9100 to servy — this is host-level defence in depth.
- name: Allow node-exporter scrapes from servy's Prometheus only
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "9100"
    source: "{{ item }}"
    jump: ACCEPT
  loop: "{{ forgejo_runner_node_exporter_sources | default([]) }}"
  become: true
  when: forgejo_runner_node_exporter | default(false) | bool
  tags:
    - system.firewall
    - system.firewall.node-exporter

- name: Drop node-exporter scrapes from anywhere else
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "9100"
    jump: DROP
  become: true
  when: forgejo_runner_node_exporter | default(false) | bool
  tags:
    - system.firewall
    - system.firewall.node-exporter
