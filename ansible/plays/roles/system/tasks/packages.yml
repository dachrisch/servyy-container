# Install packages
# apt verifies repository indices as the unprivileged _apt user. On hosts that already carry
# the Trivy keyring from an older deploy, a 0640 root:root mode makes gpgv fail with NO_PUBKEY
# 35B8ACA44FD9CA9F and update_cache dies. The authoritative key creation/chmod lives in
# security_audit.yml, but that file is imported last in main.yml -- after these apt tasks --
# so repair the mode here first. Idempotent and tagged so --tags system.packages fixes it too.
- name: Stat the Trivy APT keyring
  stat:
    path: /usr/share/keyrings/trivy.gpg
  register: trivy_keyring_stat
  become: true
  tags:
    - system.packages

- name: Relax Trivy APT keyring mode so apt can read it
  file:
    path: /usr/share/keyrings/trivy.gpg
    mode: '0644'
  when: trivy_keyring_stat.stat.exists
  become: true
  tags:
    - system.packages

- name: Install Prerequisites
  apt: name=aptitude update_cache=yes state=latest force_apt_get=yes
  tags:
    - system.packages.update

- name: Upgrade the OS (apt-get dist-upgrade)
  apt:
    upgrade: dist
    update_cache: yes
  register: upgrade
  # Ubuntu mirrors can transiently 404 pruned .debs (e.g. old kernel
  # linux-libc-dev) right after index refresh; refresh and retry before failing.
  until: upgrade is successful
  retries: 3
  delay: 10
  tags:
    - system.packages.dist-upgrade

- name: Pre-create monit log file (workaround for installer bug)
  file:
    path: /var/log/monit.log
    state: touch
    owner: root
    group: root
    mode: '0640'
    modification_time: preserve
    access_time: preserve
  tags:
    - system.packages.install

- name: Install required system packages
  apt:
    name: >-
      {{ sys_packages | reject('match', '^linux-image-.*') | list
         if ansible_facts['virtualization_type'] | default('') in ['lxc', 'docker']
         else sys_packages }}
    state: latest
  tags:
    - system.packages.install

- name: Ensure a locale exists
  community.general.locale_gen:
    name: de_DE.UTF-8
    state: present
  tags:
    - system.packages.locale

- name: Set timezone to Europe/Berlin
  timezone:
    name: Europe/Berlin
  failed_when: false  # Timezone data may not be available in Docker containers
  tags:
    - system.packages.timezone
    - molecule-notest

- name: Reboot to apply changes
  reboot:
    msg: Reboot after system update
  when:
    - upgrade.changed
    - ansible_facts['virtualization_type'] | default('') not in ['docker', 'lxc']
  tags:
    - system.packages.reboot
