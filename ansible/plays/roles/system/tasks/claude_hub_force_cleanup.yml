---
# Long-tail disk-growth backstop for claude-hub (infra-specific, not part of upstream june-hub) --
# see history/2026-09-26_claude-hub-worktree-dispatch-rework.md. Runs weekly, well below the
# reaper's own 15-minute cadence (claude_hub_reaper.yml), force-closing (never hand-rolled
# deletion) sessions parked far longer than `claude_hub_force_cleanup.days`.

- name: Create cleanup scripts directory
  file:
    path: "/home/{{ create_user }}/.cleanup-scripts"
    state: directory
    mode: '0755'
    owner: "{{ create_user }}"
    group: "{{ create_user }}"
  become: true

- name: Deploy Claude Hub force-cleanup script
  template:
    src: claude-hub-force-cleanup.sh.j2
    dest: "/home/{{ create_user }}/.cleanup-scripts/claude-hub-force-cleanup.sh"
    mode: '0755'
    owner: "{{ create_user }}"
    group: "{{ create_user }}"
  become: true

- name: Create Claude Hub force-cleanup log file with correct permissions
  file:
    path: /var/log/claude-hub-force-cleanup.log
    state: touch
    owner: "{{ create_user }}"
    group: "{{ create_user }}"
    mode: '0644'
    modification_time: preserve
    access_time: preserve
  become: true

- name: Deploy Claude Hub force-cleanup systemd service
  template:
    src: claude-hub-force-cleanup.service.j2
    dest: /etc/systemd/system/claude-hub-force-cleanup.service
    mode: '0644'
  notify: reload systemd
  become: true

- name: Deploy Claude Hub force-cleanup systemd timer
  template:
    src: claude-hub-force-cleanup.timer.j2
    dest: /etc/systemd/system/claude-hub-force-cleanup.timer
    mode: '0644'
  notify: reload systemd
  become: true

- name: Enable and start Claude Hub force-cleanup timer
  systemd:
    name: claude-hub-force-cleanup.timer
    enabled: true
    state: started
  become: true
  when: ansible_facts['virtualization_type'] | default('') != 'docker'
