---
# Retired 2026-09-27: long-tail force-cleanup moved to codey's Ofelia
# scheduler (ofelia.job-exec.hub-force-cleanup label on claude-hub.hub,
# Sun 04:00 UTC, preserving the old Sun 06:00 host-local fire instant) -- one
# scheduler for all codey container jobs. See
# history/2026-09-27_codey-ofelia-scheduler.md. This file now only tears down
# the systemd units.

- name: Stop and disable claude-hub-force-cleanup timer (moved to Ofelia)
  systemd:
    name: claude-hub-force-cleanup.timer
    state: stopped
    enabled: false
  become: true
  failed_when: false

- name: Remove claude-hub-force-cleanup unit files and script
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/claude-hub-force-cleanup.timer
    - /etc/systemd/system/claude-hub-force-cleanup.service
    - "/home/{{ create_user }}/.cleanup-scripts/claude-hub-force-cleanup.sh"
  become: true
  notify: reload systemd

# /var/log/claude-hub-force-cleanup.log is deliberately left in place as
# history; nothing rotates it anymore, nothing appends to it either.
