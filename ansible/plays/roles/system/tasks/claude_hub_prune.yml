---
- name: Create cleanup scripts directory
  file:
    path: "/home/{{ create_user }}/.cleanup-scripts"
    state: directory
    mode: '0755'
    owner: "{{ create_user }}"
    group: "{{ create_user }}"
  become: true

- name: Deploy Claude Hub prune script
  template:
    src: claude-hub-prune.sh.j2
    dest: "/home/{{ create_user }}/.cleanup-scripts/claude-hub-prune.sh"
    mode: '0755'
    owner: "{{ create_user }}"
    group: "{{ create_user }}"
  become: true

- name: Create Claude Hub prune log file with correct permissions
  file:
    path: /var/log/claude-hub-prune.log
    state: touch
    owner: "{{ create_user }}"
    group: "{{ create_user }}"
    mode: '0644'
    modification_time: preserve
    access_time: preserve
  become: true

- name: Deploy Claude Hub prune systemd service
  template:
    src: claude-hub-prune.service.j2
    dest: /etc/systemd/system/claude-hub-prune.service
    mode: '0644'
  notify: reload systemd
  become: true

- name: Deploy Claude Hub prune systemd timer
  template:
    src: claude-hub-prune.timer.j2
    dest: /etc/systemd/system/claude-hub-prune.timer
    mode: '0644'
  notify: reload systemd
  become: true

- name: Enable and start Claude Hub prune timer
  systemd:
    name: claude-hub-prune.timer
    enabled: true
    state: started
  become: true
  when: ansible_facts['virtualization_type'] | default('') != 'docker'
