---
# Retired 2026-09-27: session parking moved to codey's Ofelia scheduler
# (ofelia.job-exec.hub-reaper label on claude-hub.hub, @every 1h) -- one
# scheduler for all codey container jobs. See
# history/2026-09-27_codey-ofelia-scheduler.md. This file now only tears down
# the systemd units (same pattern as the earlier prune->reaper rename below).

- name: Stop and disable claude-hub-reaper timer (moved to Ofelia)
  systemd:
    name: claude-hub-reaper.timer
    state: stopped
    enabled: false
  become: true
  failed_when: false

- name: Remove claude-hub-reaper unit files and script
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/claude-hub-reaper.timer
    - /etc/systemd/system/claude-hub-reaper.service
    - "/home/{{ create_user }}/.cleanup-scripts/claude-hub-reaper.sh"
  become: true
  notify: reload systemd

# /var/log/claude-hub-reaper.log is deliberately left in place as history;
# nothing rotates it anymore, nothing appends to it either.
