- name: Restart SSHD
  service:
    name: ssh
    state: restarted

- name: restart fail2ban
  service:
    name: fail2ban
    state: restarted

- name: restart journald
  systemd:
    name: systemd-journald
    state: restarted
  become: true

- name: reload systemd
  systemd:
    daemon_reload: yes

- name: restart monit
  service:
    name: monit
    state: restarted

- name: reload sshd
  service:
    name: ssh
    state: reloaded
  become: true

- name: reload sysctl
  command: sysctl --system
  changed_when: true
  become: true

# augenrules concatenates /etc/audit/rules.d/*.rules and loads the result with auditctl -R.
# It replaces the running rule set, so no auditd restart (which drops events) is needed.
# Guarded like the other service handlers: auditd cannot load rules inside a container.
- name: reload auditd
  command: augenrules --load
  changed_when: true
  become: true
  when: ansible_facts['virtualization_type'] | default('') != 'docker'

# The filter lives in DOCKER-USER, which Docker recreates on every daemon restart, hence the
# unit is re-run rather than cared for by iptables persistence.
- name: restart docker edge filter
  systemd:
    name: docker-user-firewall.service
    state: restarted
  become: true
  when: ansible_facts['virtualization_type'] | default('') != 'docker'
