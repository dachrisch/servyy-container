- name: Restart SSHD
  service:
    name: ssh
    state: restarted

- name: restart fail2ban
  service:
    name: fail2ban
    state: restarted

- name: restart journald
  systemd:
    name: systemd-journald
    state: restarted
  become: true

- name: reload systemd
  systemd:
    daemon_reload: yes

- name: restart monit
  service:
    name: monit
    state: restarted

- name: reload sshd
  service:
    name: ssh
    state: reloaded
  become: true

- name: reload sysctl
  command: sysctl --system
  changed_when: true
  become: true
