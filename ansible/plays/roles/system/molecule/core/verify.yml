---
- name: Verify (Core)
  hosts: all
  become: true
  tasks:
    # Verify packages task results
    - name: Check required packages are installed
      command: dpkg -l {{ item }}
      register: pkg_check
      changed_when: false
      failed_when: pkg_check.rc != 0
      loop:
        - jq
        - curl
        - vim
        - git
        - monit

    # Verify user task results
    - name: Verify testuser exists
      command: id testuser
      register: user_result
      changed_when: false
      failed_when: user_result.rc != 0

    - name: Check testuser has sudo privileges
      stat:
        path: /etc/sudoers.d/testuser
      register: sudo_file

    - name: Verify sudo file exists
      assert:
        that:
          - sudo_file.stat.exists
        fail_msg: "sudoers file for testuser not found"

    # Verify journald task results
    - name: Check journald retention config exists
      stat:
        path: /etc/systemd/journald.conf.d/retention.conf
      register: journald_conf

    - name: Verify journald config was created
      assert:
        that:
          - journald_conf.stat.exists
        fail_msg: "journald retention config not found"

    # Verify monit task results
    - name: Check monit is running
      command: monit status
      register: monit_status
      changed_when: false
      # Note: May fail in Docker if systemd not fully running
      failed_when: false

    - name: Check monit config directory
      stat:
        path: /etc/monit/conf.d
      register: monit_conf_dir

    - name: Verify monit config directory exists
      assert:
        that:
          - monit_conf_dir.stat.exists
          - monit_conf_dir.stat.isdir
        fail_msg: "monit config directory not found"

    # Verify hardening task results
    - name: Check sysctl hardening drop-in exists
      stat:
        path: /etc/sysctl.d/99-hardening.conf
      register: sysctl_dropin

    - name: Verify sysctl hardening drop-in was created
      assert:
        that:
          - sysctl_dropin.stat.exists
        fail_msg: "sysctl hardening drop-in not found"

    - name: Verify login.defs umask hardened
      command: grep -E '^UMASK[[:space:]]+027' /etc/login.defs
      changed_when: false

    - name: Verify rare network protocols are blacklisted
      command: grep -E '^install (dccp|sctp)' /etc/modprobe.d/disable-rare-protocols.conf
      changed_when: false

    # The auditd ruleset is the regression this covers: production ran auditd with no rules at
    # all for weeks because nothing asserted the file (Lynis ACCT-9630).
    - name: Stat the auditd hardening rules
      stat:
        path: /etc/audit/rules.d/99-hardening.rules
      register: audit_rules_stat

    - name: Verify the auditd rules file was deployed with safe permissions
      assert:
        that:
          - audit_rules_stat.stat.exists
          - audit_rules_stat.stat.mode == '0640'
          - audit_rules_stat.stat.pw_name == 'root'
        fail_msg: "99-hardening.rules missing or not 0640 root:root"

    - name: Read the auditd rules
      slurp:
        path: /etc/audit/rules.d/99-hardening.rules
      register: audit_rules_raw

    - name: Verify the auditd ruleset content
      vars:
        audit_text: "{{ audit_rules_raw.content | b64decode }}"
      assert:
        that:
          # A rule for every class; the ids are what ausearch -k looks up later.
          - "'-k identity' in audit_text"
          - "'-k privilege' in audit_text"
          - "'-k cron' in audit_text"
          - "'-k modules' in audit_text"
          # Global settings belong to the package's audit.rules; immutability was not requested.
          # Match at a line start, so the comments that mention them do not count.
          - audit_text is not search('(?m)^-D')
          - audit_text is not search('(?m)^-e 2')
          - audit_text.splitlines() | select('match', '^-w ') | list | length >= 25
          - audit_text.splitlines() | select('match', '^-a always,exit') | list | length >= 3
        fail_msg: "auditd ruleset is incomplete or carries global settings"

    - name: Verify auditd is installed
      command: dpkg-query -W -f='${Status}' auditd
      register: auditd_pkg
      changed_when: false
      failed_when: "'install ok installed' not in auditd_pkg.stdout"

    - name: Check legal banner exists
      stat:
        path: /etc/issue
      register: issue_file

    - name: Verify legal banner was deployed
      assert:
        that:
          - issue_file.stat.exists
        fail_msg: "legal banner /etc/issue not found"

    # Regression guard: YAML booleans (no/yes) must render as sshd yes/no, not
    # Python True/False (which `sshd -t` rejects as "unsupported option").
    - name: Read rendered sshd hardening sample
      ansible.builtin.slurp:
        src: /tmp/sshd-hardening-render.conf
      register: sshd_render

    - name: Verify sshd hardening template renders YAML booleans as yes/no
      ansible.builtin.assert:
        that:
          - "'TCPKeepAlive no' in (sshd_render.content | b64decode)"
          - "'AllowAgentForwarding no' in (sshd_render.content | b64decode)"
          - "'LogLevel VERBOSE' in (sshd_render.content | b64decode)"
          - "'MaxAuthTries 3' in (sshd_render.content | b64decode)"
          - "'False' not in (sshd_render.content | b64decode)"
          - "'True' not in (sshd_render.content | b64decode)"
        fail_msg: "sshd hardening template rendered YAML booleans instead of sshd yes/no"
