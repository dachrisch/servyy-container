---
- name: Converge (With Docker)
  hosts: all
  become: true
  vars:
    create_user: testuser
    copy_local_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC... testkey"
    has_10g_volume: false
    create_swap: false
    with_fail2ban: false
    docker_cleanup:
      enabled: true
      schedule: 'Sun 02:00'
      log_file: '/var/log/docker-cleanup.log'
      prune_flags: '-a -f --volumes'
    kernel_cleanup:
      enabled: true
      schedule: 'Sun *-*-1..7 01:00'
      script_path: '/usr/local/bin/kernel-cleanup.sh'
      log_file: '/var/log/kernel-cleanup.log'
      description: 'Remove old kernel packages'
    apt_upgrade:
      enabled: true
      run_time: '05:00'
      reboot_time: '05:30'
    claude_hub_reaper:
      enabled: true
      every_minutes: 15
      log_file: '/var/log/claude-hub-reaper.log'
    claude_hub_force_cleanup:
      enabled: true
      days: 75
      schedule: 'Sun 06:00'
      log_file: '/var/log/claude-hub-force-cleanup.log'
    services_enabled:
      claude-hub: true
  tasks:
    - name: Run user tasks  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../"
        tasks_from: user
      tags: [system.user]

    - name: Run journald tasks  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../"
        tasks_from: journald
      tags: [system.journald]

    - name: Run docker_cleanup tasks  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../"
        tasks_from: docker_cleanup
      when: docker_cleanup.enabled | default(true)
      tags: [system.docker, system.docker.cleanup]

    - name: Run kernel_cleanup tasks  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../"
        tasks_from: kernel_cleanup
      when: kernel_cleanup.enabled | default(true)
      tags: [system.kernel, system.kernel.cleanup]

    - name: Run claude_hub_reaper tasks  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../"
        tasks_from: claude_hub_reaper
      when: >-
        (claude_hub_reaper.enabled | default(true))
        and (services_enabled['claude-hub'] | default(false))
      tags: [system.docker, system.docker.claude_hub_reaper]

    - name: Run claude_hub_force_cleanup tasks  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../"
        tasks_from: claude_hub_force_cleanup
      when: >-
        (claude_hub_force_cleanup.enabled | default(true))
        and (services_enabled['claude-hub'] | default(false))
      tags: [system.docker, system.docker.claude_hub_force_cleanup]

    - name: Run apt_upgrade tasks  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../"
        tasks_from: apt_upgrade
      when: apt_upgrade.enabled | default(true)
      tags: [system.apt_upgrade]
