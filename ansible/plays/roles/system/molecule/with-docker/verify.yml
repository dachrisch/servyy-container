---
- name: Verify (With Docker)
  hosts: all
  become: true
  tasks:
    - name: Verify testuser exists
      command: id testuser
      register: user_result
      changed_when: false
      failed_when: user_result.rc != 0

    - name: Check journald retention config exists
      stat:
        path: /etc/systemd/journald.conf.d/retention.conf
      register: journald_conf

    - name: Verify journald config was created
      assert:
        that:
          - journald_conf.stat.exists

    - name: Check docker-cleanup script exists
      stat:
        path: /home/testuser/.cleanup-scripts/docker-cleanup.sh
      register: docker_cleanup_script

    - name: Verify docker-cleanup script was created
      assert:
        that:
          - docker_cleanup_script.stat.exists
          - docker_cleanup_script.stat.executable

    - name: Check docker-cleanup timer exists
      stat:
        path: /etc/systemd/system/docker-cleanup.timer
      register: docker_cleanup_timer

    - name: Verify docker-cleanup timer was created
      assert:
        that:
          - docker_cleanup_timer.stat.exists

    - name: Check kernel-cleanup script exists
      stat:
        path: /usr/local/bin/kernel-cleanup.sh
      register: kernel_cleanup_script

    - name: Verify kernel-cleanup script was created
      assert:
        that:
          - kernel_cleanup_script.stat.exists
          - kernel_cleanup_script.stat.executable

    - name: Check kernel-cleanup timer exists
      stat:
        path: /etc/systemd/system/kernel-cleanup.timer
      register: kernel_cleanup_timer

    - name: Verify kernel-cleanup timer was created
      assert:
        that:
          - kernel_cleanup_timer.stat.exists

    - name: Check unattended-upgrades package is installed
      command: dpkg -l unattended-upgrades
      register: uu_pkg
      changed_when: false
      failed_when: uu_pkg.rc != 0

    - name: Check unattended-upgrades config exists
      stat:
        path: /etc/apt/apt.conf.d/50unattended-upgrades
      register: uu_config

    - name: Verify unattended-upgrades config was created
      assert:
        that:
          - uu_config.stat.exists

    - name: Check unattended-upgrades config content
      slurp:
        path: /etc/apt/apt.conf.d/50unattended-upgrades
      register: uu_config_content

    - name: Verify unattended-upgrades reboot settings
      assert:
        that:
          - "'Automatic-Reboot \"true\"' in uu_config_content.content | b64decode"
          - "'Automatic-Reboot-Time \"05:30\"' in uu_config_content.content | b64decode"
        fail_msg: "unattended-upgrades config does not contain expected reboot settings"

    - name: Check periodic auto-upgrades config exists
      stat:
        path: /etc/apt/apt.conf.d/20auto-upgrades
      register: auto_upgrades_config

    - name: Verify periodic auto-upgrades config was created
      assert:
        that:
          - auto_upgrades_config.stat.exists

    - name: Check apt-daily-upgrade timer override exists
      stat:
        path: /etc/systemd/system/apt-daily-upgrade.timer.d/override.conf
      register: apt_timer_override

    - name: Verify apt-daily-upgrade timer override was created
      assert:
        that:
          - apt_timer_override.stat.exists

    - name: Check apt-daily-upgrade timer override content
      slurp:
        path: /etc/systemd/system/apt-daily-upgrade.timer.d/override.conf
      register: apt_timer_override_content

    - name: Verify apt-daily-upgrade timer runs at the configured time
      assert:
        that:
          - "'05:00:00' in apt_timer_override_content.content | b64decode"
        fail_msg: "apt-daily-upgrade timer override does not contain expected run time"
