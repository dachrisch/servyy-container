---
- name: Verify (With Docker)
  hosts: all
  become: true
  tasks:
    - name: Verify testuser exists
      command: id testuser
      register: user_result
      changed_when: false
      failed_when: user_result.rc != 0

    - name: Check journald retention config exists
      stat:
        path: /etc/systemd/journald.conf.d/retention.conf
      register: journald_conf

    - name: Verify journald config was created
      assert:
        that:
          - journald_conf.stat.exists

    - name: Check docker-cleanup script exists
      stat:
        path: /home/testuser/.cleanup-scripts/docker-cleanup.sh
      register: docker_cleanup_script

    - name: Verify docker-cleanup script was created
      assert:
        that:
          - docker_cleanup_script.stat.exists
          - docker_cleanup_script.stat.executable

    - name: Check docker-cleanup timer exists
      stat:
        path: /etc/systemd/system/docker-cleanup.timer
      register: docker_cleanup_timer

    - name: Verify docker-cleanup timer was created
      assert:
        that:
          - docker_cleanup_timer.stat.exists

    - name: Check kernel-cleanup script exists
      stat:
        path: /usr/local/bin/kernel-cleanup.sh
      register: kernel_cleanup_script

    - name: Verify kernel-cleanup script was created
      assert:
        that:
          - kernel_cleanup_script.stat.exists
          - kernel_cleanup_script.stat.executable

    - name: Check kernel-cleanup timer exists
      stat:
        path: /etc/systemd/system/kernel-cleanup.timer
      register: kernel_cleanup_timer

    - name: Verify kernel-cleanup timer was created
      assert:
        that:
          - kernel_cleanup_timer.stat.exists

    - name: Verify old claude-hub-prune script/units were torn down (renamed to reaper)
      stat:
        path: "{{ item }}"
      loop:
        - /home/testuser/.cleanup-scripts/claude-hub-prune.sh
        - /etc/systemd/system/claude-hub-prune.service
        - /etc/systemd/system/claude-hub-prune.timer
      register: claude_hub_prune_leftovers
      failed_when: claude_hub_prune_leftovers.stat.exists

    - name: Verify claude-hub-reaper/force-cleanup script/units were torn down (moved to Ofelia)
      stat:
        path: "{{ item }}"
      loop:
        - /home/testuser/.cleanup-scripts/claude-hub-reaper.sh
        - /etc/systemd/system/claude-hub-reaper.service
        - /etc/systemd/system/claude-hub-reaper.timer
        - /home/testuser/.cleanup-scripts/claude-hub-force-cleanup.sh
        - /etc/systemd/system/claude-hub-force-cleanup.service
        - /etc/systemd/system/claude-hub-force-cleanup.timer
      register: claude_hub_ofelia_leftovers
      failed_when: claude_hub_ofelia_leftovers.stat.exists

    - name: Check unattended-upgrades package is installed
      command: dpkg -l unattended-upgrades
      register: uu_pkg
      changed_when: false
      failed_when: uu_pkg.rc != 0

    - name: Check unattended-upgrades config exists
      stat:
        path: /etc/apt/apt.conf.d/50unattended-upgrades
      register: uu_config

    - name: Verify unattended-upgrades config was created
      assert:
        that:
          - uu_config.stat.exists

    - name: Check unattended-upgrades config content
      slurp:
        path: /etc/apt/apt.conf.d/50unattended-upgrades
      register: uu_config_content

    - name: Verify unattended-upgrades reboot settings
      assert:
        that:
          - "'Automatic-Reboot \"true\"' in uu_config_content.content | b64decode"
          - "'Automatic-Reboot-Time \"05:30\"' in uu_config_content.content | b64decode"
        fail_msg: "unattended-upgrades config does not contain expected reboot settings"

    - name: Check periodic auto-upgrades config exists
      stat:
        path: /etc/apt/apt.conf.d/20auto-upgrades
      register: auto_upgrades_config

    - name: Verify periodic auto-upgrades config was created
      assert:
        that:
          - auto_upgrades_config.stat.exists

    - name: Check apt-daily-upgrade timer override exists
      stat:
        path: /etc/systemd/system/apt-daily-upgrade.timer.d/override.conf
      register: apt_timer_override

    - name: Verify apt-daily-upgrade timer override was created
      assert:
        that:
          - apt_timer_override.stat.exists

    - name: Check apt-daily-upgrade timer override content
      slurp:
        path: /etc/systemd/system/apt-daily-upgrade.timer.d/override.conf
      register: apt_timer_override_content

    - name: Verify apt-daily-upgrade timer runs at the configured time
      assert:
        that:
          - "'05:00:00' in apt_timer_override_content.content | b64decode"
        fail_msg: "apt-daily-upgrade timer override does not contain expected run time"

    # fail2ban itself is skipped in every scenario (with_fail2ban: false - it needs real
    # logs), so guard the rendered jail config instead. Two things regressed silently
    # before: the jail was reverted to all-ports (which REJECTs SSH for the banned IP) and
    # it hooked INPUT, which forwarded container traffic never traverses.
    - name: Render the fail2ban jail config from the role template
      set_fact:
        fail2ban_jail_conf: "{{ lookup('ansible.builtin.template', playbook_dir ~ '/../../templates/fail2ban/jail.local.j2') }}"
      vars:
        with_docker: true
        fail2ban_web_tier_chain: DOCKER-USER

    - name: Compute the effective jail config (comments stripped)
      set_fact:
        fail2ban_jail_effective: "{{ fail2ban_jail_conf.splitlines() | reject('match', '^\\s*#') | join('\\n') }}"

    - name: Verify the web-tier jail is scoped to the web ports and hooks DOCKER-USER
      assert:
        that:
          - "'[loki-blocklist]' in fail2ban_jail_effective"
          - "'port = http,https' in fail2ban_jail_effective"
          - "'banaction = iptables-multiport' in fail2ban_jail_effective"
          - "'DOCKER-USER' in fail2ban_jail_effective"
          - "'http,https,ssh' not in fail2ban_jail_effective"
          - "'iptables-allports' not in fail2ban_jail_effective"
          - "'adding the offending IP to `ignoreip`' in fail2ban_jail_conf"
        fail_msg: >-
          loki-blocklist must stay scoped to http,https and hook DOCKER-USER instead of
          INPUT - see history/2026-11-10_fail2ban-web-tier-chain-fix.md
        success_msg: "loki-blocklist is scoped to http,https and hooks DOCKER-USER"

    - name: Compute the effective no-Docker jail config (comments stripped)
      set_fact:
        fail2ban_jail_effective_no_docker: "{{ fail2ban_jail_conf_no_docker.splitlines() | reject('match', '^\\s*#') | join('\\n') }}"
      vars:
        with_docker: false
        fail2ban_web_tier_chain: "{{ 'DOCKER-USER' if (with_docker | default(false)) else 'INPUT' }}"
        fail2ban_jail_conf_no_docker: "{{ lookup('ansible.builtin.template', playbook_dir ~ '/../../templates/fail2ban/jail.local.j2') }}"

    - name: Verify hosts without Docker keep the fail2ban default chain
      assert:
        that:
          - "'DOCKER-USER' not in fail2ban_jail_effective_no_docker"
          - "'iptables-multiport' in fail2ban_jail_effective_no_docker"
        fail_msg: "hosts without Docker must not hook a DOCKER-USER chain that does not exist"

    # Both address families must be banned. `iptables-multiport` writes v4 rules only, and
    # a second instance of it with family=inet6 is refused by the server, so the v6 twin is
    # a separate action file shipped by this role.
    - name: Verify the SSH jails ban both address families
      assert:
        that:
          - '"ip6tables-multiport" in fail2ban_jail_effective'
          - 'fail2ban_jail_effective.count("ip6tables-multiport") == 1'
          - '"ip6tables-multiport" not in fail2ban_jail_effective.split("[loki-blocklist]")[1]'
        fail_msg: >-
          the SSH jails must ban through the ip6tables-multiport action too, and
          loki-blocklist must stay v4-only until the proxy network carries IPv6 - see
          history/2026-11-11_fail2ban-ipv6-ssh.md
        success_msg: "SSH jails ban v4 and v6; the web-tier jail stays v4-only for now"

    # The SSH jails read the journal and must match both OpenSSH ident shapes. Inheriting
    # the package default made the same template behave differently per host: servy
    # (OpenSSH 10.2p1) logs from `sshd-session` and its invalid-user jail had 0 bans ever,
    # while codey (OpenSSH 9.6p1) logs from `sshd` and banned normally.
    - name: Render the custom SSH filter from the role template
      set_fact:
        fail2ban_ssh_filter: "{{ lookup('ansible.builtin.template', playbook_dir ~ '/../../templates/fail2ban/filter.d/sshd-custom.conf.j2') }}"

    - name: Verify the SSH jails read the journal instead of a log file
      assert:
        that:
          - '"backend = systemd" in fail2ban_jail_effective'
          - '"/var/log/auth.log" not in fail2ban_jail_effective'
          - '"_COMM=" not in fail2ban_jail_effective'
          - 'fail2ban_jail_effective.count("journalmatch = _SYSTEMD_UNIT=ssh.service") == 2'
        fail_msg: >-
          both SSH jails must declare backend = systemd and match the whole ssh.service
          unit - see history/2026-11-10_fail2ban-openssh10-sshd-session.md
        success_msg: "SSH jails read the journal and match the whole ssh.service unit"

    - name: Verify the custom SSH filter matches sshd and sshd-session idents
      assert:
        that:
          - '"sshd(?:-session)?" in fail2ban_ssh_filter'
          - 'fail2ban_ssh_filter.count("sshd(?:-session)?") == 4'
        fail_msg: >-
          all four failregexes must match sshd and sshd-session; hard-coding `sshd[`
          leaves the jail blind on OpenSSH >= 10 (servy) - see
          history/2026-11-10_fail2ban-openssh10-sshd-session.md
        success_msg: "custom SSH filter matches both OpenSSH ident shapes"
