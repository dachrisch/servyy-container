---
# Defaults for the Phase 0c agent stage (leaguesphere#2536).
#
# Two app containers share the stage database:
#   ref  - the master image the phase started from (no watchtower label)
#   cand - leaguesphere/backend:agent-candidate (watchtower-dev, scope=dev)
# Both sit behind one basic-auth proxy; opentunnel publishes the two loopback
# ports. Applied to servyy-test only (`./servyy-test.sh --tags ls.agent.stage`).

# Host paths (the stage stack and the agent stack live side by side in the jail).
ls_agent_stage_dir: "{{ (ssh_chroot_jail_path, 'home', ls.user, 'container-agent-stage') | path_join }}"
ls_agent_stage_stage_dir: "{{ (ssh_chroot_jail_path, 'home', ls.user, 'container-stage') | path_join }}"
ls_agent_stage_stage_env_file: "{{ (ls_agent_stage_stage_dir, 'deployed', 'ls.env.staging') | path_join }}"
ls_agent_stage_stage_container: "{{ (stage_app.app.name ~ '.staging-app') if stage_app.app.name == 'leaguesphere_stage' else (stage_app.app.name ~ '.app') }}"

ls_agent_stage_project: ls_agent_stage

# `ref` is the phase baseline. It is a commit-pinned build (`agent-ref`,
# pushed from the stack's BASE commit by the leaguesphere deploy workflow), not
# a release tag: Renovate keeps moving master, so a release tag would always lag
# the stack base. It has no auto-update timer; it changes only when someone
# deliberately rebuilds `agent-ref` for a new phase and re-applies this role.
ls_agent_stage_ref_image: leaguesphere/backend:agent-ref
ls_agent_stage_cand_image: leaguesphere/backend:agent-candidate
ls_agent_stage_proxy_image: nginx:1.29.3-alpine

# Loopback ports the proxy publishes; opentunnel routes point at these.
ls_agent_stage_ref_port: 18081
ls_agent_stage_cand_port: 18082

# opentunnel: one long-lived route per deployment. The CLI keeps its own
# encrypted bridge/service, so the role installs it and adds the two routes;
# it does not render a systemd unit. `route add` prints the public URL.
ls_agent_stage_opentunnel_install_url: https://opentunnel.xyz/install
ls_agent_stage_opentunnel_bin: "{{ (remote_user_home, '.local', 'bin', 'opentunnel') | path_join }}"

# servyy-test has no watchtower, so this system timer (running as the stack
# owner) pulls agent-candidate and restarts only `cand` when the image id
# changed (health-gated).
ls_agent_stage_cand_update_interval: 5min

# Guard against schema drift: after the stack is up, both app containers run
# `manage.py migrate --check` against the shared stage database. A base/head
# with migrations the stage deploy has not applied fails the apply instead of
# serving a half-broken comparison. Set false only for a deliberate exception,
# e.g. a phase that provides its own second DB copy.
ls_agent_stage_schema_check: true

# Phase 2 flag-on validation. A Compose `environment:` entry overrides the
# inherited `SCORECARD_EVENT_FEED=false` from the stage env file. Keep this
# empty except during an agent-stage validation: the coordinator sets
# `{SCORECARD_EVENT_FEED: "true"}` to turn the flag on for `cand` ONLY, then
# empties it again before any flag-off comparison. `ref` is never affected.
ls_agent_stage_cand_env: {}
