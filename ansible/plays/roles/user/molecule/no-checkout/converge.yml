---
- name: Converge (User no-checkout cleanup)
  hosts: all
  become: true
  become_user: testuser
  vars:
    create_user: testuser
    docker:
      remote_dir: /home/testuser/servyy-container
    servyy_git_repo:
      hostname: git.lehel.xyz
  tasks:
    - name: Run the no-checkout cleanup  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../"
        tasks_from: no_checkout
