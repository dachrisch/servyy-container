---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Install Python for Ansible
      raw: |
        apt-get update
        apt-get install -y python3 python3-apt python3-requests python3-docker sudo systemd git zsh
      changed_when: false

    - name: Create test user
      user:
        name: testuser
        uid: 1001
        groups: sudo
        append: yes
        shell: /bin/bash
        create_home: yes

    - name: Allow testuser to use sudo without password
      lineinfile:
        path: /etc/sudoers
        line: 'testuser ALL=(ALL) NOPASSWD:ALL'
        validate: 'visudo -cf %s'

    # What a previous full run leaves on a host: the unlocked checkout, the
    # deploy key + its ssh config block, and the git.lehel.xyz login.
    - name: Create the seed directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: testuser
        mode: "0700"
      loop:
        - /home/testuser/.ssh
        - /home/testuser/servyy-container/ansible/plays/vars

    - name: Seed a fake deploy checkout with a plaintext secret
      ansible.builtin.copy:
        dest: /home/testuser/servyy-container/ansible/plays/vars/secrets.yml
        content: "create_user: testuser\n"
        owner: testuser
        mode: "0600"

    - name: Seed the deploy key
      ansible.builtin.copy:
        dest: /home/testuser/.ssh/id_servyy_container_deploy
        content: "fake-key\n"
        owner: testuser
        mode: "0600"

    - name: Seed ~/.ssh/config with the deploy-key block and an unrelated host
      ansible.builtin.copy:
        dest: /home/testuser/.ssh/config
        owner: testuser
        mode: "0600"
        content: |
          Host keep.example
              User keep
          # BEGIN ANSIBLE MANAGED - servyy-container GitHub deploy key
          Host github.com
              IdentityFile ~/.ssh/id_servyy_container_deploy
          # END ANSIBLE MANAGED - servyy-container GitHub deploy key

    - name: Seed git credentials
      ansible.builtin.copy:
        dest: /home/testuser/.git-credentials
        owner: testuser
        mode: "0600"
        content: |
          https://keep:other@example.org
          https://cda:secret@git.lehel.xyz
