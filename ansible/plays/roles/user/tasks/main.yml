- import_tasks: includes/repository.yml
  vars:
    repository_uri: "{{ shell.repo }}"
    remote_dir: "{{ shell.remote_dir }}"
    local_dir: "{{ shell.local_dir }}"
    clone_submodules: true                # Clone submodules during initial clone
    update_submodules: true               # Update submodules on every deployment
    secure_checkout_modes: true           # compinit blocks login on a group-writable fpath
  tags:
    - user.repo.zpresto

- import_tasks: zprezto.yml
  tags:
    - user.zprezto

# Private Loki endpoint/credential for the public logdy function. Deployed with
# the zprezto tag so a normal dotfile deploy keeps logdy working.
- import_tasks: logdy_loki.yml
  tags:
    - user.zprezto
    - user.zprezto.logdy

- import_tasks: atuin.yml
  tags:
    - user.atuin

- import_tasks: includes/github_deploy_key.yml
  tags:
    - user.docker.repo
    - user.docker
    - user.repo
  when:
    - with_containers | default(false)
    - repo_checkout | default(true) | bool

- import_tasks: includes/repository.yml
  vars:
    repository_uri: "{{ docker.repo }}"
    remote_dir: "{{ docker.remote_dir }}"
    local_dir: "{{ docker.local_dir }}"
    # `docker_branch` is an explicit override for branch deploys. It must be a
    # DIFFERENT variable from `branch`: a global `-e branch=<feature>` also hits
    # the zprezto import above, which has no such branch and fails the run
    # (measured 2026-11-19 during WP-10). The normal path still reads the
    # controller checkout's HEAD, which is master for every merged deploy.
    branch: "{{ docker_branch | default(lookup('pipe', 'git -C ' ~ docker.local_dir ~ ' rev-parse --abbrev-ref HEAD')) }}"
    clone_submodules: true                # Clone submodules if reachable
    update_submodules: true               # Update submodules on every deployment
    git_key_file: "~/.ssh/id_servyy_container_deploy"
  tags:
    - user.docker.repo
    - user.docker
    - user.repo
  when:
    - with_containers | default(false)
    - repo_checkout | default(true) | bool

# Guard against a new internet-facing port. Docker writes its own FORWARD/nat
# rules and bypasses ufw entirely, so `ports: - "8080:8080"` in any compose file is
# reachable the moment the container starts — and both repos are public with the
# compose files now plaintext, so a copy-pasted line is a realistic accident.
# Only the reverse proxy may bind 0.0.0.0 (80/443); everything else publishes to
# 127.0.0.1 or not at all. Runs on the target because CI sees git-crypt ciphertext.
# Found two latent offenders on its first run (node-exporter 9100, cadvisor 8080).
- name: Check that no compose file publishes a port on every interface
  ansible.builtin.script:
    cmd: "{{ role_path }}/files/check_published_ports.py {{ docker.remote_dir }}"
  register: published_ports_check
  changed_when: false
  failed_when: published_ports_check.rc != 0
  tags:
    - user.docker.repo
    - user.docker
    - user.repo
  when:
    - with_containers | default(false)
    - repo_checkout | default(true) | bool

# Hosts that must hold no secrets (repo_checkout: false, i.e. the runny CI
# runner, whose jobs can reach the host): no deploy checkout, no git-crypt key,
# no deploy key. Removes them if an earlier run left
# them behind. Their services are rendered outside the checkout by their roles.
- import_tasks: no_checkout.yml
  tags:
    - user.docker.repo
    - user.docker
    - user.repo
  when: not (repo_checkout | default(true) | bool)

- import_tasks: docker_setup.yml
  tags:
    - user.docker.setup
    - user.docker
  when: (with_docker or with_containers) | default(false)

- import_tasks: docker_extras.yml
  tags:
    - user.docker.services
    - user.docker
  when:
    - with_containers | default(false)
    - repo_checkout | default(true) | bool

# Moodle's data volume must be formatted+mounted before the moodle compose
# project starts. Gated on the volume actually being configured for this host:
# servyy-test.lxd has no volume and uses a plain directory instead.
#
# The `services` fact used to be a set_fact in the deploy play's pre_tasks,
# which runs AFTER roles — so inside this role it was always undefined and the
# Moodle gates had to read services_enabled directly. The shared static import
# below makes the fact available here too, regardless of which play invokes the
# role. It is tagged `always` and must stay a static import (an always-tagged
# dynamic include skips its untagged children under --tags).
# The Moodle `when` clauses deliberately keep reading the inventory flag: the
# dict form of services_enabled renders truthy via `| bool`, and changing the
# condition here would change deploy behaviour.
- name: Build the enabled services fact before the Moodle includes
  ansible.builtin.import_tasks: ../../../tasks/build_services.yml
  tags:
    - always

- import_tasks: moodle_volume.yml
  tags:
    - user.docker.moodle
    - user.docker
  when:
    - with_containers | default(false)
    - services_enabled.moodle | default(false) | bool
    - moodle_volume_device is defined

# Volume-less hosts (servyy-test.lxd and, since 2026-10-27, prod too): just the
# bind-mounted directories, no mount. Same ownership rules as on a volume.
- import_tasks: moodle_data_dirs.yml
  vars:
    moodle_data_root_path: "{{ moodle_data_root | default(docker.remote_dir ~ '/moodle/data') }}"
  tags:
    - user.docker.moodle
    - user.docker
  when:
    - with_containers | default(false)
    - services_enabled.moodle | default(false) | bool
    - moodle_volume_device is not defined

# Fail the deploy (not the container boot) when a vendored plugin archive is
# missing or was replaced without bumping the version.
- import_tasks: moodle_plugins.yml
  tags:
    - user.docker.moodle
    - user.docker
  when:
    - with_containers | default(false)
    - services_enabled.moodle | default(false) | bool

- import_tasks: dns.yml
  tags:
    - user.dns
  # Writes the Pi-hole host list INTO the deploy checkout; hosts without one
  # (repo_checkout: false) would get ~/servyy-container recreated by it.
  when:
    - with_containers | default(false)
    - repo_checkout | default(true) | bool

- import_tasks: host_ping.yml
  tags:
    - user.ping
  when: with_containers | default(false)
