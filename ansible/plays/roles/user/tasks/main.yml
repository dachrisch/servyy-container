- import_tasks: includes/repository.yml
  vars:
    repository_uri: "{{ shell.repo }}"
    remote_dir: "{{ shell.remote_dir }}"
    local_dir: "{{ shell.local_dir }}"
    check_git_servyy_reachable: false    # zpresto is from GitHub, not git.lehel.xyz
    clone_submodules: true                # Clone submodules during initial clone
    update_submodules: true               # Update submodules on every deployment
  tags:
    - user.repo.zpresto

- import_tasks: zprezto.yml
  tags:
    - user.zprezto

- import_tasks: atuin.yml
  tags:
    - user.atuin

- import_tasks: git_credentials.yml
  vars:
    hostname: "{{ servyy_git_repo.hostname }}"
    username: "{{ servyy_git_repo.username }}"
    password: "{{ servyy_git_repo.password }}"
  tags:
    - user.repo.me

- import_tasks: includes/github_deploy_key.yml
  tags:
    - user.docker.repo
    - user.docker
    - user.repo
  when: with_containers | default(false)

- import_tasks: includes/repository.yml
  vars:
    repository_uri: "{{ docker.repo }}"
    remote_dir: "{{ docker.remote_dir }}"
    local_dir: "{{ docker.local_dir }}"
    branch: "{{ lookup('pipe', 'git -C ' ~ docker.local_dir ~ ' rev-parse --abbrev-ref HEAD') }}"
    check_git_servyy_reachable: true     # Check git.lehel.xyz is reachable before recursive submodule clone
    clone_submodules: true                # Clone submodules if reachable
    update_submodules: true               # Update submodules on every deployment
    git_key_file: "~/.ssh/id_servyy_container_deploy"
  tags:
    - user.docker.repo
    - user.docker
    - user.repo
  when: with_containers | default(false)

# Guard against a new internet-facing port. Docker writes its own FORWARD/nat
# rules and bypasses ufw entirely, so `ports: - "8080:8080"` in any compose file is
# reachable the moment the container starts — and both repos are public with the
# compose files now plaintext, so a copy-pasted line is a realistic accident.
# Only the reverse proxy may bind 0.0.0.0 (80/443); everything else publishes to
# 127.0.0.1 or not at all. Runs on the target because CI sees git-crypt ciphertext.
# Found two latent offenders on its first run (node-exporter 9100, cadvisor 8080).
- name: Check that no compose file publishes a port on every interface
  ansible.builtin.script:
    cmd: "{{ role_path }}/files/check_published_ports.py {{ docker.remote_dir }}"
  register: published_ports_check
  changed_when: false
  failed_when: published_ports_check.rc != 0
  tags:
    - user.docker.repo
    - user.docker
    - user.repo
  when: with_containers | default(false)

- import_tasks: docker_setup.yml
  tags:
    - user.docker.setup
    - user.docker
  when: (with_docker or with_containers) | default(false)

- import_tasks: docker_extras.yml
  tags:
    - user.docker.services
    - user.docker
  when: with_containers | default(false)

# Moodle's data volume must be formatted+mounted before the moodle compose
# project starts. Gated on the volume actually being configured for this host:
# servyy-test.lxd has no volume and uses a plain directory instead.
#
# `services` is NOT usable here: it is a set_fact in the play's task list, which
# runs after the roles, so inside this role it is always undefined. Read the
# inventory flag directly.
- import_tasks: moodle_volume.yml
  tags:
    - user.docker.moodle
    - user.docker
  when:
    - with_containers | default(false)
    - services_enabled.moodle | default(false) | bool
    - moodle_volume_device is defined

# Volume-less hosts (servyy-test.lxd and, since 2026-10-27, prod too): just the
# bind-mounted directories, no mount. Same ownership rules as on a volume.
- import_tasks: moodle_data_dirs.yml
  vars:
    moodle_data_root_path: "{{ moodle_data_root | default(docker.remote_dir ~ '/moodle/data') }}"
  tags:
    - user.docker.moodle
    - user.docker
  when:
    - with_containers | default(false)
    - services_enabled.moodle | default(false) | bool
    - moodle_volume_device is not defined

- import_tasks: dns.yml
  tags:
    - user.dns
  when: with_containers | default(false)

- import_tasks: host_ping.yml
  tags:
    - user.ping
  when: with_containers | default(false)
