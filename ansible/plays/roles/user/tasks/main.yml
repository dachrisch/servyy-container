- import_tasks: includes/repository.yml
  vars:
    repository_uri: "{{ shell.repo }}"
    remote_dir: "{{ shell.remote_dir }}"
    local_dir: "{{ shell.local_dir }}"
    check_git_servyy_reachable: false    # zpresto is from GitHub, not git.lehel.xyz
    clone_submodules: true                # Clone submodules during initial clone
    update_submodules: true               # Update submodules on every deployment
  tags:
    - user.repo.zpresto

- import_tasks: zprezto.yml
  tags:
    - user.zprezto

- import_tasks: atuin.yml
  tags:
    - user.atuin

- import_tasks: git_credentials.yml
  vars:
    hostname: "{{ servyy_git_repo.hostname }}"
    username: "{{ servyy_git_repo.username }}"
    password: "{{ servyy_git_repo.password }}"
  tags:
    - user.repo.me

- import_tasks: includes/github_deploy_key.yml
  tags:
    - user.docker.repo
    - user.docker
    - user.repo
  when: with_containers | default(false)

- import_tasks: includes/repository.yml
  vars:
    repository_uri: "{{ docker.repo }}"
    remote_dir: "{{ docker.remote_dir }}"
    local_dir: "{{ docker.local_dir }}"
    branch: "{{ lookup('pipe', 'git -C ' ~ docker.local_dir ~ ' rev-parse --abbrev-ref HEAD') }}"
    check_git_servyy_reachable: true     # Check git.lehel.xyz is reachable before recursive submodule clone
    clone_submodules: true                # Clone submodules if reachable
    update_submodules: true               # Update submodules on every deployment
    git_key_file: "~/.ssh/id_servyy_container_deploy"
  tags:
    - user.docker.repo
    - user.docker
    - user.repo
  when: with_containers | default(false)

- import_tasks: docker_setup.yml
  tags:
    - user.docker.setup
    - user.docker
  when: (with_docker or with_containers) | default(false)

- import_tasks: docker_extras.yml
  tags:
    - user.docker.services
    - user.docker
  when: with_containers | default(false)

# Moodle's data volume must be formatted+mounted before the moodle compose
# project starts. Gated on the volume actually being configured for this host:
# servyy-test.lxd has no volume and uses a plain directory instead.
- import_tasks: moodle_volume.yml
  tags:
    - user.docker.moodle
    - user.docker
  when:
    - with_containers | default(false)
    - "'moodle' in (services | default([]))"
    - moodle_volume_device is defined

# Volume-less hosts (servyy-test.lxd): just the bind-mounted directories, no
# mount. Same ownership rules as on the volume.
- import_tasks: moodle_data_dirs.yml
  vars:
    moodle_data_root_path: "{{ docker.remote_dir }}/moodle/data"
  tags:
    - user.docker.moodle
    - user.docker
  when:
    - with_containers | default(false)
    - "'moodle' in (services | default([]))"
    - moodle_volume_device is not defined

- import_tasks: dns.yml
  tags:
    - user.dns
  when: with_containers | default(false)

- import_tasks: host_ping.yml
  tags:
    - user.ping
  when: with_containers | default(false)
