- name: Create file to test hosts up
  template:
    src: test_host.sh.j2
    dest: "{{(remote_user_home, 'test_host.sh') | path_join}}"
    mode: 0770
    owner: "{{create_user}}"
  vars:
    # Entries may carry an explicit `host` when the service is not reachable
    # under the {dir}.{domain} convention (moodle is served at
    # m.leaguesphere.app until the offd.de cutover). Everything else keeps the
    # derived name, so this stays backwards compatible.
    test_urls: >-
      {{ (docker.services | rejectattr('host', 'defined')
            | map(attribute='dir') | product([domain]) | map('join', '.') | list)
         + (docker.services | selectattr('host', 'defined')
            | map(attribute='host') | map('string') | list) }}
  tags:
    - user.ping.script
