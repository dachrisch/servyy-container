- name: Validate required variables
  assert:
    that:
      - repository_uri is defined and repository_uri | length > 0
      - remote_dir is defined and remote_dir | length > 0
    fail_msg: "One or more required variables (repository_uri, remote_dir) are missing or empty."
  tags:
    - user.repo.validate

- name: Attempt to perform HEAD request to git.lehel.xyz
  uri:
    url: https://git.lehel.xyz
    method: HEAD
    return_content: no
    status_code: 200
  register: head_request_result
  ignore_errors: yes
  when: check_git_servyy_reachable | default(false)
  tags:
    - user.repo.clone

- name: Set reachability fact based on HEAD request result
  set_fact:
    git_servyy_reachable: "{{ 'yes' if head_request_result.status == 200 else 'no' }}"
  when: check_git_servyy_reachable | default(false)
  tags:
    - user.repo.clone

- name: Set reachability fact to true when check is skipped
  set_fact:
    git_servyy_reachable: "yes"
  when: not (check_git_servyy_reachable | default(false))
  tags:
    - user.repo.clone

- name: "Check if {{ remote_dir }} is a valid git repository"
  command: "git -C {{ remote_dir }} rev-parse --git-dir"
  register: git_check
  failed_when: false
  changed_when: false
  tags:
    - user.repo.clone

- name: "Remove {{ remote_dir }} if it exists but is not a git repository"
  file:
    path: "{{ remote_dir }}"
    state: absent
  when: git_check.rc != 0 and ansible_os_family != 'Docker'
  tags:
    - user.repo.clone

# Other tasks (e.g. the opencode role's "Deploy OpenCode docker-compose.yml")
# write directly to paths tracked in this same repo, bypassing git entirely.
# git-crypt's encryption is non-deterministic (random IV per encrypt), so any
# such direct write leaves the working tree looking locally modified to git,
# which then blocks checking out a not-yet-locally-known branch below
# ("local changes would be overwritten by checkout") even though the git
# module's own force:true only auto-discards mods when updating an *existing*
# local branch, not when creating a new one via `checkout -b`. Reset tracked
# files back to HEAD first so the checkout below always has a clean slate to
# work from, regardless of what a prior run left behind. Untracked files
# (host-specific secrets/env files other tasks also write into this tree)
# are unaffected -- this only touches tracked paths.
- name: "Discard local working-tree modifications in {{ remote_dir }} before checkout"
  command: git reset --hard
  args:
    chdir: "{{ remote_dir }}"
  when: git_check.rc == 0
  changed_when: false
  tags:
    - user.repo.clone

- name: "Clone [ {{ repository_uri }} ] to [ {{remote_dir}} ] (branch: {{ branch | default('master') }} )"
  git:
    repo: "{{ repository_uri }}"
    dest: "{{ remote_dir }}"
    force: true
    recursive: "{{ clone_submodules | default(true) and git_servyy_reachable == 'yes' }}"
    version: "{{ branch | default('master') }}"
    key_file: "{{ git_key_file | default(omit) }}"
    accept_hostkey: true
  tags:
    - user.repo.clone

- name: Check lock state (before chown to unlock git-crypt files)
  command: git config --local --get filter.git-crypt.smudge
  args:
    chdir: "{{ remote_dir }}"
  register: lock_state
  failed_when: lock_state.stderr != ""
  changed_when: lock_state.rc != 0
  when: lookup('env', 'MOLECULE_SCENARIO_NAME') == ''
  tags:
    - user.repo.crypt.check
    - molecule-notest

- block:
    - block:
        - name: Create temporary keyfile local
          tempfile:
            state: file
            suffix: temp
          register: local_keyfile

        - name: Export local key
          command: git-crypt export-key {{local_keyfile.path}}
          args:
            chdir: "{{ local_dir }}"
          delegate_to: localhost
          become_user: "{{ local_user }}"
      tags:
        - user.repo.key.export
      delegate_to: localhost
      become_user: "{{ local_user }}"

    - block:
        - name: Create temporary keyfile remote
          tempfile:
            state: file
            suffix: temp
          register: remote_keyfile

        - name: Copy repository key to remote
          copy:
            src: "{{ local_keyfile.path }}"
            dest: "{{ remote_keyfile.path }}"
      tags:
        - user.repo.key.copy

    - name: Unlock repository
      command: git-crypt unlock "{{ remote_keyfile.path }}"
      args:
        chdir: "{{ remote_dir }}"
      register: unlock_result
      changed_when: "'already unlocked' not in unlock_result.stdout"
      failed_when: unlock_result.rc != 0 and 'already unlocked' not in unlock_result.stdout
  tags:
    - user.repo.crypt.unlock
    - molecule-notest
  when: lock_state is defined and lock_state.changed

# Ownership only -- modes are left as the checkout produced them. Git restores
# tracked files as 0666 & ~umask, and this play runs under umask 007, so files
# land as 0660 (dirs 0770): readable by create_user and the docker group only.
# That is intentional for the git-crypt'd secret files, but content that a
# container reads as a non-root uid needs world-read -- services declare such
# paths in `world_readable_paths_by_service` (plays/vars/default.yml).
#
# Only entries that are actually wrong are chowned. A bare `-exec chown {} +`
# over the whole tree bumps every file's ctime on every run even when the
# ownership already matches, which is what made the next checkout rewrite the
# tree (see the refresh task at the end of the file).
- name: "Set correct ownership for {{ remote_dir }}"
  shell: |
    find "{{ remote_dir }}" \( ! -user "{{ create_user }}" -o ! -group docker \) \
      -exec chown "{{ create_user }}:docker" {} + 2>/dev/null || true
  changed_when: false
  tags:
    - user.repo.clone

# Re-apply the declared world-readable modes HERE, not only inside each
# service's docker_service role. A checkout that rewrites 0660/0770 without the
# service role re-running is a silent outage: nginx answers 403, the healthcheck
# fails, Traefik withdraws the routers (achim-hoefer, twice) -- or the app exits
# outright (grafana "permission denied", prometheus "Error loading config").
# A `--tags user.docker.repo` run used to do exactly that; this makes the
# checkout unable to leave the host in that state.
- name: Look up container-consumed paths declared for this checkout
  ansible.builtin.stat:
    path: "{{ (remote_dir, item.0.key, item.1) | path_join }}"
  loop: "{{ world_readable_paths_by_service | default({}) | dict2items | subelements('value') }}"
  loop_control:
    label: "{{ item.0.key }}/{{ item.1 }}"
  register: world_readable_after_checkout
  tags:
    - user.repo.clone

- name: Select the container-consumed paths present on this host
  ansible.builtin.set_fact:
    world_readable_existing_paths: >-
      {{ world_readable_after_checkout.results
         | selectattr('stat', 'defined') | selectattr('stat.exists')
         | map(attribute='stat') | map(attribute='path') | list }}
  tags:
    - user.repo.clone

- name: Restore world-readable modes on container-consumed checkout paths
  ansible.builtin.command: "chmod -cR a+rX {{ world_readable_existing_paths | map('quote') | join(' ') }}"
  # `chmod -c` prints one line per mode it actually changed, so a second run is
  # a no-op and reports no change.
  changed_when: world_readable_chmod.stdout | length > 0
  register: world_readable_chmod
  when: world_readable_existing_paths | length > 0
  tags:
    - user.repo.clone

- name: "Initialize submodules for [ {{remote_dir}} ]"
  shell: |
    git submodule update --init --recursive
  args:
    chdir: "{{ remote_dir }}"
  when: update_submodules | default(false)
  register: submodule_init
  changed_when: "'Submodule path' in submodule_init.stdout or 'Submodule registered' in submodule_init.stdout"
  failed_when: false
  tags:
    - user.repo.submodules

# Same lesson as the world-readable block above, for the opposite direction: a checkout
# under umask 007 leaves every directory 0770, and zsh's compinit treats a group-writable
# $fpath directory as insecure -- it prints "insecure directories" and BLOCKS the login on
# "Ignore insecure directories and continue [y] or abort compinit [n]?" until answered.
#
# It has to happen HERE and not only in zprezto.yml: a `--tags user.repo.zpresto` run
# re-creates the 0770 tree without running the zprezto tasks, which put the prompt back on
# both servers on 2026-11-17 minutes after the first fix. The zprezto checkout holds no
# git-crypt'd or container-consumed secrets, so group/other write can simply go.
- name: "Make [ {{remote_dir}} ] unwritable for group and others"
  # The checkout re-applies umask 007 to every file it rewrites, so this narrowing does real
  # work on every run even though the end state is stable -- same as the chown above, hence
  # the same `changed_when: false`. A failure (rc != 0) still fails the task.
  ansible.builtin.command: "chmod -R go-w {{ remote_dir | quote }}"
  changed_when: false
  when: secure_checkout_modes | default(false)
  tags:
    - user.repo.clone
    - user.repo.secure.modes

# Close the loop between the ctime-bumping tasks above and git's stat cache.
#
# POSIX updates ctime on *every* chmod/chown call, not only on an effective
# change, and git's index stores the ctime it saw when it wrote the file. So the
# chown and the two chmods above always leave the index stat-dirty, the next
# `git reset --hard` reads that as "possibly changed" and REWRITES THE WHOLE
# TREE at umask 007 (0660) -- which gives the chmods real work again. Measured
# 2026-11-18 on servy: index ctime 12:01:27 vs file ctime 12:16:27 after one
# deploy, every tracked file rewritten on every deploy, and a container
# restarted inside that window read half-written 0660 dashboards.
#
# Re-recording the stat info here breaks the cycle: the tree reads clean to the
# next checkout, the checkout writes nothing, modes stay as the chmods left
# them, and a repo-sync-only deploy converges to changed=0. It cannot hide a
# real modification -- entries whose content differs are reported ("needs
# update") and left dirty for the next `reset --hard` to discard.
- name: "Re-record checkout stat info so the next deploy does not rewrite the tree"
  ansible.builtin.command: "git update-index --refresh"
  args:
    chdir: "{{ remote_dir }}"
  # Exit 1 only means "some entry genuinely needs update" (that is what the next
  # checkout is for), not a failure of this task.
  failed_when: false
  changed_when: false
  tags:
    - user.repo.clone
    - user.repo.secure.modes
