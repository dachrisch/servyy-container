- name: Validate required variables
  assert:
    that:
      - repository_uri is defined and repository_uri | length > 0
      - remote_dir is defined and remote_dir | length > 0
    fail_msg: "One or more required variables (repository_uri, remote_dir) are missing or empty."
  tags:
    - user.repo.validate

- name: Attempt to perform HEAD request to git.lehel.xyz
  uri:
    url: https://git.lehel.xyz
    method: HEAD
    return_content: no
    status_code: 200
  register: head_request_result
  ignore_errors: yes
  when: check_git_servyy_reachable | default(false)

- name: Set reachability fact based on HEAD request result
  set_fact:
    git_servyy_reachable: "{{ 'yes' if head_request_result.status == 200 else 'no' }}"
  when: check_git_servyy_reachable | default(false)

- name: Set reachability fact to true when check is skipped
  set_fact:
    git_servyy_reachable: "yes"
  when: not (check_git_servyy_reachable | default(false))

- name: "Check if {{ remote_dir }} is a valid git repository"
  command: "git -C {{ remote_dir }} rev-parse --git-dir"
  register: git_check
  failed_when: false
  changed_when: false
  tags:
    - user.repo.clone

- name: "Remove {{ remote_dir }} if it exists but is not a git repository"
  file:
    path: "{{ remote_dir }}"
    state: absent
  when: git_check.rc != 0 and ansible_os_family != 'Docker'
  tags:
    - user.repo.clone

# Other tasks (e.g. the opencode role's "Deploy OpenCode docker-compose.yml")
# write directly to paths tracked in this same repo, bypassing git entirely.
# git-crypt's encryption is non-deterministic (random IV per encrypt), so any
# such direct write leaves the working tree looking locally modified to git,
# which then blocks checking out a not-yet-locally-known branch below
# ("local changes would be overwritten by checkout") even though the git
# module's own force:true only auto-discards mods when updating an *existing*
# local branch, not when creating a new one via `checkout -b`. Reset tracked
# files back to HEAD first so the checkout below always has a clean slate to
# work from, regardless of what a prior run left behind. Untracked files
# (host-specific secrets/env files other tasks also write into this tree)
# are unaffected -- this only touches tracked paths.
- name: "Discard local working-tree modifications in {{ remote_dir }} before checkout"
  command: git reset --hard
  args:
    chdir: "{{ remote_dir }}"
  when: git_check.rc == 0
  changed_when: false
  tags:
    - user.repo.clone

- name: "Clone [ {{ repository_uri }} ] to [ {{remote_dir}} ] (branch: {{ branch | default('master') }} )"
  git:
    repo: "{{ repository_uri }}"
    dest: "{{ remote_dir }}"
    force: true
    recursive: "{{ clone_submodules | default(true) and git_servyy_reachable == 'yes' }}"
    version: "{{ branch | default('master') }}"
    key_file: "{{ git_key_file | default(omit) }}"
    accept_hostkey: true
  tags:
    - user.repo.clone

- name: Check lock state (before chown to unlock git-crypt files)
  command: git config --local --get filter.git-crypt.smudge
  args:
    chdir: "{{ remote_dir }}"
  register: lock_state
  failed_when: lock_state.stderr != ""
  changed_when: lock_state.rc != 0
  when: lookup('env', 'MOLECULE_SCENARIO_NAME') == ''
  tags:
    - user.repo.crypt.check
    - molecule-notest

- block:
    - block:
        - name: Create temporary keyfile local
          tempfile:
            state: file
            suffix: temp
          register: local_keyfile

        - name: Export local key
          command: git-crypt export-key {{local_keyfile.path}}
          args:
            chdir: "{{ local_dir }}"
          delegate_to: localhost
          become_user: "{{ local_user }}"
      tags:
        - user.repo.key.export
      delegate_to: localhost
      become_user: "{{ local_user }}"

    - block:
        - name: Create temporary keyfile remote
          tempfile:
            state: file
            suffix: temp
          register: remote_keyfile

        - name: Copy repository key to remote
          copy:
            src: "{{ local_keyfile.path }}"
            dest: "{{ remote_keyfile.path }}"
      tags:
        - user.repo.key.copy

    - name: Unlock repository
      command: git-crypt unlock "{{ remote_keyfile.path }}"
      args:
        chdir: "{{ remote_dir }}"
      register: unlock_result
      changed_when: "'already unlocked' not in unlock_result.stdout"
      failed_when: unlock_result.rc != 0 and 'already unlocked' not in unlock_result.stdout
  tags:
    - user.repo.crypt.unlock
    - molecule-notest
  when: lock_state is defined and lock_state.changed

- name: "Set correct ownership for {{ remote_dir }}"
  shell: |
    find "{{ remote_dir }}" -type f -exec chown "{{ create_user }}:docker" {} + 2>/dev/null || true
    find "{{ remote_dir }}" -type d -exec chown "{{ create_user }}:docker" {} + 2>/dev/null || true
  changed_when: false
  tags:
    - user.repo.clone

- name: "Initialize submodules for [ {{remote_dir}} ]"
  shell: |
    git submodule update --init --recursive
  args:
    chdir: "{{ remote_dir }}"
  when: update_submodules | default(false)
  register: submodule_init
  changed_when: "'Submodule path' in submodule_init.stdout or 'Submodule registered' in submodule_init.stdout"
  failed_when: false
  tags:
    - user.repo.submodules
