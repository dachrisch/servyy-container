---
# Moodle's bind-mounted data directories with the ownership the containers
# expect. Shared by both host shapes:
#   * a dedicated volume (/mnt/...) if moodle_volume_device is configured
#   * existing server storage (<service dir>/data) otherwise — the default since
#     2026-10-27, so no new spend before the import has been measured
#
# uid 65534 (nobody) is the numeric *Alpine* user the erseco/alpine-moodle image
# runs as — not 33 (www-data), which was the Debian/Apache value under the
# previous self-built image. Getting this wrong does not error at start: Moodle
# simply cannot write its dataroot and fails later, deep in an unrelated request.
#
# 999 is mysql inside the mariadb image; the entrypoint would chown it anyway,
# but doing it here keeps a `docker compose down && up` a no-op.
- name: Create the Moodle data directories with container ownership
  file:
    path: "{{ moodle_data_root_path }}/{{ item.name }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "0770"
  become_user: root
  loop:
    - { name: moodledata, owner: 65534, group: 65534 }
    - { name: mariadb, owner: 999, group: 999 }
  tags: [user.docker.moodle, user.docker]
