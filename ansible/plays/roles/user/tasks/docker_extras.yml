---
- name: Create docker script for services
  template:
    src: docker_command.sh.j2
    dest: "{{ (remote_user_home, 'forall_docker_services.sh') | path_join }}"
    mode: 0770
    owner: "{{ create_user }}"
  vars:
    services:
      - dir: traefik
      - dir: git
        depends: traefik
      - dir: ci
        depends: traefik
      - dir: runny
      - dir: photoprism
        depends: traefik
      - dir: bumbleflies
        depends: traefik
      - dir: achim-hoefer
        depends: traefik
      - dir: portainer
      - dir: portainer-agent
      - dir: pass
      - dir: opencode
      - dir: opencode-authgate
      - dir: energy
      - dir: groceries
      - dir: leagues-finance
      - dir: finance
      - dir: searxng
      - dir: dontforget
      - dir: bnb-office
      - dir: platzler-heid
      - dir: monitor
      - dir: moodle
        depends: traefik
      - dir: waggle
        depends: traefik
    services_root: "{{ docker.remote_dir }}"
  tags:
    - user.docker.services.script

- name: Create finance import directory
  file:
    path: "{{ (docker.remote_dir, 'finance', 'import') | path_join }}"
    state: directory
    owner: "{{ create_user }}"
    group: "docker"
    mode: '0755'
  tags:
    - user.docker.env

- name: Create finance import config from template
  template:
    src: finance-import-config.json.j2
    dest: "{{ (docker.remote_dir, 'finance', 'import', 'import_config.json') | path_join }}"
    owner: "{{ create_user }}"
    group: "docker"
    mode: '0644'
  tags:
    - user.docker.env

- name: Create finance import script from template
  template:
    src: run-import.sh.j2
    dest: "{{ (docker.remote_dir, 'finance', 'import', 'run-import.sh') | path_join }}"
    owner: "{{ create_user }}"
    group: "docker"
    mode: '0755'
  tags:
    - user.docker.env

- name: Create OpenCode data directory
  file:
    path: "{{ (docker.remote_dir, 'opencode', 'data') | path_join }}"
    state: directory
    owner: "{{ create_user }}"
    group: "docker"
    mode: '0775'
  become: true
  become_user: root
  when: with_containers | default(false)
  tags:
    - user.docker.opencode

- name: Create Waggle data directory
  file:
    path: "{{ (docker.remote_dir, 'waggle', 'data', item) | path_join }}"
    state: directory
    owner: "{{ create_user }}"
    group: "docker"
    mode: '0775'
  loop:
    - db
    - media
  # The OpenPost image runs as uid/gid 1000 (the alpine `openpost` user), which
  # is `create_user` here — so the checkout owner is enough and no chown to a
  # foreign uid is needed. Both subdirectories are created because Docker makes a
  # missing bind-mount SOURCE as root, and the container then cannot write
  # /data/db/openpost.db.
  tags:
    - user.docker.waggle

# Forgejo (ci/) — same uid-1000 reasoning: the rootless image runs as uid 1000
# (= create_user), so ./data and ./conf must exist as cda before Docker creates
# them as root and the container can no longer write its database / read config.
# The Forgejo container runs as the deploy user's uid/gid (ci/.env UID/GID).
# Looked up explicitly: ansible_facts['user_uid'] reflects whoever gathered the
# facts and renders 0 (root) in some runs, and Forgejo refuses to run as root.
- name: Look up the deploy user's uid/gid for Forgejo
  ansible.builtin.getent:
    database: passwd
    key: "{{ create_user }}"
  tags:
    - user.docker.ci

- name: Create Forgejo data and conf directories
  file:
    path: "{{ (docker.remote_dir, 'ci', item) | path_join }}"
    state: directory
    owner: "{{ create_user }}"
    group: "docker"
    mode: '0775'
  loop:
    - data
    - conf
  tags:
    - user.docker.ci

# OpenPost stores media_attachments.file_path ABSOLUTE (/data/media/<id>.png) but
# its publication-builder resolves media by joining OPENPOST_MEDIA_PATH onto that
# value, i.e. /data/media + /data/media/<id>.png. Without this link the read
# fails as "could not read selected asset N" and the build job dies, while the
# UI still displays the same image (its /media route resolves the absolute path
# correctly). The link makes the doubled path resolve to the real file.
# Found 2026-11-11; remove once upstream stops double-prefixing.
- name: Create Waggle media path-compat symlink
  ansible.builtin.file:
    path: "{{ (docker.remote_dir, 'waggle', 'data', 'media', 'data') | path_join }}"
    src: /data
    state: link
    force: true
    owner: "{{ create_user }}"
  tags:
    - user.docker.waggle

# The OpenCode container runs on the opencode host (codey.lehel.xyz) and reaches
# this host over the public internet, so its key is scoped to that host's
# addresses plus the local docker networks. Those addresses used to come from a
# deploy-time `dig` of codey.lehel.xyz, which pinned them to whatever DNS said
# on the day of the last deploy: after the 2026-11-17 Oracle cutover the live
# host was 138.2.180.191 while the deployed allow-list still held the retired
# VPS (217.217.227.124), so `ssh servy.lehel.xyz` from inside the container
# failed with "Permission denied (publickey)" and the check-server-status skill
# could not run. Reading hostvars instead makes an address change a reviewed
# inventory edit that lands in the same deploy, and any re-run repairs a stale
# line.
- name: Authorize OpenCode container SSH key (scoped to docker networks + the opencode host)
  ansible.posix.authorized_key:
    user: "{{ create_user }}"
    key: "{{ opencode.servy_ssh_pubkey }}"
    key_options: 'from="{{ opencode_ssh_allowed_sources | join(",") }}"'
    comment: "opencode-container-servy"
    state: present
  vars:
    # Empty dict when codey is not in this inventory (e.g. `-i testing`), which
    # leaves only the docker-network entries.
    opencode_ssh_peer: "{{ hostvars['codey.lehel.xyz'] | default({}) }}"
    opencode_ssh_peer_ipv4: "{{ opencode_ssh_peer.ansible_host | default('') }}"
    opencode_ssh_peer_ipv6: "{{ opencode_ssh_peer.ipv6_address | default('') }}"
    # Only IP literals are allowed through: a hostname (servyy-test.lxd uses its
    # name as ansible_host) is not a valid `from=` pattern, and sshd would reject
    # every connection rather than ignore it.
    opencode_ssh_allowed_sources: >-
      {{ ['172.16.0.0/12', '127.0.0.1']
         + ([opencode_ssh_peer_ipv4 ~ '/32']
            if opencode_ssh_peer_ipv4 is match('^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$') else [])
         + ([opencode_ssh_peer_ipv6 ~ '/128']
            if opencode_ssh_peer_ipv6 is match('^[0-9a-fA-F:]+$') else []) }}
  tags:
    - user.docker.opencode
    - user.ssh.opencode


- name: Ensure lingering enabled
  command: "loginctl enable-linger {{ create_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ create_user }}"
  tags:
    - user.docker.systemd.linger

- import_tasks: includes/oneshot.yml
  vars:
    service:
      name: docker-photo-index
      description: 'Docker Compose - Photo Index'
      schedule: '00/2:30'
      command: "{{ (docker.remote_dir, 'scripts', 'index-photos.sh') | path_join }}"

  tags:
    - user.docker.systemd.service.index

# bnb-office's daily MariaDB dump USED to be a unit here (WP-5b fixed its
# `ExecStart=` and pointed it at `dbops`). WP-8R R7+R8 moved it out of this file
# entirely: the dump now lands in the canonical `/home/cda/db-dumps/bnb_office/
# current`, is carried by its own restic repo (`db-bnb`), and is run by
# `db-backup@business.timer` — the tier unit every `dump_via: dbops` tenant uses.
# Nothing about bnb stays hard-wired in this role.
#
# The unit FILE is not removed by deleting this block (systemd keeps it and its
# timer would keep firing), so the deploy that lands this change removes
# `docker-bnb-office-dump.service`/`.timer` from
# roles/restic/tasks/backup.yml ("Remove the legacy bnb dump unit"). Do not
# re-add a dump unit here.
