# Docker Setup
# Docker packages (docker.io, docker-compose-v2, docker-buildx) are installed
# via sys_packages in system.yml for simplicity and Ubuntu compatibility

- name: Remove ancient docker compose
  apt: name=docker-compose state=absent
  become_user: root
  tags:
    - user.docker.install

- name: Check if docker group exists
  getent:
    database: group
    key: docker
  register: docker_group_check
  failed_when: false
  tags:
    - user.docker.install.add_group

- name: adding existing user '{{ create_user }}' to group docker
  user:
    name: '{{ create_user }}'
    groups: docker
    append: yes
  become_user: root
  register: group_added
  when: docker_group_check.ansible_facts.getent_group.docker is defined
  tags:
    - user.docker.install.add_group

- name: "Set up docker socket permissions for {{ create_user }}"
  file:
    path: /var/run/docker.sock
    group: docker
    mode: '0660'
  become_user: root
  when: group_added.changed
  tags:
    - user.docker.install.reboot

- name: Reboot to apply changes
  reboot:
    msg: Reboot to make docker user available
  become_user: root
  when:
    - group_added.changed
    - ansible_facts['virtualization_type'] | default('') != 'docker'
  tags:
    - user.docker.install.reboot

# IPv6 on the proxy network, so published v6 ports are DNAT'd instead of being handled
# by docker-proxy. The difference is not cosmetic: a proxied v6 connection is
# re-originated from the bridge, so containers see the gateway address instead of the
# client (Traefik logged 172.18.0.1 for a real v6 client, measured 2026-11-10) and no
# log-based blocking can ever identify a v6 source. Both subnets are explicit: the v4
# pool is referenced by allowlists, and the v6 one is a private ULA that nothing routes
# to - DNAT does not need a public prefix on the containers.
# Docker cannot change a network in place, so the cutover is a stop/recreate/start; see
# history/2026-11-11_proxy-network-ipv6.md.
- name: Create external network
  docker_network:
    name: proxy
    enable_ipv6: true
    ipam_config:
      - subnet: "{{ docker_proxy_ipv4_subnet }}"
      - subnet: "{{ docker_proxy_ipv6_subnet }}"
  tags:
    - user.docker.create.network
    - molecule-notest  # Requires Docker daemon access

# https://stackoverflow.com/questions/43689271/wheres-dockers-daemon-json-missing
- name: Configure docker daemon logging
  become_user: root
  json_patch:
    src: '/etc/docker/daemon.json'
    create: true
    operations:
      - op: add
        path: 'log-driver'
        value: 'local'
  tags:
    - molecule-notest  # Requires Docker to be installed

- name: Check if mount point "{{ extension_drive.path }}" exists
  stat:
    path: "{{ extension_drive.path }}"
  register: root_added

- block:
    - name: Configure docker daemon data root
      become_user: root
      json_patch:
        src: '/etc/docker/daemon.json'
        create: true
        pretty: true
        operations:
          - op: add
            path: 'data-root'
            value: "{{ extension_drive.path }}/docker"
      notify: restart docker

  when: root_added.stat.exists
  tags:
    - molecule-notest  # Requires Docker to be installed and mount point
