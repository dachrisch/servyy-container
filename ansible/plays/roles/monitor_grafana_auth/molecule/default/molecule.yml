---
# No Grafana image is pulled: prepare installs a small `docker` CLI stand-in.
# It answers `inspect` with `running` and answers the two auth probes with 401
# until the role re-asserts the password, then with 200. That drives all seven
# tasks, including the repair branch and the post-repair proof, without a real
# Grafana (and without a real secret anywhere in the scenario).
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../../requirements.yml

driver:
  name: docker

platforms:
  - name: instance-monitor-grafana-auth
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true

provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
    verify: verify.yml
  config_options:
    defaults:
      action_warnings: true
      allow_world_readable_tmpfiles: true
      roles_path: ../../../
  env:
    ANSIBLE_FORCE_COLOR: "1"
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
