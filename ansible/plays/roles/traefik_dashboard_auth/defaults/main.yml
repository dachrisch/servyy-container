---
# Traefik dashboard (https://traefik.lehel.xyz) HTTP basic auth.
#
# Source of truth is the gitignored passphrase seed
# plays/vars/.traefik_dashboard_password, exposed here as
# traefik_dashboard_password by vars/secrets.yml. This role hashes it into the
# htpasswd line consumed by traefik/dynamic.yaml's `traefik-auth` file-provider
# middleware (rendered by docker_service/templates/traefik/dashboard-auth.htpasswd.j2)
# and mirrors the plaintext into Vaultwarden like the other important secrets.
traefik_dashboard_username: traefik

# Push the plaintext into Vaultwarden. Disabled in Molecule; also inert on any
# host other than servy.lehel.xyz and whenever no master password was supplied.
traefik_dashboard_push_vaultwarden: true
