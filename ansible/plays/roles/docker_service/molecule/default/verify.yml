---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Check simple service .env exists
      ansible.builtin.stat:
        path: /home/molecule/simple-svc/.env
      register: simple_env
      failed_when: not simple_env.stat.exists

    - name: Check simple service .env has correct permissions
      ansible.builtin.stat:
        path: /home/molecule/simple-svc/.env
      register: simple_env_perms
      failed_when: simple_env_perms.stat.mode != '0600'

    - name: Verify simple service .env contains SERVICE_HOST
      ansible.builtin.command:
        cmd: grep -q 'SERVICE_HOST=simple-svc\.' /home/molecule/simple-svc/.env
      changed_when: false

    - name: Verify simple service .env contains SERVICE_NAME
      ansible.builtin.command:
        cmd: grep -q 'SERVICE_NAME=simple-svc' /home/molecule/simple-svc/.env
      changed_when: false

    - name: Verify domain-override service .env exists
      ansible.builtin.stat:
        path: /home/molecule/domain-svc/.env
      register: domain_env
      failed_when: not domain_env.stat.exists

    - name: Verify domain-override .env SERVICE_HOST uses domain not inventory_hostname
      ansible.builtin.command:
        cmd: grep -q 'SERVICE_HOST=domain-svc.example.org' /home/molecule/domain-svc/.env
      changed_when: false

    - name: Verify domain-override .env SERVICE_ROOT_HOST uses domain
      ansible.builtin.command:
        cmd: grep -q 'SERVICE_ROOT_HOST=example.org' /home/molecule/domain-svc/.env
      changed_when: false

    - name: Verify domain-override .env LOCAL_HOSTNAME uses inventory_hostname
      ansible.builtin.command:
        cmd: grep -q 'LOCAL_HOSTNAME={{ inventory_hostname }}' /home/molecule/domain-svc/.env
      changed_when: false

    - name: Check job-search .env exists
      ansible.builtin.stat:
        path: /home/molecule/job-search/.env
      register: js_env
      failed_when: not js_env.stat.exists

    - name: Check job-search api.env exists
      ansible.builtin.stat:
        path: /home/molecule/job-search/api.env
      register: js_api_env
      failed_when: not js_api_env.stat.exists

    - name: Check job-search crawler.env exists
      ansible.builtin.stat:
        path: /home/molecule/job-search/crawler.env
      register: js_crawler_env
      failed_when: not js_crawler_env.stat.exists

    - name: Verify job-search api.env has JWT_SECRET
      ansible.builtin.command:
        cmd: grep -q 'JWT_SECRET=test-jwt-secret' /home/molecule/job-search/api.env
      changed_when: false

    - name: Verify job-search api.env has SEARXNG_TOKEN
      ansible.builtin.command:
        cmd: grep -q 'SEARXNG_TOKEN=test-searxng-token' /home/molecule/job-search/api.env
      changed_when: false

    - name: Verify job-search api.env has OPENCODE_BASE_URL
      ansible.builtin.command:
        cmd: grep -q 'OPENCODE_BASE_URL=https://code.lehel.xyz' /home/molecule/job-search/api.env
      changed_when: false

    - name: Verify job-search api.env has OPENCODE_API_KEY
      ansible.builtin.command:
        cmd: grep -q 'OPENCODE_API_KEY=test-opencode-api-key' /home/molecule/job-search/api.env
      changed_when: false

    - name: Verify job-search crawler.env has SEARXNG_URL
      ansible.builtin.command:
        cmd: grep -q 'SEARXNG_URL=https://search.lehel.xyz' /home/molecule/job-search/crawler.env
      changed_when: false

    - name: Verify all env files have mode 0600
      ansible.builtin.stat:
        path: "/home/molecule/{{ item }}"
      register: env_stat
      failed_when: env_stat.stat.mode != '0600'
      loop:
        - simple-svc/.env
        - job-search/.env
        - job-search/api.env
        - job-search/crawler.env

    - name: Check manual service .env exists (env IS rendered even for manual)
      ansible.builtin.stat:
        path: /home/molecule/manual-svc/.env
      register: manual_env
      failed_when: not manual_env.stat.exists

    - name: Verify SERVICE_HOST in manual service .env
      ansible.builtin.command:
        cmd: grep -q 'SERVICE_HOST=manual-svc\.' /home/molecule/manual-svc/.env
      changed_when: false

    - name: Check opencode.env exists
      ansible.builtin.stat:
        path: /home/molecule/opencode/opencode.env
      register: oc_env
      failed_when: not oc_env.stat.exists

    - name: Verify opencode.env carries SSH_KEY_PATH
      ansible.builtin.command:
        cmd: grep -q '^SSH_KEY_PATH=/root/.ssh/id_github$' /home/molecule/opencode/opencode.env
      changed_when: false

    - name: Verify opencode.env carries GIT_SSH_COMMAND
      ansible.builtin.command:
        cmd: grep -q '^GIT_SSH_COMMAND=ssh -i /root/.ssh/id_github' /home/molecule/opencode/opencode.env
      changed_when: false

    - name: Verify opencode.env carries OPENCODE_AUTH_GOOGLE_B64
      ansible.builtin.command:
        cmd: grep -q '^OPENCODE_AUTH_GOOGLE_B64=.\+$' /home/molecule/opencode/opencode.env
      changed_when: false

    - name: Verify opencode.env still carries GIT_CRYPT_KEY_B64 (required for gh-dash-crypt repos)
      ansible.builtin.command:
        cmd: grep -q '^GIT_CRYPT_KEY_B64=.\+$' /home/molecule/opencode/opencode.env
      changed_when: false

    - name: Verify opencode.env no longer carries static DEV_REPOS_B64 (gh-dash auto-discovery)
      ansible.builtin.command:
        cmd: grep -q '^DEV_REPOS_B64=' /home/molecule/opencode/opencode.env
      register: dev_repos_present
      changed_when: false
      failed_when: dev_repos_present.rc == 0

    - name: Verify opencode.env has mode 0600
      ansible.builtin.stat:
        path: /home/molecule/opencode/opencode.env
      register: oc_env_perms
      failed_when: oc_env_perms.stat.mode != '0600'
