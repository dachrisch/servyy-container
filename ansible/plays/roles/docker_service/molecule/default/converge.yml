---
- name: Converge
  hosts: all
  become: true
  vars:
    docker:
      remote_dir: /home/molecule
    extension_drive:
      path: /var/lib
    job_search_jwt_secret: test-jwt-secret
    job_search_searxng_token: test-searxng-token
    job_search_searxng_url: https://search.lehel.xyz
    vault_job_search_mongo_root_username: test-mongo-root-user
    vault_job_search_mongo_root_password: test-mongo-root-pass
    vault_gmail_smtp_password: test-gmail-smtp-pw
    vault_monitor_grafana_admin_password: test-grafana-admin-pw
    monitor_admin_email: monitor-test@example.org
    opencode:
      server_password: test-opencode-pass
      api_key: test-opencode-api-key
      circleci_token: test-circleci-token
      git_crypt_key_b64: dGVzdC1jcnlwdC1rZXk=
      servy_ssh_key_b64: dGVzdC1zc2gta2V5
      dashscope_api_key: test-dashscope-api-key
      opencode_go_api_key: test-opencode-go-api-key
      github_pat_dachrisch: test-pat-dachrisch
      github_pat_bumbleflies: test-pat-bumbleflies
      youtube_oauth_token_json: '{"refresh_token":"test-refresh-token","token_uri":"https://oauth2.googleapis.com/token"}'
      servy_ssh_pubkey: "ssh-ed25519 AAAATESTKEY opencode@servy.lehel.xyz"
      dev_repos:
        - {dir: "leaguesphere", repo: "https://example.com/x.git", branch: "master", crypt: false}
        - {dir: "servyy-container", repo: "https://example.com/y.git", branch: "master", crypt: true}

  pre_tasks:
    - name: Create service directories
      ansible.builtin.file:
        path: "/home/molecule/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - simple-svc
        - domain-svc
        - job-search
        - manual-svc
        - opencode
        - claude-hub
        - monitor
        - static-svc

    # Content a container has to read as a non-root uid, as the git checkout
    # leaves it under umask 007 (0660/0770) -- the condition that made the
    # höfer-architekten site answer 403 and lose its Traefik routers.
    - name: Create 0770 bind-mount directory for static-svc
      ansible.builtin.file:
        path: /home/molecule/static-svc/serve
        state: directory
        mode: "0770"

    - name: Create unreadable bind-mount content for static-svc
      ansible.builtin.copy:
        content: "static site\n"
        dest: /home/molecule/static-svc/serve/index.html
        mode: "0660"

    # A single-file world_readable_paths entry (not inside the directory above),
    # mirroring traefik/error-pages.html: the file is mounted as its own path.
    - name: Create 0660 single-file bind-mount content for static-svc
      ansible.builtin.copy:
        content: "<html>static</html>\n"
        dest: /home/molecule/static-svc/template.html
        mode: "0660"

    # Moodle's vendored plugin archive lives in a 0770 checkout directory under
    # umask 007; the image reads it at boot to install PLUGINS=.
    - name: Create 0770 plugin directory for moodle
      ansible.builtin.file:
        path: /home/molecule/moodle/plugins
        state: directory
        mode: "0770"

    - name: Create 0660 vendored plugin archive for moodle
      ansible.builtin.copy:
        content: "PK\u0003\u0004placeholder\n"
        dest: /home/molecule/moodle/plugins/enrol_waitlist-2026051200.zip
        mode: "0660"

  tasks:
    - name: Deploy simple service
      ansible.builtin.include_role:
        name: docker_service
        tasks_from: main.yml
      vars:
        service_dir: simple-svc

    - name: Deploy domain-override service (asserts domain var wins over inventory_hostname)
      ansible.builtin.include_role:
        name: docker_service
        tasks_from: main.yml
      vars:
        service_dir: domain-svc
        domain: example.org

    # Fixture only: the prod job-search service was retired 2026-10-27, but
    # these templates stay as the role's multi-env-template test case (3 env
    # files rendered from one service). Do not treat them as service debris.
    - name: Deploy multi-template job-search service
      ansible.builtin.include_role:
        name: docker_service
        tasks_from: main.yml
      vars:
        service_dir: job-search
        env_templates:
          - src: docker.env.j2
            dest: .env
          - src: job-search/api.env.j2
            dest: api.env
          - src: job-search/crawler.env.j2
            dest: crawler.env

    - name: Deploy static service (world-readable bind-mount content)
      ansible.builtin.include_role:
        name: docker_service
        tasks_from: main.yml
      vars:
        service_dir: static-svc
        world_readable_paths:
          - serve
          - template.html

    # Moodle: PLUGINS= must stay wired to the vendored archive. The real
    # container installs it at boot and fails to start without it, so this test
    # is the only place that catches a silently emptied PLUGINS line.
    - name: Deploy moodle service env (vendored plugin wiring)
      ansible.builtin.include_role:
        name: docker_service
        tasks_from: main.yml
      vars:
        service_dir: moodle
        service_name: moodle
        service_host: m.leaguesphere.app
        manual: true
        env_templates:
          - src: moodle.app.env.j2
            dest: app.env
        world_readable_paths:
          - plugins
        vault_moodle_db_password: test-moodle-db-pw
        vault_moodle_admin_password: test-moodle-admin-pw
        # SMTP is load-bearing: the image rewrites mdl_config from these on every
        # boot, and the pre-cutover export carried empty values (the old KAS host
        # sent through a local MTA). Without them the template fails to render.
        vault_moodle_smtp_host: smtp.example.invalid
        vault_moodle_smtp_port: "587"
        vault_moodle_smtp_user: moodle@example.invalid
        vault_moodle_smtp_password: test-moodle-smtp-pw
        vault_moodle_smtp_protocol: tls
        moodle_plugin_enrol_waitlist_zip: enrol_waitlist-2026051200.zip
        moodle_plugin_enrol_waitlist_sha256: deadbeef

    - name: Deploy manual service (env only, no compose)
      ansible.builtin.include_role:
        name: docker_service
        tasks_from: main.yml
      vars:
        service_dir: manual-svc
        manual: true

    - name: Deploy opencode service (env only)
      ansible.builtin.include_role:
        name: docker_service
        tasks_from: main.yml
      vars:
        service_dir: opencode
        manual: true
        env_templates:
          - src: docker.env.j2
            dest: .env
          - src: opencode/.env.j2
            dest: opencode.env

    - name: Deploy claude-hub service (env only)
      ansible.builtin.include_role:
        name: docker_service
        tasks_from: main.yml
      vars:
        service_dir: claude-hub
        manual: true
        env_templates:
          - src: docker.env.j2
            dest: .env
          - src: claude-hub/.env.j2
            dest: claude-hub.env

    - name: Deploy monitor service env (grafana secrets, no compose)
      ansible.builtin.include_role:
        name: docker_service
        tasks_from: main.yml
      vars:
        service_dir: monitor
        manual: true
        env_templates:
          - src: docker.env.j2
            dest: .env
          - src: monitor/grafana.env.j2
            dest: grafana.env
