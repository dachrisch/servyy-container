---
service_dir: ""
service_name: "{{ service_dir }}"
# SERVICE_HOST pattern (domain-aware):
#   Production (lehel.xyz): {dns_short_name or service_dir}.lehel.xyz
#   Test (servyy-test.lxd): {service_dir}.servyy-test.lxd
#   Dev (aqui.fritz.box): {service_dir}.aqui.fritz.box
# Base domain for the host. Defaults to inventory_hostname; override via `domain`
# host var (e.g. lehel.xyz) so services resolve to the public domain even when the
# inventory hostname differs (e.g. servy.lehel.xyz).
domain: "{{ inventory_hostname }}"
# Short DNS name for exposed production services (e.g. "code" -> code.lehel.xyz).
dns_short_name: ""
# Whether the service is exposed via a dedicated public DNS name.
dns_expose: false
# Computed service host: use dns_short_name when explicitly exposed, else service_dir.
service_host: "{{ (dns_short_name if (dns_expose | default(false) and dns_short_name) else service_dir) }}.{{ domain }}"
env_templates:
  - src: docker.env.j2
    dest: .env
compose_file: docker-compose.yml
# Subset of compose services to deploy (empty = all). Lets a host run part of
# a compose file, e.g. queen from the finance file without Firefly.
compose_services: []
manual: false
# Docker volumes to ensure exist before `docker compose up` (e.g. volumes
# referenced as `external: true` by this service but owned by another compose
# project). Ordering-independent: whichever service runs first creates it.
ensure_volumes: []
# Paths (relative to the service dir) holding content a container has to read as
# a *non-root* uid, typically a bind-mounted site served by an nginx worker.
# The deploy checkout runs under umask 007 (roles/user/tasks/includes/repository.yml),
# so tracked files land as 0660 and directories as 0770 -- readable by the
# checkout owner and the docker group only. A container process that is neither
# (nginx worker = uid 101) gets 403 on every request, fails its healthcheck, and
# Traefik then withdraws the container's routers for as long as it is unhealthy
# (the site answers with the catch-all 404 instead). Paths listed here are
# chmod a+rX'ed after the env files are rendered: dirs 0775, files 0664.
world_readable_paths: []
