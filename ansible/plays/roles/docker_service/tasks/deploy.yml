---
- name: Deploy {{ service_dir }}
  community.docker.docker_compose_v2:
    project_src: "{{ docker.remote_dir }}/{{ service_dir }}"
    project_name: "{{ project_name | default(service_name) }}"
    files:
      - "{{ compose_file }}"
    services: "{{ compose_services }}"
    # Opt-in image rebuild for services whose image is built from the repo
    # itself (moodle). Default is `omit`, i.e. compose's own `missing` policy, so
    # every pre-built-image service behaves exactly as before.
    build: "{{ compose_build | default(omit) }}"
    state: present
  tags: [molecule-notest]
