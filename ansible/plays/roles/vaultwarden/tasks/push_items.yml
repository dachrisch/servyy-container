---
# Push a list of secrets into Vaultwarden as Login items.
# Runs on the Ansible CONTROLLER via the `bw` CLI (not the remote host).
# Idempotent: only creates missing Login items.
#
# Caller must set before including this file:
#   vaultwarden_items: list of {name, secret, notes}
#   vaultwarden_item_username: string

- name: Unlock the bw vault (shared)
  ansible.builtin.include_tasks: unlock.yml

- name: List existing vault items
  ansible.builtin.command:
    cmd: bw list items
  environment:
    BW_SESSION: "{{ bw_session }}"
  delegate_to: localhost
  run_once: true
  become: false
  register: bw_items_raw
  changed_when: false
  no_log: true

- name: Build map of existing items by name with their secrets
  ansible.builtin.set_fact:
    existing_items_map: "{{ existing_items_map | default({}) | combine({item.name: {'id': item.id, 'secret': item.login.password}}) }}"
  delegate_to: localhost
  run_once: true
  become: false
  loop: "{{ bw_items_raw.stdout | from_json }}"
  loop_control:
    label: "{{ item.name }}"

- name: Determine which items need creation vs update
  ansible.builtin.set_fact:
    items_to_create: "{{ vaultwarden_items | selectattr('name', 'not', 'in', existing_items_map.keys() | list) | list }}"
    items_to_update: "{{ vaultwarden_items | selectattr('name', 'in', existing_items_map.keys() | list) | selectattr('secret', 'ne', existing_items_map[item.name].secret) | list }}"
  delegate_to: localhost
  run_once: true
  become: false
  vars:
    # For update check, we need to iterate and check each one
    item: "{{ lookup('dict', existing_items_map) }}"

- name: Recompute items to update (secret value changed)
  ansible.builtin.set_fact:
    items_to_update: "{{ items_to_update | default([]) + [item] }}"
  delegate_to: localhost
  run_once: true
  become: false
  loop: "{{ vaultwarden_items }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name in existing_items_map and item.secret != existing_items_map[item.name].secret

- name: Create new items in Vaultwarden
  ansible.builtin.shell:
    cmd: "set -o pipefail; printf '%s' {{ item_json | quote }} | bw encode | bw create item"
    executable: /bin/bash
  environment:
    BW_SESSION: "{{ bw_session }}"
  delegate_to: localhost
  run_once: true
  become: false
  vars:
    item_json: >-
      {{ {'type': 1,
          'name': item.name,
          'notes': item.notes,
          'login': {'username': vaultwarden_item_username | default('ansible'), 'password': item.secret, 'uris': []}}
         | to_json }}
  loop: "{{ items_to_create }}"
  loop_control:
    label: "{{ item.name }}"
  when: items_to_create | length > 0
  changed_when: true
  no_log: true

- name: Update existing items with changed secrets
  ansible.builtin.shell:
    cmd: "set -o pipefail; printf '%s' {{ item_json | quote }} | bw encode | bw edit item {{ existing_items_map[item.name].id }}"
    executable: /bin/bash
  environment:
    BW_SESSION: "{{ bw_session }}"
  delegate_to: localhost
  run_once: true
  become: false
  vars:
    item_json: >-
      {{ {'type': 1,
          'id': existing_items_map[item.name].id,
          'name': item.name,
          'notes': item.notes,
          'login': {'username': vaultwarden_item_username | default('ansible'), 'password': item.secret, 'uris': []}}
         | to_json }}
  loop: "{{ items_to_update }}"
  loop_control:
    label: "{{ item.name }}"
  when: items_to_update | length > 0
  changed_when: true
  no_log: true

- name: Report which items were created, updated, or unchanged
  ansible.builtin.debug:
    msg: >-
      {{ item.name }}:
      {{ 'created' if item.name in items_to_create | map(attribute='name') | list else ('updated' if item.name in items_to_update | map(attribute='name') | list else 'unchanged') }}
  delegate_to: localhost
  run_once: true
  become: false
  loop: "{{ vaultwarden_items }}"
  loop_control:
    label: "{{ item.name }}"

- name: Lock the vault again
  ansible.builtin.command:
    cmd: bw lock
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: false
  failed_when: false
