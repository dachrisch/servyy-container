---
# forgejo_bootstrap — one-time (idempotent) setup of the Forgejo instance,
# run on the host that deploys `ci/` (servy; servyy-test in rehearsal).
#
# Four jobs, all idempotent:
#   1. create the admin user if it does not exist;
#   2. register the Actions runners offline with the shared secret
#      (`forgejo forgejo-cli actions register`) for each name in
#      `forgejo_runners`;
#   3. install the nightly DB-dump systemd timer (01:30, keep last 3).
#   4. Git-over-SSH passthrough: host `git` user + sshd Match block that
#      forwards to `forgejo serv` in the container (tasks/ssh_passthrough.yml).
#
# The admin PASSWORD and the runner SECRET come from plays/vars/secrets.yml as
# literals (never `lookup('password', …)` seeds — AGENTS.md rule 6).

# Admin user. `cda` is the single account on this private instance.
forgejo_bootstrap_admin_username: cda
forgejo_bootstrap_admin_email: "cda@lehel.xyz"

# Runner names to register server-side. Overridden per host in the inventory:
#   servy        -> [codey, runny]
#   servyy-test  -> [test]
# The runner SIDE (config.yml + .runner) is handled by the forgejo_runner role
# on codey/runny; this list is the server-side half of the same shared secret.
forgejo_runners: []

# Per-runner scope: "{owner}[/{repo}]", empty = global. A scoped runner only
# picks up jobs from repos the named owner (or repo) can reach. Both runners
# are global as of 2026-11-24: runny is rootless and holds no repo or secrets,
# so every repo can use its native amd64 runner. Keyed by runner name.
forgejo_runner_scopes: {}

# Where the Forgejo container lives (matches ci/docker-compose.yml). The
# `forgejo` binary is the image entrypoint; subcommands run via `docker exec`.
forgejo_bootstrap_container: ci.forgejo

# Where the DB dump lands on the HOST (./data is the ci bind mount, so
# ./data/backup maps to /var/lib/gitea/backup inside the container). This is
# what restic's home job snapshots (the dump is NOT in the exclude list).
forgejo_bootstrap_dump_dir: "{{ (docker.remote_dir, 'ci', 'data', 'backup') | path_join }}"
# The same directory as seen inside the container: ./data is mounted at
# /var/lib/gitea, so ./data/backup is /var/lib/gitea/backup.
forgejo_bootstrap_dump_container_dir: /var/lib/gitea/backup
forgejo_bootstrap_dump_keep: 3

# Where the dump script and systemd units live (a user-level ~/.forgejo dir,
# like system_probe's ~/.system-probes).
forgejo_bootstrap_scripts_dir: "{{ (remote_user_home, '.forgejo') | path_join }}"

# Root URL of the instance, used by the runner-registration idempotency check
# against the admin API. `domain` is the inventory host var (lehel.xyz on servy,
# servyy-test.lxd on the test host); the scheme follows the ci TLS knob.
forgejo_root_url: >-
  {{ ('https' if (ci_traefik_tls | default('true')) == 'true' else 'http')
     ~ '://ci.' ~ domain }}

# --- Git over SSH (host sshd passthrough, tasks/ssh_passthrough.yml) ---------
# servy's own sshd serves git@ci.<domain>:22 for Forgejo. A host user of this
# name gets its keys from Forgejo and can only run the forgejo-exec wrapper.
# Must match Forgejo's RUN_USER (`git`, the USER env in ci/docker-compose.yml).
forgejo_ssh_user: git
forgejo_ssh_home: /var/lib/forgejo-git
forgejo_ssh_enabled: true

# --- management API token (tasks/api_token.yml, play plays/forgejo_api_token.yml)
# One `all`-scope token for user cda, used by the managing-ci skill (fj helper).
# Source of truth: the Vaultwarden item + a controller-local copy. Ansible MINTS a
# new token only when neither holds a token that Forgejo accepts (proven 401);
# an unreachable Forgejo or a missing vw.key with no local copy FAILS instead.
forgejo_api_token_user: "{{ forgejo_bootstrap_admin_username }}"
forgejo_api_token_scopes: all
# Suffixed with a UTC timestamp at mint time: token names are unique per user,
# and the API cannot delete tokens without basic auth.
forgejo_api_token_name_prefix: ansible-manage
forgejo_api_token_vw_item: "forgejo - api token (ci.{{ domain }})"
forgejo_api_token_local_file: "{{ lookup('env', 'HOME') }}/.config/forgejo/ci.{{ domain }}.token"
# Prints the HTTP status of GET /api/v1/user for the token in $FJ_TOKEN. The
# token is read from the environment INSIDE the container (docker exec -e
# FJ_TOKEN passes the caller's variable through), never from argv. The pipe runs
# in the container's sh: busybox wget exits 1 on a 401, so the status line is
# parsed instead of trusting the exit code.
forgejo_api_token_check_argv:
  - docker
  - exec
  - -e
  - FJ_TOKEN
  - "{{ forgejo_bootstrap_container }}"
  - sh
  - -c
  - >-
    wget -q -S -O /dev/null --header "Authorization: token $FJ_TOKEN"
    http://localhost:3000/api/v1/user 2>&1
    | sed -n 's/^ *HTTP\/[0-9.]* \([0-9][0-9][0-9]\).*/\1/p' | head -n 1
