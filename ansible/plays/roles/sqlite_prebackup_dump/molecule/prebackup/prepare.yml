---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Install Python and sudo
      ansible.builtin.raw: |
        apt-get update
        apt-get install -y python3 python3-apt sudo
      changed_when: false

    # The role chowns its files to create_user and converge becomes that user.
    - name: Create the deploy user
      ansible.builtin.raw: |
        id testuser >/dev/null 2>&1 || useradd -m -u 1000 testuser
      changed_when: false
