---
# ---------------------------------------------------------------------------
# SSH tunnel accounts for LeagueSphere DB access.
#
# rev. 3 (2026-10-26): the prod tunnel is ONE static account. A person is not
# identified by an SSH account any more - the db-access sidecar mints a
# MySQL account per session (dbeaver_prod_<person>) - which is why the two
# names differ on purpose. The tunnel is transport only: a key opens one
# loopback port and carries no identity.
#
# `name` becomes the sshd fragment filename (dbeaver-<name>.conf), the ports in
# `local_ports` are the ONLY destinations that account may forward to
# (authorized_keys permitopen plus the sshd Match block), and `hosts` limits
# which inventory hosts get it. `local_port` stays as the single-port shorthand.
# ---------------------------------------------------------------------------

dbeaver_stage_tunnel:
  name: stage
  user: dbeaver_stage
  ssh_key_filename: "dbeaver_stage_key_{{ inventory_hostname_short }}"
  local_port: "33062"
  # 33062 is the plain mysql publish (a forwarded login arrives from the host's
  # own address, so it only works for accounts granted from that address).
  # 33064 is the db-tunnel socat inside the stage stack: it dials mysql over the
  # 172.26.x network, which is what the minted `dbeaver_prod_<person>` accounts
  # are granted from. DBeaver uses 33064.
  local_ports:
    - "33062"
    - "33064"
  hosts:
    - servy.lehel.xyz
    - servyy-test.lxd
  vault_item_name: "dbeaver stage tunnel key ({{ inventory_hostname_short }})"

dbeaver_prod_tunnel:
  name: prod
  user: dbeaver_tunnel
  ssh_key_filename: "dbeaver_tunnel_key_{{ inventory_hostname_short }}"
  local_port: "33063"
  hosts:
    - servy.lehel.xyz
  vault_item_name: "dbeaver prod tunnel key ({{ inventory_hostname_short }})"

dbeaver_tunnels: "{{ [dbeaver_stage_tunnel, dbeaver_prod_tunnel] }}"

# --- db-access sidecar + reaper (see tasks/provisioner.yml, tasks/reaper.yml)
#
# Running more than one stack on a host is normal: servy runs prod (from
# `container`) AND stage (from `container-stage`), servyy-test.lxd runs one.
# The role therefore discovers every stack whose database container is running,
# and reads each stack's compose directory from that container's own compose
# labels.
#
# `dbeaver_app_filter` narrows *what gets provisioned* (e.g. a stage-only
# rollout); the reaper always covers every stack on the host, because a
# narrowed safety net is worse than none. Empty means "all stacks".
dbeaver_app_filter: []

# `-e dbeaver_app_filter=leaguesphere_stage` arrives as a string, and `in` on a
# string is a substring test - "leaguesphere" would match "leaguesphere_stage"
# and provision prod too. Normalise to a list before it is used.
dbeaver_app_filter_list: >-
  {{ [] if (dbeaver_app_filter | length) == 0
     else ([dbeaver_app_filter] if dbeaver_app_filter is string else dbeaver_app_filter) }}

dbeaver_ls_vars_files:
  - secret_main.yaml
  - secret_stage.yaml

dbeaver_provision_hosts:
  - servy.lehel.xyz
  - servyy-test.lxd

# The hard cap the host enforces. The app's own constraint mirrors this number;
# the reaper recomputes expiry from created_at and this constant, so a bug in
# the app can shorten a session but never extend one.
dbeaver_ttl_cap_hours: 8

# Where the sidecar reads its credential from inside the DB. One password per
# stack (<prefix>_<app name>), generated once on the controller and never
# regenerated by a normal run - regenerating it would lock that stack's sidecar
# out of the database it just created accounts in.
dbeaver_provisioner_user: dbaccess
dbeaver_provisioner_local_file_prefix: "~/.dbeaver_provisioner_{{ inventory_hostname_short }}"

# Service names in the compose file, used to find the container and to template
# dba.env. Prod publishes the tunnel through a socat sidecar; stage already
# publishes its own port, so only the executor differs per host.
dbeaver_sidecar_container_suffix: ".db-access"
