---
# Creates the account the db-access sidecar of ONE stack mints temporary MySQL
# users with, and writes that sidecar's env file next to its compose file.
# Runs once per stack found on the host (see discover.yml).
#
# This is the only new privilege in the whole design, and it is scoped as
# tightly as MariaDB allows:
#   * CREATE USER is a global privilege - there is no schema-scoped variant, so
#     it cannot be avoided. It also lets the account create '%' hosts, which is
#     why the reaper re-checks the host pattern on every sweep.
#   * GRANT OPTION is scoped to the application schema, so the account can hand
#     out what it holds there and nothing in another schema. Verified on
#     2026-10-26: it cannot grant ALL on *.*, cannot touch another schema,
#     cannot grant itself anything, and cannot even read mysql.user.
#   * MariaDB records the grant option PER DATABASE, not per privilege: the
#     single `WITH GRANT OPTION` below therefore lets the account pass on every
#     privilege in that statement - SELECT, INSERT, UPDATE, DELETE - and not
#     only the one written last. It is a database-scoped capability, not a
#     per-privilege switch; there is no way to grant UPDATE "with option" and
#     INSERT "without" in the same schema.
#   * It therefore holds SELECT, INSERT, UPDATE and DELETE on the schema - you
#     can only grant what you hold. That is the honest cost: this credential is
#     as powerful as the application credential, and only the sidecar has it.
#     DELETE was added on 2026-11-20 so a request that explicitly asks for it
#     can be minted; the sidecar still grants it only when the approver signed
#     for it.
#   * CREATE on the schema is for the pre-session snapshot
#     (`bak_<table>_<date>`), which tick.sh takes before it grants anything. The
#     temporary account must not have CREATE, so this cannot be avoided either.
#     Verified on 2026-10-26: without it every request is parked as `failed`
#     with "CREATE command denied".
#   * PROCESS is deliberately NOT granted. It is global - it exposes every
#     session's query text and lets the holder kill any connection - and
#     MariaDB has no scoped variant. The consequence is that the sidecar's own
#     KILL is a no-op; the host reaper does the killing instead (root inside
#     the container, see the session sweep in the reap script).
#
# The block carries its tags because tags on a dynamic include do not propagate
# to the included tasks.
#
# Rotating this password (deleting the controller-side file) needs the sidecar
# restarted afterwards - it reads dba.env once, at start:
#   cd <compose dir> && docker compose -p <stack> up -d --force-recreate db-access
- block:
    - name: Refuse to provision {{ dbeaver_stack.name }} unless the grant host is its backend network
      assert:
        that:
          # A private-range pin: the account is only useful from inside the
          # compose network, and a public or /8-wide pattern is a grant nobody
          # needs.
          # RFC1918 only, and never wider than the stack's own network:
          # 172.<16-31>.% (a docker /16 in the 172.16/12 pool, the three-octet
          # form prod uses: 172.25.%) or 192.168.<n>.% (the tier's /20 pool, the
          # four-octet form: 192.168.16.%). Anything else, including 10/8, a
          # public range, or a wider 192.168.%, is refused.
          - dbeaver_stack.grant_host_pattern is match('^(172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.[0-9]+\.)%$')
          - dbeaver_stack.backend_network in dbeaver_stack.networks
          # Prod keeps the exact pattern the sidecar and the runbook name. If
          # this fires, the network was renumbered and every grant needs a
          # second look.
          - (dbeaver_stack.name != 'leaguesphere') or (dbeaver_stack.grant_host_pattern == '172.25.%')
        fail_msg: >-
          {{ dbeaver_stack.name }}: {{ dbeaver_stack.backend_network }} resolves to
          {{ dbeaver_stack.grant_host_pattern }}, but the database container
          {{ dbeaver_stack.db_container }} is attached to
          {{ dbeaver_stack.networks | join(', ') }}. Re-verify which containers
          share that network before granting anything.
        quiet: true

    - name: Generate the {{ dbeaver_stack.name }} reaper-admin password once, on the controller
      set_fact:
        dbeaver_admin_password: >-
          {{ lookup('password', (dbeaver_provisioner_local_file_prefix ~ '_' ~ dbeaver_stack.name ~ '_admin') ~ ' length=32 chars=ascii_letters,digits') }}
      no_log: true
      when: dbeaver_stack.admin_user | length > 0

    - name: Generate the {{ dbeaver_stack.name }} provisioner password once, on the controller
      set_fact:
        dbeaver_provisioner_password: >-
          {{ lookup('password', dbeaver_stack.password_file + ' length=32 chars=ascii_letters,digits') }}
      no_log: true

    # The data privileges are schema-wide, not on `dbaccess_event`: this role
    # runs BEFORE the app deploy that migrates that table in, and MariaDB
    # refuses a table-level grant on a table that does not exist yet (ERROR
    # 1146), which aborted the whole run on a fresh host.
    #
    # The one `WITH GRANT OPTION` covers all four data privileges because
    # MariaDB stores the option per database. It does not cover CREATE: that
    # is a separate statement without the option, so the sidecar can take the
    # pre-session snapshot but cannot hand CREATE to a temporary account.
    - name: Create or update the provisioner account in {{ dbeaver_stack.db_container }}
      community.docker.docker_container_exec:
        container: "{{ dbeaver_stack.db_container }}"
        command: mariadb -h 127.0.0.1 -u root --batch
        stdin: |
          CREATE USER IF NOT EXISTS '{{ dbeaver_provisioner_user }}'@'{{ dbeaver_stack.grant_host_pattern }}'
            IDENTIFIED BY '{{ dbeaver_provisioner_password }}';
          ALTER USER '{{ dbeaver_provisioner_user }}'@'{{ dbeaver_stack.grant_host_pattern }}'
            IDENTIFIED BY '{{ dbeaver_provisioner_password }}';
          GRANT CREATE USER ON *.* TO '{{ dbeaver_provisioner_user }}'@'{{ dbeaver_stack.grant_host_pattern }}';
          GRANT SELECT, INSERT, UPDATE, DELETE ON `{{ dbeaver_stack.db_name }}`.*
            TO '{{ dbeaver_provisioner_user }}'@'{{ dbeaver_stack.grant_host_pattern }}' WITH GRANT OPTION;
          GRANT CREATE ON `{{ dbeaver_stack.db_name }}`.*
            TO '{{ dbeaver_provisioner_user }}'@'{{ dbeaver_stack.grant_host_pattern }}';
        env:
          MYSQL_PWD: "{{ dbeaver_stack.db_root_password }}"
      no_log: true

    - name: Show what the {{ dbeaver_stack.name }} provisioner actually got
      community.docker.docker_container_exec:
        container: "{{ dbeaver_stack.db_container }}"
        command: >-
          mariadb -h 127.0.0.1 -u root --batch --skip-column-names
          -e "SHOW GRANTS FOR '{{ dbeaver_provisioner_user }}'@'{{ dbeaver_stack.grant_host_pattern }}'"
        env:
          MYSQL_PWD: "{{ dbeaver_stack.db_root_password }}"
      register: dbeaver_provisioner_grants
      changed_when: false

    - name: Print the effective {{ dbeaver_stack.name }} provisioner grants
      debug:
        var: dbeaver_provisioner_grants.stdout_lines

    # --- tier stacks only: the SCOPED admin the reaper sweeps with ------------
    # The reaper used to read the DB container's root from its env. After the
    # cutover the stage database lives on db-nonprod.mariadb, whose root would
    # give the safety net far more than it needs, so it gets its own account:
    #   * CREATE USER        - global; MariaDB has no schema-scoped variant (the
    #                          same accepted cost as the sidecar's own account),
    #   * SELECT ON mysql.user - it must read created_at / the host pattern,
    #   * ALL ON <stage db>.* WITH GRANT OPTION - it re-grants and drops the
    #                          temporary dbeaver accounts inside that schema.
    # ACCEPTED RESIDUAL (plan Phase 3 step 6): CREATE USER is global, so this
    # credential can DROP USER any account on the nonprod tier. It is a
    # non-prod, disposable tier; the alternative on MariaDB is root.
    - name: Create the {{ dbeaver_stack.admin_user }} account the reaper uses
      community.docker.docker_container_exec:
        container: "{{ dbeaver_stack.db_container }}"
        command: mariadb -h 127.0.0.1 -u root --batch
        stdin: |
          CREATE USER IF NOT EXISTS '{{ dbeaver_stack.admin_user }}'@'%'
            IDENTIFIED BY '{{ dbeaver_admin_password }}';
          ALTER USER '{{ dbeaver_stack.admin_user }}'@'%'
            IDENTIFIED BY '{{ dbeaver_admin_password }}';
          GRANT CREATE USER ON *.* TO '{{ dbeaver_stack.admin_user }}'@'%';
          GRANT SELECT ON mysql.user TO '{{ dbeaver_stack.admin_user }}'@'%';
          GRANT ALL PRIVILEGES ON `{{ dbeaver_stack.db_name }}`.*
            TO '{{ dbeaver_stack.admin_user }}'@'%' WITH GRANT OPTION;
        env:
          MYSQL_PWD: "{{ dbeaver_stack.db_root_password }}"
      no_log: true
      when: dbeaver_stack.admin_user | length > 0

    - name: Ensure the reaper's credential directory exists
      file:
        path: "{{ (dbeaver_stack.admin_env_path | dirname) }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: dbeaver_stack.admin_user | length > 0

    - name: Render the reaper's credential file for {{ dbeaver_stack.name }}
      template:
        src: reaper_admin.env.j2
        dest: "{{ dbeaver_stack.admin_env_path }}"
        owner: root
        group: root
        mode: '0600'
      no_log: true
      when: dbeaver_stack.admin_user | length > 0

    - name: Write {{ dbeaver_stack.name }}'s sidecar environment file next to its compose file
      template:
        src: dba.env.j2
        dest: "{{ (dbeaver_stack.compose_dir, 'dba.env') | path_join }}"
        owner: "{{ ls.user }}"
        group: "{{ ls.user }}"
        mode: '0600'
      no_log: true
  tags:
    - ls.dbeaver
    - ls.dbeaver.provision
