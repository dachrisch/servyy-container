---
# Tunnel accounts, the provisioner behind the db-access sidecar, and the reaper
# that ends access on a clock. See docs/plans/2026-10-25-prod-db-temp-credentials.md.
- name: Validate tunnel definitions
  assert:
    that:
      - item.user is match('^[a-z][a-z0-9_]{1,30}$')
      - item.name is match('^[a-z0-9-]{1,40}$')
      - item.local_port is match('^[0-9]{4,5}$')
      - (item.local_ports | default([item.local_port]) | join(',')) is match('^[0-9]{4,5}(,[0-9]{4,5})*$')
      # Shape only: prod's file is `dbeaver_tunnel_key_<host>` (its user name),
      # stage's is `dbeaver_stage_key_<host>`. The guard against a wrong suffix
      # is that authorized_keys is no longer exclusive, so a regenerated key
      # cannot lock the installed one out.
      - item.ssh_key_filename is match('^dbeaver_[a-z0-9_]+_key_[a-z0-9-]+$')
    quiet: true
  loop: "{{ dbeaver_tunnels }}"
  loop_control:
    label: "{{ item.user }}"
  when: inventory_hostname in item.hosts
  tags:
    - ls.dbeaver

- name: Set up restricted SSH tunnel accounts
  block:
    - name: Create dedicated {{ item.user }} account (no shell, no extra groups)
      user:
        name: "{{ item.user }}"
        state: present
        shell: /usr/sbin/nologin
        create_home: true
      loop: "{{ dbeaver_tunnels }}"
      loop_control:
        label: "{{ item.user }}"
      when: inventory_hostname in item.hosts

    - name: Generate the SSH keypair for {{ item.user }}
      openssh_keypair:
        path: "~/.ssh/{{ item.ssh_key_filename }}"
        type: rsa
        size: 4096
        state: present
        # The prod tunnel is shared, so its key is rotated on demand rather than
        # only when it happens to be missing.
        force: "{{ (dbeaver_tunnel_rotate_key | default(false) | bool) and item.name == 'prod' }}"
      delegate_to: localhost
      become_user: "{{ local_user }}"
      loop: "{{ dbeaver_tunnels }}"
      loop_control:
        label: "{{ item.user }}"
      when: inventory_hostname in item.hosts

    - name: Restrict {{ item.user }} to its single permitted destination
      authorized_key:
        user: "{{ item.user }}"
        state: present
        # NOT exclusive by default: a mistyped key filename used to replace the
        # installed key, locking every operator out of the tunnel until it was
        # restored from the vault. Rotation passes
        # -e dbeaver_tunnel_keys_exclusive=true to prune old keys.
        exclusive: "{{ dbeaver_tunnel_keys_exclusive | default(false) | bool }}"
        key: "{{ lookup('file', '~/.ssh/' + item.ssh_key_filename + '.pub') }}"
        key_options: >-
          restrict,port-forwarding,{{
          (item.local_ports | default([item.local_port]))
          | map('regex_replace', '^', 'permitopen="127.0.0.1:')
          | map('regex_replace', '$', '"')
          | join(',') }},command="/bin/false"
      loop: "{{ dbeaver_tunnels }}"
      loop_control:
        label: "{{ item.user }}"
      when: inventory_hostname in item.hosts

    - name: Deploy sshd Match block for {{ item.user }}
      template:
        src: dbeaver_sshd.conf.j2
        dest: "/etc/ssh/sshd_config.d/dbeaver-{{ item.name }}.conf"
        mode: '0644'
        validate: 'sshd -t -f %s'
      vars:
        tunnel: "{{ item }}"
      loop: "{{ dbeaver_tunnels }}"
      loop_control:
        label: "{{ item.name }}"
      when: inventory_hostname in item.hosts
      register: dbeaver_sshd_conf

    - name: Restart sshd when a Match block changed
      systemd:
        name: ssh
        state: restarted
      when: dbeaver_sshd_conf.results | selectattr('changed') | list | length > 0
  when: inventory_hostname in ['servy.lehel.xyz', 'servyy-test.lxd']
  tags:
    - ls.dbeaver
    # Separate tag so a stage-only rollout can leave the prod tunnel account
    # (and the sshd restart that comes with it) alone: --skip-tags ls.dbeaver.tunnel
    - ls.dbeaver.tunnel

- name: Start from an empty stack list for this host
  set_fact:
    dbeaver_stacks: []
  when: inventory_hostname in dbeaver_provision_hosts
  tags:
    - ls.dbeaver
    - ls.dbeaver.provision
    - ls.dbeaver.reap

# Discovery is tagged with the provision and reap tags too: both of them are
# documented as standalone entry points (rotation is `--tags ls.dbeaver.provision`,
# the safety-net check is `--tags ls.dbeaver.reap`), and both need the stack
# list this builds.
- name: Find the LeagueSphere stacks running on this host
  include_tasks: discover.yml
  loop: "{{ dbeaver_ls_vars_files }}"
  loop_control:
    loop_var: dbeaver_vars_file
    label: "{{ dbeaver_vars_file }}"
  when: inventory_hostname in dbeaver_provision_hosts
  tags:
    - ls.dbeaver
    - ls.dbeaver.provision
    - ls.dbeaver.reap

- name: Report which stacks this run covers
  debug:
    msg: >-
      {{ dbeaver_stacks | length }} stack(s) found on {{ inventory_hostname }}:
      {{ dbeaver_stacks | map(attribute='name') | join(', ') | default('none', true) }}
      - provisioning
      {{ 'none (no stack here)' if (dbeaver_stacks | length) == 0
         else ('all of them' if (dbeaver_app_filter_list | length) == 0
               else (dbeaver_stacks | map(attribute='name')
                     | select('in', dbeaver_app_filter_list) | join(', ') | default('none', true))) }}
  when: inventory_hostname in dbeaver_provision_hosts
  tags:
    - ls.dbeaver
    - ls.dbeaver.provision
    - ls.dbeaver.reap

- name: Provision the account the db-access sidecar mints with
  include_tasks: provisioner.yml
  loop: "{{ dbeaver_stacks }}"
  loop_control:
    loop_var: dbeaver_stack
    label: "{{ dbeaver_stack.name }}"
  when:
    - inventory_hostname in dbeaver_provision_hosts
    - dbeaver_stacks | length > 0
    # A filtered run provisions only the named stacks; the reaper below always
    # covers all of them.
    - (dbeaver_app_filter_list | length) == 0 or (dbeaver_stack.name in dbeaver_app_filter_list)
  tags:
    - ls.dbeaver
    - ls.dbeaver.provision

- name: Deploy the safety net that ends access on a clock
  include_tasks: reaper.yml
  when:
    - inventory_hostname in dbeaver_provision_hosts
    - dbeaver_stacks | length > 0
  tags:
    - ls.dbeaver
    - ls.dbeaver.reap

- name: Hand the tunnel keys to Vaultwarden
  include_tasks: vault_push.yml
  tags:
    - ls.dbeaver
    # Same reason as the tunnel block: without it a stage-only run would push
    # prod's freshly generated key while the prod tunnel does not exist yet.
    - ls.dbeaver.tunnel
