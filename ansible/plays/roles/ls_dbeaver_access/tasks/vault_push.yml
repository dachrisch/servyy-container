---
# Vaultwarden is the operator's backup of the tunnel keys - the private key the
# controller generated. The temporary DB credentials are NOT pushed here: the
# person reveals those once in the app, and a second copy in a vault is the
# weaker of the two channels.
- name: Back up {{ item.user }}'s key to Vaultwarden
  include_role:
    name: vaultwarden
    tasks_from: push_items.yml
    apply:
      tags:
        - ls.dbeaver
  vars:
    vaultwarden_item_username: ansible
    vaultwarden_items:
      - name: "{{ item.vault_item_name }}"
        secret: "{{ lookup('file', '~/.ssh/' + item.ssh_key_filename) }}"
        notes: >-
          Private key for {{ item.user }} on {{ inventory_hostname }}.
          authorized_keys restricts it to
          permitopen=127.0.0.1:{{ (item.local_ports | default([item.local_port])) | join(' and 127.0.0.1:') }};
          sshd Match User {{ item.user }} forces AllowTcpForwarding local, so the key
          cannot open a shell or a reverse tunnel. The tunnel carries no identity:
          the database account it reaches is minted per session.
  loop: "{{ dbeaver_tunnels }}"
  loop_control:
    label: "{{ item.user }}"
  when:
    - inventory_hostname in item.hosts
    - vw_master_password | default('') | length > 0
  tags:
    - ls.dbeaver

- name: Back up the leaguesphere deploy key to Vaultwarden
  include_role:
    name: vaultwarden
    tasks_from: push_items.yml
    apply:
      tags:
        - ls.dbeaver
  vars:
    # Rename-aware, exactly like the tunnel keys (defaults/main.yml): the prod
    # host was inventoried as `lehel` in 2026-08 and its deploy key was created
    # and authorised under that name, while `inventory_hostname_short` is
    # `servy` today. `ls.ssh_key_filename` (encrypted vars) still derives from
    # the short name, so it asks for `ls_ssh_key_servy`, which exists nowhere -
    # and a file lookup that misses aborts the whole run. Derive it here instead
    # of editing the encrypted vars file, and never create a symlink/copy on the
    # controller: the next operator's machine must behave the same.
    # The one other consumer is ls_access/tasks/jail_ssh.yaml, which CREATES the
    # keypair from `ls.ssh_key_filename` (short name). It has not run here since
    # the rename, so the old name is still the authorised one; if it ever runs,
    # it would mint a NEW `ls_ssh_key_servy` pair and install its pubkey. That
    # mismatch stays until the encrypted vars file is next edited.
    ls_deploy_key_filename: "{{ 'ls_ssh_key_lehel' if inventory_hostname_short == 'servy' else 'ls_ssh_key_' ~ inventory_hostname_short }}"
    ls_deploy_key_label: "{{ 'lehel' if inventory_hostname_short == 'servy' else inventory_hostname_short }}"
    vaultwarden_item_username: ansible
    vaultwarden_items:
      - name: "leaguesphere deploy key ({{ ls_deploy_key_label }})"
        secret: "{{ lookup('file', '~/.ssh/' + ls_deploy_key_filename) }}"
        notes: >-
          Private key for the jailed leaguesphere deploy account on {{ inventory_hostname }}.
          Used by ls_access/jail_ssh.yaml for app deployment (SSH chroot jail;
          AllowTcpForwarding disabled for this account's group).
  when:
    - inventory_hostname in ['servy.lehel.xyz', 'servyy-test.lxd']
    - vw_master_password | default('') | length > 0
  tags:
    - ls.dbeaver
