---
# Grafana half of monitor_reload. See main.yml for the algorithm.
#
# The fingerprint covers everything Grafana reads at START: the alerting
# provisioning (alert rules, notification policies, contact points) and — since
# 2026-11-20 — the rendered contact points and datasources. Grafana polls
# dashboards and datasources but NOT provisioning/alerting/, and the datasource
# file now carries the cross-host Prometheus credential, so a change to either
# rendered file must be able to bounce this container.

- name: Compute the Grafana startup-config fingerprint
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - >-
        for f in provisioning/alerting/*.yml rendered/contact-points.yml
        rendered/datasources.yml;
        do [ -f "$f" ] && { printf "%s\n" "$f"; cat "$f"; };
        done | sha256sum | cut -d" " -f1
    chdir: "{{ monitor_reload_service_dir }}"
  register: monitor_grafana_fp
  changed_when: false
  check_mode: false

- name: Read when Grafana last started
  ansible.builtin.command:
    argv: [docker, inspect, --format, "{{ '{{.State.StartedAt}}' }}", "{{ monitor_reload_grafana_container }}"]
  register: monitor_grafana_started
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the last applied Grafana state
  ansible.builtin.slurp:
    src: "{{ (monitor_reload_state_dir, 'grafana.state') | path_join }}"
  register: monitor_grafana_state
  failed_when: false
  no_log: true

- name: Split the last applied Grafana state
  ansible.builtin.set_fact:
    monitor_grafana_prev_fp: "{{ (monitor_grafana_state.content | b64decode | trim).split(' ') | first | default('', true) }}"
    monitor_grafana_prev_started: "{{ (monitor_grafana_state.content | b64decode | trim).split(' ') | last | default('', true) }}"
  when: monitor_grafana_state.content is defined
  no_log: true

- name: Restart Grafana because provisioning/alerting/ changed
  ansible.builtin.command:
    argv: [docker, restart, "{{ monitor_reload_grafana_container }}"]
  register: monitor_grafana_restart
  when:
    - not ansible_check_mode
    - monitor_grafana_prev_fp | default('') | length > 0
    - monitor_grafana_prev_fp != (monitor_grafana_fp.stdout | trim)
    - monitor_grafana_prev_started == (monitor_grafana_started.stdout | trim)
  # Non-zero exit aborts the play before the state is recorded (see the
  # Prometheus note in main.yml): a failed restart never marks content as loaded.
  changed_when: true

- name: Read when Grafana started AFTER our own restart
  ansible.builtin.command:
    argv: [docker, inspect, --format, "{{ '{{.State.StartedAt}}' }}", "{{ monitor_reload_grafana_container }}"]
  register: monitor_grafana_started_after
  # Post-restart verification must read the container inline, before later tasks.
  when: monitor_grafana_restart.changed | default(false)  # noqa: no-handler
  changed_when: false
  check_mode: false

- name: Decide which StartedAt to record for Grafana
  ansible.builtin.set_fact:
    monitor_grafana_record_started: >-
      {{ (monitor_grafana_started_after.stdout
          if (monitor_grafana_restart.changed | default(false))
          else monitor_grafana_started.stdout) | trim }}
  no_log: true

- name: Report the pending Grafana restart (check mode)
  ansible.builtin.debug:
    msg: >-
      would restart {{ monitor_reload_grafana_container }}: provisioning/alerting/ changed
      (fingerprint {{ monitor_grafana_prev_fp | default('-') | truncate(12, true, '') }} ->
      {{ monitor_grafana_fp.stdout | trim | truncate(12, true, '') }})
  when:
    - ansible_check_mode
    - monitor_grafana_prev_fp | default('') | length > 0
    - monitor_grafana_prev_fp != (monitor_grafana_fp.stdout | trim)
    - monitor_grafana_prev_started == (monitor_grafana_started.stdout | trim)

- name: Record the applied Grafana state
  ansible.builtin.copy:
    content: "{{ monitor_grafana_fp.stdout | trim }} {{ monitor_grafana_record_started }}\n"
    dest: "{{ (monitor_reload_state_dir, 'grafana.state') | path_join }}"
    mode: '0600'
  no_log: true
