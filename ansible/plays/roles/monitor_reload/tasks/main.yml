---
# Restart the monitor containers when the content they read AT STARTUP changed.
#
# WHY THIS EXISTS — two silent no-ops, both measured on the WP-8R deploy
# (2026-11-18):
#
#   * Prometheus runs without `--web.enable-lifecycle`, so a changed
#     prometheus.yml or rules/*.yml is picked up only when the container
#     restarts. `docker_service` recreates it when its SPEC changes, but a
#     rules-only edit changes no spec — the old rules keep evaluating and nothing
#     says so.
#   * Grafana reads provisioning/alerting/ at START only (dashboards and
#     datasources poll; alerting does not). After an alert-rules edit the deploy
#     left it evaluating 47 of 49 rules until it was restarted by hand.
#
# WHAT IT COMPARES: a sha256 over the bytes each container reads at startup —
# Prometheus: prometheus.yml + rules/*.yml; Grafana: provisioning/alerting/*.yml
# + the rendered contact-points file — stored per container in
# ~/.deploy-state/monitor/ (outside the checkout: a clone cannot reset it and it
# never shows up in `git status`).
#
# NO SPURIOUS RESTARTS: the stored value records the container's StartedAt
# together with the fingerprint.
#   fingerprint changed, StartedAt unchanged -> nothing else restarted it: restart
#   fingerprint changed, StartedAt changed   -> compose recreated it with the new
#                                               content already: just re-record
#   fingerprint unchanged                    -> do nothing
#   no state file (first run / fresh host)   -> compose just deployed it: record,
#                                               do not restart
#
# The two containers are deliberately independent: a rules edit must not bounce
# Grafana, a provisioning edit must not bounce Prometheus.
#
# In `--check` mode the fingerprint and inspect commands still run (read-only),
# the restart is replaced by a message, and the state write reports what it
# would change.

- name: Ensure the monitor reload-state directory exists
  ansible.builtin.file:
    path: "{{ monitor_reload_state_dir }}"
    state: directory
    mode: '0700'

# --- Prometheus: prometheus.yml + rules/*.yml ---------------------------------
- name: Compute the Prometheus startup-config fingerprint
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - 'for f in prometheus.yml rules/*.yml; do [ -f "$f" ] && { printf "%s\n" "$f"; cat "$f"; }; done | sha256sum | cut -d" " -f1'
    chdir: "{{ monitor_reload_service_dir }}"
  register: monitor_prometheus_fp
  changed_when: false
  check_mode: false

- name: Read when Prometheus last started
  ansible.builtin.command:
    argv: [docker, inspect, --format, "{{ '{{.State.StartedAt}}' }}", "{{ monitor_reload_prometheus_container }}"]
  register: monitor_prometheus_started
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the last applied Prometheus state
  ansible.builtin.slurp:
    src: "{{ (monitor_reload_state_dir, 'prometheus.state') | path_join }}"
  register: monitor_prometheus_state
  failed_when: false
  no_log: true

- name: Split the last applied Prometheus state
  ansible.builtin.set_fact:
    monitor_prometheus_prev_fp: "{{ (monitor_prometheus_state.content | b64decode | trim).split(' ') | first | default('', true) }}"
    monitor_prometheus_prev_started: "{{ (monitor_prometheus_state.content | b64decode | trim).split(' ') | last | default('', true) }}"
  when: monitor_prometheus_state.content is defined
  no_log: true

- name: Restart Prometheus because prometheus.yml or rules/ changed
  ansible.builtin.command:
    argv: [docker, restart, "{{ monitor_reload_prometheus_container }}"]
  when:
    - not ansible_check_mode
    - monitor_prometheus_prev_fp | default('') | length > 0
    - monitor_prometheus_prev_fp != (monitor_prometheus_fp.stdout | trim)
    - monitor_prometheus_prev_started == (monitor_prometheus_started.stdout | trim)
  changed_when: true

- name: Report the pending Prometheus restart (check mode)
  ansible.builtin.debug:
    msg: >-
      would restart {{ monitor_reload_prometheus_container }}: prometheus.yml or rules/ changed
      (fingerprint {{ monitor_prometheus_prev_fp | default('-') | truncate(12, true, '') }} ->
      {{ monitor_prometheus_fp.stdout | trim | truncate(12, true, '') }})
  when:
    - ansible_check_mode
    - monitor_prometheus_prev_fp | default('') | length > 0
    - monitor_prometheus_prev_fp != (monitor_prometheus_fp.stdout | trim)
    - monitor_prometheus_prev_started == (monitor_prometheus_started.stdout | trim)

- name: Record the applied Prometheus state
  ansible.builtin.copy:
    content: "{{ monitor_prometheus_fp.stdout | trim }} {{ monitor_prometheus_started.stdout | trim }}\n"
    dest: "{{ (monitor_reload_state_dir, 'prometheus.state') | path_join }}"
    mode: '0600'
  no_log: true

# --- Grafana: provisioning/alerting/ + rendered contact points ---------------
- name: Compute the Grafana startup-config fingerprint
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - 'for f in provisioning/alerting/*.yml rendered/contact-points.yml; do [ -f "$f" ] && { printf "%s\n" "$f"; cat "$f"; }; done | sha256sum | cut -d" " -f1'
    chdir: "{{ monitor_reload_service_dir }}"
  register: monitor_grafana_fp
  changed_when: false
  check_mode: false

- name: Read when Grafana last started
  ansible.builtin.command:
    argv: [docker, inspect, --format, "{{ '{{.State.StartedAt}}' }}", "{{ monitor_reload_grafana_container }}"]
  register: monitor_grafana_started
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the last applied Grafana state
  ansible.builtin.slurp:
    src: "{{ (monitor_reload_state_dir, 'grafana.state') | path_join }}"
  register: monitor_grafana_state
  failed_when: false
  no_log: true

- name: Split the last applied Grafana state
  ansible.builtin.set_fact:
    monitor_grafana_prev_fp: "{{ (monitor_grafana_state.content | b64decode | trim).split(' ') | first | default('', true) }}"
    monitor_grafana_prev_started: "{{ (monitor_grafana_state.content | b64decode | trim).split(' ') | last | default('', true) }}"
  when: monitor_grafana_state.content is defined
  no_log: true

- name: Restart Grafana because provisioning/alerting/ changed
  ansible.builtin.command:
    argv: [docker, restart, "{{ monitor_reload_grafana_container }}"]
  when:
    - not ansible_check_mode
    - monitor_grafana_prev_fp | default('') | length > 0
    - monitor_grafana_prev_fp != (monitor_grafana_fp.stdout | trim)
    - monitor_grafana_prev_started == (monitor_grafana_started.stdout | trim)
  changed_when: true

- name: Report the pending Grafana restart (check mode)
  ansible.builtin.debug:
    msg: >-
      would restart {{ monitor_reload_grafana_container }}: provisioning/alerting/ changed
      (fingerprint {{ monitor_grafana_prev_fp | default('-') | truncate(12, true, '') }} ->
      {{ monitor_grafana_fp.stdout | trim | truncate(12, true, '') }})
  when:
    - ansible_check_mode
    - monitor_grafana_prev_fp | default('') | length > 0
    - monitor_grafana_prev_fp != (monitor_grafana_fp.stdout | trim)
    - monitor_grafana_prev_started == (monitor_grafana_started.stdout | trim)

- name: Record the applied Grafana state
  ansible.builtin.copy:
    content: "{{ monitor_grafana_fp.stdout | trim }} {{ monitor_grafana_started.stdout | trim }}\n"
    dest: "{{ (monitor_reload_state_dir, 'grafana.state') | path_join }}"
    mode: '0600'
  no_log: true
