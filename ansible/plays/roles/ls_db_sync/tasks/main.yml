---
- name: Install mysql-client for DB export
  apt:
    name: default-mysql-client
    state: present
    update_cache: false

- name: Load production variables
  include_vars:
    file: "{{ playbook_dir }}/roles/ls_app/vars/secret_main.yaml"
    name: prod_app

- name: Load staging variables
  include_vars:
    file: "{{ playbook_dir }}/roles/ls_app/vars/secret_stage.yaml"
    name: stage_app

- name: Look for the retired stage mysql container
  # Plan Phase 3 step 8: after the WP-4 cutover the staging database is on the
  # nonprod tier. The failure mode is a RESURRECTED, RUNNING app-owned container
  # (it would silently receive the sync into a database nobody reads). A merely
  # STOPPED container is the cutover's one-week rollback and must NOT trip the
  # guard: docker_container_info reports a stopped container just as happily as a
  # running one, so the decision below tests State.Running, never existence.
  community.docker.docker_container_info:
    name: "{{ ls_db_sync_retired_container }}"
  register: ls_db_sync_retired
  changed_when: false
  failed_when: false

- name: Refuse to sync while {{ ls_db_sync_retired_container }} is RUNNING again
  ansible.builtin.fail:
    msg: >-
      {{ ls_db_sync_retired_container }} is running again. The stage database
      moved to {{ ls_db_sync_target_container }} (WP-4), so a sync into the old
      container would fill a database nobody reads. Stop it again (its mysql-data
      bind mount stays as the rollback) before syncing.
  when:
    - ls_db_sync_retired.container | default(none) is not none
    - ls_db_sync_retired.container.State.Running | default(false) | bool

- name: Set dump file variable
  command: date +%s
  register: dump_timestamp
  changed_when: false

- name: Set dump file path
  set_fact:
    sql_dump_file: "/tmp/leaguesphere_prod_{{ dump_timestamp.stdout }}.sql"

- name: Export prod DB from EXTERNAL host (ignore views)
  when: ls_db_sync_source == 'external'
  shell: |
    IGNORE=$(mysql -h {{ ls_db_sync_external_host }} -u {{ prod_app.app.db_user }} \
      -p'{{ prod_app.app.db_password }}' -N \
      -e "SELECT CONCAT('--ignore-table={{ prod_app.app.db_name }}.', table_name) \
          FROM information_schema.views WHERE table_schema='{{ prod_app.app.db_name }}'")
    mysqldump -h {{ ls_db_sync_external_host }} -u {{ prod_app.app.db_user }} \
      -p'{{ prod_app.app.db_password }}' --single-transaction --quick --lock-tables=false \
      $IGNORE {{ prod_app.app.db_name }} > "{{ sql_dump_file }}"
  changed_when: true

- name: Export prod DB from LOCAL container (ignore views)
  when: ls_db_sync_source == 'local'
  shell: |
    IGNORE=$(docker exec {{ ls_db_sync_local_container }} mariadb -u root \
      -p'{{ prod_app.app.db_root_password }}' -N \
      -e "SELECT CONCAT('--ignore-table={{ prod_app.app.db_name }}.', table_name) \
          FROM information_schema.views WHERE table_schema='{{ prod_app.app.db_name }}'")
    docker exec {{ ls_db_sync_local_container }} mariadb-dump -u root \
      -p'{{ prod_app.app.db_root_password }}' --single-transaction --quick --lock-tables=false \
      $IGNORE {{ prod_app.app.db_name }} > "{{ sql_dump_file }}"
  changed_when: true

- name: Wait for the staging database container health
  shell: >
    docker inspect {{ ls_db_sync_target_container }}
    --format='{{ "{{.State.Health.Status}}" }}'
  register: mysql_health
  until: mysql_health.stdout == 'healthy'
  retries: 30
  delay: 2
  changed_when: false

# WP-4b: the tier's stage app user has ALL on its own database, so it can
# drop/recreate and import it - no root on the tier. MYSQL_PWD goes to the
# container through the docker CLI's environment, never a host argv.
- name: Drop and recreate staging database
  shell: |
    MYSQL_PWD='{{ stage_app.app.db_password }}' docker exec -e MYSQL_PWD {{ ls_db_sync_target_container }} \
      mariadb -h 127.0.0.1 -u {{ stage_app.app.db_user }} \
      -e "DROP DATABASE IF EXISTS {{ stage_app.app.db_name }}; CREATE DATABASE {{ stage_app.app.db_name }} CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
  changed_when: true
  no_log: true

- name: Import dump into staging database
  shell: |
    MYSQL_PWD='{{ stage_app.app.db_password }}' docker exec -i -e MYSQL_PWD {{ ls_db_sync_target_container }} \
      mariadb -h 127.0.0.1 -u {{ stage_app.app.db_user }} {{ stage_app.app.db_name }} < "{{ sql_dump_file }}"
  changed_when: true
  no_log: true

- name: Restart staging app
  shell: docker restart {{ (stage_app.app.name ~ '.staging-app') if stage_app.app.name == 'leaguesphere_stage' else (stage_app.app.name ~ '.app') }}

- name: Cleanup dumps
  file:
    path: "{{ sql_dump_file }}"
    state: absent

# The nightly timer is a PRODUCTION convenience. On a test host it would
# re-clone prod every night and delete the Phase 0c agent-stage harness
# accounts (leaguesphere#2536), so it is never installed there; an existing
# unit from before this guard is stopped and masked below.
- name: Disable and mask a leftover nightly sync timer on test hosts
  when: is_test_host | default(false) | bool
  become_user: "{{ create_user }}"
  block:
    - name: Stop an existing ls-db-sync-nightly.timer
      systemd:
        scope: user
        name: ls-db-sync-nightly.timer
        state: stopped
        enabled: no
      failed_when: false

    - name: Mask ls-db-sync-nightly.timer so a stray start cannot re-enable it
      systemd:
        scope: user
        name: ls-db-sync-nightly.timer
        masked: yes
      failed_when: false

- import_tasks: timer.yml
  when: not (is_test_host | default(false)) | bool
  tags:
    - ls.db.sync.timer
