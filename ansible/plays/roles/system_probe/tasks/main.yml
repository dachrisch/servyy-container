---
- name: Ensure probe scripts directory exists
  file:
    path: "{{ system_probe_scripts_dir }}"
    state: directory
    mode: '0755'
  become_user: "{{ create_user }}"
  tags:
    - system.probe

- name: Deploy log-freshness probe script
  template:
    src: system_log_freshness.sh.j2
    dest: "{{ (system_probe_scripts_dir, 'system-log-freshness.sh') | path_join }}"
    mode: '0750'
  become_user: "{{ create_user }}"
  when: system_probe_push_enabled | default(false) | bool
  tags:
    - system.probe
    - system.probe.log

- name: Deploy log-freshness timer
  import_tasks: oneshot_include.yml
  become_user: "{{ create_user }}"
  vars:
    service:
      name: system-log-freshness
      description: 'Check staleness of maintenance/backup log files'
      schedule: '*-*-* *:0/30:00'
      command: "{{ (system_probe_scripts_dir, 'system-log-freshness.sh') | path_join }}"
  when: system_probe_push_enabled | default(false) | bool
  tags:
    - system.probe
    - system.probe.log

- name: Deploy restic snapshot-age probe script
  template:
    src: restic_snapshot_freshness.sh.j2
    dest: "{{ (system_probe_scripts_dir, 'system-restic-snapshots.sh') | path_join }}"
    mode: '0750'
  become_user: "{{ create_user }}"
  when: system_probe_push_enabled | default(false) | bool
  tags:
    - system.probe
    - system.probe.restic

- name: Deploy restic snapshot-age timer
  import_tasks: oneshot_include.yml
  become_user: "{{ create_user }}"
  vars:
    service:
      name: system-restic-snapshots
      description: 'Check age of newest restic snapshot per repo'
      schedule: '*-*-* *:0/30:00'
      command: "{{ (system_probe_scripts_dir, 'system-restic-snapshots.sh') | path_join }}"
  when: system_probe_push_enabled | default(false) | bool
  tags:
    - system.probe
    - system.probe.restic

- name: Deploy storagebox probe script
  template:
    src: system_storagebox.sh.j2
    dest: "{{ (system_probe_scripts_dir, 'system-storagebox.sh') | path_join }}"
    mode: '0750'
  become_user: "{{ create_user }}"
  when:
    - system_probe_storagebox_mount | length > 0
    - system_probe_push_enabled | default(false) | bool
  tags:
    - system.probe
    - system.probe.storagebox

- name: Deploy storagebox timer
  import_tasks: oneshot_include.yml
  become_user: "{{ create_user }}"
  vars:
    service:
      name: system-storagebox
      description: 'Check storagebox mount presence and disk usage'
      schedule: '*-*-* *:00:00'
      command: "{{ (system_probe_scripts_dir, 'system-storagebox.sh') | path_join }}"
  when:
    - system_probe_storagebox_mount | length > 0
    - system_probe_push_enabled | default(false) | bool
  tags:
    - system.probe
    - system.probe.storagebox

- name: Deploy dump-age probe script
  template:
    src: db_dump_freshness.sh.j2
    dest: "{{ (system_probe_scripts_dir, 'system-db-dump-age.sh') | path_join }}"
    mode: '0750'
  become_user: "{{ create_user }}"
  # Also gated on a non-empty list: a host with no dump-backed tenants pushes
  # nothing but probe_success, which would leave the rule comparing an absent
  # series (noDataState: OK) while looking deployed.
  when:
    - system_probe_dump_checks | default([]) | length > 0
    - system_probe_push_enabled | default(false) | bool
  tags:
    - system.probe
    - system.probe.dump

- name: Deploy dump-age timer
  import_tasks: oneshot_include.yml
  become_user: "{{ create_user }}"
  vars:
    service:
      name: system-db-dump-age
      description: 'Check age of the newest database dump per tenant'
      schedule: '*-*-* *:0/30:00'
      command: "{{ (system_probe_scripts_dir, 'system-db-dump-age.sh') | path_join }}"
  when:
    - system_probe_dump_checks | default([]) | length > 0
    - system_probe_push_enabled | default(false) | bool
  tags:
    - system.probe
    - system.probe.dump

- name: Deploy /tmp usage probe script
  template:
    src: system_tmp.sh.j2
    dest: "{{ (system_probe_scripts_dir, 'system-tmp.sh') | path_join }}"
    mode: '0750'
  become_user: "{{ create_user }}"
  when: system_probe_push_enabled | default(false) | bool
  tags:
    - system.probe
    - system.probe.tmp

- name: Deploy /tmp usage timer
  import_tasks: oneshot_include.yml
  become_user: "{{ create_user }}"
  vars:
    service:
      name: system-tmp
      description: 'Check /tmp usage (tmpfs is not in node_filesystem_*)'
      schedule: '*-*-* *:0/10:00'
      command: "{{ (system_probe_scripts_dir, 'system-tmp.sh') | path_join }}"
  when: system_probe_push_enabled | default(false) | bool
  tags:
    - system.probe
    - system.probe.tmp

- name: Deploy container-health probe script
  template:
    src: system_container_health.sh.j2
    dest: "{{ (system_probe_scripts_dir, 'system-container-health.sh') | path_join }}"
    mode: '0750'
  become_user: "{{ create_user }}"
  when:
    - with_containers | default(false)
    - system_probe_push_enabled | default(false) | bool
  tags:
    - system.probe
    - system.probe.container

- name: Deploy container-health timer
  import_tasks: oneshot_include.yml
  become_user: "{{ create_user }}"
  vars:
    service:
      name: system-container-health
      description: 'Check running state of docker-compose containers'
      schedule: '*-*-* *:0/5:00'
      command: "{{ (system_probe_scripts_dir, 'system-container-health.sh') | path_join }}"
  when:
    - with_containers | default(false)
    - system_probe_push_enabled | default(false) | bool
  tags:
    - system.probe
    - system.probe.container

# Forgejo runner liveness (2026-11-20): online state, last-seen and job counts
# pushed from the Forgejo admin API (SQLite fallback in the script). Every 5
# minutes, matching the container-health cadence.
- name: Deploy Forgejo runner liveness probe script
  template:
    src: forgejo_runners.sh.j2
    dest: "{{ (system_probe_scripts_dir, 'forgejo-runners.sh') | path_join }}"
    mode: '0750'
  become_user: "{{ create_user }}"
  when:
    - services_enabled.ci | default(false) | bool
    - system_probe_push_enabled | default(false) | bool
  tags:
    - system.probe
    - system.probe.forgejo

- name: Deploy Forgejo runner liveness timer
  import_tasks: oneshot_include.yml
  become_user: "{{ create_user }}"
  vars:
    service:
      name: forgejo-runners
      description: 'Check Forgejo runner online state and job counts'
      schedule: '*-*-* *:0/5:00'
      command: "{{ (system_probe_scripts_dir, 'forgejo-runners.sh') | path_join }}"
  when:
    - services_enabled.ci | default(false) | bool
    - system_probe_push_enabled | default(false) | bool
  tags:
    - system.probe
    - system.probe.forgejo

# Clean up probes whose precondition has flipped false since a previous run
# (mirrors the old monit.yml `state: absent` tasks for manual/missing services).
- name: Clean up container-health probe when with_containers is false
  when: not (with_containers | default(false) | bool)
  block:
    - name: Stop container-health timer
      systemd:
        scope: user
        name: system-container-health.timer
        state: stopped
        enabled: no
      become_user: "{{ create_user }}"
      ignore_errors: true
      tags:
        - system.probe
        - system.probe.container
    - name: Remove container-health units and script
      file:
        path: "{{ item }}"
        state: absent
      become_user: "{{ create_user }}"
      loop:
        - "{{ (remote_user_systemd, 'system-container-health.service') | path_join }}"
        - "{{ (remote_user_systemd, 'system-container-health.timer') | path_join }}"
        - "{{ (system_probe_scripts_dir, 'system-container-health.sh') | path_join }}"
      tags:
        - system.probe
        - system.probe.container

- name: Clean up storagebox probe when no mount is configured
  when: system_probe_storagebox_mount | length == 0
  block:
    - name: Stop storagebox timer
      systemd:
        scope: user
        name: system-storagebox.timer
        state: stopped
        enabled: no
      become_user: "{{ create_user }}"
      ignore_errors: true
      tags:
        - system.probe
        - system.probe.storagebox
    - name: Remove storagebox units and script
      file:
        path: "{{ item }}"
        state: absent
      become_user: "{{ create_user }}"
      loop:
        - "{{ (remote_user_systemd, 'system-storagebox.service') | path_join }}"
        - "{{ (remote_user_systemd, 'system-storagebox.timer') | path_join }}"
        - "{{ (system_probe_scripts_dir, 'system-storagebox.sh') | path_join }}"
      tags:
        - system.probe
        - system.probe.storagebox

# Clean up all probes where no Pushgateway sink exists (hosts without the
# monitor service, e.g. codey): their timers would only push into the void.
# Units + scripts are removed so a later monitor enablement redeploys cleanly.
- name: Clean up all probes when Pushgateway sink is absent
  when: not (system_probe_push_enabled | default(false) | bool)
  block:
    - name: Stop probe timers without sink
      systemd:
        scope: user
        name: "{{ item }}.timer"
        state: stopped
        enabled: no
      become_user: "{{ create_user }}"
      # Cleanup, not a state assertion: a host that never ran the probe (e.g. the
      # test host, where the sink is absent by inventory) has no such unit, and
      # "systemd: Could not find the requested service" is success here. Without
      # `failed_when: false` this aborted the whole system play on 2026-11-20 and
      # silently skipped the fail2ban tasks queued behind it.
      failed_when: false
      loop:
        - system-log-freshness
        - system-restic-snapshots
        - system-storagebox
        - system-container-health
        - system-tmp
        - system-db-dump-age
        - forgejo-runners
      tags:
        - system.probe
    - name: Remove probe units and scripts without sink
      file:
        path: "{{ item }}"
        state: absent
      become_user: "{{ create_user }}"
      loop:
        - "{{ (remote_user_systemd, 'system-log-freshness.service') | path_join }}"
        - "{{ (remote_user_systemd, 'system-log-freshness.timer') | path_join }}"
        - "{{ (system_probe_scripts_dir, 'system-log-freshness.sh') | path_join }}"
        - "{{ (remote_user_systemd, 'system-restic-snapshots.service') | path_join }}"
        - "{{ (remote_user_systemd, 'system-restic-snapshots.timer') | path_join }}"
        - "{{ (system_probe_scripts_dir, 'system-restic-snapshots.sh') | path_join }}"
        - "{{ (remote_user_systemd, 'system-storagebox.service') | path_join }}"
        - "{{ (remote_user_systemd, 'system-storagebox.timer') | path_join }}"
        - "{{ (system_probe_scripts_dir, 'system-storagebox.sh') | path_join }}"
        - "{{ (remote_user_systemd, 'system-container-health.service') | path_join }}"
        - "{{ (remote_user_systemd, 'system-container-health.timer') | path_join }}"
        - "{{ (system_probe_scripts_dir, 'system-container-health.sh') | path_join }}"
        # system-tmp was missing here from R12 until R2: such a host kept a timer
        # pushing into a void it no longer had a sink for.
        - "{{ (remote_user_systemd, 'system-tmp.service') | path_join }}"
        - "{{ (remote_user_systemd, 'system-tmp.timer') | path_join }}"
        - "{{ (system_probe_scripts_dir, 'system-tmp.sh') | path_join }}"
        - "{{ (remote_user_systemd, 'system-db-dump-age.service') | path_join }}"
        - "{{ (remote_user_systemd, 'system-db-dump-age.timer') | path_join }}"
        - "{{ (system_probe_scripts_dir, 'system-db-dump-age.sh') | path_join }}"
        - "{{ (remote_user_systemd, 'forgejo-runners.service') | path_join }}"
        - "{{ (remote_user_systemd, 'forgejo-runners.timer') | path_join }}"
        - "{{ (system_probe_scripts_dir, 'forgejo-runners.sh') | path_join }}"
      tags:
        - system.probe

# Clean up the dump-age probe when the inventory declares no dump-backed tenant
# (same shape as the storagebox block above): a timer left behind would keep
# pushing ages for tenants that no longer declare a probe policy, and a stale
# series is exactly what `noDataState: OK` is supposed to prevent.
- name: Clean up the dump-age probe when no tenant declares a probe policy
  when: system_probe_dump_checks | default([]) | length == 0
  block:
    - name: Stop the dump-age timer
      systemd:
        scope: user
        name: system-db-dump-age.timer
        state: stopped
        enabled: no
      become_user: "{{ create_user }}"
      ignore_errors: true
      tags:
        - system.probe
        - system.probe.dump
    - name: Remove the dump-age units and script
      file:
        path: "{{ item }}"
        state: absent
      become_user: "{{ create_user }}"
      loop:
        - "{{ (remote_user_systemd, 'system-db-dump-age.service') | path_join }}"
        - "{{ (remote_user_systemd, 'system-db-dump-age.timer') | path_join }}"
        - "{{ (system_probe_scripts_dir, 'system-db-dump-age.sh') | path_join }}"
      tags:
        - system.probe
        - system.probe.dump

# Clean up the Forgejo runner probe when `ci` is disabled (same shape as the
# storagebox/dump-age blocks): a timer left behind would keep pushing runner
# state for an instance that no longer exists.
- name: Clean up the Forgejo runner probe when ci is disabled
  when: not (services_enabled.ci | default(false) | bool)
  block:
    - name: Stop the forgejo-runners timer
      systemd:
        scope: user
        name: forgejo-runners.timer
        state: stopped
        enabled: no
      become_user: "{{ create_user }}"
      ignore_errors: true
      tags:
        - system.probe
        - system.probe.forgejo
    - name: Remove the forgejo-runners units and script
      file:
        path: "{{ item }}"
        state: absent
      become_user: "{{ create_user }}"
      loop:
        - "{{ (remote_user_systemd, 'forgejo-runners.service') | path_join }}"
        - "{{ (remote_user_systemd, 'forgejo-runners.timer') | path_join }}"
        - "{{ (system_probe_scripts_dir, 'forgejo-runners.sh') | path_join }}"
      tags:
        - system.probe
        - system.probe.forgejo

# --- Moodle task-health probe (2026-11-21) ------------------------------------
# Only where Moodle runs AND the Pushgateway sink exists (servy). Gates on
# `moodle_enabled`, the same switch that adds the moodle log/repo entries above.
- name: Deploy Moodle task-health probe script
  template:
    src: moodle_task_failures.sh.j2
    dest: "{{ (system_probe_scripts_dir, 'moodle-task-failures.sh') | path_join }}"
    mode: '0750'
  become_user: "{{ create_user }}"
  when:
    - moodle_enabled | default(false) | bool
    - system_probe_push_enabled | default(false) | bool
  tags:
    - system.probe
    - system.probe.moodle

# Every 5 minutes: a failed task is cheap to detect (`php admin/cli` boots ~1s,
# three COUNT queries) and Moodle escalates a failing ad-hoc task's retry delay
# with every attempt, so waiting 30 minutes just loses signal.
- name: Deploy Moodle task-health timer
  import_tasks: oneshot_include.yml
  become_user: "{{ create_user }}"
  vars:
    service:
      name: system-moodle-tasks
      description: 'Check Moodle scheduled/adhoc task failures and parked tasks'
      schedule: '*-*-* *:0/5:00'
      command: "{{ (system_probe_scripts_dir, 'moodle-task-failures.sh') | path_join }}"
  when:
    - moodle_enabled | default(false) | bool
    - system_probe_push_enabled | default(false) | bool
  tags:
    - system.probe
    - system.probe.moodle
