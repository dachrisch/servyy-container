---
# Servy shape: monitor sink present, LeagueSphere enabled, storagebox mounted,
# containers enabled. All four probes must deploy with db entries included.
- name: Converge
  hosts: all
  become: true
  vars:
    create_user: testuser
    remote_user_home: /home/testuser
    remote_user_systemd: /home/testuser/.config/systemd/user
    leaguesphere_enabled: true
    skip_storagebox: false
    with_containers: true
    services_enabled:
      monitor: true
    storagebox:
      mount: /mnt/storagebox
    restic:
      logs:
        backup_home: /var/log/restic/backup-home.log
        backup_root: /var/log/restic/backup-root.log
        backup_ls_db: /var/log/restic/backup-ls-db.log
        forget: /var/log/restic/forget.log
        check: /var/log/restic/check.log
    docker:
      services:
        - dir: probetest
        # Monitor carries compose profiles; this host runs only `collect`.
        - dir: monitor
    # Profile-aware probe: the `ui` half (grafana) must not be expected here.
    monitor_profiles: [collect]
    # Backend-only services: watched by the probe, never exposed via DNS/ping.
    docker_backend_services:
      - dir: backendtest
    system_probe_docker_local_dir: "{{ playbook_dir }}/files"
    # WP-8R R2: the dump-age probe is generated from the tenant inventory; the
    # scenario supplies one row in the same shape restic_wiring.yml produces, so
    # the script deploys here and the threshold/severity emission is verifiable.
    system_probe_dump_checks:
      - tenant: moleculetest
        tier: business
        path: /tmp/moleculetest-dumps
        threshold_seconds: 93600
    system_probe_dump_severities:
      - tier: business
        severity: high
  tasks:
    - name: Run system_probe role  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../"
      tags: [system.probe]
