---
# Defaults for the system_probe role.
#
# Migrates Monit's system checks (monit.system.check.j2, monit.storagebox.check.j2,
# monit.container.check.j2, check_docker_compose.sh.j2) to the probe -> Pushgateway ->
# Grafana alert pattern established by ls_maintenance_probe.

# Where probe scripts are deployed (mirrors ls_maintenance_probe / docker_cleanup layout).
system_probe_scripts_dir: "{{ remote_user_home }}/.system-probes"
system_probe_pushgateway_url: "http://localhost:9091"

# --- Log-freshness probe -----------------------------------------------------
# Each entry: name (metric label), path (log file), threshold_seconds.
# Thresholds mirrored from monit.system.check.j2.
# The ls-db log entry is appended below only where the db repo is enabled
# (prod): on other hosts the file does not exist and the probe would report
# the log as missing.
system_probe_log_checks_base:
  - name: docker-cleanup
    path: /var/log/docker-cleanup.log
    threshold_seconds: 691200        # 8 days
  - name: kernel-cleanup
    path: /var/log/kernel-cleanup.log
    threshold_seconds: 2764800       # 32 days
  - name: restic-backup-home
    path: "{{ restic.logs.backup_home }}"
    threshold_seconds: 7200          # 2 hours
  - name: restic-backup-root
    path: "{{ restic.logs.backup_root }}"
    threshold_seconds: 90000         # 25 hours
  - name: restic-forget
    path: "{{ restic.logs.forget }}"
    threshold_seconds: 90000         # 25 hours
  - name: restic-check
    path: "{{ restic.logs.check }}"
    threshold_seconds: 691200        # 8 days

# Scheduler-dead signal for the ls-db backup (a FAILING backup still touches
# its log hourly, so real success is measured by the snapshot-age probe below).
system_probe_log_checks: >-
  {{ system_probe_log_checks_base + ([{'name': 'restic-backup-ls-db',
  'path': restic.logs.backup_ls_db, 'threshold_seconds': 7200}]
  if (restic.db.enabled | default(false)) else []) }}

# --- Restic snapshot-age probe -------------------------------------------------
# Measures the age of the NEWEST snapshot per repo (actual backup success),
# not log mtime (a failing job still touches its log every hour). Thresholds
# are mirrored into the `restic-snapshot-alerts` Grafana group in
# monitor/provisioning/alerting/alert-rules.yml — keep both in sync.
# The db entry only exists where the db repo is enabled (prod).
system_probe_restic_repos_base:
  - name: home
    env_file: "/etc/restic/env.home"
    threshold_seconds: 7200          # 2 hours (hourly backup)
  - name: root
    env_file: "/etc/restic/env.root"
    threshold_seconds: 90000         # 25 hours (daily backup)

system_probe_restic_repos: >-
  {{ system_probe_restic_repos_base + ([{'name': 'db',
  'env_file': '/etc/restic/env.db', 'threshold_seconds': 7200}]
  if (restic.db.enabled | default(false)) else []) }}

# --- Storagebox probe --------------------------------------------------------
system_probe_storagebox_mount: "{{ storagebox.mount | default('') }}"
system_probe_storagebox_threshold_pct: 50

# --- Container-health probe --------------------------------------------------
# List of docker-compose service dirs to check (mirrors monit.yml's container check,
# which skips services tagged `manual`). Container names are resolved at deploy time
# from each service's docker-compose.yml, mirroring check_docker_compose.sh.j2.
system_probe_docker_local_dir: "{{ docker.local_dir }}"
