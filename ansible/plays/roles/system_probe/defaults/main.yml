---
# Defaults for the system_probe role.
#
# Migrates Monit's system checks (monit.system.check.j2, monit.storagebox.check.j2,
# monit.container.check.j2, check_docker_compose.sh.j2) to the probe -> Pushgateway ->
# Grafana alert pattern established by ls_maintenance_probe.
#
# SCOPING (single source of truth lives in plays/vars/default.yml):
# - `leaguesphere_enabled` gates the db/ls-db entries below (db repo exists only
#   where LeagueSphere runs). ALWAYS consume with `| bool` (Jinja string caveat).
# - `moodle_enabled` gates the moodle log/repo entries the same way (moodle-files
#   and moodle-db repos exist only where Moodle runs).
# - `skip_storagebox` (inventory/Test) empties the storagebox mount so the probe
#   is not deployed where no mount is configured.
# - `system_probe_push_enabled` gates ALL probes: they PUT to a local Pushgateway
#   that only exists where the `monitor` service runs (servy). Hosts without it
#   (codey) must not run the timers — pushes would fail into the void.

# Where probe scripts are deployed (mirrors ls_maintenance_probe / docker_cleanup layout).
system_probe_scripts_dir: "{{ remote_user_home }}/.system-probes"
system_probe_pushgateway_url: "http://localhost:9091"

# True only on hosts running the monitor stack's Pushgateway sink present).
# Handles both inventory shapes: bare `monitor: true` and `monitor: {enabled: true}`.
# Also requires the `collect` profile: since 2026-11-20 monitor is enabled on BOTH
# hosts, but only the host that runs the collectors (and therefore the local
# Pushgateway bridge) may run the timers — codey runs the `ui` half and has no
# sink, so a push there would fail into the void.
# NOTE: renders as a string; ALWAYS consume with `| bool`.
system_probe_push_enabled: >-
  {{ ((services_enabled.monitor | default(false) == true)
      or (services_enabled.monitor.enabled | default(false) | bool))
     and ('collect' in (monitor_profiles | default([]))) }}

# --- Log-freshness probe -----------------------------------------------------
# Each entry: name (metric label), path (log file), threshold_seconds.
# Thresholds mirrored from monit.system.check.j2.
# The ls-db log entry exists only where LeagueSphere runs (see header).
system_probe_log_checks_base:
  - name: docker-cleanup
    path: /var/log/docker-cleanup.log
    threshold_seconds: 691200        # 8 days
  - name: kernel-cleanup
    path: /var/log/kernel-cleanup.log
    threshold_seconds: 2764800       # 32 days
  - name: restic-backup-home
    path: "{{ restic.logs.backup_home }}"
    threshold_seconds: 7200          # 2 hours
  - name: restic-backup-root
    path: "{{ restic.logs.backup_root }}"
    threshold_seconds: 90000         # 25 hours
  - name: restic-forget
    path: "{{ restic.logs.forget }}"
    threshold_seconds: 90000         # 25 hours
  - name: restic-check
    path: "{{ restic.logs.check }}"
    threshold_seconds: 691200        # 8 days

# Scheduler-dead signal for the ls-db backup (a FAILING backup still touches
# its log hourly, so real success is measured by the snapshot-age probe below).
# Same for the moodle dump: its log proves the timer is firing, the
# snapshot-age probe below proves the data is actually reaching the repo.
system_probe_log_checks: >-
  {{ system_probe_log_checks_base
     + ([{'name': 'restic-backup-ls-db',
          'path': restic.logs.backup_ls_db, 'threshold_seconds': 7200}]
        if (leaguesphere_enabled | default(false) | bool) else [])
     + ([{'name': 'restic-backup-moodle-files',
          'path': restic.logs.backup_moodle_files, 'threshold_seconds': 90000},
         {'name': 'restic-backup-moodle-db',
          'path': restic.logs.backup_moodle_db, 'threshold_seconds': 7200},
         {'name': 'moodle-dump',
          'path': restic.logs.moodle_dump, 'threshold_seconds': 7200}]
        if (moodle_enabled | default(false) | bool) else []) }}

# --- Restic snapshot-age probe -------------------------------------------------
# Measures the age of the NEWEST snapshot per repo (actual backup success),
# not log mtime (a failing job still touches its log every hour).
#
# THRESHOLDS AND SEVERITY ARE PUSHED BY THE PROBE, not duplicated in
# monitor/provisioning/alerting/alert-rules.yml. The lists below carry them (and
# so do the lists that plays/tasks/restic_wiring.yml generates from
# `backup_targets`), the rendered script publishes them as
# `restic_snapshot_threshold_seconds{repo}` / `restic_snapshot_severity{repo}`,
# and the Grafana rules are comparisons against them. Before WP-8R R2 the alert
# file repeated every repo name and number, so a repo added to this list was
# silently unprotected until someone remembered the second file.
#
# The db entry exists only where LeagueSphere runs, the moodle entries only
# where Moodle runs (see header). `severity` is high | medium (1 | 0 as a metric).
system_probe_restic_repos_base:
  - name: home
    env_file: "/etc/restic/env.home"
    threshold_seconds: 7200          # 2 hours (hourly backup)
    severity: medium
  - name: root
    env_file: "/etc/restic/env.root"
    threshold_seconds: 90000         # 25 hours (daily backup)
    severity: medium

system_probe_restic_repos: >-
  {{ system_probe_restic_repos_base
     + ([{'name': 'db',
          'env_file': '/etc/restic/env.db', 'threshold_seconds': 7200,
          'severity': 'high'}]
        if (leaguesphere_enabled | default(false) | bool) else [])
     + ([{'name': 'moodle-files',
          'env_file': '/etc/restic/env.moodle-files', 'threshold_seconds': 90000,
          'severity': 'medium'},
         {'name': 'moodle-db',
          'env_file': '/etc/restic/env.moodle-db', 'threshold_seconds': 7200,
          'severity': 'high'}]
        if (moodle_enabled | default(false) | bool) else []) }}

# --- Dump-age probe (WP-8R R2) ------------------------------------------------
# Measures how long ago each tenant's DUMP was refreshed (`<dump_dir>/current`
# for the `dbops`/`pg_dump` jobs, `<dump_dir>` for the older flat layouts), which
# the snapshot probe above cannot see: a repo can keep uploading yesterday's file
# and stay green. One entry per tenant row that declares `probe_minutes > 0`; the
# list is generated by plays/tasks/restic_wiring.yml from `db_tenants.yml`.
# Empty fallback (molecule, and any host whose inventory declares no probe).
system_probe_dump_checks: []

# --- Storagebox probe --------------------------------------------------------
# Empty when the host skips the storagebox mount (e.g. skip_storagebox on test),
# so the probe is neither deployed nor expected there.
system_probe_storagebox_mount: "{{ '' if (skip_storagebox | default(false) | bool) else (storagebox.mount | default('')) }}"
system_probe_storagebox_threshold_pct: 50
# /tmp usage warns at 70 % and is critical at 90 %: at 82 % (2026-11-18) the
# tmpfs filled and every restic home snapshot failed with 'disk quota
# exceeded'. Grabbing a warn before the backup window is cheap.
system_probe_tmp_warn_pct: 70
system_probe_tmp_critical_pct: 90

# --- Moodle task-health probe (2026-11-21) ------------------------------------
# Moodle's cron is the only thing that runs its scheduled/adhoc tasks, and the
# image sends its output to /dev/null, so neither the logs nor a container
# healthcheck can see a failing task. The probe reads `mdl_task_log` and the
# retry state in `mdl_task_adhoc`/`mdl_task_scheduled` through `php` inside the
# container (no DB credentials on the host) and pushes:
#
#   moodle_task_failures{window="1h"}      failed runs in the window
#   moodle_task_failure_threshold{window}  how many are tolerated  (below)
#   moodle_task_needs_attention           adhoc parked/retrying + scheduled failing
#   moodle_task_needs_attention_threshold  how many are tolerated  (below)
#   moodle_task_probe_success             0 = could not read Moodle
#
# The window label and its seconds must stay in step.
system_probe_moodle_task_window: "1h"
system_probe_moodle_task_window_seconds: 3600
# 1, i.e. the alert fires at 2+ failures inside the hour: one failed run is what
# a retry is for (`registration_cron_task` fails benignly every few weeks), two
# in an hour is a pattern. A task Moodle has PARKED (attemptsavailable = 0) is
# never tolerated, whatever the recent-failure count says.
system_probe_moodle_task_failed_threshold: 1
system_probe_moodle_needs_attention_threshold: 0
# Container name from the compose project name (`moodle.moodle`); the compose
# guarantees it is globally unique on the shared proxy network.
system_probe_moodle_container: "{{ (project_name | default('moodle')) ~ '.moodle' }}"

# --- Container-health probe --------------------------------------------------
# List of docker-compose service dirs to check (mirrors monit.yml's container check,
# which skips services tagged `manual`). Container names are resolved at deploy time
# from each service's docker-compose.yml, mirroring check_docker_compose.sh.j2.
system_probe_docker_local_dir: "{{ docker.local_dir }}"

# The template also iterates `docker_backend_services` (plays/vars/default.yml):
# backend-only services with no Traefik router / no public name, which must not
# appear in `docker.services` because that list also drives Pi-hole DNS,
# test_host.sh URLs and servyy-test /etc/hosts. Consume it with `| default([])`
# so hosts and molecule scenarios that do not define it keep rendering.

# --- Forgejo runner liveness probe (2026-11-20) -----------------------------
# Runs only where the `ci` service AND the Pushgateway sink both live (servy).
# The instance URL derives from the ci TLS knob; the DB is read read-only
# through a one-shot container only when the admin API path fails.
forgejo_probe_instance: >-
  {{ ('https' if (ci_traefik_tls | default('true')) == 'true' else 'http')
     ~ '://ci.' ~ domain }}
forgejo_probe_ci_data: "{{ (docker.remote_dir, 'ci', 'data') | path_join }}"
