---
# No restic repo, DB image or docker daemon is needed: this role only RENDERS
# the drill/probe scripts and the cadence timers, seeds the pending state and
# syntax-checks the scripts. The tenant roster is the minimal stub the role
# needs (production builds it from plays/vars/db_tenants.yml via
# tasks/restic_wiring.yml); nothing here talks to a live database.
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../../requirements.yml

driver:
  name: docker

platforms:
  - name: instance-restore-drill
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true

provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
    verify: verify.yml
  config_options:
    defaults:
      action_warnings: true
      allow_world_readable_tmpfiles: true
      roles_path: ../../../
  env:
    ANSIBLE_FORCE_COLOR: "1"
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
