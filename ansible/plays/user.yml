---
- name: Setup user specific options
  hosts: all
  strategy: free
  remote_user: "{{ create_user }}"
  become: true
  become_user: "{{ create_user }}"
  vars_files:
    - vars/default.yml
    - vars/restic.yml
    - vars/secrets.yml
  roles:
    - user
  tags:
    - user

- name: Setup OpenCode SSH key
  hosts: all
  remote_user: "{{ create_user }}"
  become: true
  become_user: "{{ create_user }}"
  vars_files:
    - vars/default.yml
    - vars/restic.yml
    - vars/secrets.yml
  roles:
    - opencode
  tags:
    - user
    - user.opencode
    - user.docker.opencode

- name: Deploy Docker services
  hosts: all
  strategy: free
  remote_user: "{{ create_user }}"
  become: true
  become_user: "{{ create_user }}"
  vars_files:
    - vars/default.yml
    - vars/restic.yml
    - vars/secrets.yml
  tags:
    - user
    - user.docker
  pre_tasks:
    - name: Read and encode Enable Banking PEM key
      ansible.builtin.slurp:
        src: "{{ docker.local_dir }}/finance/import/eb.pem"
      register: pem_file
      delegate_to: localhost
      tags:
        - user.docker.env
        - user.docker.env.finance

    - name: Set Enable Banking private key fact
      ansible.builtin.set_fact:
        enable_banking_private_key_b64: >-
          {{ pem_file['content'] | regex_replace('-----BEGIN PRIVATE KEY-----\n|-----END PRIVATE KEY-----\n', '')
          | regex_replace('\n', '') }}
      tags:
        - user.docker.env
        - user.docker.env.finance

    - name: Build enabled services list from services_enabled dict (compatibility layer)
      ansible.builtin.set_fact:
        services: "{{ services_enabled | default({}) | dict2items | selectattr('value', 'equalto', true) | map(attribute='key') | list }}"
      tags:
        - user.docker

    - name: Stop searxng before config update
      community.docker.docker_compose_v2:
        project_src: "{{ docker.remote_dir }}/searxng"
        state: absent
      ignore_errors: true
      tags:
        - user.docker.searxng
        - molecule-notest

    - name: Deploy searxng settings.yml
      ansible.builtin.template:
        src: searxng/settings.yml.j2
        dest: "{{ docker.remote_dir }}/searxng/core-config/settings.yml"
        mode: "0600"
      # core-config is root-owned (searxng runs as root and owns the dir/files);
      # write as root so the deploy doesn't depend on the dir being chowned to the deploy user.
      become: true
      become_user: root
      tags:
        - user.docker.searxng

  roles:
    # Simple services — generic .env only
    - role: docker_service
      vars:
        service_dir: traefik
      when: "'traefik' in (services | default([]))"
      tags: [user.docker, user.docker.traefik]

    - role: docker_service
      vars:
        service_dir: git
      when: "'git' in (services | default([]))"
      tags: [user.docker, user.docker.git]

    - role: docker_service
      vars:
        service_dir: photoprism
      when: "'photoprism' in (services | default([]))"
      tags: [user.docker, user.docker.photoprism]

    - role: docker_service
      vars:
        service_dir: bumbleflies
      when: "'bumbleflies' in (services | default([]))"
      tags: [user.docker, user.docker.bumbleflies]

    - role: docker_service
      vars:
        service_dir: achim-hoefer
      when: "'achim-hoefer' in (services | default([]))"
      tags: [user.docker, user.docker.achim-hoefer]

    - role: docker_service
      vars:
        service_dir: portainer
        env_templates:
          - src: portainer/docker.env.j2
            dest: .env
          # Plaintext admin password (mode 0600) consumed by the container's
          # --admin-password-file flag. Only used on first init.
          - src: portainer/admin-password.txt.j2
            dest: admin-password.txt
      when: "'portainer' in (services | default([]))"
      tags: [user.docker, user.docker.portainer]

    # Portainer Agent (slave) — runs on code.lehel.xyz, reachable by the master
    # only via the IP-restricted Traefik route at a.codey.lehel.xyz.
    - role: docker_service
      vars:
        service_dir: portainer-agent
        service_name: portainer-agent
        # Traefik router name stays unique (portainer-agent), but Compose
        # project/container name is "portainer" so the container is
        # portainer.agent (matching the server's portainer.portainer).
        project_name: portainer
        service_host: "a.codey.lehel.xyz"
        env_templates:
          - src: portainer-agent/docker.env.j2
            dest: .env
      when: "'portainer-agent' in (services | default([]))"
      tags: [user.docker, user.docker.portainer-agent]

    - role: docker_service
      vars:
        service_dir: pass
      when: "'pass' in (services | default([]))"
      tags: [user.docker, user.docker.pass]

    # Services with additional env templates
    - role: docker_service
      vars:
        service_dir: opencode
        env_templates:
          - src: docker.env.j2
            dest: .env
          - src: opencode/.env.j2
            dest: opencode.env
      when: "'opencode' in (services | default([]))"
      tags: [user.docker, user.docker.opencode]

    - role: docker_service
      vars:
        service_dir: opencode-authgate
        env_templates:
          - src: docker.env.j2
            dest: .env
          - src: opencode-authgate/.env.j2
            dest: authgate.env
      when: "'opencode-authgate' in (services | default([]))"
      tags: [user.docker, user.docker.opencode-authgate]

    - role: docker_service
      vars:
        service_dir: energy
        env_templates:
          - src: docker.env.j2
            dest: .env
          - src: energy/.env.j2
            dest: energy.env
      when: "'energy' in (services | default([]))"
      tags: [user.docker, user.docker.energy]

    - role: docker_service
      vars:
        service_dir: groceries
        env_templates:
          - src: docker.env.j2
            dest: .env
          - src: groceries/.env.j2
            dest: groceries.env
      when: "'groceries' in (services | default([]))"
      tags: [user.docker, user.docker.groceries]

    - role: docker_service
      vars:
        service_dir: leagues-finance
        env_templates:
          - src: docker.env.j2
            dest: .env
          - src: leagues-finance/.env.j2
            dest: leagues-finance.env
      when: "'leagues-finance' in (services | default([]))"
      tags: [user.docker, user.docker.leagues-finance]

    - role: docker_service
      vars:
        service_dir: finance
        env_templates:
          - src: finance/docker.env.j2
            dest: .env
          - src: finance/.env.j2
            dest: finance.env
      when: "'finance' in (services | default([]))"
      tags: [user.docker, user.docker.finance]

    # Searxng — custom service_host (search.* not searxng.*)
    - role: docker_service
      vars:
        service_dir: searxng
        service_host: "search.{{ inventory_hostname }}"
        service_name: searxng
        env_templates:
          - src: searxng/.env.j2
            dest: .env
      when: "'searxng' in (services | default([]))"
      tags: [user.docker, user.docker.searxng]

    # Sproutlings — custom service_host (thore.* not sproutlings.*)
    - role: docker_service
      vars:
        service_dir: thore
        service_host: "thore.{{ inventory_hostname }}"
        service_name: thore
        env_templates:
          - src: thore/docker.env.j2
            dest: .env
      when: "'thore' in (services | default([]))"
      tags: [user.docker, user.docker.sproutlings]

    # Job search — three env files
    - role: docker_service
      vars:
        service_dir: job-search
        service_host: "jobs.{{ inventory_hostname }}"
        job_search_jwt_secret: "{{ vault_job_search_jwt_secret }}"
        job_search_searxng_token: "{{ vault_searxng_brave_token }}"
        job_search_searxng_url: https://search.lehel.xyz
        env_templates:
          - src: job-search/.env.j2
            dest: .env
          - src: job-search/api.env.j2
            dest: api.env
          - src: job-search/crawler.env.j2
            dest: crawler.env
      when: "'job-search' in (services | default([]))"
      tags: [user.docker, user.docker.job-search]

    # dontforget — one app container (serves the API and the built
    # frontend from a single image) + an internal-only mongo container
    - role: docker_service
      vars:
        service_dir: dontforget
        env_templates:
          - src: dontforget/.env.j2
            dest: .env
          - src: dontforget/web.env.j2
            dest: web.env
      when: "'dontforget' in (services | default([]))"
      tags: [user.docker, user.docker.dontforget]

    # Platzler-Heid — Festzelt availability dashboard
    - role: docker_service
      vars:
        service_dir: platzler-heid
        env_templates:
          - src: platzler-heid/.env.j2
            dest: .env
      when: "'platzler-heid' in (services | default([]))"
      tags: [user.docker, user.docker.platzler-heid]

    # Manual services — env rendered, compose not started
    - role: docker_service
      vars:
        service_dir: dns
        manual: true
      when: "'dns' in (services | default([]))"
      tags: [user.docker, user.docker.dns]

    - role: docker_service
      vars:
        service_dir: me
        manual: true
      when: "'me' in (services | default([]))"
      tags: [user.docker, user.docker.me]

    - role: docker_service
      vars:
        service_dir: monitor
      when: "'monitor' in (services | default([]))"
      tags: [user.docker, user.docker.monitor]

  post_tasks:
    - name: Wait for leagues-finance mongo to become healthy
      community.docker.docker_container_info:
        name: "leagues-finance.mongo"
      register: lf_mongo_info
      until: >
        lf_mongo_info.container is not none and
        lf_mongo_info.container.State.Health.Status is defined and
        lf_mongo_info.container.State.Health.Status == 'healthy'
      retries: 15
      delay: 2
      failed_when: false
      when: "'leagues-finance' in (services | default([]))"
      tags:
        - user.docker.leagues-finance
        - user.docker

    - name: Remove corrupted mongo volume and restart if unhealthy
      when: >
        'leagues-finance' in (services | default([])) and (
        lf_mongo_info.container is none or
        lf_mongo_info.container.State.Health.Status != 'healthy')
      block:
        - name: Remove leagues-finance containers
          community.docker.docker_compose_v2:
            project_src: "{{ (docker.remote_dir, 'leagues-finance') | path_join }}"
            project_name: leagues-finance
            state: absent

        - name: Remove leagues-finance mongo_data volume
          community.docker.docker_volume:
            name: leagues-finance_mongo_data
            state: absent

        - name: Restart leagues-finance containers
          community.docker.docker_compose_v2:
            project_src: "{{ (docker.remote_dir, 'leagues-finance') | path_join }}"
            project_name: leagues-finance
            state: present

        - name: Wait for mongo after volume reset
          community.docker.docker_container_info:
            name: "leagues-finance.mongo"
          register: lf_mongo_retry
          until: >
            lf_mongo_retry.container is not none and
            lf_mongo_retry.container.State.Health.Status == 'healthy'
          retries: 15
          delay: 2
      tags:
        - user.docker.leagues-finance
        - user.docker

# Configure Portainer RBAC and register the slave agent endpoint via the API.
# Opt-in via portainer_rbac_enabled (does not run on routine deploys). See
# roles/portainer_rbac/tasks/main.yml for usage.
- name: Configure Portainer RBAC
  hosts: lehel.xyz
  remote_user: "{{ create_user }}"
  become: true
  become_user: "{{ create_user }}"
  vars_files:
    - vars/default.yml
    - vars/restic.yml
    - vars/secrets.yml
    - vars/portainer-rbac.yml
  pre_tasks:
    # Rebuild the enabled-services fact so the role's `when` works even when this
    # play is invoked in isolation via --tags user.portainer-rbac (the fact is
    # otherwise only produced by the user.docker pre_task in the deploy play).
    - name: Build enabled services list from services_enabled dict
      ansible.builtin.set_fact:
        services: "{{ services_enabled | default({}) | dict2items | selectattr('value', 'equalto', true) | map(attribute='key') | list }}"
      tags:
        - always
  roles:
    - role: portainer_rbac
      when:
        - portainer_rbac_enabled | default(false)
        - "'portainer' in (services | default([]))"
  tags:
    - user.portainer-rbac
