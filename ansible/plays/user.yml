---
- name: Setup user specific options
  hosts: all
  strategy: free
  remote_user: "{{ create_user }}"
  become: true
  become_user: "{{ create_user }}"
  vars_files:
    - vars/default.yml
    - vars/restic.yml
    - vars/secrets.yml
  roles:
    - user
  tags:
    - user

- name: Setup OpenCode SSH key
  hosts: all
  remote_user: "{{ create_user }}"
  become: true
  become_user: "{{ create_user }}"
  vars_files:
    - vars/default.yml
    - vars/restic.yml
    - vars/secrets.yml
  roles:
    - opencode
  tags:
    - user
    - user.opencode
    - user.docker.opencode

- name: Deploy Docker services
  hosts: all
  strategy: free
  remote_user: "{{ create_user }}"
  become: true
  become_user: "{{ create_user }}"
  vars_files:
    - vars/default.yml
    - vars/restic.yml
    - vars/secrets.yml
  tags:
    - user
    - user.docker
  pre_tasks:
    - name: Read and encode Enable Banking PEM key
      ansible.builtin.slurp:
        src: "{{ docker.local_dir }}/finance/import/eb.pem"
      register: pem_file
      delegate_to: localhost
      tags:
        - user.docker.env
        - user.docker.env.finance

    # slurp returns base64 of the whole file, so decode first, then strip the
    # PEM armor: the importer expects the bare base64 body and adds the
    # -----BEGIN/END PRIVATE KEY----- headers itself.
    - name: Set Enable Banking private key fact
      ansible.builtin.set_fact:
        enable_banking_private_key_b64: >-
          {{ pem_file['content'] | b64decode
          | regex_replace('-----BEGIN PRIVATE KEY-----\n|-----END PRIVATE KEY-----\n', '')
          | regex_replace('\n', '') | trim }}
      tags:
        - user.docker.env
        - user.docker.env.finance

    - name: Build enabled services list from services_enabled dict (compatibility layer)
      ansible.builtin.set_fact:
        services: >-
          {{
            (services_enabled | default({}) | dict2items
              | selectattr('value', 'equalto', true)
              | map(attribute='key') | list)
            + (services_enabled | default({}) | dict2items
              | selectattr('value.enabled', 'defined')
              | selectattr('value.enabled', 'equalto', true)
              | map(attribute='key') | list)
          }}
      tags:
        - user.docker
        - always

    - name: Stop searxng before config update
      community.docker.docker_compose_v2:
        project_src: "{{ docker.remote_dir }}/searxng"
        state: absent
      ignore_errors: true
      tags:
        - user.docker.searxng
        - molecule-notest

    - name: Deploy searxng settings.yml
      ansible.builtin.template:
        src: searxng/settings.yml.j2
        dest: "{{ docker.remote_dir }}/searxng/core-config/settings.yml"
        mode: "0600"
      # core-config is root-owned (searxng runs as root and owns the dir/files);
      # write as root so the deploy doesn't depend on the dir being chowned to the deploy user.
      become: true
      become_user: root
      tags:
        - user.docker.searxng

    # Consolidation (shared project): data containers moved out of the
    # leagues-finance / finance projects. Remove the ORPHANED originals
    # (containers only — volumes and bind mounts stay) BEFORE the shared role
    # starts equivalents on the same data. Without this, two mongos would
    # write to one volume (compose does not remove orphans). No-op once done.
    - name: Remove superseded pre-consolidation data containers
      community.docker.docker_container:
        name: "{{ item }}"
        state: absent
        keep_volumes: true
      loop:
        - leagues-finance.mongo
        - leagues-finance.redis
        - finance.db
      when: "'shared' in (services | default([]))"
      tags:
        - user.docker.shared
        - user.docker

    # One-time MongoDB auth migration for leagues-finance (DBS-1820 fix).
    # Must run before the docker_service role below recreates the container
    # with `command: ["--auth"]` — MONGO_INITDB_ROOT_USERNAME only creates the
    # user on an empty /data/db, so an already-populated volume needs the user
    # created here first, against the still-unauthenticated running container.
    - name: Check current leagues-finance mongo container
      community.docker.docker_container_info:
        name: leagues-finance.mongo
      register: lf_mongo_pre_auth_info
      when: "'leagues-finance' in (services | default([]))"
      tags:
        - user.docker.leagues-finance
        - user.docker

    - name: Ensure leagues-finance MongoDB root user exists before auth is enforced
      community.docker.docker_container_exec:
        container: leagues-finance.mongo
        argv:
          - mongosh
          - admin
          - --quiet
          - --eval
          - >-
            db.createUser({user: "{{ leagues_finance.mongo_root_username }}",
            pwd: "{{ leagues_finance.mongo_root_password }}",
            roles: [{role: "root", db: "admin"}]})
      register: lf_mongo_user_create
      changed_when: lf_mongo_user_create.rc == 0
      failed_when: >-
        lf_mongo_user_create.rc != 0 and
        'already exists' not in (lf_mongo_user_create.stdout | default('') ~ lf_mongo_user_create.stderr | default('')) and
        'requires authentication' not in (lf_mongo_user_create.stdout | default('') ~ lf_mongo_user_create.stderr | default('')) and
        'not authorized' not in (lf_mongo_user_create.stdout | default('') ~ lf_mongo_user_create.stderr | default(''))
      when:
        - "'leagues-finance' in (services | default([]))"
        - lf_mongo_pre_auth_info.container is defined
        - lf_mongo_pre_auth_info.container is not none
      tags:
        - user.docker.leagues-finance
        - user.docker

    # Same one-time MongoDB auth migration for dontforget (DBS-1820 fix).
    - name: Check current dontforget mongo container
      community.docker.docker_container_info:
        name: dontforget.mongo
      register: df_mongo_pre_auth_info
      when: "'dontforget' in (services | default([]))"
      tags:
        - user.docker.dontforget
        - user.docker

    - name: Ensure dontforget MongoDB root user exists before auth is enforced
      community.docker.docker_container_exec:
        container: dontforget.mongo
        argv:
          - mongosh
          - admin
          - --quiet
          - --eval
          - >-
            db.createUser({user: "{{ vault_dontforget_mongo_root_username }}",
            pwd: "{{ vault_dontforget_mongo_root_password }}",
            roles: [{role: "root", db: "admin"}]})
      register: df_mongo_user_create
      changed_when: df_mongo_user_create.rc == 0
      failed_when: >-
        df_mongo_user_create.rc != 0 and
        'already exists' not in (df_mongo_user_create.stdout | default('') ~ df_mongo_user_create.stderr | default('')) and
        'requires authentication' not in (df_mongo_user_create.stdout | default('') ~ df_mongo_user_create.stderr | default('')) and
        'not authorized' not in (df_mongo_user_create.stdout | default('') ~ df_mongo_user_create.stderr | default(''))
      when:
        - "'dontforget' in (services | default([]))"
        - df_mongo_pre_auth_info.container is defined
        - df_mongo_pre_auth_info.container is not none
      tags:
        - user.docker.dontforget
        - user.docker

    # Same one-time MongoDB auth migration for job-search (DBS-1820 fix).
    - name: Check current job-search mongo container
      community.docker.docker_container_info:
        name: job-search-mongodb
      register: js_mongo_pre_auth_info
      when: "'job-search' in (services | default([]))"
      tags:
        - user.docker.job-search
        - user.docker

    - name: Ensure job-search MongoDB root user exists before auth is enforced
      community.docker.docker_container_exec:
        container: job-search-mongodb
        argv:
          - mongosh
          - admin
          - --quiet
          - --eval
          - >-
            db.createUser({user: "{{ vault_job_search_mongo_root_username }}",
            pwd: "{{ vault_job_search_mongo_root_password }}",
            roles: [{role: "root", db: "admin"}]})
      register: js_mongo_user_create
      changed_when: js_mongo_user_create.rc == 0
      failed_when: >-
        js_mongo_user_create.rc != 0 and
        'already exists' not in (js_mongo_user_create.stdout | default('') ~ js_mongo_user_create.stderr | default('')) and
        'requires authentication' not in (js_mongo_user_create.stdout | default('') ~ js_mongo_user_create.stderr | default('')) and
        'not authorized' not in (js_mongo_user_create.stdout | default('') ~ js_mongo_user_create.stderr | default(''))
      when:
        - "'job-search' in (services | default([]))"
        - js_mongo_pre_auth_info.container is defined
        - js_mongo_pre_auth_info.container is not none
      tags:
        - user.docker.job-search
        - user.docker

    # One-time MongoDB 7 -> 8 upgrade prep (shares the mongo:8 image with dontforget).
    # Runs only while the container is still on a mongo:7 image: assert FCV is 7.0
    # (mongod 8 refuses to start on older FCV data) and dump into <service>/.backup/
    # (gitignored, covered by the restic home backup) before compose swaps the image.
    # The FCV bump to 8.0 happens in post_tasks once mongo:8 is healthy.
    - name: Timestamp for mongo 7 -> 8 pre-upgrade dumps
      ansible.builtin.set_fact:
        mongo8_dump_ts: "{{ now(utc=true).strftime('%Y%m%dT%H%M%SZ') }}"
      tags:
        - user.docker.leagues-finance
        - user.docker.job-search
        - user.docker

    - name: Detect leagues-finance mongo still on mongo 7
      ansible.builtin.set_fact:
        lf_mongo_upgrading: "{{ lf_mongo_pre_auth_info.container.Config.Image is match('^(docker.io/)?(library/)?mongo:7') }}"
      when:
        - "'leagues-finance' in (services | default([]))"
        - lf_mongo_pre_auth_info.container is defined
        - lf_mongo_pre_auth_info.container is not none
      tags:
        - user.docker.leagues-finance
        - user.docker

    - name: Read leagues-finance mongo featureCompatibilityVersion
      community.docker.docker_container_exec:
        container: leagues-finance.mongo
        argv:
          - mongosh
          - admin
          - --quiet
          - -u
          - "{{ leagues_finance.mongo_root_username }}"
          - -p
          - "{{ leagues_finance.mongo_root_password }}"
          - --eval
          - 'db.adminCommand({getParameter: 1, featureCompatibilityVersion: 1}).featureCompatibilityVersion.version'
      register: lf_mongo_pre_fcv
      changed_when: false
      when: lf_mongo_upgrading | default(false)
      tags:
        - user.docker.leagues-finance
        - user.docker

    - name: Assert leagues-finance mongo FCV is 7.0 before switching to mongo 8
      ansible.builtin.assert:
        that: lf_mongo_pre_fcv.stdout | trim == '7.0'
        fail_msg: >-
          leagues-finance.mongo FCV is '{{ lf_mongo_pre_fcv.stdout | trim }}', mongo 8 needs 7.0.
          Run setFeatureCompatibilityVersion "7.0" first.
      when: lf_mongo_upgrading | default(false)
      tags:
        - user.docker.leagues-finance
        - user.docker

    - name: Dump leagues-finance mongo before 7 -> 8 upgrade
      community.docker.docker_container_exec:
        container: leagues-finance.mongo
        argv:
          - mongodump
          - -u
          - "{{ leagues_finance.mongo_root_username }}"
          - -p
          - "{{ leagues_finance.mongo_root_password }}"
          - --authenticationDatabase
          - admin
          - --gzip
          - --archive=/tmp/pre-mongo8.archive.gz
      when: lf_mongo_upgrading | default(false)
      tags:
        - user.docker.leagues-finance
        - user.docker

    - name: Copy leagues-finance pre-upgrade dump to host
      ansible.builtin.shell: >-
        mkdir -p {{ (docker.remote_dir, 'leagues-finance', '.backup') | path_join | quote }} &&
        docker cp leagues-finance.mongo:/tmp/pre-mongo8.archive.gz
        {{ (docker.remote_dir, 'leagues-finance', '.backup', 'mongo7-' ~ mongo8_dump_ts ~ '.archive.gz') | path_join | quote }}
      when: lf_mongo_upgrading | default(false)
      tags:
        - user.docker.leagues-finance
        - user.docker

    - name: Detect job-search mongo still on mongo 7
      ansible.builtin.set_fact:
        js_mongo_upgrading: "{{ js_mongo_pre_auth_info.container.Config.Image is match('^(docker.io/)?(library/)?mongo:7') }}"
      when:
        - "'job-search' in (services | default([]))"
        - js_mongo_pre_auth_info.container is defined
        - js_mongo_pre_auth_info.container is not none
      tags:
        - user.docker.job-search
        - user.docker

    - name: Read job-search mongo featureCompatibilityVersion
      community.docker.docker_container_exec:
        container: job-search-mongodb
        argv:
          - mongosh
          - admin
          - --quiet
          - -u
          - "{{ vault_job_search_mongo_root_username }}"
          - -p
          - "{{ vault_job_search_mongo_root_password }}"
          - --eval
          - 'db.adminCommand({getParameter: 1, featureCompatibilityVersion: 1}).featureCompatibilityVersion.version'
      register: js_mongo_pre_fcv
      changed_when: false
      when: js_mongo_upgrading | default(false)
      tags:
        - user.docker.job-search
        - user.docker

    - name: Assert job-search mongo FCV is 7.0 before switching to mongo 8
      ansible.builtin.assert:
        that: js_mongo_pre_fcv.stdout | trim == '7.0'
        fail_msg: >-
          job-search-mongodb FCV is '{{ js_mongo_pre_fcv.stdout | trim }}', mongo 8 needs 7.0.
          Run setFeatureCompatibilityVersion "7.0" first.
      when: js_mongo_upgrading | default(false)
      tags:
        - user.docker.job-search
        - user.docker

    - name: Dump job-search mongo before 7 -> 8 upgrade
      community.docker.docker_container_exec:
        container: job-search-mongodb
        argv:
          - mongodump
          - -u
          - "{{ vault_job_search_mongo_root_username }}"
          - -p
          - "{{ vault_job_search_mongo_root_password }}"
          - --authenticationDatabase
          - admin
          - --gzip
          - --archive=/tmp/pre-mongo8.archive.gz
      when: js_mongo_upgrading | default(false)
      tags:
        - user.docker.job-search
        - user.docker

    - name: Copy job-search pre-upgrade dump to host
      ansible.builtin.shell: >-
        mkdir -p {{ (docker.remote_dir, 'job-search', '.backup') | path_join | quote }} &&
        docker cp job-search-mongodb:/tmp/pre-mongo8.archive.gz
        {{ (docker.remote_dir, 'job-search', '.backup', 'mongo7-' ~ mongo8_dump_ts ~ '.archive.gz') | path_join | quote }}
      when: js_mongo_upgrading | default(false)
      tags:
        - user.docker.job-search
        - user.docker

  roles:
    # Simple services — generic .env only
    - role: docker_service
      vars:
        service_dir: traefik
      when: "'traefik' in (services | default([]))"
      tags: [user.docker, user.docker.traefik]

    - role: docker_service
      vars:
        service_dir: git
      when: "'git' in (services | default([]))"
      tags: [user.docker, user.docker.git]

    - role: docker_service
      vars:
        service_dir: photoprism
      when: "'photoprism' in (services | default([]))"
      tags: [user.docker, user.docker.photoprism]

    - role: docker_service
      vars:
        service_dir: bumbleflies
        env_templates:
          - src: docker.env.j2
            dest: .env
          - src: bumbleflies/bnb.env.j2
            dest: bnb.env
          - src: bumbleflies/live.env.j2
            dest: live.env
      when: "'bumbleflies' in (services | default([]))"
      tags: [user.docker, user.docker.bumbleflies]

    - role: docker_service
      vars:
        service_dir: achim-hoefer
      when: "'achim-hoefer' in (services | default([]))"
      tags: [user.docker, user.docker.achim-hoefer]

    - role: docker_service
      vars:
        service_dir: portainer
        env_templates:
          - src: portainer/docker.env.j2
            dest: .env
          # Plaintext admin password (mode 0600) consumed by the container's
          # --admin-password-file flag. Only used on first init.
          - src: portainer/admin-password.txt.j2
            dest: admin-password.txt
      when: "'portainer' in (services | default([]))"
      tags: [user.docker, user.docker.portainer]

    # Portainer Agent (slave) — runs on code.lehel.xyz, reachable by the master
    # only via the IP-restricted Traefik route at a.codey.lehel.xyz.
    - role: docker_service
      vars:
        service_dir: portainer-agent
        service_name: portainer-agent
        # Traefik router name stays unique (portainer-agent), but Compose
        # project/container name is "portainer" so the container is
        # portainer.agent (matching the server's portainer.portainer).
        project_name: portainer
        service_host: "a.codey.lehel.xyz"
        env_templates:
          - src: portainer-agent/docker.env.j2
            dest: .env
      when: "'portainer-agent' in (services | default([]))"
      tags: [user.docker, user.docker.portainer-agent]

    # Computes vaultwarden_admin_token_hash (consumed by pass/docker.env.j2 below) and
    # mirrors the plaintext seed into Vaultwarden itself as a convenience copy.
    - role: vaultwarden_admin_token
      when: "'pass' in (services | default([]))"
      tags: [user.docker, user.docker.pass]

    - role: docker_service
      vars:
        service_dir: pass
        env_templates:
          - src: pass/docker.env.j2
            dest: .env
      when: "'pass' in (services | default([]))"
      tags: [user.docker, user.docker.pass]

    # Services with additional env templates
    - role: docker_service
      vars:
        service_dir: opencode
        # services_enabled.opencode is a dict here (dns_short_name/dns_expose for
        # the public code.lehel.xyz hostname), not a bare `true` like most
        # services. docker.env.j2's SERVICE_ROOT_HOST (used by the
        # "${SERVICE_NAME}_root" traefik router in docker-compose.yml) is driven
        # by the separate `service_root_host` var, not by SERVICE_HOST/
        # dns_short_name/dns_expose — set it directly here so it resolves to
        # code.lehel.xyz instead of falling back to the bare `domain` default.
        # Without this, the "Ensure SERVICE_ROOT_HOST is set" task in the
        # opencode role sets it correctly first, but this role's template task
        # (which fully overwrites .env) clobbers it back to the wrong default.
        service_root_host: >-
          {{ (services_enabled.opencode.dns_short_name ~ '.' ~ domain)
             if (services_enabled.opencode is defined and services_enabled.opencode is mapping
                 and (services_enabled.opencode.dns_expose | default(false))
                 and (services_enabled.opencode.dns_short_name | default('')))
             else domain }}
        env_templates:
          - src: docker.env.j2
            dest: .env
          - src: opencode/.env.j2
            dest: opencode.env
        # Owns the codey_dev_checkouts volume (see
        # opencode/docker-compose.yml); ensure it exists even when only
        # claude-hub is targeted via --tags.
        ensure_volumes:
          - codey_dev_checkouts
      when: "'opencode' in (services | default([]))"
      tags: [user.docker, user.docker.opencode]

    - role: docker_service
      vars:
        service_dir: opencode-authgate
        env_templates:
          - src: docker.env.j2
            dest: .env
          - src: opencode-authgate/.env.j2
            dest: authgate.env
      when: "'opencode-authgate' in (services | default([]))"
      tags: [user.docker, user.docker.opencode-authgate]

    - role: docker_service
      vars:
        service_dir: energy
        env_templates:
          - src: docker.env.j2
            dest: .env
          - src: energy/.env.j2
            dest: energy.env
      when: "'energy' in (services | default([]))"
      tags: [user.docker, user.docker.energy]

    - role: docker_service
      vars:
        service_dir: groceries
        env_templates:
          - src: docker.env.j2
            dest: .env
          - src: groceries/.env.j2
            dest: groceries.env
      when: "'groceries' in (services | default([]))"
      tags: [user.docker, user.docker.groceries]

    - role: docker_service
      vars:
        service_dir: shared
        env_templates:
          - src: docker.env.j2
            dest: .env
          - src: shared/.env.j2
            dest: shared.env
        compose_services: "{{ shared_services | default([]) }}"
      when: "'shared' in (services | default([]))"
      tags: [user.docker, user.docker.shared]

    - role: docker_service
      vars:
        service_dir: leagues-finance
        env_templates:
          - src: docker.env.j2
            dest: .env
          - src: leagues-finance/.env.j2
            dest: leagues-finance.env
      when: "'leagues-finance' in (services | default([]))"
      tags: [user.docker, user.docker.leagues-finance]

    - role: docker_service
      vars:
        service_dir: finance
        env_templates:
          - src: finance/docker.env.j2
            dest: .env
          - src: finance/.env.j2
            dest: finance.env
          - src: finance/queen.env.j2
            dest: queen.env
        compose_services: "{{ finance_services | default([]) }}"
      when: "'finance' in (services | default([]))"
      tags: [user.docker, user.docker.finance]

    # Searxng — custom service_host (search.* not searxng.*)
    - role: docker_service
      vars:
        service_dir: searxng
        service_host: "search.{{ domain }}"
        service_name: searxng
        env_templates:
          - src: searxng/.env.j2
            dest: .env
      when: "'searxng' in (services | default([]))"
      tags: [user.docker, user.docker.searxng]

    # Sproutlings — custom service_host (thore.* not sproutlings.*)
    - role: docker_service
      vars:
        service_dir: thore
        service_host: "thore.{{ domain }}"
        service_name: thore
        env_templates:
          - src: thore/docker.env.j2
            dest: .env
      when: "'thore' in (services | default([]))"
      tags: [user.docker, user.docker.sproutlings]

    # Job search — three env files
    - role: docker_service
      vars:
        service_dir: job-search
        service_host: "jobs.{{ domain }}"
        job_search_jwt_secret: "{{ vault_job_search_jwt_secret }}"
        job_search_searxng_token: "{{ vault_searxng_brave_token }}"
        job_search_searxng_url: https://search.lehel.xyz
        env_templates:
          - src: job-search/.env.j2
            dest: .env
          - src: job-search/api.env.j2
            dest: api.env
          - src: job-search/crawler.env.j2
            dest: crawler.env
      when: "'job-search' in (services | default([]))"
      tags: [user.docker, user.docker.job-search]

    # dontforget — one app container (serves the API and the built
    # frontend from a single image) + an internal-only mongo container
    - role: docker_service
      vars:
        service_dir: dontforget
        env_templates:
          - src: dontforget/.env.j2
            dest: .env
          - src: dontforget/web.env.j2
            dest: web.env
      when: "'dontforget' in (services | default([]))"
      tags: [user.docker, user.docker.dontforget]

    # Platzler-Heid — Festzelt availability dashboard
    - role: docker_service
      vars:
        service_dir: platzler-heid
        env_templates:
          - src: platzler-heid/.env.j2
            dest: .env
      when: "'platzler-heid' in (services | default([]))"
      tags: [user.docker, user.docker.platzler-heid]

    # DevHub — personal dev command board (Next.js + SQLite). Runs on codey so it
    # can dispatch opencode on code.lehel.xyz. Public DNS h.code.lehel.xyz must point
    # to codey (217.217.227.124) via Porkbun before the first deploy.
    - role: docker_service
      vars:
        service_dir: devhub
        service_name: devhub
        service_host: "h.code.lehel.xyz"
        env_templates:
          - src: devhub/.env.j2
            dest: .env
          - src: devhub/web.env.j2
            dest: web.env
      when: "'devhub' in (services | default([]))"
      tags: [user.docker, user.docker.devhub]

    - role: docker_service
      vars:
        service_dir: claude-hub
        service_name: claude-hub
        env_templates:
          - src: docker.env.j2
            dest: .env
          - src: claude-hub/.env.j2
            dest: claude-hub.env
        # References codey_dev_checkouts as external (owned by
        # opencode). Ensure it here so a claude-hub-only --tags run works.
        ensure_volumes:
          - codey_dev_checkouts
      when: "'claude-hub' in (services | default([]))"
      tags: [user.docker, user.docker.claude-hub]

    # Manual services — env rendered, compose not started
    - role: docker_service
      vars:
        service_dir: dns
        manual: true
      when: "'dns' in (services | default([]))"
      tags: [user.docker, user.docker.dns]

    - role: docker_service
      vars:
        service_dir: me
        manual: true
      when: "'me' in (services | default([]))"
      tags: [user.docker, user.docker.me]

    - role: docker_service
      vars:
        service_dir: monitor
      when: "'monitor' in (services | default([]))"
      tags: [user.docker, user.docker.monitor]

  post_tasks:
    - name: Wait for shared mongo to become healthy
      community.docker.docker_container_info:
        name: "shared.mongo"
      register: lf_mongo_info
      until: >
        lf_mongo_info.container is not none and
        lf_mongo_info.container.State.Health.Status is defined and
        lf_mongo_info.container.State.Health.Status == 'healthy'
      retries: 15
      delay: 2
      failed_when: false
      when: "'shared' in (services | default([]))"
      tags:
        - user.docker.leagues-finance
        - user.docker.shared
        - user.docker

    # Never wipe the volume during an upgrade: mongo 8 may need longer to
    # come up on existing data, and an unhealthy container here means the upgrade
    # failed, not that the volume is corrupt. The dedicated wait below fails loudly.
    - name: Remove corrupted mongo volume and restart if unhealthy
      when: >
        'shared' in (services | default([])) and
        not (lf_mongo_upgrading | default(false)) and (
        lf_mongo_info.container is none or
        lf_mongo_info.container.State.Health.Status != 'healthy')
      block:
        - name: Remove shared containers
          community.docker.docker_compose_v2:
            project_src: "{{ (docker.remote_dir, 'shared') | path_join }}"
            project_name: shared
            state: absent

        - name: Remove leagues-finance mongo_data volume
          community.docker.docker_volume:
            name: leagues-finance_mongo_data
            state: absent

        - name: Restart shared containers
          community.docker.docker_compose_v2:
            project_src: "{{ (docker.remote_dir, 'shared') | path_join }}"
            project_name: shared
            state: present

        - name: Wait for mongo after volume reset
          community.docker.docker_container_info:
            name: "shared.mongo"
          register: lf_mongo_retry
          until: >
            lf_mongo_retry.container is not none and
            lf_mongo_retry.container.State.Health.Status == 'healthy'
          retries: 15
          delay: 2
      tags:
        - user.docker.leagues-finance
        - user.docker.shared
        - user.docker

    - name: Wait for leagues-finance mongo after 7 -> 8 upgrade
      community.docker.docker_container_info:
        name: "leagues-finance.mongo"
      register: lf_mongo_upgraded_info
      until: >
        lf_mongo_upgraded_info.container is not none and
        lf_mongo_upgraded_info.container.State.Health.Status is defined and
        lf_mongo_upgraded_info.container.State.Health.Status == 'healthy'
      retries: 30
      delay: 5
      when: lf_mongo_upgrading | default(false)
      tags:
        - user.docker.leagues-finance
        - user.docker

    # Idempotent: also finishes an upgrade whose FCV bump was interrupted on a previous run.
    # Skipped once consolidated: the legacy leagues-finance.mongo container is gone.
    - name: Read leagues-finance mongo featureCompatibilityVersion
      community.docker.docker_container_exec:
        container: leagues-finance.mongo
        argv:
          - mongosh
          - admin
          - --quiet
          - -u
          - "{{ leagues_finance.mongo_root_username }}"
          - -p
          - "{{ leagues_finance.mongo_root_password }}"
          - --eval
          - 'db.adminCommand({getParameter: 1, featureCompatibilityVersion: 1}).featureCompatibilityVersion.version'
      register: lf_mongo_post_fcv
      changed_when: false
      when:
        - "'leagues-finance' in (services | default([]))"
        # Legacy 7->8 upgrade path only (false once consolidated).
        - lf_mongo_upgrading | default(false)
      tags:
        - user.docker.leagues-finance
        - user.docker

    - name: Detect leagues-finance mongo on mongo 8 image
      ansible.builtin.set_fact:
        lf_mongo_is_v8: "{{ (lf_mongo_container.Config.Image | default('')) is match('^(docker.io/)?(library/)?mongo:8') }}"
      vars:
        lf_mongo_container: >-
          {{ ((lf_mongo_upgraded_info | default({})).container | default(none, true))
          or ((lf_mongo_info | default({})).container | default(none, true)) or {} }}
      when: "'leagues-finance' in (services | default([]))"
      tags:
        - user.docker.leagues-finance
        - user.docker

    - name: Set leagues-finance mongo featureCompatibilityVersion to 8.0
      community.docker.docker_container_exec:
        container: leagues-finance.mongo
        argv:
          - mongosh
          - admin
          - --quiet
          - -u
          - "{{ leagues_finance.mongo_root_username }}"
          - -p
          - "{{ leagues_finance.mongo_root_password }}"
          - --eval
          - 'db.adminCommand({setFeatureCompatibilityVersion: "8.0", confirm: true})'
      when:
        - "'leagues-finance' in (services | default([]))"
        - lf_mongo_post_fcv.stdout | default('') | trim == '7.0'
        - lf_mongo_is_v8 | default(false)
      tags:
        - user.docker.leagues-finance
        - user.docker

    - name: Wait for job-search mongo to become healthy
      community.docker.docker_container_info:
        name: "job-search-mongodb"
      register: js_mongo_info
      until: >
        js_mongo_info.container is not none and
        js_mongo_info.container.State.Health.Status is defined and
        js_mongo_info.container.State.Health.Status == 'healthy'
      retries: 30
      delay: 5
      when: "'job-search' in (services | default([]))"
      tags:
        - user.docker.job-search
        - user.docker

    - name: Read job-search mongo featureCompatibilityVersion
      community.docker.docker_container_exec:
        container: job-search-mongodb
        argv:
          - mongosh
          - admin
          - --quiet
          - -u
          - "{{ vault_job_search_mongo_root_username }}"
          - -p
          - "{{ vault_job_search_mongo_root_password }}"
          - --eval
          - 'db.adminCommand({getParameter: 1, featureCompatibilityVersion: 1}).featureCompatibilityVersion.version'
      register: js_mongo_post_fcv
      changed_when: false
      when: "'job-search' in (services | default([]))"
      tags:
        - user.docker.job-search
        - user.docker

    - name: Detect job-search mongo on mongo 8 image
      ansible.builtin.set_fact:
        js_mongo_is_v8: "{{ (js_mongo_container.Config.Image | default('')) is match('^(docker.io/)?(library/)?mongo:8') }}"
      vars:
        js_mongo_container: "{{ ((js_mongo_info | default({})).container | default(none, true)) or {} }}"
      when: "'job-search' in (services | default([]))"
      tags:
        - user.docker.job-search
        - user.docker

    - name: Set job-search mongo featureCompatibilityVersion to 8.0
      community.docker.docker_container_exec:
        container: job-search-mongodb
        argv:
          - mongosh
          - admin
          - --quiet
          - -u
          - "{{ vault_job_search_mongo_root_username }}"
          - -p
          - "{{ vault_job_search_mongo_root_password }}"
          - --eval
          - 'db.adminCommand({setFeatureCompatibilityVersion: "8.0", confirm: true})'
      when:
        - "'job-search' in (services | default([]))"
        - js_mongo_post_fcv.stdout | default('') | trim == '7.0'
        - js_mongo_is_v8 | default(false)
      tags:
        - user.docker.job-search
        - user.docker

    # Opt-in (-e prune_legacy_datastore_images=true) once every service has moved to
    # valkey:9-alpine / mongo:8. Docker refuses to remove an image still used by a container.
    - name: Remove legacy datastore images superseded by valkey:9-alpine and mongo:8
      community.docker.docker_image:
        name: "{{ item }}"
        state: absent
      loop:
        - redis:7-alpine
        - mongo:7
        - mongo:7.0
      when: prune_legacy_datastore_images | default(false)
      tags:
        - user.docker

# Configure Portainer RBAC and register the slave agent endpoint via the API.
# Opt-in via portainer_rbac_enabled (does not run on routine deploys). See
# roles/portainer_rbac/tasks/main.yml for usage.
- name: Configure Portainer RBAC
  hosts: servy.lehel.xyz
  remote_user: "{{ create_user }}"
  become: true
  become_user: "{{ create_user }}"
  vars_files:
    - vars/default.yml
    - vars/restic.yml
    - vars/secrets.yml
    - vars/portainer-rbac.yml
  pre_tasks:
    # Rebuild the enabled-services fact so the role's `when` works even when this
    # play is invoked in isolation via --tags user.portainer-rbac (the fact is
    # otherwise only produced by the user.docker pre_task in the deploy play).
    - name: Build enabled services list from services_enabled dict
      ansible.builtin.set_fact:
        services: "{{ services_enabled | default({}) | dict2items | selectattr('value', 'equalto', true) | map(attribute='key') | list }}"
      tags:
        - always
  roles:
    - role: portainer_rbac
      when:
        - portainer_rbac_enabled | default(false)
        - "'portainer' in (services | default([]))"
  tags:
    - user.portainer-rbac
