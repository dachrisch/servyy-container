---
- name: Setup user specific options
  hosts: all
  strategy: free
  remote_user: "{{ create_user }}"
  become: true
  become_user: "{{ create_user }}"
  vars_files:
    - vars/default.yml
    - vars/restic.yml
    - vars/secrets.yml
  pre_tasks:
    # Every lookup('password', …) seed vars/secrets.yml expects must exist before
    # anything dereferences it — a missing seed GENERATES a new credential that
    # then disagrees with a database or an app (three outages on 2026-11-19, see
    # tasks/secret_seed_guard.yml). `always` so a narrowly-tagged deploy gets it.
    - name: Guard the password seeds
      ansible.builtin.import_tasks: tasks/secret_seed_guard.yml
      tags:
        - always
  roles:
    - user
  tags:
    - user

- name: Setup OpenCode SSH key
  hosts: all
  remote_user: "{{ create_user }}"
  become: true
  become_user: "{{ create_user }}"
  vars_files:
    - vars/default.yml
    - vars/restic.yml
    - vars/secrets.yml
  pre_tasks:
    # The opencode role writes its GitHub and servy SSH keys into the deploy
    # checkout. Hosts without a checkout (repo_checkout: false) must not get
    # them; their checkout, keys included, is removed by the user role.
    - name: Skip the opencode keys on hosts without a deploy checkout
      ansible.builtin.meta: end_host
      when: not (repo_checkout | default(true) | bool)
      tags:
        - always
  roles:
    - opencode
  tags:
    - user
    - user.opencode
    - user.docker.opencode

- name: Deploy Docker services
  hosts: all
  strategy: free
  remote_user: "{{ create_user }}"
  become: true
  become_user: "{{ create_user }}"
  vars_files:
    - vars/default.yml
    - vars/restic.yml
    - vars/secrets.yml
    # Tenant inventory: the single source of truth the database guard reads
    # (WP-3). Loaded here so plays/tasks/db_version_guard.yml can assume
    # `db_tenants` is defined rather than silently checking nothing.
    - vars/db_tenants.yml
  tags:
    - user
    - user.docker
  pre_tasks:
    # D8: read every database server's intended tag from the controller
    # checkout and refuse a mixed minor line BEFORE anything restarts.
    # First pre_task on purpose: the mongo migration blocks below stop and
    # recreate containers. Tagged `always` so `--tags docker` or a single
    # service tag still runs it.
    #
    # import_tasks, NOT include_tasks: a dynamic include only inherits this
    # `always` tag on the include task itself, so `--tags user.docker` would run
    # the include and SKIP every (untagged) task inside it — a silent no-op where
    # D8 promises a check on every deploy. A static import applies `always` to
    # every task in the file (measured on ansible-core 2.20.1). Do not "tidy"
    # this back into an include.
    - name: Guard the database versions before any service task
      ansible.builtin.import_tasks: tasks/db_version_guard.yml
      tags:
        - always

    - name: Read and encode Enable Banking PEM key
      ansible.builtin.slurp:
        src: "{{ docker.local_dir }}/finance/import/eb.pem"
      register: pem_file
      delegate_to: localhost
      tags:
        - user.docker.env
        - user.docker.env.finance

    # slurp returns base64 of the whole file, so decode first, then strip the
    # PEM armor: the importer expects the bare base64 body and adds the
    # -----BEGIN/END PRIVATE KEY----- headers itself.
    - name: Set Enable Banking private key fact
      ansible.builtin.set_fact:
        enable_banking_private_key_b64: >-
          {{ pem_file['content'] | b64decode
          | regex_replace('-----BEGIN PRIVATE KEY-----\n|-----END PRIVATE KEY-----\n', '')
          | regex_replace('\n', '') | trim }}
      tags:
        - user.docker.env
        - user.docker.env.finance

    # The `services` fact is shared with the user role, which runs BEFORE this
    # play's own tasks. Static import keeps the `always` tag on the inner task
    # (see tasks/build_services.yml); the expression itself is unchanged.
    - name: Build the enabled services fact for this play
      ansible.builtin.import_tasks: tasks/build_services.yml
      tags:
        - always

    # Only on hosts that actually run searxng. Unguarded, this ran everywhere:
    # on a host without the service the project has no .env, `docker compose`
    # answered "env file ... not found", and the task failed on every deploy
    # (ignored, but it buried real failures in the same loop — codey, 2026-11-20).
    # ignore_errors stays: on a FIRST deploy the .env is rendered later in this
    # play, so stopping a not-yet-rendered project is expected to fail once.
    # The module reports that case only in its message, so no narrower failed_when
    # can distinguish it from a genuine compose failure without changing behaviour.
    - name: Stop searxng before config update  # noqa: ignore-errors
      community.docker.docker_compose_v2:
        project_src: "{{ docker.remote_dir }}/searxng"
        state: absent
      ignore_errors: true
      when: "'searxng' in (services | default([]))"
      tags:
        - user.docker.searxng
        - molecule-notest

    - name: Deploy searxng settings.yml
      ansible.builtin.template:
        src: searxng/settings.yml.j2
        dest: "{{ docker.remote_dir }}/searxng/core-config/settings.yml"
        mode: "0600"
      # core-config is root-owned (searxng runs as root and owns the dir/files);
      # write as root so the deploy doesn't depend on the dir being chowned to the deploy user.
      become: true
      become_user: root
      when: "'searxng' in (services | default([]))"
      tags:
        - user.docker.searxng

    # Monitor contact points are the one monitor config that still carries a
    # secret (the admin mail address), so Ansible still renders them — but into
    # monitor/rendered/, an UNTRACKED path that monitor/docker-compose.yml
    # bind-mounts over the provisioning dir. Never render over the tracked file
    # again: `roles/user/tasks/includes/repository.yml` resets tracked files to
    # raw Jinja (`git reset --hard`), so an in-tree render is non-idempotent
    # forever — every run rewrote them, and a repo-sync-only run left Grafana
    # and promtail reading `{{ ... }}`, which is invalid YAML. Grafana 13 exits 1
    # on a provisioning error (crash-loop, monitoring blind).
    # Full analysis: history/2026-11-18_monitor-render-out-of-checkout.md
    - name: Ensure the untracked monitor render target exists
      ansible.builtin.file:
        path: "{{ docker.remote_dir }}/monitor/rendered"
        state: directory
        mode: "0755"
      when: "'monitor' in (services | default([]))"
      tags:
        - user.docker.monitor
        - user.docker.env
        - user.docker.env.monitor

    - name: Render the monitor contact points from the centralized admin address
      ansible.builtin.template:
        src: "{{ docker.local_dir }}/monitor/provisioning/alerting/contact-points.yml"
        dest: "{{ docker.remote_dir }}/monitor/rendered/contact-points.yml"
        # Grafana (uid 472, gid root) reads this from inside the container and
        # the group is `docker`, not root: it must be world-readable.
        mode: "0644"
      when: "'monitor' in (services | default([]))"
      tags:
        - user.docker.monitor
        - user.docker.env
        - user.docker.env.monitor

    - name: Read back the rendered contact points
      ansible.builtin.slurp:
        src: "{{ docker.remote_dir }}/monitor/rendered/contact-points.yml"
      register: monitor_contact_points
      # Skipped in check mode: `template` writes nothing there, so the file may
      # not exist yet on a first run.
      when:
        - "'monitor' in (services | default([]))"
        - not ansible_check_mode
      tags:
        - user.docker.monitor
        - user.docker.env
        - user.docker.env.monitor

    # A placeholder that silently stopped resolving (renamed var, unset secret)
    # is a fatal Grafana provisioning error at boot, not a warning. Fail the
    # deploy here instead of at the next restart. The negative check is escaped
    # because the file legitimately keeps Grafana's own `{{ .Status | toUpper }}`
    # subject templating; an unresolved Ansible value looks like
    # `{{ monitor_admin_email }}`.
    - name: Verify the rendered contact points resolved to a real address
      ansible.builtin.assert:
        that:
          - "monitor_contact_points.content | b64decode is search('addresses: [^@\\s]+@[^@\\s]+')"
          - "monitor_contact_points.content | b64decode is not search('\\{\\{\\s*[a-z_]+')"
        fail_msg: >-
          monitor/rendered/contact-points.yml has no resolved mail address, or
          still holds an unresolved Jinja placeholder. Grafana 13 exits 1 on a
          provisioning error, so the deploy stops here instead of being found at
          the next restart.
      when:
        - "'monitor' in (services | default([]))"
        - not ansible_check_mode
      tags:
        - user.docker.monitor
        - user.docker.env
        - user.docker.env.monitor

    # --- Monitor split across two hosts (2026-11-20) -------------------------
    # Grafana + Loki moved to codey; Prometheus, promtail and the exporters stay
    # on servy. Every secret-bearing monitor config is rendered into the untracked
    # rendered/ dir (same rule as contact-points.yml above) and mounted over the
    # tracked path or into a fixed path. Each render is gated on the profile that
    # READS the file, so codey never renders the servy collector's target file and
    # servy never renders the Grafana datasource.
    - name: Render the Grafana datasources from the cross-host credentials
      ansible.builtin.template:
        src: "{{ docker.local_dir }}/monitor/provisioning/datasources/datasources.yml"
        dest: "{{ docker.remote_dir }}/monitor/rendered/datasources.yml"
        # Grafana runs as uid 472, and the checkout group is `docker`, not root.
        mode: "0644"
      when:
        - "'monitor' in (services | default([]))"
        - "'ui' in (monitor_profiles | default([]))"
      tags:
        - user.docker.monitor
        - user.docker.env
        - user.docker.env.monitor

    - name: Read back the rendered datasources
      ansible.builtin.slurp:
        src: "{{ docker.remote_dir }}/monitor/rendered/datasources.yml"
      register: monitor_datasources
      when:
        - "'monitor' in (services | default([]))"
        - "'ui' in (monitor_profiles | default([]))"
        - not ansible_check_mode
      tags:
        - user.docker.monitor
        - user.docker.env
        - user.docker.env.monitor

    # Same trap as the contact points: an unresolved `{{ … }}` in datasources.yml
    # is a FATAL Grafana provisioning error (Grafana 13 exits 1 and crash-loops),
    # so catch it at deploy time, not at the next restart. A missing/blank
    # password would instead provision a datasource that answers 401 on every
    # query — Grafana stays up and every dashboard silently breaks.
    - name: Verify the rendered datasources resolved
      ansible.builtin.assert:
        that:
          - "monitor_datasources.content | b64decode is not search('\\{\\{')"
          - "monitor_datasources.content | b64decode is search('uid: prometheus')"
          - "monitor_datasources.content | b64decode is search('basicAuthPassword: \"[^\" ]{16,}\"')"
          - "monitor_datasources.content | b64decode is search('url: https?://')"
        fail_msg: >-
          monitor/rendered/datasources.yml still holds an unresolved Jinja
          placeholder, lost a datasource uid, or carries no basicAuthPassword /
          url. Grafana 13 exits 1 on a provisioning error, and a datasource without
          the cross-host credential would 401 every query — so the deploy stops
          here.
      when:
        - "'monitor' in (services | default([]))"
        - "'ui' in (monitor_profiles | default([]))"
        - not ansible_check_mode
      tags:
        - user.docker.monitor
        - user.docker.env
        - user.docker.env.monitor

    - name: Render the Loki basic-auth password for promtail and Prometheus
      ansible.builtin.copy:
        content: "{{ monitor_remote_auth.loki_password }}\n"
        dest: "{{ docker.remote_dir }}/monitor/rendered/loki-password"
        # Prometheus runs as uid 65534 and promtail reads it as root; both are
        # outside the checkout's group (`docker`), so it must be world-readable
        # (also listed in world_readable_paths_by_service.monitor).
        mode: "0644"
      when:
        - "'monitor' in (services | default([]))"
        - "'collect' in (monitor_profiles | default([]))"
      no_log: true
      tags:
        - user.docker.monitor
        - user.docker.env
        - user.docker.env.monitor

    - name: Render the Loki scrape target for Prometheus
      ansible.builtin.template:
        src: "{{ docker.local_dir }}/monitor/loki-target.json.j2"
        dest: "{{ docker.remote_dir }}/monitor/rendered/loki-target.json"
        mode: "0644"
      when:
        - "'monitor' in (services | default([]))"
        - "'collect' in (monitor_profiles | default([]))"
      tags:
        - user.docker.monitor
        - user.docker.env
        - user.docker.env.monitor

    # Forgejo [metrics] bearer token (2026-11-20): the scrape job in
    # monitor/prometheus.yml reads it from /etc/prometheus/rendered/ (same
    # pattern as loki-password). Prometheus runs as uid 65534, so 0644.
    - name: Render the Forgejo metrics token for Prometheus
      ansible.builtin.copy:
        content: "{{ forgejo_metrics_token | default('') }}\n"
        dest: "{{ docker.remote_dir }}/monitor/rendered/forgejo-metrics-token"
        mode: "0644"
      # Rendered on every collect host (not only where ci runs): compose
      # bind-mounts this path, and a missing source would be created as a root
      # directory, breaking the Prometheus container.
      when:
        - "'collect' in (monitor_profiles | default([]))"
      no_log: true
      tags:
        - user.docker.ci
        - user.docker.env
        - user.docker.env.ci

    # Consolidation (shared project): data containers moved out of the
    # leagues-finance / finance projects. Remove the ORPHANED originals
    # (containers only — volumes and bind mounts stay) BEFORE the shared role
    # starts equivalents on the same data. Without this, two mongos would
    # write to one volume (compose does not remove orphans). No-op once done.
    - name: Remove superseded pre-consolidation data containers
      community.docker.docker_container:
        name: "{{ item }}"
        state: absent
        keep_volumes: true
      loop:
        - leagues-finance.mongo
        - leagues-finance.redis
        - finance.db
      when: "'shared' in (services | default([]))"
      tags:
        - user.docker.shared
        - user.docker

  # WP-9 (2026-11-19): the pre_tasks that used to live here are gone with
  # `shared.mongo`. They were one-time migrations (leagues-finance's root
  # account, mongo 7 -> 8, mongo 8 -> 9, dontforget's move into shared) and
  # every one of them would now touch a container that is deliberately STOPPED
  # as the rollback. The data lives on db-business.mongo / db-private.mongo
  # and their users are created by roles/db_tier (tasks/mongo.yml).
  #
  # Rollback for that move: `docker start shared.mongo`, point the three
  # MONGO_URI/DATABASE_URL values back at it, redeploy. See
  # history/2026-11-19_db-tier-wp9-mongo-tiers.md.

  roles:
    # Simple services — generic .env only
    # Traefik computes its dashboard basic-auth htpasswd entry first (seed:
    # plays/vars/.traefik_dashboard_password, mirrored to Vaultwarden), then the
    # docker_service templates below render it plus the Porkbun ACME keys.
    - role: traefik_dashboard_auth
      when: "'traefik' in (services | default([]))"
      tags: [user.docker, user.docker.traefik]

    # Cross-host monitor basic auth (2026-11-20). Must run before the traefik
    # service below: the env templates render the two htpasswd users files from
    # the facts this role computes (traefik/dynamic.yaml mounts them).
    - role: monitor_remote_auth
      when: "'traefik' in (services | default([]))"
      tags: [user.docker, user.docker.traefik, user.docker.monitor]

    - role: docker_service
      vars:
        service_dir: traefik
        # Per-host public dashboard name. The default (`{{ service_dir }}.{{ domain }}`)
        # is only right on servy: codey also runs with domain `lehel.xyz`, so it would
        # claim `traefik.lehel.xyz` too — a name the `*.lehel.xyz` wildcard already
        # routes to servy, leaving codey's dashboard unreachable and its router
        # competing for a host it never serves (measured 2026-10-29). codey sets
        # `traefik_service_host: traefik.code.lehel.xyz` in ansible/production.
        service_host: "{{ traefik_service_host | default(service_dir ~ '.' ~ domain) }}"
        env_templates:
          - src: docker.env.j2
            dest: .env
          # Porkbun API keys for the DNS-01 resolver (env_file in compose).
          - src: traefik/traefik.env.j2
            dest: traefik.env
          # basicAuth usersFile consumed by traefik/dynamic.yaml (`traefik-auth`).
          - src: traefik/dashboard-auth.htpasswd.j2
            dest: dashboard-auth.htpasswd
          # basicAuth usersFiles for the two cross-host monitor routes
          # (dynamic.yaml: monitor-loki-auth / monitor-prometheus-auth).
          - src: traefik/monitor-loki-auth.htpasswd.j2
            dest: monitor-loki-auth.htpasswd
          - src: traefik/monitor-prometheus-auth.htpasswd.j2
            dest: monitor-prometheus-auth.htpasswd
        # error-pages bind-mounts error-pages.html and runs as uid 10001. The
        # deploy checkout's umask 007 leaves tracked files at 0660, which the
        # container cannot read ("permission denied" -> restart loop, so every
        # catchall/5xx page falls back to Traefik's plain status). traefik
        # itself runs as root. Declared centrally (vars/default.yml) so the
        # repo-sync task can re-apply it too.
        world_readable_paths: "{{ world_readable_paths_by_service[service_dir] | default([]) }}"
      when: "'traefik' in (services | default([]))"
      tags: [user.docker, user.docker.traefik]

    # Forgejo (ci.lehel.xyz) — home of the migrated repos. Two env files:
    # .env (compose interpolation + Traefik knobs) and forgejo.env (the
    # FORGEJO__* container env, from secrets.yml — nothing secret in the
    # plaintext compose).
    - role: docker_service
      vars:
        service_dir: ci
        env_templates:
          - src: ci/docker.env.j2
            dest: .env
          - src: ci/forgejo.env.j2
            dest: forgejo.env
      when: "'ci' in (services | default([]))"
      tags: [user.docker, user.docker.ci]

    # Idempotent Forgejo setup, AFTER docker_service has brought ci.forgejo up:
    # admin user, offline runner registration (shared secret), nightly DB dump
    # timer (01:30, keep 3).
    - role: forgejo_bootstrap
      when: "'ci' in (services | default([]))"
      tags: [user.docker, user.docker.ci]

    # Self-hosted Renovate. One-shot container on a user timer, not a web
    # service: docker_service only renders renovate.env (manual: true) and the
    # renovate role installs the scheduler. Tokens come from secrets.yml.
    - role: docker_service
      vars:
        service_dir: renovate
        manual: true
        env_templates:
          - src: renovate/renovate.env.j2
            dest: renovate.env
      when: "'renovate' in (services | default([]))"
      tags: [user.docker, user.docker.renovate]

    - role: renovate
      when: "'renovate' in (services | default([]))"
      tags: [user.docker, user.docker.renovate]

    # Forgejo Actions runner (codey = dind, runny = host socket). Not in
    # docker.services[]: the runners never run on servy.
    - role: forgejo_runner
      when: "'runny' in (services | default([]))"
      tags: [user.docker, user.docker.runny]

    - role: docker_service
      vars:
        service_dir: photoprism
        env_templates:
          # The DB/admin secrets live here, not inline in the compose file: both
          # repos are public and the compose files are being made readable
          # (Renovate cannot see git-crypt ciphertext, so image tags in them were
          # never bumped automatically). `*.env` stays encrypted.
          - src: photoprism/photoprism.env.j2
            dest: photoprism.env
      when: "'photoprism' in (services | default([]))"
      tags: [user.docker, user.docker.photoprism]

    - role: docker_service
      vars:
        service_dir: bumbleflies
        env_templates:
          - src: docker.env.j2
            dest: .env
          - src: bumbleflies/bnb.env.j2
            dest: bnb.env
          - src: bumbleflies/live.env.j2
            dest: live.env
      when: "'bumbleflies' in (services | default([]))"
      tags: [user.docker, user.docker.bumbleflies]

    - role: docker_service
      vars:
        service_dir: achim-hoefer
        # serve/ is bind-mounted into nginx:stable and must stay readable by the
        # nginx worker (uid 101), which the checkout's umask 007 (0660) prevents.
        world_readable_paths: "{{ world_readable_paths_by_service[service_dir] | default([]) }}"
      when: "'achim-hoefer' in (services | default([]))"
      tags: [user.docker, user.docker.achim-hoefer]

    - role: docker_service
      vars:
        service_dir: portainer
        env_templates:
          - src: portainer/docker.env.j2
            dest: .env
          # Plaintext admin password (mode 0600) consumed by the container's
          # --admin-password-file flag. Only used on first init.
          - src: portainer/admin-password.txt.j2
            dest: admin-password.txt
      when: "'portainer' in (services | default([]))"
      tags: [user.docker, user.docker.portainer]

    # Portainer Agent (slave) — runs on code.lehel.xyz, reachable by the master
    # only via the IP-restricted Traefik route at a.codey.lehel.xyz.
    - role: docker_service
      vars:
        service_dir: portainer-agent
        service_name: portainer-agent
        # Traefik router name stays unique (portainer-agent), but Compose
        # project/container name is "portainer" so the container is
        # portainer.agent (matching the server's portainer.portainer).
        project_name: portainer
        # Per-host: the master reaches each agent by its own name, and the agent
        # reports that same name to Portainer. Defaults keep codey unchanged.
        service_host: "{{ portainer_agent_service_host | default('a.codey.lehel.xyz') }}"
        agent_name: "{{ portainer_agent_name | default('codey') }}"
        env_templates:
          - src: portainer-agent/docker.env.j2
            dest: .env
      when: "'portainer-agent' in (services | default([]))"
      tags: [user.docker, user.docker.portainer-agent]

    # Computes vaultwarden_admin_token_hash (consumed by pass/docker.env.j2 below) and
    # mirrors the plaintext seed into Vaultwarden itself as a convenience copy.
    - role: vaultwarden_admin_token
      when: "'pass' in (services | default([]))"
      tags: [user.docker, user.docker.pass]

    - role: docker_service
      vars:
        service_dir: pass
        env_templates:
          - src: pass/docker.env.j2
            dest: .env
      when: "'pass' in (services | default([]))"
      tags: [user.docker, user.docker.pass]

    # Services with additional env templates
    - role: docker_service
      vars:
        service_dir: opencode
        # services_enabled.opencode is a dict here (dns_short_name/dns_expose for
        # the public code.lehel.xyz hostname), not a bare `true` like most
        # services. docker.env.j2's SERVICE_ROOT_HOST (used by the
        # "${SERVICE_NAME}_root" traefik router in docker-compose.yml) is driven
        # by the separate `service_root_host` var, not by SERVICE_HOST/
        # dns_short_name/dns_expose — set it directly here so it resolves to
        # code.lehel.xyz instead of falling back to the bare `domain` default.
        # Without this, the "Ensure SERVICE_ROOT_HOST is set" task in the
        # opencode role sets it correctly first, but this role's template task
        # (which fully overwrites .env) clobbers it back to the wrong default.
        service_root_host: >-
          {{ (services_enabled.opencode.dns_short_name ~ '.' ~ domain)
             if (services_enabled.opencode is defined and services_enabled.opencode is mapping
                 and (services_enabled.opencode.dns_expose | default(false))
                 and (services_enabled.opencode.dns_short_name | default('')))
             else domain }}
        env_templates:
          - src: docker.env.j2
            dest: .env
          - src: opencode/.env.j2
            dest: opencode.env
        # Owns the codey_dev_checkouts volume (see
        # opencode/docker-compose.yml); ensure it exists even when only
        # claude-hub is targeted via --tags.
        ensure_volumes:
          - codey_dev_checkouts
      when: "'opencode' in (services | default([]))"
      tags: [user.docker, user.docker.opencode]

    - role: docker_service
      vars:
        service_dir: opencode-authgate
        env_templates:
          - src: docker.env.j2
            dest: .env
          - src: opencode-authgate/.env.j2
            dest: authgate.env
      when: "'opencode-authgate' in (services | default([]))"
      tags: [user.docker, user.docker.opencode-authgate]

    - role: docker_service
      vars:
        service_dir: energy
        env_templates:
          - src: docker.env.j2
            dest: .env
          - src: energy/.env.j2
            dest: energy.env
      when: "'energy' in (services | default([]))"
      tags: [user.docker, user.docker.energy]

    - role: docker_service
      vars:
        service_dir: groceries
        env_templates:
          - src: docker.env.j2
            dest: .env
          - src: groceries/.env.j2
            dest: groceries.env
      when: "'groceries' in (services | default([]))"
      tags: [user.docker, user.docker.groceries]

    - role: docker_service
      vars:
        service_dir: shared
        env_templates:
          - src: docker.env.j2
            dest: .env
          - src: shared/.env.j2
            dest: shared.env
        compose_services: "{{ shared_services | default([]) }}"
      when: "'shared' in (services | default([]))"
      tags: [user.docker, user.docker.shared]

    # DB tiers (WP-3b): one invocation per tier so a single tier can be deployed
    # alone (`--tags user.docker.db-business`) — Phase 10's version hop needs that.
    #
    # A tier WITH a server gets THREE tasks, in this order (WP-4a): pass 1 renders
    # db-<tier>/mariadb.env + dbops, `docker_service` brings the server up, pass 2
    # creates the tenants on the server that now runs. nonprod (WP-4) and business
    # (WP-5) and private (WP-6a) have theirs.
    - role: db_tier
      vars:
        db_tier_name: high
      when: "'high' in (db_tiers | default([]))"
      tags: [user.docker, user.docker.db-high]

    - role: db_tier
      vars:
        db_tier_name: nonprod
        db_tier_render_only: true
      when: "'nonprod' in (db_tiers | default([]))"
      # `.render` selects ONLY this pass: it writes db-<tier>/mariadb.env, dbops
      # and the tier credential, and creates/removes nothing in Docker. Needed by
      # WP-8R R8, whose `db-backup@<tier>` runner calls `dbops dump-due` — the
      # dbops on the host must know the new command before the tier timer is
      # enabled. Without this tag the only way to refresh dbops was the full
      # `user.docker.db-<tier>` tag, which also runs `docker compose up`.
      tags: [user.docker, user.docker.db-nonprod, user.docker.db-nonprod.render]

    # The tier's own compose project. Committed (D6), backend-only, no Traefik
    # router; `db_nonprod_backend` is internal. Consumers attach externally.
    - role: docker_service
      vars:
        service_dir: db-nonprod
        env_templates:
          - src: docker.env.j2
            dest: .env
      when: "'nonprod' in (db_tiers | default([]))"
      tags: [user.docker, user.docker.db-nonprod]

    - role: db_tier
      vars:
        db_tier_name: nonprod
      when: "'nonprod' in (db_tiers | default([]))"
      tags: [user.docker, user.docker.db-nonprod]

    # business tier (WP-5a), same three-step shape as nonprod above: render
    # db-business/mariadb.env + dbops, bring the server up, then create the
    # tier's users on it. Only the tenants placed there are created - see the
    # comment on db_tier_server_tenants in roles/db_tier/tasks/configure.yml.
    - role: db_tier
      vars:
        db_tier_name: business
        db_tier_render_only: true
      when: "'business' in (db_tiers | default([]))"
      # `.render` selects ONLY this pass: it writes db-<tier>/mariadb.env, dbops
      # and the tier credential, and creates/removes nothing in Docker. Needed by
      # WP-8R R8, whose `db-backup@<tier>` runner calls `dbops dump-due` — the
      # dbops on the host must know the new command before the tier timer is
      # enabled. Without this tag the only way to refresh dbops was the full
      # `user.docker.db-<tier>` tag, which also runs `docker compose up`.
      tags: [user.docker, user.docker.db-business, user.docker.db-business.render]

    # The tier's own compose project: committed (D6), backend-only, no Traefik
    # router; `db_business_backend` is internal. Consumers attach externally.
    - role: docker_service
      vars:
        service_dir: db-business
        env_templates:
          - src: docker.env.j2
            dest: .env
      when: "'business' in (db_tiers | default([]))"
      tags: [user.docker, user.docker.db-business]

    - role: db_tier
      vars:
        db_tier_name: business
      when: "'business' in (db_tiers | default([]))"
      tags: [user.docker, user.docker.db-business]

    # private tier (WP-6a), same three-step shape as nonprod/business above:
    # render db-private/mariadb.env + dbops, bring the server up, then create the
    # tier's users on it. Only the tenants placed there are created - see the
    # comment on db_tier_server_tenants in roles/db_tier/tasks/configure.yml.
    - role: db_tier
      vars:
        db_tier_name: private
        db_tier_render_only: true
      when: "'private' in (db_tiers | default([]))"
      # `.render` selects ONLY this pass: it writes db-<tier>/mariadb.env, dbops
      # and the tier credential, and creates/removes nothing in Docker. Needed by
      # WP-8R R8, whose `db-backup@<tier>` runner calls `dbops dump-due` — the
      # dbops on the host must know the new command before the tier timer is
      # enabled. Without this tag the only way to refresh dbops was the full
      # `user.docker.db-<tier>` tag, which also runs `docker compose up`.
      tags: [user.docker, user.docker.db-private, user.docker.db-private.render]

    # The tier's own compose project: committed (D6), backend-only, no Traefik
    # router; `db_private_backend` is internal. Consumers attach externally.
    - role: docker_service
      vars:
        service_dir: db-private
        env_templates:
          - src: docker.env.j2
            dest: .env
      when: "'private' in (db_tiers | default([]))"
      tags: [user.docker, user.docker.db-private]

    - role: db_tier
      vars:
        db_tier_name: private
      when: "'private' in (db_tiers | default([]))"
      tags: [user.docker, user.docker.db-private]

    # WP-9: mongo user provisioning moved into `db_tier` (tasks/mongo.yml) —
    # a tenant's database and its credential are properties of the TIER that
    # owns them, not of the shared project. The three db-scoped users are now
    # created on db-business.mongo / db-private.mongo, before this play reaches
    # the consumer roles below.
    #
    # A tag-scoped app deploy (`--tags user.docker.leagues-finance`) therefore
    # assumes its tier is deployed and its user exists — the same contract as
    # every MariaDB tier since WP-4. The cutover deploy includes
    # `user.docker.db-business` / `user.docker.db-private`.

    - role: docker_service
      vars:
        service_dir: leagues-finance
        env_templates:
          - src: docker.env.j2
            dest: .env
          - src: leagues-finance/.env.j2
            dest: leagues-finance.env
      when: "'leagues-finance' in (services | default([]))"
      tags: [user.docker, user.docker.leagues-finance]

    - role: docker_service
      vars:
        service_dir: finance
        env_templates:
          - src: finance/docker.env.j2
            dest: .env
          - src: finance/.env.j2
            dest: finance.env
          - src: finance/queen.env.j2
            dest: queen.env
        compose_services: "{{ finance_services | default([]) }}"
      when: "'finance' in (services | default([]))"
      tags: [user.docker, user.docker.finance]

    # Searxng — custom service_host (search.* not searxng.*)
    - role: docker_service
      vars:
        service_dir: searxng
        service_host: "search.{{ domain }}"
        service_name: searxng
        env_templates:
          - src: searxng/.env.j2
            dest: .env
      when: "'searxng' in (services | default([]))"
      tags: [user.docker, user.docker.searxng]

    # Sproutlings — custom service_host (thore.* not sproutlings.*)
    - role: docker_service
      vars:
        service_dir: thore
        service_host: "thore.{{ domain }}"
        service_name: thore
        env_templates:
          - src: thore/docker.env.j2
            dest: .env
      when: "'thore' in (services | default([]))"
      tags: [user.docker, user.docker.sproutlings]

    # dontforget — one app container (serves the API and the built frontend from
    # a single image). Its db is shared.mongo since 2026-11-17; the dedicated
    # user is provisioned by the shared_mongo_users role above.
    - role: docker_service
      vars:
        service_dir: dontforget
        env_templates:
          - src: dontforget/.env.j2
            dest: .env
          - src: dontforget/web.env.j2
            dest: web.env
      when: "'dontforget' in (services | default([]))"
      tags: [user.docker, user.docker.dontforget]

    # Platzler-Heid — Festzelt availability dashboard
    - role: docker_service
      vars:
        service_dir: platzler-heid
        env_templates:
          - src: platzler-heid/.env.j2
            dest: .env
      when: "'platzler-heid' in (services | default([]))"
      tags: [user.docker, user.docker.platzler-heid]

    # bnb-office — BricksnBytes office app (IBS, PHP). Public host is her Strato
    # domain (host vars: bnb_office_service_host = ibs.bricksnbytes.de on prod),
    # so HTTP-01 resolver, and she flips the Strato record before go-live. Tests
    # get a local-qualified host with TRAEFIK_TLS=false from the testing
    # inventory.
    #
    # WP-5b: the app's database is the business tier (`db-business.mariadb`,
    # host var bnb_office_db_host) and the `db:` sidecar left the compose — so
    # there is no db.env template any more. The tier's server is NOT deployed by
    # this role: `db_tier`/`docker_service` for db-business above own it.
    - role: docker_service
      vars:
        service_dir: bnb-office
        service_name: bnb-office
        service_host: "{{ bnb_office_service_host | default('ibs.bricksnbytes.de') }}"
        env_templates:
          - src: bnb-office.env.j2
            dest: .env
          - src: bnb-office/app.env.j2
            dest: app.env
      when: "'bnb-office' in (services | default([]))"
      tags: [user.docker, user.docker.bnb-office]

    # Waggle — self-hosted OpenPost (social post scheduling) at
    # waggle.bumbleflies.de. Custom service_host: the public name is on the
    # bumbleflies.de wildcard, not {dir}.{domain}. Not `dns_short_name`: that
    # only composes names under `domain`.
    #
    # All three public URLs derive from service_host, so moving the instance to
    # another hostname is an inventory change here — but it also invalidates
    # every provider OAuth callback and requires reconnecting the accounts.
    #
    # compose_pull: always — the compose file tracks `latest`, so the deploy is
    # what advances the version. Without it the role's `missing` default would
    # quietly keep the first pulled `latest` forever.
    - role: docker_service
      vars:
        service_dir: waggle
        service_name: waggle
        service_host: "{{ waggle_service_host | default('waggle.bumbleflies.de') }}"
        compose_pull: always
        env_templates:
          - src: waggle.env.j2
            dest: .env
      when: "'waggle' in (services | default([]))"
      tags: [user.docker, user.docker.waggle]

    # Moodle (OFFD / Flag Academy) — the referee-training platform that replaces
    # Christoph's FTP-only shared hosting. See history/2026-10-27_moodle-offd-blank-instance.md
    #
    # `service_host` is not cosmetic: it is rendered into the Traefik router AND
    # into SITE_URL ($CFG->wwwroot) for the container. Moving the site from the
    # rehearsal host to offd.de is therefore one inventory change, never a
    # database edit.
    #
    # Data (moodledata + the MariaDB datadir) lives under moodle_data_root —
    # existing server storage. The optional volume path is still supported:
    # set moodle_volume_device/moodle_volume_path and roles/user/tasks/
    # moodle_volume.yml takes over the mount.
    # WP-7b: the app's database is the business tier (`db-business.mariadb`,
    # host var moodle_db_host) and the `db:` sidecar left the compose — so there
    # is no db.env template any more (it only ever held that sidecar's root and
    # app credentials). The tier's server is NOT deployed by this role:
    # `db_tier`/`docker_service` for db-business above own it.
    - role: docker_service
      vars:
        service_dir: moodle
        service_name: moodle
        service_host: "{{ moodle_service_host | default(service_dir ~ '.' ~ domain) }}"
        # `always`, not compose's default `missing`: upstream REBUILDS an
        # already-published tag in place (release CI re-runs the whole matrix,
        # 4.5.x included), so the tag being present in the local store says
        # nothing about the image being current. That is not theoretical: on
        # 2026-11-21 production was running the 2026-11-12 build of `4.5.16`,
        # which predates erseco/alpine-moodle#197, while the Hub had been
        # serving a 2026-11-20 rebuild of the SAME tag that adds Ghostscript.
        # Without this the deploy reuses the old image forever and "Annotate
        # PDF" stays broken (moodle/AGENTS.md).
        compose_pull: always
        env_templates:
          - src: moodle.env.j2
            dest: .env
          # The image writes config.php itself from these variables, so nothing
          # is rendered into the Moodle tree.
          - src: moodle.app.env.j2
            dest: app.env
        # php-fpm.conf has `include=/etc/php83/php-fpm.d/*.conf`, and the pool
        # override bind-mounted from the checkout is read by php-fpm inside the
        # container. The checkout's umask 007 leaves it 0660 cda:cda while the
        # image runs as `nobody`: without this, php-fpm cannot open the pool file
        # and fails to start at all (nginx answers 502). Found on servyy-test,
        # 2026-10-29.
        world_readable_paths: "{{ world_readable_paths_by_service[service_dir] | default([]) }}"
      when: "'moodle' in (services | default([]))"
      tags: [user.docker, user.docker.moodle]

    # DevHub — personal dev command board (Next.js + SQLite). Runs on codey so it
    # can dispatch opencode on code.lehel.xyz. Public DNS h.code.lehel.xyz must point
    # to codey (217.217.227.124) via Porkbun before the first deploy.
    - role: docker_service
      vars:
        service_dir: devhub
        service_name: devhub
        service_host: "h.code.lehel.xyz"
        env_templates:
          - src: devhub/.env.j2
            dest: .env
          - src: devhub/web.env.j2
            dest: web.env
      when: "'devhub' in (services | default([]))"
      tags: [user.docker, user.docker.devhub]

    - role: docker_service
      vars:
        service_dir: claude-hub
        service_name: claude-hub
        env_templates:
          - src: docker.env.j2
            dest: .env
          - src: claude-hub/.env.j2
            dest: claude-hub.env
        # References codey_dev_checkouts as external (owned by
        # opencode). Ensure it here so a claude-hub-only --tags run works.
        ensure_volumes:
          - codey_dev_checkouts
      when: "'claude-hub' in (services | default([]))"
      tags: [user.docker, user.docker.claude-hub]

    # Manual services — env rendered, compose not started
    - role: docker_service
      vars:
        service_dir: dns
        manual: true
      when: "'dns' in (services | default([]))"
      tags: [user.docker, user.docker.dns]

    - role: docker_service
      vars:
        service_dir: me
        manual: true
      when: "'me' in (services | default([]))"
      tags: [user.docker, user.docker.me]

    - role: docker_service
      vars:
        service_dir: monitor
        env_templates:
          # docker.env.j2 carries a monitor-only block (guarded by
          # `service_dir == 'monitor'`) with COMPOSE_PROFILES — which half of the
          # split stack this host runs — LOKI_PUSH_URL and the two cross-host
          # routers' hostnames/allowlists. See the template header.
          - src: docker.env.j2
            dest: .env
          - src: monitor/grafana.env.j2
            dest: grafana.env
        # Same value the .env carries, handed to `docker compose --profile` so the
        # two paths cannot disagree. Empty on a host that does not run monitor.
        compose_profiles: "{{ monitor_profiles | default([]) }}"
        # Grafana (uid 472), Prometheus (uid 65534) and Loki (uid 10001) all read
        # bind-mounted config as non-root users. The deploy checkout's umask 007
        # leaves tracked files at 0660 group `docker`, which none of them can
        # read — the container then exits on "permission denied" (Grafana) or
        # "Error loading config" (Prometheus) and silently drops out of the
        # compose project. Declared centrally (vars/default.yml). The render task
        # above sets 0644 on its own output (monitor/rendered/contact-points.yml);
        # everything else the containers read is a tracked checkout file, so it
        # depends on this list.
        world_readable_paths: "{{ world_readable_paths_by_service[service_dir] | default([]) }}"
      when: "'monitor' in (services | default([]))"
      tags: [user.docker, user.docker.monitor]

    # `docker_service` recreates a container only when its SPEC changes, and
    # neither Prometheus (no --web.enable-lifecycle) nor Grafana (alerting
    # provisioning is read at start only) reloads on its own. This restarts the
    # one container whose startup content changed, and nothing when nothing did -
    # see roles/monitor_reload/tasks/main.yml for why each is independent.
    #
    # A role, not a bare task: `roles:` only accepts roles, and this must run
    # after the monitor role above.
    - role: monitor_reload
      vars:
        monitor_reload_service_dir: "{{ (docker.remote_dir, 'monitor') | path_join }}"
        monitor_reload_state_dir: "{{ (remote_user_home, '.deploy-state', 'monitor') | path_join }}"
        # The compose project (and therefore the container-name prefix) is the
        # service directory: `name: ${SERVICE_NAME}` in monitor/docker-compose.yml
        # with SERVICE_NAME=monitor.
        monitor_reload_prometheus_container: monitor.prometheus
        monitor_reload_grafana_container: monitor.grafana
        # One half of the stack now runs per host (2026-11-20). Without these the
        # role would `docker inspect`/`docker restart` a container this host does
        # not run: prometheus on codey, grafana on servy.
        monitor_reload_prometheus_enabled: "{{ 'collect' in (monitor_profiles | default([])) }}"
        monitor_reload_grafana_enabled: "{{ 'ui' in (monitor_profiles | default([])) }}"
      when: "'monitor' in (services | default([]))"
      tags: [user.docker, user.docker.monitor]

    # The rendered admin password is applied by Grafana only when it CREATES the
    # admin user, so the env and grafana.db drift apart silently (2026-11-18: the
    # DB was rewritten by a browser password reset, the env kept the seed, and the
    # documented verification recipe 401'd). This proves the env still
    # authenticates and re-asserts it into the DB when it does not. Runs after
    # monitor_reload so a restarted Grafana has settled. Grafana only runs under
    # the `ui` profile (codey, servyy-test).
    - role: monitor_grafana_auth
      when:
        - "'monitor' in (services | default([]))"
        - "'ui' in (monitor_profiles | default([]))"
      tags: [user.docker, user.docker.monitor]

  post_tasks:
    # The registration team picker ships from this repo (moodle/assets/), so the
    # one `<script>` tag in mdl_config.additionalhtmlfooter is reconciled from
    # git and asserted. Here, not in the `user` role: it talks to the running
    # container, which only exists after the compose up above.
    - name: Reconcile the Moodle signup team picker
      ansible.builtin.import_tasks: roles/user/tasks/moodle_signup_picker.yml
      when:
        - "'moodle' in (services | default([]))"
        - with_containers | default(false)
        - services_enabled.moodle | default(false) | bool
      tags:
        - user.docker
        - user.docker.moodle

    # Monitor split (2026-11-20): grafana + loki moved to codey and this host
    # runs only the `collect` profile. Compose NEVER removes a service whose
    # profile is inactive — `up --profile collect` simply ignores grafana/loki and
    # leaves the existing containers running (and their restart policy keeps them
    # alive). Without this, servy would keep running a second Grafana/Loki. The
    # task file is idempotent and names the four objects explicitly; it must not
    # touch any other volume.
    - name: Remove the monitor ui containers and volumes superseded by the split
      ansible.builtin.import_tasks: tasks/monitor_ui_cleanup.yml
      when:
        - "'monitor' in (services | default([]))"
        - "'ui' not in (monitor_profiles | default([]))"
      tags:
        - user.docker
        - user.docker.monitor

    # WP-9: nothing here waits on `shared.mongo` any more. The mongo servers now
    # have the same healthcheck contract as every other database container (the
    # `db` watchtower scope health-gates its patch window, and the consumer apps
    # retry their connection), and a stopped shared.mongo is the ROLLBACK, not a
    # fault. The old wait/fail pair would have made every full deploy fail during
    # the rollback week; its failure text and the wipe it replaced are recorded
    # in history/2026-11-18_db-tier-wp1-mongo-wipe.md.

    # Opt-in (-e prune_legacy_datastore_images=true) once every service has moved to
    # valkey:9-alpine / mongo:8. Docker refuses to remove an image still used by a container.
    - name: Remove legacy datastore images superseded by valkey:9-alpine and mongo:8
      community.docker.docker_image:
        name: "{{ item }}"
        state: absent
      loop:
        - redis:7-alpine
        - mongo:7
        - mongo:7.0
      when: prune_legacy_datastore_images | default(false)
      tags:
        - user.docker

    # Traefik 3.6.19 turned "basicAuth with an empty user list" into an ERROR:
    # the middleware is dropped, every router referencing `traefik-auth@file` is
    # unmounted, and the dashboard answers 404 instead of 401 with only a log
    # line — the exact silent failure to watch for here, because the users file
    # comes from a gitignored passphrase seed that a fresh checkout or a
    # half-finished render can leave empty. Verified on both hosts 2026-10-29.
    - name: Read the rendered Traefik dashboard users file
      ansible.builtin.slurp:
        src: "{{ (docker.remote_dir, 'traefik', 'dashboard-auth.htpasswd') | path_join }}"
      register: traefik_dashboard_users_file
      when: "'traefik' in (services | default([]))"
      tags:
        - user.docker
        - user.docker.traefik

    - name: Assert the Traefik dashboard users file holds exactly one htpasswd entry
      ansible.builtin.assert:
        that:
          - (traefik_dashboard_users_file.content | b64decode).splitlines()
            | reject('match', '^\s*(#.*)?$') | select('match', '^[^:\s]+:\$[^:\s]+$')
            | list | length == 1
        fail_msg: >-
          traefik/dashboard-auth.htpasswd on {{ inventory_hostname }} does not
          contain exactly one `username:hash` line. Traefik 3.6.19+ treats an
          empty users list as an error and unmounts the dashboard router (404
          instead of 401), so https://{{ traefik_service_host | default('traefik.' ~ domain) }}
          is unreachable until this is fixed. Check that
          plays/vars/.traefik_dashboard_password exists on the controller and
          re-run with --tags user.docker.traefik.
        quiet: true
      when: "'traefik' in (services | default([]))"
      tags:
        - user.docker
        - user.docker.traefik

    # D8: patch/digest drift is measured AFTER the deploy and is never fatal —
    # a watchtower patch pull legitimately leaves the servers apart for hours.
    # Last post_task: it must see the final container state.
    #
    # import_tasks, not include_tasks (same gotcha as the guard above): an
    # include tagged `always` runs, but skips its untagged children under any
    # `--tags` filter, so the drift metric would silently never be pushed.
    - name: Push the post-deploy database drift metric
      ansible.builtin.import_tasks: tasks/db_version_drift_push.yml
      tags:
        - always

# Configure Portainer RBAC and register the slave agent endpoint via the API.
# Opt-in via portainer_rbac_enabled (does not run on routine deploys). See
# roles/portainer_rbac/tasks/main.yml for usage.
- name: Configure Portainer RBAC
  # All hosts enter the play and the non-owner hosts leave before any task runs.
  # The former `hosts: servy.lehel.xyz` made --syntax-check -i testing warn
  # "Could not match supplied host pattern"; the owner now lives in a variable.
  hosts: all
  remote_user: "{{ create_user }}"
  become: true
  become_user: "{{ create_user }}"
  vars_files:
    - vars/default.yml
    - vars/restic.yml
    - vars/secrets.yml
    - vars/portainer-rbac.yml
  pre_tasks:
    - name: Skip Portainer RBAC on hosts that do not own it
      ansible.builtin.meta: end_host
      when: inventory_hostname != (portainer_rbac_host | default('servy.lehel.xyz'))
      tags:
        - always

    # Rebuild the enabled-services fact so the role's `when` works even when this
    # play is invoked in isolation via --tags user.portainer-rbac (the fact is
    # otherwise only produced by the shared task imported in the deploy play and
    # the user role). This narrower expression is kept on purpose: the play only
    # runs on the Portainer owner, whose services_enabled has no dict-form
    # entries, so using it changes no behaviour.
    - name: Build enabled services list from services_enabled dict
      ansible.builtin.set_fact:
        services: "{{ services_enabled | default({}) | dict2items | selectattr('value', 'equalto', true) | map(attribute='key') | list }}"
      tags:
        - always
  roles:
    - role: portainer_rbac
      when:
        - portainer_rbac_enabled | default(false)
        - "'portainer' in (services | default([]))"
  tags:
    - user.portainer-rbac
