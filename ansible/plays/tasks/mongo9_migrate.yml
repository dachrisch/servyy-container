---
# One-time mongo 8.x -> 9.0 migration (dump/restore onto a new volume).
# Imported once per mongo service from plays/user.yml pre_tasks with:
#   mongo9_name          short id, also the prefix of the result fact
#                        <mongo9_name>_mongo9_migrating
#   mongo9_project       compose project (= service dir) owning the mongo service
#   mongo9_container     mongo container name
#   mongo9_legacy_volume volume the pre-9 container mounts (kept untouched)
#   mongo9_new_volume    volume the 9.0 compose file mounts (absent = not migrated)
#   mongo9_consumers     containers to stop while the data moves
#   mongo9_user / mongo9_password  root credentials (same before and after)
#
# Why: Linux >= 6.19 (servy: 7.0) is incompatible with the TCMalloc/rseq use of
# mongo 8.x and current 8.x builds refuse to start (SERVER-121912). mongo 9.0
# starts, but cannot open FCV 8.2 data, and no 8.x binary runs on this kernel
# to lower the FCV first. So the data moves logically: mongodump from the still
# running pre-9 container, mongorestore into mongo 9 on a NEW volume.
#
# Trigger: the container is running with the legacy volume mounted AND the new
# volume does not exist yet. Afterwards (new volume exists) every task skips.
#
# Safety: the legacy volume is never touched, and the dump stays in
# <project>/.backup/ (gitignored, covered by the restic home backup).
# Rollback: revert the compose file, `docker volume rm <new volume>`, redeploy.
#
# Runs in pre_tasks, i.e. BEFORE the service roles: the consumers are stopped
# here and only started again by their own roles, after the restore is
# verified, so no app ever sees (or writes into) an empty mongo.
# See history/2026-11-03_shared-mongo9-kernel7.md.

- name: Inspect {{ mongo9_container }} before the mongo 9 migration
  community.docker.docker_container_info:
    name: "{{ mongo9_container }}"
  register: mongo9_pre_info

- name: Inspect new {{ mongo9_name }} mongo volume
  community.docker.docker_volume_info:
    name: "{{ mongo9_new_volume }}"
  register: mongo9_volume_info

- name: Decide whether {{ mongo9_name }} mongo needs the 8 -> 9 migration
  ansible.builtin.set_fact:
    "{{ mongo9_name }}_mongo9_migrating": >-
      {{ (not mongo9_volume_info.exists)
         and mongo9_pre_info.exists
         and mongo9_pre_info.container.State.Running
         and (mongo9_legacy_volume in
              (mongo9_pre_info.container.Mounts | selectattr('Name', 'defined') | map(attribute='Name') | list)) }}

- name: Migrate {{ mongo9_name }} mongo 8 -> 9
  when: lookup('vars', mongo9_name ~ '_mongo9_migrating') | bool
  block:
    - name: Timestamp for the pre-mongo9 dump
      ansible.builtin.set_fact:
        mongo9_dump_file: >-
          {{ (docker.remote_dir, mongo9_project, '.backup',
              'mongo8-' ~ now(utc=true).strftime('%Y%m%dT%H%M%SZ') ~ '.archive.gz') | path_join }}
        # Per-db, per-collection document counts (app dbs only) as JSON.
        mongo9_count_js: >-
          const out = {};
          db.adminCommand({listDatabases: 1, nameOnly: true}).databases
            .map(d => d.name).filter(n => !['admin', 'config', 'local'].includes(n)).sort()
            .forEach(n => { const d = db.getSiblingDB(n); out[n] = {};
              d.getCollectionInfos({type: 'collection'}).map(c => c.name)
                .filter(c => !c.startsWith('system.')).sort()
                .forEach(c => { out[n][c] = d.getCollection(c).countDocuments({}); }); });
          print(JSON.stringify(out));

    # Freeze writes. The consumer roles later in this play start them again.
    # Plain `docker stop`: docker_container state=stopped would try to CREATE a
    # missing container (e.g. the queen-only test host has no finance-api). Succeeds when
    # the container was stopped or does not exist; fails otherwise.
    - name: Stop {{ mongo9_name }} mongo consumers
      ansible.builtin.shell: >-
        docker stop {{ item | quote }} 2>/dev/null ||
        ! docker container inspect {{ item | quote }} >/dev/null 2>&1
      loop: "{{ mongo9_consumers }}"
      changed_when: true

    - name: Count documents before the migration
      community.docker.docker_container_exec:
        container: "{{ mongo9_container }}"
        argv:
          - mongosh
          - admin
          - --quiet
          - -u
          - "{{ mongo9_user }}"
          - -p
          - "{{ mongo9_password }}"
          - --eval
          - "{{ mongo9_count_js }}"
      register: mongo9_counts_before
      changed_when: false

    - name: Dump {{ mongo9_name }} mongo (all databases) inside the container
      community.docker.docker_container_exec:
        container: "{{ mongo9_container }}"
        argv:
          - mongodump
          - -u
          - "{{ mongo9_user }}"
          - -p
          - "{{ mongo9_password }}"
          - --authenticationDatabase
          - admin
          - --gzip
          - --archive=/tmp/pre-mongo9.archive.gz

    - name: Copy the pre-mongo9 dump to the host
      ansible.builtin.shell: >-
        mkdir -p {{ (docker.remote_dir, mongo9_project, '.backup') | path_join | quote }} &&
        docker cp {{ mongo9_container }}:/tmp/pre-mongo9.archive.gz {{ mongo9_dump_file | quote }} &&
        test -s {{ mongo9_dump_file | quote }}
      changed_when: true

    # The compose file in the checkout already points at mongo:9.0.4 on
    # the new volume: `up` recreates the container on the empty new volume,
    # and the entrypoint creates the root user from the service's env file.
    - name: Start mongo 9 on {{ mongo9_new_volume }}
      community.docker.docker_compose_v2:
        project_src: "{{ (docker.remote_dir, mongo9_project) | path_join }}"
        project_name: "{{ mongo9_project }}"
        services: [mongo]
        state: present

    - name: Wait for mongo 9 to become healthy
      community.docker.docker_container_info:
        name: "{{ mongo9_container }}"
      register: mongo9_post_info
      until: >-
        mongo9_post_info.container is not none and
        mongo9_post_info.container.State.Health.Status | default('') == 'healthy'
      retries: 30
      delay: 10

    - name: Copy the dump into the mongo 9 container
      ansible.builtin.command: >-
        docker cp {{ mongo9_dump_file | quote }} {{ mongo9_container }}:/tmp/pre-mongo9.archive.gz
      changed_when: true

    # admin.* stays out: the root user already exists (entrypoint), and every
    # app here authenticates as that root user, so there are no other users to carry.
    - name: Restore the app databases into mongo 9
      community.docker.docker_container_exec:
        container: "{{ mongo9_container }}"
        argv:
          - mongorestore
          - -u
          - "{{ mongo9_user }}"
          - -p
          - "{{ mongo9_password }}"
          - --authenticationDatabase
          - admin
          - --gzip
          - --archive=/tmp/pre-mongo9.archive.gz
          - --nsExclude=admin.*
          - --nsExclude=config.*

    - name: Count documents after the migration
      community.docker.docker_container_exec:
        container: "{{ mongo9_container }}"
        argv:
          - mongosh
          - admin
          - --quiet
          - -u
          - "{{ mongo9_user }}"
          - -p
          - "{{ mongo9_password }}"
          - --eval
          - "{{ mongo9_count_js }}"
      register: mongo9_counts_after
      changed_when: false

    - name: Assert the restore matches the dump source
      ansible.builtin.assert:
        that:
          - (mongo9_counts_after.stdout | from_json) == (mongo9_counts_before.stdout | from_json)
        fail_msg: >-
          Document counts differ after the mongo 9 restore.
          before={{ mongo9_counts_before.stdout }}
          after={{ mongo9_counts_after.stdout }}.
          The legacy volume {{ mongo9_legacy_volume }} is untouched and the dump is at
          {{ mongo9_dump_file }}. Consumers stay stopped; see the rollback note
          at the top of plays/tasks/mongo9_migrate.yml.
        success_msg: "{{ mongo9_name }} mongo 9 restore verified: {{ mongo9_counts_after.stdout }}"

    - name: Remove the in-container dump copy
      community.docker.docker_container_exec:
        container: "{{ mongo9_container }}"
        argv: [rm, -f, /tmp/pre-mongo9.archive.gz]
