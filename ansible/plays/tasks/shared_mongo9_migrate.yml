---
# One-time shared.mongo 8.x -> 9.0 migration (dump/restore onto a new volume).
#
# Why: Linux >= 6.19 (servy: 7.0) is incompatible with the TCMalloc/rseq use of
# mongo 8.x and current 8.x builds refuse to start (SERVER-121912). mongo 9.0
# starts, but cannot open FCV 8.2 data, and no 8.x binary runs on this kernel
# to lower the FCV first. So the data moves logically: mongodump from the still
# running pre-9 container, mongorestore into mongo 9 on a NEW volume.
#
# Trigger: shared.mongo is running with the legacy volume mounted AND the new
# volume does not exist yet. Afterwards (new volume exists) every task skips.
#
# Safety: the legacy volume leagues-finance_mongo_data is never touched, and the
# dump stays in shared/.backup/ (gitignored, covered by the restic home backup).
# Rollback: revert shared/docker-compose.yml, `docker volume rm shared_mongo_data`,
# redeploy with --tags user.docker.shared.
#
# Runs in pre_tasks, i.e. BEFORE the shared/leagues-finance/finance roles: the
# consumers are stopped here and only started again by their own roles, after
# the restore is verified, so no app ever sees (or writes into) an empty mongo.
# See history/2026-11-03_shared-mongo9-kernel7.md.

- name: Inspect shared mongo container before the mongo 9 migration
  community.docker.docker_container_info:
    name: shared.mongo
  register: shared_mongo9_pre_info

- name: Inspect new shared mongo volume
  community.docker.docker_volume_info:
    name: shared_mongo_data
  register: shared_mongo9_volume_info

- name: Decide whether shared mongo needs the 8 -> 9 migration
  ansible.builtin.set_fact:
    shared_mongo9_migrating: >-
      {{ (not shared_mongo9_volume_info.exists)
         and shared_mongo9_pre_info.exists
         and shared_mongo9_pre_info.container.State.Running
         and ('leagues-finance_mongo_data' in
              (shared_mongo9_pre_info.container.Mounts | selectattr('Name', 'defined') | map(attribute='Name') | list)) }}

- name: Migrate shared mongo 8 -> 9
  when: shared_mongo9_migrating | bool
  block:
    - name: Timestamp for the pre-mongo9 dump
      ansible.builtin.set_fact:
        shared_mongo9_dump_file: >-
          {{ (docker.remote_dir, 'shared', '.backup',
              'mongo8-' ~ now(utc=true).strftime('%Y%m%dT%H%M%SZ') ~ '.archive.gz') | path_join }}
        # Per-db, per-collection document counts (app dbs only) as JSON.
        shared_mongo9_count_js: >-
          const out = {};
          db.adminCommand({listDatabases: 1, nameOnly: true}).databases
            .map(d => d.name).filter(n => !['admin', 'config', 'local'].includes(n)).sort()
            .forEach(n => { const d = db.getSiblingDB(n); out[n] = {};
              d.getCollectionInfos({type: 'collection'}).map(c => c.name)
                .filter(c => !c.startsWith('system.')).sort()
                .forEach(c => { out[n][c] = d.getCollection(c).countDocuments({}); }); });
          print(JSON.stringify(out));

    # Freeze writes. The consumer roles later in this play start them again.
    # Plain `docker stop`: docker_container state=stopped would try to CREATE a
    # missing container (queen-only test host has no finance-api). Succeeds when
    # the container was stopped or does not exist; fails otherwise.
    - name: Stop shared mongo consumers
      ansible.builtin.shell: >-
        docker stop {{ item | quote }} 2>/dev/null ||
        ! docker container inspect {{ item | quote }} >/dev/null 2>&1
      loop:
        - leagues-finance.finance-api
        - finance.queen
      changed_when: true

    - name: Count documents before the migration
      community.docker.docker_container_exec:
        container: shared.mongo
        argv:
          - mongosh
          - admin
          - --quiet
          - -u
          - "{{ leagues_finance.mongo_root_username }}"
          - -p
          - "{{ leagues_finance.mongo_root_password }}"
          - --eval
          - "{{ shared_mongo9_count_js }}"
      register: shared_mongo9_counts_before
      changed_when: false

    - name: Dump shared mongo (all databases) inside the container
      community.docker.docker_container_exec:
        container: shared.mongo
        argv:
          - mongodump
          - -u
          - "{{ leagues_finance.mongo_root_username }}"
          - -p
          - "{{ leagues_finance.mongo_root_password }}"
          - --authenticationDatabase
          - admin
          - --gzip
          - --archive=/tmp/pre-mongo9.archive.gz

    - name: Copy the pre-mongo9 dump to the host
      ansible.builtin.shell: >-
        mkdir -p {{ (docker.remote_dir, 'shared', '.backup') | path_join | quote }} &&
        docker cp shared.mongo:/tmp/pre-mongo9.archive.gz {{ shared_mongo9_dump_file | quote }} &&
        test -s {{ shared_mongo9_dump_file | quote }}
      changed_when: true

    # The compose file in the checkout already points at mongo:9.0.4 on
    # shared_mongo_data: `up` recreates the container on the empty new volume,
    # and the entrypoint creates the root user from shared.env.
    - name: Start mongo 9 on the new volume
      community.docker.docker_compose_v2:
        project_src: "{{ (docker.remote_dir, 'shared') | path_join }}"
        project_name: shared
        services: [mongo]
        state: present

    - name: Wait for mongo 9 to become healthy
      community.docker.docker_container_info:
        name: shared.mongo
      register: shared_mongo9_post_info
      until: >-
        shared_mongo9_post_info.container is not none and
        shared_mongo9_post_info.container.State.Health.Status | default('') == 'healthy'
      retries: 30
      delay: 10

    - name: Copy the dump into the mongo 9 container
      ansible.builtin.command: >-
        docker cp {{ shared_mongo9_dump_file | quote }} shared.mongo:/tmp/pre-mongo9.archive.gz
      changed_when: true

    # admin.* stays out: the root user already exists (entrypoint), and both
    # apps authenticate as that root user, so there are no other users to carry.
    - name: Restore the app databases into mongo 9
      community.docker.docker_container_exec:
        container: shared.mongo
        argv:
          - mongorestore
          - -u
          - "{{ leagues_finance.mongo_root_username }}"
          - -p
          - "{{ leagues_finance.mongo_root_password }}"
          - --authenticationDatabase
          - admin
          - --gzip
          - --archive=/tmp/pre-mongo9.archive.gz
          - --nsExclude=admin.*
          - --nsExclude=config.*

    - name: Count documents after the migration
      community.docker.docker_container_exec:
        container: shared.mongo
        argv:
          - mongosh
          - admin
          - --quiet
          - -u
          - "{{ leagues_finance.mongo_root_username }}"
          - -p
          - "{{ leagues_finance.mongo_root_password }}"
          - --eval
          - "{{ shared_mongo9_count_js }}"
      register: shared_mongo9_counts_after
      changed_when: false

    - name: Assert the restore matches the dump source
      ansible.builtin.assert:
        that:
          - (shared_mongo9_counts_after.stdout | from_json) == (shared_mongo9_counts_before.stdout | from_json)
        fail_msg: >-
          Document counts differ after the mongo 9 restore.
          before={{ shared_mongo9_counts_before.stdout }}
          after={{ shared_mongo9_counts_after.stdout }}.
          The legacy volume leagues-finance_mongo_data is untouched and the dump is at
          {{ shared_mongo9_dump_file }}. Consumers stay stopped; see the rollback note
          at the top of plays/tasks/shared_mongo9_migrate.yml.
        success_msg: "shared mongo 9 restore verified: {{ shared_mongo9_counts_after.stdout }}"

    - name: Remove the in-container dump copy
      community.docker.docker_container_exec:
        container: shared.mongo
        argv: [rm, -f, /tmp/pre-mongo9.archive.gz]
