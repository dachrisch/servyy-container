---
# Restic wiring: validate the inventory and build the probe lists (WP-8R R1).
#
# WHY: before R1 a new restic repo meant hand edits in 12 places across 9 files.
# Now `backup_targets` in plays/vars/db_tenants.yml is the single input: the repo
# lists are derived in vars/restic.yml, the forget/check scripts iterate the
# targets directly, and this file builds the two system_probe lists (they are
# consumed by `{% for %}` loops in the probe scripts, so they cannot be derived
# inside the templates without duplicating the gating logic).
#
# WHY VALIDATE HERE: a typo in a repo name, a retention profile or a log key used
# to degrade silently - a repo that quietly stops being backed up, or a forget
# block pruning at the wrong rate. Every check below is a hard failure with the
# offending value in the message.
#
# Molecule scenarios do not load the tenant inventory. When `backup_targets` is
# undefined this file does nothing and the roles' own defaults (kept as molecule
# fallbacks) are used; production always defines it (the three plays load
# vars/db_tenants.yml).

- name: Validate the restic backup inventory
  when: backup_targets is defined
  block:
    - name: Fail when a backup target names an unknown retention profile
      ansible.builtin.assert:
        that:
          - item.retention in retention_profiles
        fail_msg: >-
          backup_targets '{{ item.name }}': retention '{{ item.retention }}' is not a
          profile in retention_profiles ({{ retention_profiles.keys() | list | join(', ') }}).
        quiet: true
      loop: "{{ backup_targets }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Fail when a backup target is not gated by a known flag
      ansible.builtin.assert:
        that:
          - item.enabled_by in ['always', 'leaguesphere', 'moodle', 'servy']
        fail_msg: >-
          backup_targets '{{ item.name }}': enabled_by '{{ item.enabled_by }}' is not one of
          always | leaguesphere | moodle | servy.
        quiet: true
      loop: "{{ backup_targets }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Fail when a backup target has no repo definition in vars/restic.yml
      ansible.builtin.assert:
        that:
          - item.name in restic
        fail_msg: >-
          backup_targets '{{ item.name }}': there is no `restic.{{ item.name }}` in
          vars/restic.yml. The inventory carries the policy; the transport details
          (repository, password, source_path, excludes) live there.
        quiet: true
      loop: "{{ backup_targets }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Fail when two backup targets share a name
      ansible.builtin.assert:
        that:
          - backup_targets | map(attribute='name') | list | length
            == backup_targets | map(attribute='name') | unique | list | length
        fail_msg: >-
          backup_targets declares at least one repo twice:
          {{ backup_targets | map(attribute='name') | list | join(', ') }}.
        quiet: true

    - name: Fail when a target's log key is not a known log file
      ansible.builtin.assert:
        that:
          - item.log_key in restic.logs
          - (item.dump_log_key | default(none)) is none or item.dump_log_key in restic.logs
        fail_msg: >-
          backup_targets '{{ item.name }}': log_key '{{ item.log_key }}' (or dump_log_key
          '{{ item.dump_log_key | default('-') }}') is not a key in restic.logs
          ({{ restic.logs.keys() | list | join(', ') }}).
        quiet: true
      loop: "{{ backup_targets }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Fail when a dump log key is declared without the rest of its probe row
      ansible.builtin.assert:
        that:
          - (item.dump_log_key | default(none)) is none
            or (item.dump_log_label | default('') | length > 0
                and (item.dump_log_threshold_seconds | default(0) | int) > 0)
        fail_msg: >-
          backup_targets '{{ item.name }}': it declares dump_log_key
          '{{ item.dump_log_key | default('-') }}' but not both dump_log_label and
          dump_log_threshold_seconds. plays/tasks/restic_wiring.yml renders the
          log-freshness probe from those three fields together, so a missing
          label publishes `system_log_freshness_seconds{log=""}` — a series no
          alert can name — and a missing threshold falls back to 7200 s, which is
          silently wrong for a 5-minute job like the binlog ship.
        quiet: true
      loop: "{{ backup_targets }}"
      loop_control:
        label: "{{ item.name }}"

    # A repo's probe is its only "did this actually happen" signal, and an
    # unreadable threshold/severity publishes nothing at all. Cheap to check,
    # and it is the difference between a quiet repo and a green dashboard over
    # a stopped job.
    - name: Fail when a backup target's probe fields are not usable numbers
      ansible.builtin.assert:
        that:
          - (item.log_threshold_seconds | default(0) | int) > 0
          - (item.probe_minutes | default(0) | int) >= 0
        fail_msg: >-
          backup_targets '{{ item.name }}': log_threshold_seconds
          '{{ item.log_threshold_seconds | default('-') }}' must be > 0 and
          probe_minutes '{{ item.probe_minutes | default('-') }}' must be >= 0
          (0 means "no snapshot-age series", which is only correct for a repo
          nothing snapshots).
        quiet: true
      loop: "{{ backup_targets }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Fail when a tenant points at a repo that is not a backup target
      ansible.builtin.assert:
        that:
          - item.restic_repo | default('') == ''
            or item.restic_repo in (backup_targets | map(attribute='name') | list)
        fail_msg: >-
          db_tenants '{{ item.tenant }}': restic_repo '{{ item.restic_repo }}' is not a
          backup_targets name ({{ backup_targets | map(attribute='name') | list | join(', ') }}).
          A dump nobody snapshots is a backup gap.
        quiet: true
      loop: "{{ db_tenants }}"
      loop_control:
        label: "{{ item.tenant }}"

    # --- the WP-8R R3/R4/R6 jobs: four facts live on two rows --------------
    # size_floor_bytes / probe_minutes / severity exist on BOTH the tenant row
    # (what the dump script and the inventory read) and the backup_targets row
    # (what the probe generator and the retention read). That duplication is
    # deliberate — a dump's floor is a property of the tenant, a repo's cadence
    # of the target — but it is only safe with this guard: lowering a floor in
    # one place would otherwise leave the script and the probe at different
    # thresholds, and the failure mode is a green dashboard over a broken dump.
    # The two URLs below are checked for the same reason: a source_path that
    # does not end in `<dump_dir>/current` snapshots an empty or wrong directory.
    # Scoped to `servy`, i.e. the five jobs this package wires; moodle (R9) and
    # the host repos have no dump_at/floor of this shape.
    - name: Fail when a backup target names a tenant the inventory does not have
      ansible.builtin.assert:
        that:
          - db_tenants | selectattr('tenant', 'equalto', item.tenant) | list | length == 1
        fail_msg: >-
          backup_targets '{{ item.name }}': tenant '{{ item.tenant }}' is not a row in
          db_tenants. A repo without a tenant row has no server, no database and no
          dump script — it would snapshot a directory nobody fills.
        quiet: true
      loop: "{{ backup_targets | selectattr('enabled_by', 'equalto', 'servy') | list }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Fail when a tenant row and its backup target disagree
      ansible.builtin.assert:
        that:
          - trow.size_floor_bytes | int == item.size_floor_bytes | int
          - trow.probe_minutes | int == item.probe_minutes | int
          - trow.severity == item.severity
          - trow.dump_at in restic.schedules['dump_' ~ item.tenant]
          - restic[item.name].source_path == (trow.dump_dir ~ '/current')
        fail_msg: >-
          backup_targets '{{ item.name }}' and db_tenants '{{ item.tenant }}' must agree.
          Values: size_floor_bytes (target {{ item.size_floor_bytes }} /
          tenant {{ trow.size_floor_bytes }}), probe_minutes ({{ item.probe_minutes }} /
          {{ trow.probe_minutes }}), severity ({{ item.severity }} / {{ trow.severity }});
          restic.schedules.dump_{{ item.tenant }} ('{{ restic.schedules['dump_' ~ item.tenant] }}')
          must contain dump_at '{{ item.dump_at }}'; and restic.{{ item.name }}.source_path
          ('{{ restic[item.name].source_path }}') must be '<tenant dump_dir>/current'
          ('{{ trow.dump_dir }}/current'). The first expression that failed is shown above.
        # NOT quiet: with five conditions in one assert, the failing one must be
        # visible — otherwise the message reads like all five disagree.
      vars:
        trow: "{{ db_tenants | selectattr('tenant', 'equalto', item.tenant) | first }}"
      loop: "{{ backup_targets | selectattr('enabled_by', 'equalto', 'servy') | list }}"
      loop_control:
        label: "{{ item.name }}"

    # --- restore drills (WP-8R R11) ----------------------------------------
    # `drill` is a property of the TENANT row, like every other cadence. It must
    # be stated, not inferred: a new tenant that silently defaults to "not
    # drilled" is the exact failure this package exists to prevent, and a tenant
    # with a repo but no drill is a capability gap that nothing would page on.
    - name: Fail when a tenant row has no usable restore-drill cadence
      ansible.builtin.assert:
        that:
          - item.drill is defined
          - item.drill in ['weekly', 'monthly', 'none']
        fail_msg: >-
          db_tenants '{{ item.tenant }}': drill '{{ item.drill | default('-') }}'
          must be weekly | monthly | none. The plan's rule: weekly for
          leaguesphere and moodle, monthly for every other backed-up tenant, none
          for nonprod. State it on the row — do not rely on a default.
        quiet: true
      loop: "{{ db_tenants }}"
      loop_control:
        label: "{{ item.tenant }}"

    - name: Fail when a tenant is drilled but has nothing to restore from
      ansible.builtin.assert:
        that:
          - item.restic_repo | default('') | length > 0
          - item.dump_dir | default('') | length > 0
        fail_msg: >-
          db_tenants '{{ item.tenant }}': drill is {{ item.drill }} but restic_repo
          is '{{ item.restic_repo | default('') }}' and dump_dir is
          '{{ item.dump_dir | default('') }}'. A drill restores the newest snapshot
          of the tenant's repo, so both are required; a tenant with neither must
          say drill: none (and only nonprod may).
        quiet: true
      loop: "{{ db_tenants | selectattr('drill', 'defined') | rejectattr('drill', 'equalto', 'none') | list }}"
      loop_control:
        label: "{{ item.tenant }}"

    # `none` is not an escape hatch for a real tenant: it removes the only signal
    # that a restore still works. Nonprod is the one legitimate case (stage is
    # re-synced from prod nightly, demo reseeds itself nightly), so the guard
    # names the tier instead of trusting a comment.
    - name: Fail when a non-nonprod tenant opts out of restore drills
      ansible.builtin.assert:
        that:
          - item.tier == 'nonprod'
        fail_msg: >-
          db_tenants '{{ item.tenant }}' (tier '{{ item.tier }}') sets drill: none.
          Only nonprod may: every high/business/private tenant has a repo whose
          restorability must be proven on a cadence. If the drill is genuinely
          impossible, say why in the row and change this guard in the same commit.
        quiet: true
      loop: "{{ db_tenants | selectattr('drill', 'defined') | selectattr('drill', 'equalto', 'none') | list }}"
      loop_control:
        label: "{{ item.tenant }}"

    # --- the two system_probe lists, in the order the deployed scripts have ---
    - name: Start the log-check list with the host-level entries
      ansible.builtin.set_fact:
        restic_wiring_log_checks:
          - name: docker-cleanup
            path: /var/log/docker-cleanup.log
            threshold_seconds: 691200
          - name: kernel-cleanup
            path: /var/log/kernel-cleanup.log
            threshold_seconds: 2764800
        restic_wiring_snapshot_checks: []
        restic_wiring_dump_checks: []
        restic_wiring_dump_severities: []
        restic_wiring_drill_tenants: []

    - name: Add the host-repo log checks
      ansible.builtin.set_fact:
        restic_wiring_log_checks: >-
          {{ restic_wiring_log_checks
             + [{'name': t.log_label, 'path': restic.logs[t.log_key],
                 'threshold_seconds': t.log_threshold_seconds}] }}
      loop: "{{ restic_targets_enabled | selectattr('tenant', 'equalto', None) | list }}"
      loop_control:
        loop_var: t
        label: "{{ t.name }}"

    - name: Add the host-level forget/check log checks
      ansible.builtin.set_fact:
        restic_wiring_log_checks: >-
          {{ restic_wiring_log_checks
             + [{'name': 'restic-forget', 'path': restic.logs.forget, 'threshold_seconds': 90000},
                {'name': 'restic-check', 'path': restic.logs.check, 'threshold_seconds': 691200}] }}

    - name: Add the tenant-repo log checks
      ansible.builtin.set_fact:
        restic_wiring_log_checks: >-
          {{ restic_wiring_log_checks
             + [{'name': t.log_label, 'path': restic.logs[t.log_key],
                 'threshold_seconds': t.log_threshold_seconds}] }}
      loop: "{{ restic_targets_enabled | rejectattr('tenant', 'equalto', None) | list }}"
      loop_control:
        loop_var: t
        label: "{{ t.name }}"

    - name: Add the dump-log checks
      ansible.builtin.set_fact:
        restic_wiring_log_checks: >-
          {{ restic_wiring_log_checks
             + [{'name': t.dump_log_label, 'path': restic.logs[t.dump_log_key],
                 'threshold_seconds': t.dump_log_threshold_seconds | default(7200)}] }}
      loop: "{{ restic_targets_enabled | rejectattr('dump_log_key', 'none') | list }}"
      loop_control:
        loop_var: t
        label: "{{ t.name }}"

    - name: Build the snapshot-age probe list (repo order = inventory order)
      ansible.builtin.set_fact:
        restic_wiring_snapshot_checks: >-
          {{ restic_wiring_snapshot_checks
             + [{'name': t.name, 'env_file': '/etc/restic/env.' ~ t.name,
                 'threshold_seconds': (t.probe_minutes | int) * 60,
                 'severity': t.severity}] }}
      loop: "{{ restic_targets_enabled | selectattr('probe_minutes', 'gt', 0) | list }}"
      loop_control:
        loop_var: t
        label: "{{ t.name }}"

    # --- the dump-age probe (WP-8R R2) -------------------------------------
    # One entry per TENANT that declares a probe policy (`probe_minutes > 0`).
    # This is the second half of "protected": the snapshot probe proves the dump
    # reached its repo, this one proves the dump itself was refreshed. Before R2
    # neither existed for the five R3/R4/R6 tenants, so a silent failure paged
    # nobody.
    #
    # A tenant row with `probe_minutes: 0` (or no `probe_minutes`) emits NOTHING —
    # that is how the nonprod tier stays quiet (`noDataState: OK` handles an
    # absent series). Emitting `-1` there instead would page forever, because
    # those tenants are never dumped by design (stage is re-synced nightly, the
    # demo reseeds itself).
    - name: Select the tenants that declare a dump probe policy
      ansible.builtin.set_fact:
        restic_wiring_probe_tenants: >-
          {{ db_tenants | selectattr('probe_minutes', 'defined')
             | selectattr('probe_minutes', 'gt', 0) | list }}

    - name: Fail when a tenant declares a dump probe but has no dump directory
      ansible.builtin.assert:
        that:
          - item.dump_dir | default('') | length > 0
        fail_msg: >-
          db_tenants '{{ item.tenant }}': probe_minutes is {{ item.probe_minutes }} but
          dump_dir is empty. A dump probe with nothing to measure would report -1
          forever (a permanent page) or silently vanish. Either give the tenant a
          dump_dir or set probe_minutes: 0.
        quiet: true
      loop: "{{ restic_wiring_probe_tenants }}"
      loop_control:
        label: "{{ item.tenant }}"

    - name: Fail when a tenant with a dump probe has no usable severity
      ansible.builtin.assert:
        that:
          - item.severity | default('') in ['high', 'medium']
        fail_msg: >-
          db_tenants '{{ item.tenant }}': severity '{{ item.severity | default('-') }}'
          must be high or medium. The probes push it as `db_dump_severity{tier}` /
          `restic_snapshot_severity{repo}` and the alert rules split on it, so an
          unknown value puts the tenant in NEITHER rule — a silent, unprotected gap.
        quiet: true
      loop: "{{ restic_wiring_probe_tenants }}"
      loop_control:
        label: "{{ item.tenant }}"

    # `db_dump_severity` is one series per TIER and the rule joins it on `tier`,
    # so two tenants on one tier that disagree would silently mean "whichever row
    # the template saw first". Fail instead: a tier is an alerting class, not a
    # per-tenant choice.
    - name: Fail when two tenants on one tier declare different severities
      ansible.builtin.assert:
        that:
          - restic_wiring_probe_tenants | selectattr('tier', 'equalto', item)
            | map(attribute='severity') | unique | list | length == 1
        fail_msg: >-
          db_tenants: the '{{ item }}' tier declares more than one severity
          ({{ restic_wiring_probe_tenants | selectattr('tier', 'equalto', item)
              | map(attribute='severity') | unique | join(', ') }}).
          `db_dump_severity` is pushed once per tier because the alert rules carry
          one static severity, so a tier must have one alerting class.
        quiet: true
      loop: "{{ restic_wiring_probe_tenants | map(attribute='tier') | unique | sort | list }}"

    - name: Build the dump-age probe list (only tenants that declare a policy)
      ansible.builtin.set_fact:
        restic_wiring_dump_checks: >-
          {{ restic_wiring_dump_checks
             + [{'tenant': t.tenant, 'tier': t.tier, 'path': t.dump_dir,
                 'threshold_seconds': (t.probe_minutes | int) * 60}] }}
      loop: "{{ restic_wiring_probe_tenants }}"
      loop_control:
        loop_var: t
        label: "{{ t.tenant }}"

    - name: Build the per-tier severity list (one entry per tier, never per tenant)
      ansible.builtin.set_fact:
        restic_wiring_dump_severities: >-
          {{ restic_wiring_dump_severities
             + [{'tier': tier,
                 'severity': (restic_wiring_probe_tenants
                              | selectattr('tier', 'equalto', tier) | first).severity}] }}
      loop: "{{ restic_wiring_probe_tenants | map(attribute='tier') | unique | sort | list }}"
      loop_control:
        loop_var: tier
        label: "{{ tier }}"

    # --- the tenants this HOST can drill -----------------------------------
    # A drill reads the tenant's own repo and compares the restored scratch
    # against the LIVE tenant. Both exist only where the tenant runs, so the
    # gate is `restic_repo in restic_targets_enabled`: on servy that selects the
    # eight prod tenants; on servyy-test it selects only moodle (whose repo and
    # database exist there), and on codey nothing. That is why the play can be
    # imported from servyy.yml unconditionally: a host without a tenant gets no
    # script and no timer, instead of a timer that fails every week.
    - name: Select the tenants this host can restore-drill
      ansible.builtin.set_fact:
        restic_wiring_drill_tenants: >-
          {{ restic_wiring_drill_tenants
             + [item | combine({'drill_format': (
                  (drill_target.dump_format | default('none'))
                  if (drill_target.dump_format | default('none')) in ['logical', 'physical']
                  else ('logical' if item.engine == 'mariadb' else 'none'))})] }}
      vars:
        drill_target: "{{ (backup_targets | selectattr('name', 'equalto', item.restic_repo) | list | first) | default({}, true) }}"
      loop: "{{ db_tenants | selectattr('drill', 'defined') | rejectattr('drill', 'equalto', 'none') | list }}"
      when: item.restic_repo in (restic_targets_enabled | map(attribute='name') | list)
      loop_control:
        label: "{{ item.tenant }}"

    - name: Publish the generated probe lists and the drill roster
      ansible.builtin.set_fact:
        system_probe_log_checks: "{{ restic_wiring_log_checks }}"
        system_probe_restic_repos: "{{ restic_wiring_snapshot_checks }}"
        system_probe_dump_checks: "{{ restic_wiring_dump_checks }}"
        system_probe_dump_severities: "{{ restic_wiring_dump_severities }}"
        restore_drill_tenants: "{{ restic_wiring_drill_tenants }}"
