# --- servers kept for rollback, with no tenant rows (WP-9) -------------------
# The version guard compares every ACTIVE database server, and it derives that
# set from `db_tenants`. A server that has been retired — every tenant moved off
# it — would therefore disappear from the comparison while its container and
# datadir are still there and still startable for the rollback week. That is
# exactly the window in which a stray pull/manual `docker start` could put a
# different minor line into the fleet unnoticed.
#
# `shared.mongo` (WP-9, 2026-11-19): STOPPED, not removed, and `shared_mongo_data`
# is kept as the rollback copy. Delete this entry in the same change that
# removes the container and the volume (one week after the cutover, WP-9's
# cleanup step) — an entry whose container is gone is a harmless skip, but it
# must not outlive the rollback on purpose.
#
# `compose_dir: ''`: the `mongo:` service is deliberately gone from
# shared/docker-compose.yml, so there is no file to read the intended tag from.
# The guard falls back to the RUNNING tag — the same documented exception as
# leaguesphere.db — and a stopped container still reports its image.
db_retired_servers:
  - container: shared.mongo
    engine: mongo
    compose_dir: ''
    service: ''
    retiring: false
    pinned_tag: ''
  # `shared.db` (WP-10, 2026-11-19): STOPPED, not removed. Its datadir
  # (`${DOCKER_DATA_ROOT}/finance/db`) and the container are the rollback for
  # one month; `docker start shared.db` is the rollback. The `db:` service is
  # deliberately gone from shared/docker-compose.yml, so a `shared` deploy can
  # neither start nor remove it (compose runs without --remove-orphans).
  #
  # `retiring: false` ON PURPOSE: this is the ONLY Postgres server left, so the
  # drift value stays 0 (one image ID = no drift) instead of the engine silently
  # dropping out of the comparison while the container is still startable. The
  # guard still resolves the running tag, which is why the entry can have no
  # compose_dir. Delete this entry in the same change that removes the container
  # and the datadir (step 1/2 of the deletion checklist in the WP-10 history).
  - container: shared.db
    engine: postgres
    compose_dir: ''
    service: ''
    retiring: false
    pinned_tag: ''
