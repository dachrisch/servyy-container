    user: ibs_app
    # 01:05, not 02:30 (WP-8R follow-up, 2026-11-19). 02:30 sat inside the
    # nightly 02:00–04:00 restic window, where it competed with the tier repos'
    # snapshots for the same disk and the same Storage Box link; the plan's
    # schedule table has said 01:05 since 2026-11-18. R8 derives "due" from THIS
