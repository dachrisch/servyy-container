  # --- business: other organisations' data + our business apps -------------
  # WP-7b (2026-11-18): on the business tier. The old app-owned `moodle.db` is
  # stopped and kept (with ${MOODLE_DATA_ROOT}/mariadb) for the one-week rollback,
  # so this row is no longer a `retiring` server: the guard now compares it with
  # the other three 13.0 servers as a fourth.
  #
  # dump_schedule/restic_repo stay as they are ON PURPOSE: the existing
  # `moodle-dump` timer runs a hand-written script that execs into the OLD
  # container (`moodle.db`), so it keeps working right up to the window and then
