    dump_schedule: 'daily 01:05'
    dump_at: '01:05'
    dump_via: dbops
    # WP-8R R7 (2026-11-19): the canonical root, not the app's `.backup/`. Every
    # dump-backed tenant now lives under /home/cda/db-dumps/<tenant>, so ONE rule
    # describes them all: restic snapshots `<dump_dir>/current` (written by a
    # sibling `new/` + atomic swap, floor-checked) and `home` excludes the root.
    # The old flat directory is excluded from `home` as well (vars/restic.yml) —
    # after R7 nothing writes there, and a stale file must not ride the file repo
    # back into a backup whose retention is not this tenant's.
    dump_dir: /home/cda/db-dumps/bnb_office
    # WP-8R R7: a customer's bookkeeping data gets its own repo, like every other
    # business tenant (db-lf, db-queen). See the `db-bnb` backup_targets row.
    restic_repo: db-bnb
    drill: monthly
    # WP-8R R7: the dump now lands in `<dump_dir>/current`, so the dump-age probe
    # takes its PRIMARY path (stat of `current/`) instead of the flat-layout
    # fallback the old `.backup/` directory needed — same 26 h threshold, same
    # `high` severity, and the probe file needs no change (it already prefers
    # `current/` when it exists). 26 h = the daily cadence + slack; high, because
    # ibs is a customer's bookkeeping data and the dump is its only copy.
    size_floor_bytes: 8192
    probe_minutes: 1560
    severity: high
    max_user_connections: 0
    max_statement_time: 0
    # WP-5b: no longer frozen on the old line — it is an ACTIVE server now, so
    # it joins the D8 minor-line equality check with the high and nonprod tiers.
    # All three are mariadb:13.0 (the old 12.3 server is stopped and not a tenant
    # any more).
    retiring: false
    # GUARD-ONLY (WP-5b): the intended tag now comes from the TIER's compose,
    # not from bnb-office/docker-compose.yml — which no longer has a `db`
    # service at all, so the guard would resolve an empty tag and drop the
    # server out of the D8 check silently.
    compose_dir: db-business
    compose_service: mariadb

