---
# Tenant inventory — THE single source of truth for every database tenant from
# WP-3 on. Plan: docs/plans/2026-11-17_db-tier-topology.md (Phase 2, D2/D8/D14).
#
# Seeded (2026-11-18) with the CURRENT placement, so nothing moves: an entry here
# describes where a tenant runs today, not where it will end up. Later phases
# only edit rows (WP-4..WP-9 move `server`, WP-9 retires `shared.mongo`, WP-10
# moves `firefly` to MariaDB and retires `shared.db`).
#
# Schema — one row per TENANT, not per server (several tenants share a server):
#   tenant                stable id, never renamed (history and dumps key off it)
#   tier                  one of: high | nonprod | business | private   (D3)
#   engine                mariadb | mongo | postgres
#   server                container name of the server that holds it
#   db                    database name ON that server (kept when a tenant moves)
#   user                  the tenant's own scoped user (never root — D4)
#   dump_schedule         what runs TODAY: 'hourly', 'daily HH:MM', or 'none'
#   dump_at               the HH:MM the dump timer fires (mirrors dump_schedule;
#                         '' when dump_schedule is none). WP-8R R8: this is the
#                         ONLY place a dump time is written down — `dbops
#                         dump-due <tier>` derives "is this tenant due" from
#                         schedule + this field + the mtime of its `current/`.
#                         'HH:MM' for daily jobs, 'MM' for hourly ones.
#   dump_via              WHICH mechanism produces the dump:
#                           dbops          — `dbops dump <tenant>`, driven by the
#                                            tier's ONE db-backup@<tier> unit (R8)
#                           moodle-dump    — roles/restic/templates/moodle_dump.sh.j2
#                                            (its own unit until WP-8R R9 converges it)
#                           mariadb-backup — the high tier's physical prepared set
#                                            (mariadb-backup-ls + the binlog ship, R5;
#                                            never a logical dump)
#                           none           — nothing dumps this tenant (nonprod only)
#                         WP-8R R8: `db-backup@<tier>` is rendered from THIS field,
#                         so a new tenant is picked up by the tier unit by adding
#                         a row — and an old per-tenant dump unit is removed by the
#                         deploy for every tenant that says dbops.
#   dump_dir              directory the dump lands in ('' = none today); the
#                         CURRENT file lives in <dump_dir>/current, which is what
#                         the restic repo snapshots
#   restic_repo           restic repo that carries dump_dir ('' = none today)
#   size_floor_bytes      below this a fresh dump is treated as broken by the
#                         dump script (0 = no floor). Measured, not guessed: set
#                         well under the healthy size but far above an empty one
#   probe_minutes         dump-age probe threshold for this tenant (0 or absent =
#                         NO series at all — that is how nonprod stays quiet)
#   drill                 restore-drill cadence (WP-8R R11): weekly | monthly | none.
#                         The rule from the plan's Schedules section, applied here:
#                         weekly for the two tenants with a real RTO promise
#                         (leaguesphere, moodle), monthly for every other backed-up
#                         tenant, none for nonprod. `none` emits NO drill series at
#                         all — the same convention as probe_minutes 0 — so the
#                         alert cannot page for a tenant that is not supposed to be
#                         drilled. A tenant with a restic_repo but drill: none is
#                         only legal on the nonprod tier (stage is re-synced
#                         nightly, demo reseeds itself): plays/tasks/restic_wiring.yml
#                         refuses every other shape, because "we stopped drilling it"
#                         must be a decision visible in the inventory, not an omission.
#   severity              high | medium. The probes push it as
#                         `db_dump_severity{tier}`, so the alert rule picks a
#                         severity from THIS ROW: never hardcode one in
#                         monitor/provisioning/alerting/alert-rules.yml
#   max_user_connections  D12 limit; 0 = no limit set yet (WP-3b applies them)
#   max_statement_time    D12 limit in seconds; 0 = no limit set yet
#   retiring              D14: true = stays on its current line, excluded from the
#                         engine equality check, and must NOT leave it
#   compose_dir           GUARD-ONLY: service dir in THIS repo whose
#                         docker-compose.yml is the intended tag source
#                         ('' = another repo: the guard falls back to the tag the
#                         container is actually running)
#   compose_service       GUARD-ONLY: the compose service inside that file
#
# `dump_schedule` / `dump_at` / `dump_via` / `dump_dir` / `restic_repo` mirror the
# timers and scripts that exist today (mariadb-backup-ls, moodle-dump +
# restic-backup-moodle-db, and since WP-5b the bnb dump, which already runs
# through `dbops dump bnb_office`); since WP-8R R3/R4/R6 the nightly `dbops` jobs
# are described here too, and their scripts are RENDERED from this file
# (roles/restic/tasks/backup.yml) rather than hand-wired.
#
# WP-8R R7 (2026-11-19): `bnb_office` no longer rides the `home` FILE repo. Its
# dump moved to the canonical root (/home/cda/db-dumps/bnb_office) and its own
# repo (`db-bnb`), because a customer's bookkeeping data inside a file backup is
# the wrong scope twice over: `home`'s retention (48 hourly + 14 daily) is not the
# tenant's, and a timestamped dump file inside an hourly file snapshot makes
# `restic diff` churn on bytes that never change for a day. Every dump-backed
# tenant now lives under `/home/cda/db-dumps/<tenant>/current` — one root, one
# rule: a dump is snapshotted by the tenant's repo and by nothing else.
#
# WP-8R R8 (2026-11-19): ONE `db-backup@<tier>` unit per tier replaces the
# per-tenant `db-dump-<tenant>.timer/.service` pairs. The unit runs every 5
# minutes and asks `dbops dump-due <tier>` who is due (from `dump_schedule` +
# `dump_at` + the mtime of `<dump_dir>/current`), then runs each tenant's
# existing dump script in turn under one flock, so a failure is isolated per
# tenant and a killed dump leaves `current/` at the last good set. The dump
# TIMES stay exactly as declared here — nothing re-hardcodes them.
#
# The `size_floor_bytes` / `probe_minutes` / `severity` facts appear here AND on
# the tenant's `backup_targets` row. That duplication is deliberate and guarded:
# `plays/tasks/restic_wiring.yml` fails the run when the two disagree, so a floor
# can never be lowered in one place and leave the dump script and the probe
# reading different thresholds. The tenant row is what the dump script reads; the
# target row is what the probe generator and the retention read.
#
# The guard groups rows by `server`, so several tenants on one server produce one
# entry in its per-server check (shared.mongo holds three, shared.db one).
# A server counts as `retiring` only when every tenant on it is.
#
# --- restic wiring (WP-8R R1): `backup_targets` + `retention_profiles` --------
# This file is the GENERATOR for the restic wiring. Before R1 a new repo meant
# hand edits in 12 places across 9 files (vars/restic.yml, roles/restic/defaults,
# roles/restic/tasks/backup.yml, the two system templates, the two system_probe
# lists, and an alert-rule name chain). The lists below are now derived from
# `backup_targets`; the only remaining hand-written parts are the repo's own
# transport details in vars/restic.yml (repository URL, password, source path,
# excludes) and its backup task in roles/restic/tasks/backup.yml, which differ
# per repo by nature.
#
# WP-8R R2 closed the last of the twelve: the alert file no longer names a repo,
# a tenant or a threshold. The probes push `restic_snapshot_threshold_seconds`,
# `restic_snapshot_severity`, `db_dump_age_seconds`, `db_dump_threshold_seconds`,
# `db_dump_severity` and `system_log_threshold_seconds`, and the Grafana rules
# are comparisons against them. Adding a row below therefore adds an ALERTING
# backup; nothing in monitor/provisioning/alerting/ needs an edit — and it must
# not start needing one again (see monitor/AGENTS.md).
#
# ONE ROW PER RESTIC REPO (not per tenant — `moodle` has two: files and db):
#   name                     repo key, = `restic.<name>` and `<repo>` in restic.yml
#   kind                     files | db-dump  (what the repo holds)
#   tenant                   tenant id from `db_tenants`, or null for a host repo
#   enabled_by               always | leaguesphere | moodle | servy
#                            (`servy` = the app exists on servy only: photoprism,
#                            the two mongo business tenants and firefly)
#   cadence                  hourly | daily HH:MM | none   (dump cadence TODAY)
#   dump_at                  when the dump step runs ('40', '01:20'), null if none
#   dump_format              physical | logical | none
#   retention                name in `retention_profiles` (never an inline map, so
#                            a typo fails the run instead of silently pruning at
#                            the wrong rate)
#   probe_minutes            snapshot-age probe threshold; 0 = no series
#   severity                 high | medium, pushed as `restic_snapshot_severity`
#                            and compared by the alert rule (the rule holds no
#                            name and no severity of its own)
#   size_floor_bytes         below this a fresh snapshot is treated as broken;
#                            0 = no floor (R2/R3 use it)
#   log_key                  key in `restic.logs` of this repo's backup log
#   log_label                metric label of the log-freshness check
#                            (`restic-backup-ls-db` for the repo `db`: the label
#                            names the dump job, not the repo)
#   log_threshold_seconds    log-freshness threshold (scheduler-alive signal)
#   dump_log_key             optional: key in `restic.logs` of the DUMP script's
#                            log (a dump is not a repo; its log proves the timer
#                            fires while the snapshot probe proves the data lands)
#   dump_log_threshold_seconds
#   comment                  optional policy note rendered above this repo in the
#                            forget script (kept next to the policy it explains)
#
# Values below are TODAY's reality, copied from the timers and scripts that run,
# deliberately not a new policy: R3/R4/R6 change some of them with their moves.
retention_profiles:
  # Named GFS keep-maps (restic forget flags). Order is the render order:
  # last, hourly, daily, weekly, monthly; `keep_tag` (optional) is emitted first.
  host_hourly:
    last: 24
    hourly: 48     # ~2 days of hourly
    daily: 14
    weekly: 8
    monthly: 6
  host_daily:
    last: 7
    daily: 30      # daily backup -> no hourly bucket
    weekly: 12
    monthly: 12
  db_hourly:
    last: 48
    hourly: 72     # 3 days of hourly
    daily: 30      # a month of dailies
    weekly: 12
    monthly: 12
  files_daily:
    keep_tag: baseline   # a manual `restic tag --add baseline` outlives the buckets
    last: 7
    daily: 7
    weekly: 4
    monthly: 6
  dump_hourly:
    keep_tag: baseline
    last: 24
    hourly: 24
    daily: 14
    weekly: 8
    monthly: 6
  # WP-8R R3/R4/R6: daily dumps, 30 dailies + 8 weekly + 6 monthly.
  db_daily:
    last: 7
    daily: 30
    weekly: 8
    monthly: 6
  # 14 dailies + 4 weekly: Firefly's retention, chosen while it was an interim
  # postgres tenant. WP-10 kept it UNCHANGED on purpose: the move's contract is
  # that the repo/dump path is byte-identical, and changing retention in the
  # same package would make the "a dump still lands in the same repo" proof
  # ambiguous. Revisit as its own change now that firefly is a permanent
  # MariaDB tenant.
  db_daily_short:
    last: 7
    daily: 14
    weekly: 4
  # WP-8R R5: the binlog tail (5-minute snapshots). `keep_within` is a DURATION,
  # not a count: the meaning here is "2 days", which must equal the server's own
  # `expire_logs_days=2` (measured: binlog_expire_logs_seconds=172800). A count
  # (576) would silently mean a different window the moment the cadence changes,
  # and the cadence and this number are the pair that keeps a restore inside the
  # window. The ship script re-reads the server's value every run and FAILS when
  # the two diverge in either direction, so this is enforced, not documented.
  binlog_5min:
    keep_within: 2d

backup_targets:
  - name: home
    kind: files
    tenant: null
    enabled_by: always
    cadence: hourly
    dump_at: null
    dump_format: none
    retention: host_hourly
    probe_minutes: 120            # hourly backup -> 2 h
    severity: medium
    size_floor_bytes: 0
    log_key: backup_home
    log_label: restic-backup-home
    log_threshold_seconds: 7200
    dump_log_key: null

  - name: root
    kind: files
    tenant: null
    enabled_by: always
    cadence: daily
    dump_at: '00:00'
    dump_format: none
    retention: host_daily
    probe_minutes: 1500           # daily backup -> 25 h
    severity: medium
    size_floor_bytes: 0
    log_key: backup_root
    log_label: restic-backup-root
    log_threshold_seconds: 90000
    dump_log_key: null

  - name: db
    kind: db-dump
    tenant: leaguesphere
    enabled_by: leaguesphere
    cadence: hourly
    dump_at: '40'                 # mariadb-backup, :40 past every hour
    dump_format: physical
    retention: db_hourly
    probe_minutes: 120
    severity: high
    size_floor_bytes: 0
    log_key: backup_ls_db
    log_label: restic-backup-ls-db
    log_threshold_seconds: 7200
    dump_log_key: null

  # --- WP-8R R5: the binlog tail (the second half of the high tier's PITR) ----
  # The `db` repo above is the hourly BASE: one prepared set per hour. This repo
  # is everything that happened between two sets. Restore = newest set + replay
  # these binlogs to the target instant, which is why the pair has to be
  # snapshotted at different cadences and must never be pruned independently.
  #
  # DO NOT raise `probe_minutes` to "avoid noise" and DO NOT slow the cadence.
  # 5 minutes IS the recovery point objective: the newest shipped binlog is the
  # newest instant a restore can reach, so the window between the last shipped
  # event and now is data that does not survive a disaster. 20 minutes = four
  # consecutive misses, which is the smallest value that cannot page on a single
  # slow run — not a tolerance for a ship that stops happening.
  #
  # `retention: binlog_5min` (2 d) and the server's `expire_logs_days=2` are a
  # PAIR: binlog_ship.sh.j2 reads the server's live value every run and exits
  # non-zero when the two diverge, because a repo that keeps less than the server
  # retains silently shortens the window while every snapshot dashboard stays
  # green. That failure deliberately does not refresh the stage's marker, so
  # restic's stale guard turns it into a missing snapshot (and a page).
  - name: ls-binlog
    kind: db-dump
    tenant: leaguesphere
    enabled_by: leaguesphere
    cadence: 'every 5 minutes'
    dump_at: null
    dump_format: none
    retention: binlog_5min
    probe_minutes: 20
    severity: high
    size_floor_bytes: 0
    log_key: backup_ls_binlog
    log_label: restic-backup-ls-binlog
    log_threshold_seconds: 1800
    dump_log_key: binlog_ship
    dump_log_label: binlog-ship
    dump_log_threshold_seconds: 1800

  - name: moodle-files
    kind: files
    tenant: moodle
    enabled_by: moodle
    cadence: daily
    dump_at: '01:20'
    dump_format: none
    retention: files_daily
    probe_minutes: 1500
    severity: medium
    size_floor_bytes: 0
    log_key: backup_moodle_files
    log_label: restic-backup-moodle-files
    log_threshold_seconds: 90000
    dump_log_key: null
    comment: |
      # Moodle files (daily) and Moodle DB dumps (hourly) live in SEPARATE repos with
      # their own retention — the file set is content-addressed and cheap to keep, the
      # hourly dump is replaceable but is the only copy of the DB rows.
      #
      # `--keep-tag baseline` makes a manual `restic tag --add baseline <id>` a real
      # pin: the pre-cutover baseline pair (files + dump) must outlive the GFS buckets
      # (which would drop it after ~6 monthly runs). Verified combinable with the
      # repo's own `--tag` filter on restic 0.18 (2026-11-06).

  - name: moodle-db
    kind: db-dump
    tenant: moodle
    enabled_by: moodle
    cadence: hourly
    dump_at: '40'                 # moodle-dump.sh at :40; the snapshot is at :50
    dump_format: logical
    retention: dump_hourly
    probe_minutes: 120
    # high, not medium: this is the only copy of the Moodle DB rows and the alert
    # it replaces (stale_restic_db_snapshot) was HIGH. Since R2 the severity is
    # read from here instead of from the rule, so "unchanged behaviour" means this
    # word stays high.
    severity: high
    size_floor_bytes: 10485760    # moodle-dump.sh refuses a dump below 10 MiB
    log_key: backup_moodle_db
    log_label: restic-backup-moodle-db
    log_threshold_seconds: 7200
    dump_log_key: moodle_dump
    dump_log_label: moodle-dump
    dump_log_threshold_seconds: 7200

  # --- WP-8R R4: PhotoPrism (private tier). A raw datadir is not a backup; the
  # stopped pre-cutover datadir rides the home repo, which is not restorable as a
  # database. This repo is the first real protection of its 1 014 albums.
  - name: db-private
    kind: db-dump
    tenant: photoprism
    enabled_by: servy
    cadence: daily
    dump_at: '00:45'
    dump_format: logical
    retention: db_daily
    probe_minutes: 1560           # 26 h: a daily dump + slack
    severity: medium
    # 50 MiB: the healthy dump measured 107 336 589 B on 2026-11-18 (103 MB); an
    # empty photoprism schema gzips to <1 KB, so anything under this is a defect,
    # not a small backup. (The WIP used one blanket 1 MiB floor for all five
    # tenants, which four of them could never reach: their dumps are 11-414 KB.)
    size_floor_bytes: 52428800
    log_key: backup_db_private
    log_label: restic-backup-db-private
    log_threshold_seconds: 93600
    dump_log_key: db_dump_photoprism
    dump_log_label: dump-photoprism
    dump_log_threshold_seconds: 93600

  # --- WP-8R R6: the two business mongo tenants. One repo each: a business
  # tenant must be hand-over-able on its own (owner decision, WP-8R).
  - name: db-lf
    kind: db-dump
    tenant: leagues_finance
    enabled_by: servy
    cadence: daily
    dump_at: '01:15'
    dump_format: logical
    retention: db_daily
    probe_minutes: 1560
    severity: high
    # 4 KiB: measured 11 644 B. An empty mongodump archive is 136 B, so this
    # catches "dumped nothing" while leaving room for the tenant to shrink.
    size_floor_bytes: 4096
    log_key: backup_db_lf
    log_label: restic-backup-db-lf
    log_threshold_seconds: 93600
    dump_log_key: db_dump_leagues_finance
    dump_log_label: dump-leagues_finance
    dump_log_threshold_seconds: 93600

  - name: db-queen
    kind: db-dump
    tenant: queen
    enabled_by: servy
    cadence: daily
    dump_at: '01:25'
    dump_format: logical
    retention: db_daily
    probe_minutes: 1560
    severity: high
    size_floor_bytes: 8192        # measured 28 812 B; an empty archive is 136 B
    log_key: backup_db_queen
    log_label: restic-backup-db-queen
    log_threshold_seconds: 93600
    dump_log_key: db_dump_queen
    dump_log_label: dump-queen
    dump_log_threshold_seconds: 93600

  # --- WP-8R R7: bnb_office's own repo (business tenant, customer data) ------
  # Until R7 this tenant had NO repo: `restic_repo: home` pointed at the file
  # backup, and the dumps were flat timestamped files in
  # `servyy-container/bnb-office/.backup` (one `.sql.gz` per run, no `current/`).
  # Three consequences, all measured on 2026-11-19: the customer's bookkeeping
  # data sat inside a FILE scope; `home` re-uploaded the dump bytes every hour
  # (a new timestamped name is new data even when the SQL is identical); and the
  # dump inherited `home`'s retention (48 hourly / 14 daily) instead of the
  # tenant's.
  #
  # Name: `db-bnb` — the same short form as `db-lf` (leagues_finance) and
  # `db-queen`, and NOT derived from the container/dir name, so it stays stable
  # if the app is ever renamed. Retention `db_daily` is the plan's decision
  # (2026-11-18): bnb keeps the same profile as the private tenants —
  # 30 dailies + 8 weekly + 6 monthly — because the repo IS the artefact for a
  # customer's bookkeeping data. It is a named profile, not an inline map, so a
  # typo fails plays/tasks/restic_wiring.yml instead of pruning at the wrong rate.
  - name: db-bnb
    kind: db-dump
    tenant: bnb_office
    enabled_by: servy
    cadence: daily
    dump_at: '02:30'
    dump_format: logical
    retention: db_daily
    probe_minutes: 1560
    severity: high
    # 8 KiB: measured 52 372 B (2026-11-18) / 52 357 B (2026-11-19). An empty
    # `mariadb-dump --databases` of a schema with tables still gzips to a few KiB,
    # so this catches "dumped the wrong (empty) database" while leaving 6x room
    # for the tenant's data to shrink.
    size_floor_bytes: 8192
    log_key: backup_db_bnb
    log_label: restic-backup-db-bnb
    log_threshold_seconds: 93600
    dump_log_key: db_dump_bnb_office
    dump_log_label: dump-bnb_office
    dump_log_threshold_seconds: 93600

  # --- WP-8R R6: dontforget (private tier). Its own repo, like every other
  # tenant: `db-private` belongs to PhotoPrism, and a repo per tenant is what
  # makes one tenant's disaster not touch another's history. All five share the
  # D16 password (restic_password_db), so this costs no extra secret.
  - name: db-private-mongo
    kind: db-dump
    tenant: dontforget
    enabled_by: servy
    cadence: daily
    dump_at: '01:35'
    dump_format: logical
    retention: db_daily
    probe_minutes: 1560
    severity: medium
    size_floor_bytes: 8192        # measured 24 771 B; an empty archive is 136 B
    log_key: backup_db_private_mongo
    log_label: restic-backup-db-private-mongo
    log_threshold_seconds: 93600
    dump_log_key: db_dump_dontforget
    dump_log_label: dump-dontforget
    dump_log_threshold_seconds: 93600

  # WP-10 (2026-11-19): firefly moved to db-private.mariadb. The repo, the dump
  # dir, the floor and the drill cadence are UNCHANGED — the tenant's repo is
  # its history, and the dump script switched from the interim pg_dump to
  # `dbops dump firefly` in the same `current/`. The pg_dump is kept only for
  # the one-month rollback; delete this repo only with the postgres cleanup
  # checklist (history/2026-11-19_db-tier-wp10-postgres.md).
  - name: db-private-firefly
    kind: db-dump
    tenant: firefly
    enabled_by: servy
    cadence: daily
    dump_at: '01:45'
    dump_format: logical
    retention: db_daily_short
    probe_minutes: 1560
    severity: medium
    # 128 KiB: measured 414 050 B. An empty pg_dump -Fc archive is 888 B.
    size_floor_bytes: 131072
    log_key: backup_db_private_firefly
    log_label: restic-backup-db-private-firefly
    log_threshold_seconds: 93600
    dump_log_key: db_dump_firefly
    dump_log_label: dump-firefly
    dump_log_threshold_seconds: 93600

db_tenants:
  # --- high: LeagueSphere core production ---------------------------------
  - tenant: leaguesphere
    tier: high
    engine: mariadb
    server: leaguesphere.db
    # Read from the jail's rendered ls.env (MYSQL_DB_NAME) and the container env,
    # not guessed: prod's database is web35_db8 owned by web35_8.
    db: web35_db8
    user: web35_8
    # Physical mariadb-backup (hourly) + binlog PITR — not a logical dump (D10).
    dump_schedule: hourly
    dump_at: '40'
    # R8: NOT a `dbops` tenant, and it must never become one by accident — the
    # high tier's protection is the physical prepared set plus the 5-minute
    # binlog tail (R5), and both have their own units.
    dump_via: mariadb-backup
    dump_dir: /var/jail/home/leaguesphere/container/deployed/mysql-backup/current
    restic_repo: db
    drill: weekly
    # WP-8R R2b: measured by the dump-age probe, not assumed. `current` is an
    # atomic swap (`mv new current` in mariadb_backup.sh.j2, hourly at :40), so
    # its mtime IS the moment the prepared set was refreshed; and while the set
    # is root-only inside, the directory itself is 0755 root:root, so the probe's
    # `cda` stat() succeeds. Nothing else covers this case: if mariadb-backup
    # fails, restic keeps re-uploading the unchanged `current/` every hour, so
    # `restic_snapshot_age_seconds{repo="db"}` stays fresh and only a dump-age
    # series can see it. 120 min matches the repo's own snapshot threshold; high
    # because this is production data with a physical + binlog recovery story.
    probe_minutes: 120
    severity: high
    max_user_connections: 0
    max_statement_time: 0
    retiring: false
    # Other repo: the guard compares the RUNNING tag (documented exception).
    compose_dir: ''
    compose_service: ''

  # --- nonprod: LeagueSphere stage + demo (disposable) ---------------------
  # WP-4b: moved to the nonprod tier (data copied and verified in WP-4b1:
  # 208 tables / 950,028 rows, zero mismatches). This row is the switch the
