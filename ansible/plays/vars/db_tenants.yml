  # tier (see the runbook in docs/plans/2026-11-18_db-tier-work-packages.md);
  # until then this row describes the cadence and the repo, not the target.
  - tenant: moodle
    tier: business
    engine: mariadb
    server: db-business.mariadb
    db: moodle
    user: moodle
    dump_schedule: hourly
    dump_at: '40'
    # R8: `moodle-dump` (roles/restic/templates/moodle_dump.sh.j2, its own timer)
    # until WP-8R R9 converges it on dbops. The plan is explicit: do NOT converge
    # Moodle inside its WP-7b rollback window (closes ~2026-11-25). When R9 runs,
    # this word becomes `dbops` (plus dump_dir/dump_at) and the tier unit picks
    # the tenant up with no other edit — the business tier already has its unit.
    dump_via: moodle-dump
    dump_dir: /home/cda/servyy-container/moodle/data/db-backup/current
    restic_repo: moodle-db
    drill: weekly
    # WP-8R R2b: NO probe_minutes/severity — deliberately, and it is a measured
    # limitation, not an oversight. The probe runs as `cda` (user timer
    # system-db-dump-age.timer) and `.../moodle/data/` is 0750 root:root, so
    # stat() on the dump dir is refused: a row here would emit -1 and page high
    # forever (a permanent false positive, the opposite of coverage). What it
    # would take: run this one check as root (system unit) or grant the probe a
    # sudoers/ACL stat on that path.
    # The condition is NOT silent meanwhile: `restic['moodle-db']` carries the
    # stale-source guard (roles/restic/tasks/backup.yml,
    # stale_guard_max_age_minutes: 120), so a dump that stops refreshing FAILS
    # the restic-backup-moodle-db job, and stale_restic_snapshot_high then pages
    # on `repo="moodle-db"` at 2 h. Different signal (the snapshot fails rather
    # than the dump ageing), same condition, and it only works because of that
    # guard — do not drop the guard without adding a dump-age series first.
    max_user_connections: 0
    max_statement_time: 0
    retiring: false
    compose_dir: db-business
    compose_service: mariadb

  - tenant: bnb_office
