---
local_user: "{{ lookup('env', 'USER') }}"
remote_user_home: "{{ ('/home/', create_user) | path_join }}"
remote_user_systemd: "{{ (remote_user_home, '.config/systemd/user') | path_join }}"
copy_local_key: "{{ lookup('file', lookup('env','HOME') + '/.ssh/id_rsa.pub') }}"
sys_packages:
  - monit                       # server monitoring
  - jq                          # json parsing
  - curl
  - vim
  - git
  - zsh                         # default shell
  - cifs-utils                  # storagebox
  - git-crypt                   # encrypt files in git
  - locales                     # language options
  - linux-image-generic         # image + extras
  - btop                        # better top
  - binutils                    # ar
  - docker.io                   # docker engine
  - docker-compose-v2           # docker compose plugin
  - docker-buildx               # docker buildx plugin
  - restic                      # backup tool with deduplication
  - sshpass                     # SFTP authentication for restic

# Per-host override: set `swap_space_override` on a host in ansible/production
# (e.g. codey.lehel.xyz has less disk, so it runs a smaller swapfile).
swap_space: "{{ swap_space_override | default('10G') }}"

storagebox:
  file: /etc/storagebox.cred
  mount: /mnt/storagebox
  remote: "//{{storagebox_credentials.host}}/{{storagebox_credentials.share}}"
  fstype: cifs

backup_dir: "{{(storagebox.mount, 'backup', inventory_hostname) | path_join}}"

extension_drive:
  path: /mnt/10g_volume
  device: /dev/disk/by-id/scsi-0HC_Volume_101343964
  fstype: ext4
  opts: discard,defaults

# Journal log retention (declarative)
journald:
  system_max_use: 500M
  max_retention_sec: 4week
  max_file_size: 100M

# Docker cleanup (aggressive, weekly)
docker_cleanup:
  enabled: true
  schedule: 'Sun 02:00'  # After PhotoPrism backup, before home backup
  log_file: '/var/log/docker-cleanup.log'
  prune_flags: '-a -f --volumes'  # Aggressive: all unused images + volumes

# Claude Hub session parking + long-tail force-cleanup run on codey's Ofelia
# scheduler (labels on claude-hub.hub) since 2026-09-27 -- the systemd units
# were torn down, no vars needed here. See
# history/2026-09-27_codey-ofelia-scheduler.md.

# runc LXC fix (CVE-2025-52881 workaround)
# runc 1.3.3 breaks Docker in LXC containers; auto-unhold when this version is available
runc_safe_version: "1.4.0"

# Apt package upgrades (unattended-upgrades, daily)
apt_upgrade:
  enabled: true
  run_time: '05:00'     # apt-daily-upgrade.timer fixed run time, after nightly restic backups
  reboot_time: '05:30'  # Automatic-Reboot-Time - only if a reboot-requiring update was installed

# Kernel cleanup (monthly)
kernel_cleanup:
  enabled: true
  schedule: 'Sun *-*-1..7 01:00'  # 1st Sunday of month, 01:00 UTC
  script_path: '/usr/local/bin/kernel-cleanup.sh'
  log_file: '/var/log/kernel-cleanup.log'
  description: 'Remove old kernel packages'

# Security audit (monthly)
security_audit:
  enabled: true
  schedule: 'Sun *-*-1..7 04:00'  # 1st Sunday of month, 04:00 UTC
  log_dir: '/var/log/security-audit'
  script_dir: '/opt/security-audit'
  tools:
    lynis: true
    docker_bench: true
    trivy: true
    nmap: true
    testssl: true
    humble: true
    nuclei: true

# Host hardening (Lynis-driven). See docs/plans/2026-10-08-host-hardening-p6.md
hardening:
  enabled: true
  # Optional monitoring/integrity tooling (medium risk) - toggle per host.
  audit: true
  aide: true
  malware: true
  # Docker-safe sysctl values. Deliberately excludes net.ipv4.conf.all.forwarding
  # (Docker needs it) and kernel.modules_disabled (breaks dynamic module load).
  sysctl:
    fs.protected_fifos: 2
    fs.suid_dumpable: 0
    kernel.kptr_restrict: 2
    kernel.sysrq: 0
    net.core.bpf_jit_harden: 2
    net.ipv4.conf.all.log_martians: 1
    net.ipv4.conf.all.rp_filter: 1
    net.ipv4.conf.all.send_redirects: 0
    net.ipv4.conf.default.accept_redirects: 0
    net.ipv4.conf.default.log_martians: 1
    net.ipv6.conf.all.accept_redirects: 0
    net.ipv6.conf.default.accept_redirects: 0
  ssh:
    PermitRootLogin: prohibit-password
    MaxAuthTries: 3
    MaxSessions: 2
    ClientAliveCountMax: 2
    LogLevel: VERBOSE
    TCPKeepAlive: no
    # local (not no): blocks remote (-R) forwarding but keeps local (-L) tunnels
    # for admins and the dbeaver_stage Match block.
    AllowTcpForwarding: local
    AllowAgentForwarding: no
  login_defs:
    UMASK: "027"
    PASS_MIN_DAYS: "1"
    PASS_MAX_DAYS: "365"
  disabled_protocols:
    - dccp
    - sctp
    - rds
    - tipc
  packages:
    - debsums
    - apt-show-versions
    - libpam-tmpdir
    - libpam-pwquality

# mkcert - Local CA for test environments
mkcert:
  cert_dir: /etc/ssl/mkcert
  domains:
    - "servyy-test.lxd"
    - "*.servyy-test.lxd"
    - "localhost"
    - "127.0.0.1"
    - "::1"

# --- Cross-role topology flags (single source of truth) ---------------------
# leaguesphere_enabled: does this host run LeagueSphere (jail + prod DB)?
# Owns ALL db/ls-db scoping: restic db repo + backup timers, system_probe db
# entries, restic forget/check db sections. Derived from inventory
# `services_enabled.leaguesphere` (servy: true, codey: absent/false) — the same
# guard `leaguesphere.yml` uses for end_host.
# NOTE: renders as a string via Jinja; ALWAYS consume with `| bool`.
leaguesphere_enabled: "{{ services_enabled.leaguesphere | default(false) }}"

# Monitor stack identity (non-secret).
# NOTE: the admin email lives in vars/secrets.yml as `monitor_admin_email` —
# this file is public (not git-crypt encrypted), so no email addresses here.
# The Loki tenant ID is already public (docs, promtail/datasource configs).
monitor:
  loki_tenant: "servyy-logs-k8x9m2p4q7"
