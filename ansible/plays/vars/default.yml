---
local_user: "{{ lookup('env', 'USER') }}"
remote_user_home: "{{ ('/home/', create_user) | path_join }}"
remote_user_systemd: "{{ (remote_user_home, '.config/systemd/user') | path_join }}"
copy_local_key: "{{ lookup('file', lookup('env','HOME') + '/.ssh/id_rsa.pub') }}"
sys_packages:
  - monit                       # server monitoring
  - jq                          # json parsing
  - curl
  - vim
  - git
  - zsh                         # default shell
  - cifs-utils                  # storagebox
  - git-crypt                   # encrypt files in git
  - locales                     # language options
  - linux-image-generic         # image + extras
  - btop                        # better top
  - binutils                    # ar
  - docker.io                   # docker engine
  - docker-compose-v2           # docker compose plugin
  - docker-buildx               # docker buildx plugin
  - restic                      # backup tool with deduplication
  - sshpass                     # SFTP authentication for restic

# Per-host override: set `swap_space_override` on a host in ansible/production
# (e.g. codey.lehel.xyz has less disk, so it runs a smaller swapfile).
swap_space: "{{ swap_space_override | default('10G') }}"

storagebox:
  file: /etc/storagebox.cred
  mount: /mnt/storagebox
  remote: "//{{storagebox_credentials.host}}/{{storagebox_credentials.share}}"
  fstype: cifs

backup_dir: "{{(storagebox.mount, 'backup', inventory_hostname) | path_join}}"

extension_drive:
  path: /mnt/10g_volume
  device: /dev/disk/by-id/scsi-0HC_Volume_101343964
  fstype: ext4
  opts: discard,defaults

# Journal log retention (declarative)
journald:
  system_max_use: 500M
  max_retention_sec: 4week
  max_file_size: 100M

# Docker cleanup (aggressive, weekly)
docker_cleanup:
  enabled: true
  schedule: 'Sun 02:00'  # After PhotoPrism backup, before home backup
  log_file: '/var/log/docker-cleanup.log'
  prune_flags: '-a -f --volumes'  # Aggressive: all unused images + volumes

# Claude Hub session reaper (every 15min) — docker exec claude-hub.hub node
# /opt/vendor/skills/session-reaper/scripts/session-reaper.mjs --action run --text
# Parks idle/never-prompted/cleared sessions (reversible via revive); does NOT delete anything --
# see claude_hub_force_cleanup below for the long-tail disk-growth backstop.
claude_hub_reaper:
  enabled: true
  every_minutes: 15
  log_file: '/var/log/claude-hub-reaper.log'

# Claude Hub force-cleanup backstop (weekly) — docker exec claude-hub.hub sh
# /scripts/force-cleanup-stale.sh. Force-closes (via session-reaper.mjs --action close, never
# hand-rolled deletion) sessions parked longer than `days` — a deliberate, infra-specific
# exception to "never close on a timeout"; still refuses a dirty worktree, still always keeps
# branches. See history/2026-09-26_claude-hub-worktree-dispatch-rework.md.
claude_hub_force_cleanup:
  enabled: true
  days: 75
  schedule: 'Sun 06:00'  # After the 02:00-04:00 backup window, Sun 02:00 docker-cleanup, and the
                         # 05:00/05:30 daily apt-upgrade/reboot window
  log_file: '/var/log/claude-hub-force-cleanup.log'

# runc LXC fix (CVE-2025-52881 workaround)
# runc 1.3.3 breaks Docker in LXC containers; auto-unhold when this version is available
runc_safe_version: "1.4.0"

# Apt package upgrades (unattended-upgrades, daily)
apt_upgrade:
  enabled: true
  run_time: '05:00'     # apt-daily-upgrade.timer fixed run time, after nightly restic backups
  reboot_time: '05:30'  # Automatic-Reboot-Time - only if a reboot-requiring update was installed

# Kernel cleanup (monthly)
kernel_cleanup:
  enabled: true
  schedule: 'Sun *-*-1..7 01:00'  # 1st Sunday of month, 01:00 UTC
  script_path: '/usr/local/bin/kernel-cleanup.sh'
  log_file: '/var/log/kernel-cleanup.log'
  description: 'Remove old kernel packages'

# Security audit (monthly)
security_audit:
  enabled: true
  schedule: 'Sun *-*-1..7 04:00'  # 1st Sunday of month, 04:00 UTC
  log_dir: '/var/log/security-audit'
  script_dir: '/opt/security-audit'
  tools:
    lynis: true
    docker_bench: true
    trivy: true
    nmap: true
    testssl: true
    humble: true
    nuclei: true

# mkcert - Local CA for test environments
mkcert:
  cert_dir: /etc/ssl/mkcert
  domains:
    - "servyy-test.lxd"
    - "*.servyy-test.lxd"
    - "localhost"
    - "127.0.0.1"
    - "::1"
