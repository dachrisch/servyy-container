---
# Restic backup configuration.
#
# OWNERSHIP: the restic role owns this file. It is kept at play level (rather
# than in roles/restic/defaults/) because three roles consume it in the same
# play without including each other: `restic` (backup/init), `system`
# (restic_maintenance forget/check scripts), and `system_probe`
# (log-freshness + snapshot-age probes). Role defaults are invisible across
# roles, so this file is the documented cross-role contract. Thresholds that
# Grafana evaluates are mirrored in monitor/provisioning/alerting/alert-rules.yml.
#
# DB SCOPING: the `db` repo (LeagueSphere prod DB under /var/jail/...) exists
# ONLY where LeagueSphere runs. Its presence is governed by `leaguesphere_enabled`
# (vars/default.yml, derived from services_enabled.leaguesphere) — NOT by a flag
# in this file. Every db consumer must gate on that flag.
#
# MOODLE SCOPING: the two `moodle-*` repos exist ONLY where Moodle runs
# (`moodle_enabled`, same file/mechanism). They are deliberately SEPARATE repos
# rather than one repo with two tags:
#   * the DB stream is hourly and small, the file stream is daily and ~6 GB —
#     separate repos keep a lock/prune on one from blocking the other;
#   * system_probe reports one snapshot age per repo, so a single repo would
#     hide stale files behind a fresh hourly DB snapshot.
# Both use the same password (restic_password_moodle).
# NOTE: repo names contain a dash — dereference them with `restic['moodle-files']`,
# never attribute syntax.
restic:
  # Home directory backup (hourly)
  home:
    enabled: true
    repository: "sftp://storagebox/{{ storagebox_credentials.share }}/{{ inventory_hostname }}/restic-home"
    password: "{{ restic_password_home }}"
    source_path: "{{ remote_user_home }}"
    excludes:
      # Version control
      - '**/.git'
      - '**/.git/worktrees'
      - '.zprezto/.git'

      # Caches (use restic's --exclude-caches for CACHEDIR.TAG)
      - '.cache'
      - '**/.cache'
      - '**/node_modules'
      - '**/__pycache__'
      - '**/.pytest_cache'
      - '**/.mypy_cache'
      - '**/.tox'
      - '**/.venv'

      # Build artifacts
      - '**/target'        # Rust
      - '**/dist'
      - '**/build'

      # Large data directories
      - 'pgdata'
      - 'go/pkg'           # Go packages cache
      - 'go/bin'

      # Moodle: moodledata (~6 GB) and the MariaDB datadir live in the service
      # dir. Two independent reasons to keep them out of the hourly home repo:
      #   * the dataroot is root:root 0750 (files owned by 65534) — this job runs
      #     unprivileged and cannot read it at all;
      #   * a snapshot of a live database is worthless and uploading a 6 GB file
      #     tree hourly is wasteful.
      # They have dedicated scopes instead: `moodle-files` (daily snapshot) and
      # `moodle-db` (hourly logical dump), both under `moodle_enabled`.
      - 'servyy-container/moodle/data'

      # OpenCode's bind-mounted SSH dir. The container runs as root and writes
      # id_github/id_servy/known_hosts as root, so the backup user cannot read
      # them and restic aborts the whole home snapshot with exit 3 (measured
      # 2026-11-06 on codey + servyy-test). They are deploy artifacts with their
      # own seed files in plays/vars/ and a Vaultwarden copy — not home data.
      - 'servyy-container/opencode/.ssh'

      # Temporary files
      - '**/*.tmp'
      - '**/*.swp'
      - '**/*~'

      # Unreadable by unprivileged home backup (container-owned secret, uid 977)
      - 'servyy-container/searxng/core-config/settings.yml'

  # Root filesystem backup (daily)
  root:
    enabled: true
    repository: "sftp://storagebox/{{ storagebox_credentials.share }}/{{ inventory_hostname }}/restic-root"
    password: "{{ restic_password_root }}"
    source_path: "/"
    includes:
      - /etc           # System configuration
      - /var           # Variable data
    excludes:
      # System pseudo-filesystems
      - /proc
      - /sys
      - /dev
      - /run
      - /tmp
      - /mnt
      - /media

      # Container runtime layers (NEVER backup - rebuildable)
      - /var/lib/docker
      - /var/lib/containerd

      # Caches
      - /var/cache
      - /var/tmp
      - /var/lib/snapd/cache

      # Logs (rebuildable / handled by journald retention)
      - /var/log

      # LXD runtime namespace pseudo-files (unreadable, cause restic exit 3)
      - /var/snap/lxd/common/ns

      # Sockets and swap
      - '*.sock'
      - 'swap.img'
      - '*.swap'

  # LeagueSphere prod DB backup (hourly).
  # Scoped by `leaguesphere_enabled`, not by a flag here: there is deliberately
  # NO `enabled` key on this repo — consumers (restic init/backup tasks,
  # system_probe defaults, forget/check templates) gate on that flag instead.
  db:
    repository: "sftp://storagebox/{{ storagebox_credentials.share }}/{{ inventory_hostname }}/restic-ls-db"
    password: "{{ restic_password_ls_db }}"
    source_path: "/var/jail/home/leaguesphere/container/deployed/mysql-backup/current"

  # Moodle — the file half (daily). `moodledata/filedir` is content-addressed
  # (SHA1 filenames), so a daily snapshot costs almost nothing after the first:
  # files are added, not modified in place.
  #
  # The exclude list is the 2026-11-04 import's deliberate choice: caches,
  # sessions and temp carry no recoverable state, only churn. `lang`, `models`,
  # `secret`, `environment`, `diag`, `trashdir` and `.htaccess` are ALL kept.
  #
  # Runs with sudo (see backup.yml): the dataroot is root:root 0750 with
  # files owned by uid 65534, so the unprivileged home backup cannot read it —
  # which is exactly why the home repo excludes the whole `moodle/data` tree.
  # Patterns are `/`-anchored to this snapshot root, not "anywhere in the tree".
  'moodle-files':
    repository: "sftp://storagebox/{{ storagebox_credentials.share }}/{{ inventory_hostname }}/restic-moodle-files"
    password: "{{ restic_password_moodle }}"
    source_path: "{{ moodle_data_root_path }}/moodledata"
    excludes:
      - '/cache'
      - '/localcache'
      - '/muc'
      - '/sessions'
      - '/temp'

  # Moodle — the database half (hourly). Captures the dump directory written by
  # moodle-dump.sh (a `current/` symlink-free directory refreshed at :40), not
  # the live InnoDB datadir: a live datadir is crash-inconsistent and churns
  # gigabytes per hour.
  #
  # Logical `mariadb-dump` rather than a physical `mariadb-backup` prepared set:
  # it is the pattern already running for bnb-office.db (daily, since 2026-10)
  # and for the nightly prod->stage LeagueSphere sync, it needs no extra bind
  # mount in moodle/docker-compose.yml, and `log_bin` is OFF on this DB so a
  # physical set buys no PITR either way.
  'moodle-db':
    repository: "sftp://storagebox/{{ storagebox_credentials.share }}/{{ inventory_hostname }}/restic-moodle-db"
    password: "{{ restic_password_moodle }}"
    source_path: "{{ moodle_data_root_path }}/db-backup/current"

  # Backup schedules
  schedules:
    backup_home: 'hourly'                      # Home: every hour at :00
    backup_root: 'daily'                       # Root: once per day at 00:00
    backup_ls_db: 'hourly'                     # DB: every hour at :00
    backup_ls_db_dump: '*-*-* *:40:00'        # mariadb-backup dump: :40 past every hour
    # Moodle: dump at :40, snapshot at :50 (10 min after the dump — never
    # snapshot a half-written `new/`), files daily at 01:20.
    # 01:20 is deliberate: it is AFTER the 00:40 dump, so the file snapshot can
    # only contain MORE blobs than the DB rows reference. Files are never
    # rewritten in place, so this ordering cannot lose content.
    backup_moodle_dump: '*-*-* *:40:00'
    backup_moodle_db: '*-*-* *:50:00'
    backup_moodle_files: '*-*-* 01:20:00'
    forget_daily: '*-*-* 05:00:00'            # Daily at 05:00 UTC
    check_weekly: 'Sun 06:00'                 # Weekly integrity check

  # GFS retention policy — PER REPOSITORY.
  #
  # A single aggressive policy (keep-hourly 2 / keep-daily 2 / keep-monthly 3) was
  # previously applied to every repo, including the HOURLY `db` repo. That pruned
  # every DB snapshot within ~2 days, so a problem noticed days later had no
  # recoverable backup (LeagueSphere gd874 data-loss, 2026-07). Retention is now
  # sized per repo, with the production DB kept generously in both the short and
  # long term. restic de-duplicates, so a slowly-changing DB keeps many snapshots
  # cheaply.
  retention:
    home:
      last: 24
      hourly: 48     # ~2 days of hourly
      daily: 14
      weekly: 8
      monthly: 6
    root:
      last: 7
      daily: 30      # daily backup → no hourly bucket
      weekly: 12
      monthly: 12
    db:
      last: 48
      hourly: 72     # 3 days of hourly
      daily: 30      # a month of dailies
      weekly: 12
      monthly: 12
    # Moodle files: Task 7 of the hosting plan (7 daily / 4 weekly / 6 monthly).
    # `last` is the safety net when a schedule is misread; the file set is
    # content-addressed, so these snapshots are cheap to keep.
    moodle_files:
      last: 7
      daily: 7
      weekly: 4
      monthly: 6
    # Moodle DB: a dump per hour, so both the hourly bucket and a longer
    # daily/weekly tail (the file+DB pair from a bad week is the point).
    moodle_db:
      last: 24
      hourly: 24
      daily: 14
      weekly: 8
      monthly: 6

  # SFTP connection settings via SSH config
  sftp:
    ssh_key_path: "{{ remote_user_home }}/.ssh/id_storagebox"
    host_alias: "storagebox"  # SSH config host alias
    hostname: "{{ storagebox_credentials.host }}"
    username: "{{ storagebox_credentials.user }}"
    port: 23  # Hetzner Storage Box uses port 23
    # SSH key authentication configured via ~/.ssh/config
    # Host key verification disabled for automation (StrictHostKeyChecking=no)

  # Log files
  log_dir: '/var/log/restic'
  logs:
    backup_home: '/var/log/restic/backup-home.log'
    backup_root: '/var/log/restic/backup-root.log'
    backup_ls_db: '/var/log/restic/backup-ls-db.log'
    backup_moodle_files: '/var/log/restic/backup-moodle-files.log'
    backup_moodle_db: '/var/log/restic/backup-moodle-db.log'
    moodle_dump: '/var/log/restic/moodle-dump.log'
    forget: '/var/log/restic/forget.log'
    check: '/var/log/restic/check.log'

  # Global settings
  exclude_caches: true  # Use --exclude-caches to skip folders with CACHEDIR.TAG
