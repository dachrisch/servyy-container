---
# Restic backup configuration.
#
# OWNERSHIP: the restic role owns this file. It is kept at play level (rather
# than in roles/restic/defaults/) because three roles consume it in the same
# play without including each other: `restic` (backup/init), `system`
# (restic_maintenance forget/check scripts), and `system_probe`
# (log-freshness + snapshot-age probes). Role defaults are invisible across
# roles, so this file is the documented cross-role contract. Thresholds that
# Grafana evaluates are mirrored in monitor/provisioning/alerting/alert-rules.yml.
#
# DB SCOPING: the `db` repo (LeagueSphere prod DB under /var/jail/...) exists
# ONLY where LeagueSphere runs. Its presence is governed by `leaguesphere_enabled`
# (vars/default.yml, derived from services_enabled.leaguesphere) — NOT by a flag
# in this file. Every db consumer must gate on that flag.
#
# MOODLE SCOPING: the two `moodle-*` repos exist ONLY where Moodle runs
# (`moodle_enabled`, same file/mechanism). They are deliberately SEPARATE repos
# rather than one repo with two tags:
#   * the DB stream is hourly and small, the file stream is daily and ~6 GB —
#     separate repos keep a lock/prune on one from blocking the other;
#   * system_probe reports one snapshot age per repo, so a single repo would
#     hide stale files behind a fresh hourly DB snapshot.
# Both use the same password (restic_password_moodle).
# NOTE: repo names contain a dash — dereference them with `restic['moodle-files']`,
# never attribute syntax.
restic:
  # Where restic stages its temporary pack files ($TMPDIR). NOT /tmp: that is a
  # 3.8 GB tmpfs on this host, shared with every other program, and on
  # 2026-11-18 two stray 1.6 GB dumps filled it - every `home` snapshot then died
  # with "Fatal: unable to save snapshot: ... /tmp/user/1000/restic-temp-pack-…:
  # disk quota exceeded", and the unit looked like it had failed for some other
  # reason. Pin it to the root filesystem instead. `~/.cache` is excluded from
  # every backup scope, so this directory is never snapshotted.
  tmpdir: "{{ (remote_user_home, '.cache', 'restic-tmp') | path_join }}"

  # Which directory this host owns under the Storage Box `backup/` share.
  #
  # Defaults to inventory_hostname, but is overridable PER HOST. That override
  # matters from 2026-11-17: the Oracle box took over the inventory name
  # `codey.lehel.xyz` from the alphavps box, whose snapshots already live under
  # `backup/codey.lehel.xyz/`. Both hosts share restic_password_root, so letting
  # them resolve to the same path would put two machines in one repository —
  # and either host's `forget --prune` would happily delete the other's
  # snapshots per its own retention. Pin `restic_repo_name` on the renamed hosts.
  #
  # Home directory backup (hourly)
  home:
    enabled: true
    repository: "sftp://storagebox/{{ storagebox_credentials.share }}/{{ restic_repo_name | default(inventory_hostname) }}/restic-home"
    password: "{{ restic_password_home }}"
    source_path: "{{ remote_user_home }}"
    excludes:
      # Version control
      - '**/.git'
      - '**/.git/worktrees'
      - '.zprezto/.git'

      # Caches (use restic's --exclude-caches for CACHEDIR.TAG)
      - '.cache'
      - '**/.cache'
      - '**/node_modules'
      - '**/__pycache__'
      - '**/.pytest_cache'
      - '**/.mypy_cache'
      - '**/.tox'
      - '**/.venv'

      # Build artifacts
      - '**/target'        # Rust
      - '**/dist'
      - '**/build'

      # Large data directories
      - 'pgdata'
      - 'go/pkg'           # Go packages cache
      - 'go/bin'

      # Moodle: moodledata (~6 GB) and the MariaDB datadir live in the service
      # dir. Two independent reasons to keep them out of the hourly home repo:
      #   * the dataroot is root:root 0750 (files owned by 65534) — this job runs
      #     unprivileged and cannot read it at all;
      #   * a snapshot of a live database is worthless and uploading a 6 GB file
      #     tree hourly is wasteful.
      # They have dedicated scopes instead: `moodle-files` (daily snapshot) and
      # `moodle-db` (hourly logical dump), both under `moodle_enabled`.
      - 'servyy-container/moodle/data'

      # DB tier datadirs (D13: bind mounts on `/` under db-<tier>/data). Same two
      # reasons as moodle's: the files are owned by the container's mysql user
      # (mode 660, a group the backup user is not in), so an unprivileged home
      # snapshot aborts the WHOLE run with restic exit 3 — measured on
      # 2026-11-18, the first hourly run after db-nonprod was created — and a
      # copy of a live InnoDB datadir is worthless anyway. Tiers get their own
      # dump + restic wiring (Phase 7), never the home repo.
      - 'servyy-container/db-*/data'

      # The canonical dump root (WP-8R R7). Every tenant's logical dump lands in
      # /home/cda/db-dumps/<tenant>/current and is snapshotted by ITS OWN repo
      # (db-private, db-lf, db-queen, db-bnb, db-private-mongo,
      # db-private-firefly, leaguesphere-binlog). Keeping it out of `home` matters
      # for two independent reasons:
      #   * deduplication: a 107 MB PhotoPrism dump re-uploaded into `home` every
      #     hour would be the same bytes five times a day in a repo whose
      #     retention is hourly;
      #   * a dump in two repos with two retention policies is a restore that can
      #     disagree with itself about how old the newest copy is.
      - 'db-dumps'

      # --- WP-8R R7: the last dump bytes that were still riding `home` --------
      # `home` is a FILE backup: its retention, its cadence and its dedup shape
      # are properties of the filesystem, and none of them is the right promise
      # for a database dump. Everything below was measured on 2026-11-19 before
      # being excluded (~1.03 GB per snapshot, which is the plan's "home shrinks
      # ~1.1 GB"), and every one of them is now either superseded by a tenant repo
      # or is a one-off artefact that must not inherit a backup promise by
      # accident.
      #
      # 1. bnb_office's legacy dump directory (WP-8R R7). Its dumps now land in
      #    db-dumps/bnb_office/current and are carried by `db-bnb`; the flat
      #    timestamped files left here are excluded so a stray one can never ride
      #    the file repo again. (Measured before: 4 files, 210 KB — small, but the
      #    scope error was the point, not the size.)
      - 'servyy-container/bnb-office/.backup'
      #
      # 2. The STOPPED pre-cutover PhotoPrism datadir (775 MB). PhotoPrism has
      #    lived on db-private.mariadb since WP-6; a raw datadir of a stopped
      #    engine is not restorable as a database, and the tenant's real,
      #    restorable copy is the `db-private` logical dump (R4). This also means
      #    the `Restore PhotoPrism Database` include in roles/restic/tasks/main.yml
      #    will no longer find it in `home` — deliberately: that datadir is a
      #    rollback artefact, not a backup. Delete it with the WP-6 rollback
      #    window, not by restoring it.
      - 'servyy-container/photoprism/database'
      #
      # 3. Ad-hoc cutover dumps of the MOODLE database (130 MB each, 2026-11-13
      #    and 2026-11-18). Moodle's database has its own hourly logical stream
      #    (`moodle-db`); these were manual artefacts of the hosting move and the
      #    WP-7b cutover drill. They stay on disk (evidence) but leave the backup
      #    scope — a dump is snapshotted by the tenant's repo or not at all.
      - 'dbops-dumps'
      - 'dump-offd-*.sql.gz'

      # OpenCode's bind-mounted SSH dir. The container runs as root and writes
      # id_github/id_servy/known_hosts as root, so the backup user cannot read
      # them and restic aborts the whole home snapshot with exit 3 (measured
      # 2026-11-06 on codey + servyy-test). They are deploy artifacts with their
      # own seed files in plays/vars/ and a Vaultwarden copy — not home data.
      - 'servyy-container/opencode/.ssh'

      # Temporary files
      - '**/*.tmp'
      - '**/*.swp'
      - '**/*~'

      # Unreadable by unprivileged home backup (container-owned secret, uid 977)
      - 'servyy-container/searxng/core-config/settings.yml'

  # Root filesystem backup (daily)
  root:
    enabled: true
    repository: "sftp://storagebox/{{ storagebox_credentials.share }}/{{ restic_repo_name | default(inventory_hostname) }}/restic-root"
    password: "{{ restic_password_root }}"
    source_path: "/"
    includes:
      - /etc           # System configuration
      - /var           # Variable data
    excludes:
      # System pseudo-filesystems
      - /proc
      - /sys
      - /dev
      - /run
      - /tmp
      - /mnt
      - /media

      # Container runtime layers. Docker's own internals are rebuildable, but the
      # VOLUMES are not: opencode keeps its sessions DB in
      # /var/lib/docker/volumes/opencode_opencode_root, which neither `home`
      # (only /home/cda) nor a blanket /var/lib/docker exclusion would ever
      # capture — so until 2026-11-17 the dev gateway had no backup at all.
      # Exclude the rebuildable internals individually and keep volumes/.
      - /var/lib/containerd
      - /var/lib/docker/overlay2
      - /var/lib/docker/image
      - /var/lib/docker/buildkit
      - /var/lib/docker/containers
      - /var/lib/docker/network
      - /var/lib/docker/plugins
      - /var/lib/docker/tmp
      # Rebuildable from git by provision-dev.sh; ~6.6G of checkout on codey.
      # Excluded to keep the snapshot small — uncommitted work in there is NOT
      # covered, which is the accepted trade.
      - /var/lib/docker/volumes/codey_dev_checkouts

      # Caches
      - /var/cache
      - /var/tmp
      - /var/lib/snapd/cache

      # Logs (rebuildable / handled by journald retention)
      - /var/log

      # LXD runtime namespace pseudo-files (unreadable, cause restic exit 3)
      - /var/snap/lxd/common/ns

      # Sockets and swap
      - '*.sock'
      - 'swap.img'
      - '*.swap'

  # LeagueSphere prod DB backup (hourly).
  # Scoped by `leaguesphere_enabled`, not by a flag here: there is deliberately
  # NO `enabled` key on this repo — consumers (restic init/backup tasks,
  # system_probe defaults, forget/check templates) gate on that flag instead.
  db:
    repository: "sftp://storagebox/{{ storagebox_credentials.share }}/{{ restic_repo_name | default(inventory_hostname) }}/restic-ls-db"
    password: "{{ restic_password_ls_db }}"
    source_path: "/var/jail/home/leaguesphere/container/deployed/mysql-backup/current"

  # WP-8R R5: the binlog TAIL — what makes "PITR" a mechanism instead of a
  # sentence. The `db` repo above holds one prepared set per hour; this one holds
  # the transaction stream between sets, snapshotted every 5 minutes.
  #
  # WHY A SEPARATE REPO, NOT MORE PATH IN `db`: two schedules (hourly vs 5-min)
  # and two retentions (3 days of hourly sets vs 2 days of binlogs) in one repo
  # would force one `restic forget --tag` policy over both, and restic forget is
  # per-repo state: a 576-snapshot forget/prune would sit on the same lock as the
  # hourly set upload.
  #
  # It snapshots a COPY, not the datadir: restic has no include patterns and the
  # live binlogs are root/mysql-owned inside the jail. `binlog_ship.sh.j2` stages
  # them (atomic renames, never a half-copied file) and this repo snapshots the
  # staging directory. The stage is keyed under `db-dumps/`, which the `home`
  # repo excludes, so the same bytes are never uploaded twice.
  #
  # The staging directory must be pruned LATER than this repo's retention (see
  # `binlog_stage_keep_days` in the template and the check in the ship script):
  # 2-day repo keep is only safe while the files it needs still exist.
  'ls-binlog':
    repository: "sftp://storagebox/{{ storagebox_credentials.share }}/{{ restic_repo_name | default(inventory_hostname) }}/restic-ls-binlog"
    password: "{{ restic_password_ls_db }}"
    source_path: "{{ (remote_user_home, 'db-dumps', 'leaguesphere-binlog') | path_join }}"
    excludes:
      # Written by binlog_ship.sh.j2 before an atomic rename. A read of the stage
      # can never see one (the rename is atomic), but a run killed mid-copy can
      # leave one behind and it must never enter a snapshot.
      - '.incoming*'

  # Moodle — the file half (daily). `moodledata/filedir` is content-addressed
  # (SHA1 filenames), so a daily snapshot costs almost nothing after the first:
  # files are added, not modified in place.
  #
  # The exclude list is the 2026-11-04 import's deliberate choice: caches,
  # sessions and temp carry no recoverable state, only churn. `lang`, `models`,
  # `secret`, `environment`, `diag`, `trashdir` and `.htaccess` are ALL kept.
  #
  # Runs with sudo (see backup.yml): the dataroot is root:root 0750 with
  # files owned by uid 65534, so the unprivileged home backup cannot read it —
  # which is exactly why the home repo excludes the whole `moodle/data` tree.
  # Patterns are `/`-anchored to this snapshot root, not "anywhere in the tree".
  'moodle-files':
    repository: "sftp://storagebox/{{ storagebox_credentials.share }}/{{ restic_repo_name | default(inventory_hostname) }}/restic-moodle-files"
    password: "{{ restic_password_moodle }}"
    source_path: "{{ moodle_data_root_path }}/moodledata"
    excludes:
      - '/cache'
      - '/localcache'
      - '/muc'
      - '/sessions'
      - '/temp'

  # Moodle — the database half (hourly). Captures the dump directory written by
  # moodle-dump.sh (a `current/` symlink-free directory refreshed at :40), not
  # the live InnoDB datadir: a live datadir is crash-inconsistent and churns
  # gigabytes per hour.
  #
  # Logical `mariadb-dump` rather than a physical `mariadb-backup` prepared set:
  # it is the pattern already running for bnb-office.db (daily, since 2026-10)
  # and for the nightly prod->stage LeagueSphere sync, it needs no extra bind
  # mount in moodle/docker-compose.yml, and `log_bin` is OFF on this DB so a
  # physical set buys no PITR either way.
  'moodle-db':
    repository: "sftp://storagebox/{{ storagebox_credentials.share }}/{{ restic_repo_name | default(inventory_hostname) }}/restic-moodle-db"
    password: "{{ restic_password_moodle }}"
    source_path: "{{ moodle_data_root_path }}/db-backup/current"

  # --- WP-8R R3/R4/R6: the three tiers' first real protection --------------
  # Each repo snapshots ONE canonical `<dump_dir>/current` directory (R7's
  # /home/cda/db-dumps/<tenant>). Why `current` and not the tenant's dump root:
  # the dump scripts write into a sibling `new/` and only move it into `current/`
  # after the size floor passed, so the directory restic sees is never
  # mid-write and never holds a file that failed validation. The dump file
  # itself keeps a timestamped name (its content is byte-identical for unchanged
  # data thanks to --skip-dump-date / gzip -n, so restic still deduplicates).
  # All five share the D16 db-tier password.
  'db-private':
    repository: "sftp://storagebox/{{ storagebox_credentials.share }}/{{ restic_repo_name | default(inventory_hostname) }}/restic-db-private"
    password: "{{ restic_password_db }}"
    source_path: "/home/cda/db-dumps/photoprism/current"
  'db-private-mongo':
    repository: "sftp://storagebox/{{ storagebox_credentials.share }}/{{ restic_repo_name | default(inventory_hostname) }}/restic-db-private-mongo"
    password: "{{ restic_password_db }}"
    source_path: "/home/cda/db-dumps/dontforget/current"
  # WP-10 (2026-11-19): firefly is now a MariaDB tenant on db-private.mariadb,
  # but the repo key, repository URL and source_path are UNCHANGED on purpose —
  # the repo belongs to the TENANT, not to the engine, so the move keeps every
  # existing snapshot and the restic/probe wiring needs no new repo. The dump is
  # now `dbops dump firefly` (mariadb adapter) in exactly the same `current/`.
  'db-private-firefly':
    repository: "sftp://storagebox/{{ storagebox_credentials.share }}/{{ restic_repo_name | default(inventory_hostname) }}/restic-db-private-firefly"
    password: "{{ restic_password_db }}"
    source_path: "/home/cda/db-dumps/firefly/current"
  'db-lf':
    repository: "sftp://storagebox/{{ storagebox_credentials.share }}/{{ restic_repo_name | default(inventory_hostname) }}/restic-db-lf"
    password: "{{ restic_password_db }}"
    source_path: "/home/cda/db-dumps/leagues_finance/current"
  'db-queen':
    repository: "sftp://storagebox/{{ storagebox_credentials.share }}/{{ restic_repo_name | default(inventory_hostname) }}/restic-db-queen"
    password: "{{ restic_password_db }}"
    source_path: "/home/cda/db-dumps/queen/current"
  # WP-8R R7: bnb_office's own repo. Before this the customer's bookkeeping data
  # was inside the `home` FILE scope (see the excludes above), with home's
  # retention and a timestamped file per run. Same D16 password as the other
  # db-tier repos, same `current/` shape, own retention profile (`db_daily`).
  'db-bnb':
    repository: "sftp://storagebox/{{ storagebox_credentials.share }}/{{ restic_repo_name | default(inventory_hostname) }}/restic-db-bnb"
    password: "{{ restic_password_db }}"
    source_path: "/home/cda/db-dumps/bnb_office/current"

  # Backup schedules
  schedules:
    backup_home: 'hourly'                      # Home: every hour at :00
    backup_root: 'daily'                       # Root: once per day at 00:00
    backup_ls_db: 'hourly'                     # DB: every hour at :00
    backup_ls_db_dump: '*-*-* *:40:00'        # mariadb-backup dump: :40 past every hour
    # WP-8R R5: the binlog tail. Ship at :01/06/11/…, snapshot at :03/08/13/… —
    # two minutes of headroom for the ship (it copies only what changed), and
    # both units run with `randomized_delay: 0` (see backup.yml): the timer
    # template's default 5-minute jitter would turn a 5-minute cadence into
    # 5–10 minutes and could reorder ship and snapshot, which is exactly the
    # silent-stall shape this repo is meant to make impossible. Do not add jitter
    # back to these two.
    ship_binlog: '*-*-* *:01/5:00'
    backup_ls_binlog: '*-*-* *:03/5:00'
    # Moodle: dump at :40, snapshot at :50 (10 min after the dump — never
    # snapshot a half-written `new/`), files daily at 01:20.
    # 01:20 is deliberate: it is AFTER the 00:40 dump, so the file snapshot can
    # only contain MORE blobs than the DB rows reference. Files are never
    # rewritten in place, so this ordering cannot lose content.
    backup_moodle_dump: '*-*-* *:40:00'
    backup_moodle_db: '*-*-* *:50:00'
    backup_moodle_files: '*-*-* 01:20:00'
    # WP-8R R3/R4/R6: dump at :45/:15/:25/:35/:45, snapshot five minutes later
    # (never snapshot a half-written .partial; the rename makes that safe anyway).
    dump_photoprism: '*-*-* 00:45:00'
    backup_db_private: '*-*-* 00:55:00'
    dump_leagues_finance: '*-*-* 01:15:00'
    backup_db_lf: '*-*-* 01:20:00'
    dump_queen: '*-*-* 01:25:00'
    backup_db_queen: '*-*-* 01:30:00'
    dump_dontforget: '*-*-* 01:35:00'
    backup_db_private_mongo: '*-*-* 01:40:00'
    dump_firefly: '*-*-* 01:45:00'
    backup_db_private_firefly: '*-*-* 01:50:00'
    # WP-8R R7: the bnb dump, at the time its row already declared (02:30). The
    # snapshot follows 10 minutes later, like the other daily tenants.
    dump_bnb_office: '*-*-* 02:30:00'
    backup_db_bnb: '*-*-* 02:40:00'
    # WP-8R R8: ONE db-backup@<tier> pair per tier, ticking every 5 minutes.
    # Nothing is dumped on a tick that finds nobody due — the tenant TIMES stay in
    # the inventory rows (dump_at), and `dbops dump-due <tier>` compares each
    # tenant's last scheduled instant with the mtime of its `current/`. 5 minutes
    # is the smallest granularity that can honour every dump_at in the inventory
    # (they are 5-minute spaced by design) without re-writing a single time here.
    db_backup_tier: '*-*-* *:00/5:00'
    forget_daily: '*-*-* 05:00:00'            # Daily at 05:00 UTC
    check_weekly: 'Sun 06:00'                 # Weekly integrity check

  # GFS retention policy — PER REPOSITORY.
  #
  # A single aggressive policy (keep-hourly 2 / keep-daily 2 / keep-monthly 3) was
  # previously applied to every repo, including the HOURLY `db` repo. That pruned
  # every DB snapshot within ~2 days, so a problem noticed days later had no
  # recoverable backup (LeagueSphere gd874 data-loss, 2026-07). Retention is now
  # sized per repo, with the production DB kept generously in both the short and
  # long term. restic de-duplicates, so a slowly-changing DB keeps many snapshots
  # cheaply.
  retention:
    home:
      last: 24
      hourly: 48     # ~2 days of hourly
      daily: 14
      weekly: 8
      monthly: 6
    root:
      last: 7
      daily: 30      # daily backup → no hourly bucket
      weekly: 12
      monthly: 12
    db:
      last: 48
      hourly: 72     # 3 days of hourly
      daily: 30      # a month of dailies
      weekly: 12
      monthly: 12
    # Moodle files: Task 7 of the hosting plan (7 daily / 4 weekly / 6 monthly).
    # `last` is the safety net when a schedule is misread; the file set is
    # content-addressed, so these snapshots are cheap to keep.
    moodle_files:
      last: 7
      daily: 7
      weekly: 4
      monthly: 6
    # Moodle DB: a dump per hour, so both the hourly bucket and a longer
    # daily/weekly tail (the file+DB pair from a bad week is the point).
    moodle_db:
      last: 24
      hourly: 24
      daily: 14
      weekly: 8
      monthly: 6

  # SFTP connection settings via SSH config
  sftp:
    ssh_key_path: "{{ remote_user_home }}/.ssh/id_storagebox"
    host_alias: "storagebox"  # SSH config host alias
    hostname: "{{ storagebox_credentials.host }}"
    username: "{{ storagebox_credentials.user }}"
    port: 23  # Hetzner Storage Box uses port 23
    # SSH key authentication configured via ~/.ssh/config
    # Host key verification disabled for automation (StrictHostKeyChecking=no)

  # Log files
  log_dir: '/var/log/restic'
  logs:
    backup_home: '/var/log/restic/backup-home.log'
    backup_root: '/var/log/restic/backup-root.log'
    backup_ls_db: '/var/log/restic/backup-ls-db.log'
    # WP-8R R5: the ship log proves the 5-minute timer fires; the repo's snapshot
    # age proves the data landed; the pair is what pages on a stalled tail.
    binlog_ship: '/var/log/restic/binlog-ship.log'
    backup_ls_binlog: '/var/log/restic/backup-ls-binlog.log'
    backup_moodle_files: '/var/log/restic/backup-moodle-files.log'
    backup_moodle_db: '/var/log/restic/backup-moodle-db.log'
    moodle_dump: '/var/log/restic/moodle-dump.log'
    # WP-8R R3/R4/R6: one log per snapshot job and one per dump job (the probe
    # reads the dump logs; the snapshot-age probe reads the repos).
    backup_db_private: '/var/log/restic/backup-db-private.log'
    backup_db_private_mongo: '/var/log/restic/backup-db-private-mongo.log'
    backup_db_private_firefly: '/var/log/restic/backup-db-private-firefly.log'
    backup_db_lf: '/var/log/restic/backup-db-lf.log'
    backup_db_queen: '/var/log/restic/backup-db-queen.log'
    backup_db_bnb: '/var/log/restic/backup-db-bnb.log'
    db_dump_photoprism: '/var/log/restic/dump-photoprism.log'
    db_dump_leagues_finance: '/var/log/restic/dump-leagues_finance.log'
    db_dump_queen: '/var/log/restic/dump-queen.log'
    db_dump_bnb_office: '/var/log/restic/dump-bnb_office.log'
    db_dump_dontforget: '/var/log/restic/dump-dontforget.log'
    db_dump_firefly: '/var/log/restic/dump-firefly.log'
    forget: '/var/log/restic/forget.log'
    check: '/var/log/restic/check.log'

  # Global settings
  exclude_caches: true  # Use --exclude-caches to skip folders with CACHEDIR.TAG

# --- Generated restic wiring (WP-8R R1) ---------------------------------------
# Everything below is derived from `backup_targets` in plays/vars/db_tenants.yml.
# Do not add repo names here: add a row to `backup_targets` (and the repo's own
# transport details in the `restic:` map above). The `or` fallbacks exist ONLY so
# the molecule scenarios, which do not load the tenant inventory, keep working;
# production always takes the derived branch.
restic_targets_enabled: >-
  {{ (backup_targets | selectattr('enabled_by', 'equalto', 'always') | list)
     + ((backup_targets | selectattr('enabled_by', 'equalto', 'leaguesphere') | list)
        if (leaguesphere_enabled | default(false) | bool) else [])
     + ((backup_targets | selectattr('enabled_by', 'equalto', 'moodle') | list)
        if (moodle_enabled | default(false) | bool) else [])
     + ((backup_targets | selectattr('enabled_by', 'equalto', 'servy') | list)
        if (inventory_hostname == 'servy.lehel.xyz') else []) }}

# Repo key lists. Order is the inventory order and it is load-bearing for the
# forget/check scripts' output (they are diffed against the deployed files).
restic_repo_names_enabled: "{{ (restic_targets_enabled | map(attribute='name') | list) or (['home', 'root']
     + (['db'] if (leaguesphere_enabled | default(false) | bool) else [])
     + (['moodle-files', 'moodle-db'] if (moodle_enabled | default(false) | bool) else [])) }}"
restic_repos_enabled: "{{ restic_repo_names_enabled | map('extract', restic) | list }}"
restic_moodle_repo_names: "{{ restic_targets_enabled | selectattr('tenant', 'equalto', 'moodle') | map(attribute='name') | list }}"
restic_moodle_repos: "{{ restic_moodle_repo_names | map('extract', restic) | list }}"

# Log files to create: host-level repos, then forget/check, then the tenant
# repos, then the dump logs (a dump log proves the timer fires; the snapshot
# probe proves the data landed).
restic_log_paths_enabled: >-
  {{ ((restic_targets_enabled | selectattr('tenant', 'equalto', None) | map(attribute='log_key') | list)
      + ['forget', 'check']
      + (restic_targets_enabled | rejectattr('tenant', 'equalto', None) | map(attribute='log_key') | list)
      + (restic_targets_enabled | rejectattr('dump_log_key', 'none') | map(attribute='dump_log_key') | list))
     | map('extract', restic.logs) | list }}
