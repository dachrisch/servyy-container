---
- name: Remove Docker Service
  hosts: "{{ target_host | default('all') }}"
  gather_facts: true
  vars_prompt:
    - name: service_to_remove
      prompt: "Service name to remove (e.g., 'platzler-heid')"
      private: false

  tasks:
    - name: Confirm removal
      pause:
        prompt: "Remove '{{ service_to_remove }}' containers, volumes, and directory? Type 'yes' to confirm"
      register: confirm_removal

    - name: Validate confirmation
      fail:
        msg: "Removal cancelled by user"
      when: confirm_removal.user_input != 'yes'

    - name: Report service removal starting
      debug:
        msg: "Starting removal of service '{{ service_to_remove }}' from {{ inventory_hostname }}"

    - name: Stop and remove containers
      community.docker.docker_compose_v2:
        project_src: "{{ docker.remote_dir }}/{{ service_to_remove }}"
        state: absent
      ignore_errors: true
      register: compose_result

    - name: List volumes for service
      shell: docker volume ls --filter "name={{ service_to_remove }}" -q
      register: volumes_to_remove
      changed_when: false

    - name: Remove service volumes
      community.docker.docker_volume:
        name: "{{ item }}"
        state: absent
      loop: "{{ volumes_to_remove.stdout_lines }}"
      when: volumes_to_remove.stdout_lines | length > 0
      register: volume_removal

    - name: Report volumes removed
      debug:
        msg: "Removed {{ volume_removal.results | length }} volume(s)"
      when: volume_removal is defined and volume_removal.changed

    - name: Remove service directory
      file:
        path: "{{ docker.remote_dir }}/{{ service_to_remove }}"
        state: absent
      register: dir_removal

    - name: Report removal complete
      debug:
        msg: |
          ✅ Service '{{ service_to_remove }}' removed successfully from {{ inventory_hostname }}

          Next steps:
          1. Remove from git: git rm -r {{ service_to_remove }}/
          2. Update inventory: Set services_enabled[{{ service_to_remove }}] = false
          3. Clean Pushgateway stale series (POST-merge legacy / pre-PUT probes):
             ssh {{ inventory_hostname }} "curl -sf -X DELETE http://localhost:9091/metrics/job/system_container_health && sudo -u {{ create_user | default('cda') }} ~/.system-probes/system-container-health.sh"
             # After the PUT fix this is self-healing on the next timer run (5min),
             # but run once manually so Grafana stops firing container_not_running immediately.
          4. Redeploy probes + verify Grafana: ./servyy.sh --limit {{ inventory_hostname }} --tags "system.probe"
             # Check Grafana: no system_container_running{name="{{ service_to_remove }}.*"} series,
             # container_not_running alert OK, Services Overview shows no ghost service.
          5. Deploy changes: ./servyy.sh --limit {{ inventory_hostname }}
