- name: Setup League Sphere (Production & Staging)
  hosts: all
  strategy: free
  become: true
  remote_user: "{{ root_user | default('root') }}"
  gather_facts: yes
  vars_files:
    - vars/secret_leaguesphere.yaml
    - vars/ssh_jail.yaml
    - vars/secrets.yml
    - vars/default.yml
    # Tenant inventory (WP-3): the database guard reads it, same as plays/user.yml.
    - vars/db_tenants.yml
  pre_tasks:
    # Skip this play on hosts that do not run LeagueSphere. Without this
    # guard the ssh-chroot-jail role (and all other ls_* roles) would run on
    # hosts like codey.lehel.xyz that have no LeagueSphere service.
    #
    # end_host (not end_play) is used deliberately: this play targets a mixed
    # host set (servy runs LeagueSphere, codey does not), and end_play would
    # abort the play on the LeagueSphere host too. end_host only stops the
    # current host, so servy continues while codey is skipped.
    - name: End play if leaguesphere is not enabled on the host
      ansible.builtin.meta: end_host
      when: not (services_enabled | default({})).leaguesphere | default(false) | bool

    # D8: this play applies the high tier's tag (leaguesphere.db) on its own, so
    # a `--tags ls.app` run would otherwise restart it with no version check at
    # all — which is exactly the ordering Phase 10 depends on. Same shared task
    # as plays/user.yml, not a copy. After the enablement guard above, because
    # this play targets a mixed host set (servy runs LeagueSphere, codey does
    # not); the task itself also skips absent containers.
    #
    # import_tasks, NOT include_tasks: a dynamic include inherits `always` only
    # on the include task, so under `--tags ls.app` every (untagged) task inside
    # would be skipped and the guard would be a silent no-op. A static import
    # applies `always` to each of its tasks (measured on ansible-core 2.20.1).
    - name: Guard the database versions before any service task
      ansible.builtin.import_tasks: tasks/db_version_guard.yml
      tags:
        - always
  roles:
    # Setup (shared, run once)
    - role: ls_setup
      tags:
        - ls.setup
    - role: geerlingguy.security
      vars:
        security_ssh_permit_root_login: "yes"
        security_fail2ban_enabled: false
      tags:
        - ssh.security
    - role: geerlingguy.ssh-chroot-jail
      tags:
        - ssh.jail
    - ls_access

    - role: ls_dbeaver_access
      tags:
        - ls.dbeaver

    # Production deployment (jail)
    - role: ls_app
      vars:
        container_dir: "{{ (ssh_chroot_jail_path, 'home', ls.user, 'container') | path_join }}"
        ls_vars_file: "secret_main.yaml"
        deploy_containers: true
        docker_env_file: ".env"
      become_user: "{{ ls.user }}"
      tags:
        - ls.app
        - ls.app.prod
        - ls.app.jail

    # Production deployment (dev)
    - role: ls_app
      vars:
        container_dir: "{{ ('~', 'dev', ls.user) | path_join }}"
        ls_vars_file: "secret_main.yaml"
        deploy_containers: false
      remote_user: "{{ create_user }}"
      become_user: "{{ create_user }}"
      tags:
        - ls.app
        - ls.app.prod
        - ls.app.current

    # Staging deployment (jail) - ALWAYS RUNS WITH PROD
    #
    # app_compose_remove_orphans: false — the WP-4 cutover removed stage's own
    # `mysql:` service from its compose, and orphan removal DELETED that
    # container instead of leaving it stopped. The retired container (or, once it
    # is gone, its `deployed/mysql-data` bind mount) is the one-week rollback, so
    # this stack must never have its orphans swept by a routine deploy.
    - role: ls_app
      vars:
        container_dir: "{{ (ssh_chroot_jail_path, 'home', ls.user, 'container-stage') | path_join }}"
        ls_vars_file: "secret_stage.yaml"
        deploy_containers: true
        app_compose_remove_orphans: false
      become_user: "{{ ls.user }}"
      tags:
        - ls.app
        - ls.app.stage

    # Staging env files (dev)
    - role: ls_app
      vars:
        container_dir: "{{ ('~', 'dev', ls.user) | path_join }}"
        ls_vars_file: "secret_stage.yaml"
        deploy_containers: false
      remote_user: "{{ create_user }}"
      become_user: "{{ create_user }}"
      tags:
        - ls.app.env
        - ls.app.env.docker
        - ls.app.env.ls

    # Demo deployment (jail) - runs containers
    - role: ls_demo
      vars:
        container_dir: "{{ (ssh_chroot_jail_path, 'home', ls.user, 'container-demo') | path_join }}"
        deploy_containers: true
      become_user: "{{ ls.user }}"
      tags:
        - ls.demo
        - demo

    # Demo deployment (dev) - env files only
    - role: ls_demo
      vars:
        container_dir: "{{ ('~', 'dev', ls.user) | path_join }}"
        deploy_containers: false
      remote_user: "{{ create_user }}"
      become_user: "{{ create_user }}"
      tags:
        - ls.demo
        - ls.demo.env

    # DB sync role - runs on staging deployment and on ls.db.sync
    - role: ls_db_sync
      tags:
        - ls.db.sync
        - ls.app.stage
        - ls.app

    # DB migrate role - on-demand seed of local prod db from external (tag-only, not in default ls run)
    - role: ls_db_migrate
      tags:
        - ls.db.migrate

    # Hourly maintenance-mode / active-games probe - tag-only, not in default ls run
    # (mirrors ls_db_migrate above). Pushes metrics to Pushgateway; Grafana alerts on them.
    - role: ls_maintenance_probe
      tags:
        - ls.maintenance.probe

    # DB restore to stage from a physical mariadb-backup (tag-only, not in default ls run)
    - role: ls_stage_restore
      tags:
        - ls.stage.restore
  tags:
    - ls
