---
- name: Push opencode API key to Vaultwarden
  hosts: all
  strategy: linear
  remote_user: "{{ create_user }}"
  become: true
  become_user: "{{ create_user }}"
  vars_files:
    - vars/default.yml
    - vars/secrets.yml
  pre_tasks:
    - name: Load opencode SSH key from seed file
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/vars/.opencode_github_ssh_key"
      register: ssh_key_seed
      delegate_to: localhost
      run_once: true

    - name: Set opencode SSH key fact
      ansible.builtin.set_fact:
        opencode_github_ssh_key: "{{ ssh_key_seed['content'] | b64decode }}"
      run_once: false
  tasks:
    - name: Push opencode API key into Vaultwarden
      include_role:
        name: vaultwarden
        tasks_from: push_items.yml
        apply:
          tags:
            - opencode.vaultwarden
      vars:
        vaultwarden_item_username: "opencode"
        vaultwarden_items:
          - name: "opencode api key ({{ inventory_hostname_short }})"
            secret: "{{ opencode.api_key }}"
            notes: >-
              X-Api-Key value for opencode's scoped ForwardAuth gate (opencode-authgate) on
              {{ inventory_hostname }}. Grants session-create + session-scoped chat access to
              https://opencode.{{ inventory_hostname }}/api/session/* only. No direct HTTP
              access to opencode's filesystem/shell/VCS/credential endpoints — but the agent
              this drives runs with real credentials (GitHub PAT, git-crypt key, CircleCI
              token, SSH key) and can act on them via prompted tool calls, so treat this key
              as broad access to what the agent can do, not merely "read-only chat". See
              docs/superpowers/specs/2026-08-08-opencode-api-key-forwardauth-design.md.
          - name: "opencode github ssh key ({{ inventory_hostname_short }})"
            secret: "{{ opencode_github_ssh_key }}"
            notes: >-
              OpenCode GitHub SSH private key (ed25519) for {{ inventory_hostname }}.
              Used by opencode agent to authenticate with GitHub for git operations.
              Seed file: ansible/plays/vars/.opencode_github_ssh_key
      when:
        - vw_master_password | default('') | length > 0
        - inventory_hostname in ['lehel.xyz', 'servyy-test.lxd']
      tags:
        - opencode.vaultwarden
  tags:
    - opencode.vaultwarden
