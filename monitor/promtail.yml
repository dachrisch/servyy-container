server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: servyy-logs-k8x9m2p4q7

scrape_configs:
  # Docker container logs via Docker API
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Drop monitor stack containers
      - source_labels: ['__meta_docker_container_name']
        regex: '/monitor\..*'
        action: drop
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - action: replace
        replacement: docker
        target_label: 'job'
    pipeline_stages:
      # Drop entries older than 4h to prevent retry storms when monitoring is paused
      - drop:
          older_than: 4h
      # Drop healthcheck logs
      - drop:
          expression: '"healthcheck"'
      - drop:
          expression: 'HEAD / HTTP'
      - drop:
          expression: '/health HTTP'
      - drop:
          expression: '/ready HTTP'
      - drop:
          expression: '/metrics HTTP'
      # Extract structured metadata from Traefik JSON logs for efficient security queries
      - match:
          selector: '{container=~"traefik.*"}'
          stages:
            - json:
                expressions:
                  method: RequestMethod
                  status: DownstreamStatus
                  path: RequestPath
                  user_agent: '"request_User-Agent"'
            - structured_metadata:
                method: method
                status: status
                path: path
                user_agent: user_agent

  # System logs
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          __path__: /var/log/syslog
    pipeline_stages:
      # Drop entries older than 4h to prevent retry storms when monitoring is paused
      - drop:
          older_than: 4h
      - regex:
          expression: '^(?P<timestamp>\w+\s+\d+\s+\d+:\d+:\d+)\s+(?P<host>\S+)\s+(?P<program>[^\[:]+)(?:\[(?P<pid>\d+)\])?:\s+(?P<message>.*)$'
      - labels:
          host:
          program:

  # fail2ban actions log (ban/unban events)
  # Labeled job=system so the Security dashboard's
  # {job="system"} |~ "fail2ban.*Ban" queries match. fail2ban writes bans to
  # its own logfile (logtarget=/var/log/fail2ban.log) which is NOT part of
  # syslog, so it must be scraped explicitly or the dashboard stays empty.
  - job_name: fail2ban
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          __path__: /var/log/fail2ban.log
    pipeline_stages:
      # Native format: "2026-08-04 19:00:31,878 fail2ban.actions [1317]: NOTICE  [sshd] Ban 1.2.3.4"
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}),\d+\s+(?P<program>\S+)'
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05'
          # fail2ban writes local wall-clock time with no offset; without a
          # location promtail reads it as UTC and Loki rejects the entries as
          # "timestamp too new" (2h in the future during CEST).
          location: Europe/Berlin
      # Drop entries older than 4h AFTER the real timestamp is parsed, so a
      # fresh read of the whole file doesn't flood Loki with rejected old lines.
      - drop:
          older_than: 4h
      - labels:
          program:

  # fail2ban Loki-blocklist ban events (traefik bot/rate-limit/crawler reasons).
  # These reasons live only here, not in fail2ban.log — feeds the Security
  # dashboard Traefik ban panels. Drop the [blocklist] diagnostic lines; keep
  # the "<ts> <ip> <reason>" ban-add lines.
  - job_name: fail2ban_blocklist
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          __path__: /var/log/fail2ban-loki.log
    pipeline_stages:
      - drop:
          expression: '\[blocklist\]'
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) '
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05'
          location: Europe/Berlin
      # Drop entries older than 4h AFTER the real timestamp is parsed, so a
      # fresh read of the whole file doesn't flood Loki with rejected old lines
      # (fail2ban-loki.log retains months of history).
      - drop:
          older_than: 4h

  # Auth logs
  - job_name: auth
    static_configs:
      - targets:
          - localhost
        labels:
          job: auth
          __path__: /var/log/auth.log
    pipeline_stages:
      # Drop entries older than 4h to prevent retry storms when monitoring is paused
      - drop:
          older_than: 4h
