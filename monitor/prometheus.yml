global:
  scrape_interval: 15s
# Recording rules (mounted from ./rules). The series they produce are what the
# Grafana alerts and the runbooks name by name - see rules/container-memory.yml.
rule_files:
  - /etc/prometheus/rules/*.yml
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9090' ]
  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']
    scrape_interval: 5s
  - job_name: 'node-exporter'
    static_configs:
      - targets: [ 'node-exporter:9100' ]
  - job_name: 'cadvisor'
    static_configs:
      - targets: [ 'cadvisor:8080' ]
  - job_name: 'traefik'
    static_configs:
      - targets: [ 'traefik.traefik:8082' ]
  # Loki moved to codey on 2026-11-20 and is no longer reachable over the docker
  # network. It is scraped through the authenticated https://loki.lehel.xyz route
  # (basicAuth + ipAllowList, see monitor/docker-compose.yml). Target and scheme
  # differ per environment (servyy-test reaches its own Traefik over plain http),
  # so they come from the Ansible-rendered file_sd file:
  #   {"targets": ["<host>:<port>"], "labels": {"loki_scheme": "https"}}
  # `__scheme__` cannot come from file_sd directly — PopulateLabels overwrites it
  # from `scheme:` before relabeling runs — hence the one relabel rule below.
  - job_name: 'loki'
    basic_auth:
      username: promtail
      password_file: /etc/prometheus/rendered/loki-password
    file_sd_configs:
      - files:
          - /etc/prometheus/rendered/loki-target.json
    relabel_configs:
      - source_labels: [loki_scheme]
        target_label: __scheme__
  - job_name: 'k6-load-test'
    static_configs:
      - targets: [ 'localhost:6565' ]
    scrape_interval: 5s
    scrape_timeout: 5s
    metrics_path: '/metrics'