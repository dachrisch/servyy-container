# Every service carries `restart: unless-stopped`. Without it a container that Docker
# stops on daemon restart (host reboot) never comes back — and the daily
# `docker system prune -a -f` then deletes the stopped container and its image, so the
# whole stack silently disappears. That is what happened on 2026-10-29
# (history/2026-10-29_monitor-restart-policy.md).
services:
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    # 512m: 273-302M working set right after a restart with plugins loaded
    # (measured 2026-10-29, ~79 % of a 384m cap - too little headroom for the
    # container that carries every dashboard and alert rule on this host).
    mem_limit: 512m
    container_name: ${COMPOSE_PROJECT_NAME}.grafana
    env_file:
      - grafana.env # rendered by ansible (docker_service monitor template) from vault; never committed
    labels:
      - traefik.enable=true
      - traefik.http.routers.${SERVICE_NAME}.tls=true
      - traefik.http.routers.${SERVICE_NAME}.rule=Host(`${SERVICE_HOST}`)
      - traefik.http.routers.${SERVICE_NAME}.tls.certresolver=letsencryptdnsresolver
      - traefik.http.routers.${SERVICE_NAME}.service=grafana
      - traefik.http.services.grafana.loadbalancer.server.port=3000
      - traefik.http.routers.${SERVICE_NAME}_local_qualified.rule=Host(`${SERVICE_NAME}.${LOCAL_HOSTNAME}`)
      - traefik.http.routers.${SERVICE_NAME}_local_qualified.entrypoints=web
      - com.centurylinklabs.watchtower.scope=prod
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # Identity + mail secrets come from grafana.env (vault-rendered). Kept here
      # only structural (non-secret) settings.
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_FROM_NAME=Grafana Monitor
      - GF_SMTP_SKIP_VERIFY=false
      # Feature toggles
      - GF_FEATURE_TOGGLES_ENABLE=provisioning,kubernetesDashboards
      # Enable unified alerting
      - GF_UNIFIED_ALERTING_ENABLED=true
      # Server URL configuration for email notifications
      - GF_SERVER_ROOT_URL=https://${SERVICE_HOST}
      - GF_SERVER_DOMAIN=${SERVICE_HOST}
    networks:
      - backend
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    # 512m: ~184-362M resident while indexing; the cap bounds a jammed
    # ingestion backlog instead of letting it displace app pages.
    mem_limit: 512m
    container_name: ${COMPOSE_PROJECT_NAME}.loki
    labels:
      # Deliberately NOT routed through Traefik any more. Loki was published at
      # `monitor.lehel.xyz/loki` (TLS router with certresolver) even though Grafana
      # queries it over the docker network (`http://loki:3100`), and Traefik's
      # per-entrypoint router split also produced a `web-loki` router on the public
      # :80. Since Loki has no real auth (only the tenant header), that was pure
      # exposure surface. Prometheus scrapes `loki:3100` over the network too.
      - traefik.enable=false
      - com.centurylinklabs.watchtower.scope=prod
    volumes:
      - ./loki.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - backend
      - proxy
    # Note: Loki image is scratch-based with no shell/wget/curl
    # Health is monitored by Prometheus scraping loki:3100/metrics

  promtail:
    image: grafana/promtail:latest
    restart: unless-stopped
    container_name: ${COMPOSE_PROJECT_NAME}.promtail
    labels:
      - traefik.enable=false
      - com.centurylinklabs.watchtower.scope=prod
    volumes:
      - ./promtail.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
      - promtail_data:/var/lib/promtail
    command: -config.file=/etc/promtail/config.yml
    networks:
      - backend
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    # 768m: ~192M resident + 21M swap while the 2.25G TSDB is idle;
    # a heavy range query on the 45-container dashboards needs the headroom.
    mem_limit: 768m
    container_name: ${COMPOSE_PROJECT_NAME}.prometheus
    labels:
      - com.centurylinklabs.watchtower.scope=prod
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - backend
      - proxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]

  pushgateway:
    image: prom/pushgateway:v1.11.5
    restart: unless-stopped
    container_name: ${COMPOSE_PROJECT_NAME}.pushgateway
    labels:
      - com.centurylinklabs.watchtower.scope=prod
    volumes:
      - pushgateway_data:/pushgateway
    command:
      - "--persistence.file=/pushgateway/metrics"
      - "--persistence.interval=5m"
    networks:
      - backend
    expose:
      - "9091"

  pushgateway-bridge:
    image: alpine/socat:latest
    restart: unless-stopped
    container_name: ${COMPOSE_PROJECT_NAME}.pushgateway-bridge
    depends_on:
      - pushgateway
    command: TCP-LISTEN:9091,reuseaddr,fork TCP:pushgateway:9091
    ports:
      - "127.0.0.1:9091:9091"
    networks:
      - backend
      - pushgateway_publish

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    container_name: ${COMPOSE_PROJECT_NAME}.node-exporter
    labels:
      - traefik.enable=false
      - com.centurylinklabs.watchtower.scope=prod
    # No `ports:` here: Prometheus scrapes node-exporter over the docker network
    # (node-exporter:9100). Publishing it bound 0.0.0.0 and made it reachable from
    # the internet whenever the container was next recreated.
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points="^/(sys|proc|dev|host|etc)($$|/)"'
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9100/metrics"]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    container_name: ${COMPOSE_PROJECT_NAME}.cadvisor
    labels:
      - traefik.enable=false
      - com.centurylinklabs.watchtower.scope=prod
    command:
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --disable_metrics=advtcp,cpu_topology,memory_numa,sched
    # No `ports:` here either: Prometheus scrapes cadvisor over the docker
    # network (cadvisor:8080). Same 0.0.0.0 exposure as node-exporter above.
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - backend

volumes:
  prometheus_data: { }
  grafana_data: { }
  loki_data: { }
  promtail_data: { }
  pushgateway_data: { }

networks:
  backend:
    internal: true
  proxy:
    external: true
  # Plain (non-internal) network so pushgateway-bridge's published host port
  # actually gets wired up - Docker silently no-ops `ports:` publishing for a
  # container whose ONLY network is `internal: true` (confirmed by direct
  # reproduction: HostConfig.PortBindings shows the requested mapping, but
  # NetworkSettings.Ports stays null and the port never accepts connections
  # until the container also joins a non-internal network). Used only by
  # pushgateway-bridge; backend stays internal for every other service.
  pushgateway_publish: {}
