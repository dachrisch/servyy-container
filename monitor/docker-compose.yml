# Every service carries `restart: unless-stopped`. Without it a container that Docker
# stops on daemon restart (host reboot) never comes back — and the daily
# `docker system prune -a -f` then deletes the stopped container and its image, so the
# whole stack silently disappears. That is what happened on 2026-10-29
# (history/2026-10-29_monitor-restart-policy.md).
#
# SPLIT ACROSS TWO HOSTS (2026-11-20). Compose `profiles` select one half per host;
# COMPOSE_PROFILES comes from monitor/.env (rendered per host) and is also passed to
# the compose module, so a hand-run `docker compose up -d` selects the same half.
#   ui      → grafana, loki                     (codey)
#   collect → prometheus, pushgateway, pushgateway-bridge, node-exporter,
#             cadvisor, promtail                (servy; they read its /proc, docker
#                                                socket and logs)
# servyy-test enables both. Cross-profile `depends_on` is impossible (compose
# refuses a dependency on a service whose profile is not active), which is why
# grafana depends only on loki and promtail depends on nothing.
services:
  grafana:
    image: grafana/grafana:latest
    profiles: ["ui"]
    restart: unless-stopped
    # 512m: 273-302M working set right after a restart with plugins loaded
    # (measured 2026-10-29, ~79 % of a 384m cap - too little headroom for the
    # container that carries every dashboard and alert rule on this host).
    mem_limit: 512m
    container_name: ${COMPOSE_PROJECT_NAME}.grafana
    env_file:
      - grafana.env # rendered by ansible (docker_service monitor template) from vault; never committed
    labels:
      - traefik.enable=true
      - traefik.http.routers.${SERVICE_NAME}.rule=Host(`${SERVICE_HOST}`)
      # Follows the same entrypoint/TLS knobs as the two cross-host routes: on
      # production this is websecure + the Porkbun DNS-01 resolver (as before);
      # on servyy-test it is plain `web`, because that Traefik has no ACME
      # resolver and no public DNS for the lxd name.
      - traefik.http.routers.${SERVICE_NAME}.entrypoints=${MONITOR_TRAEFIK_ENTRYPOINT}
      - traefik.http.routers.${SERVICE_NAME}.tls=${MONITOR_TRAEFIK_TLS}
      - traefik.http.routers.${SERVICE_NAME}.tls.certresolver=${MONITOR_TRAEFIK_CERTRESOLVER}
      - traefik.http.routers.${SERVICE_NAME}.service=grafana
      - traefik.http.services.grafana.loadbalancer.server.port=3000
      - traefik.http.routers.${SERVICE_NAME}_local_qualified.rule=Host(`${SERVICE_NAME}.${LOCAL_HOSTNAME}`)
      - traefik.http.routers.${SERVICE_NAME}_local_qualified.entrypoints=web
      - com.centurylinklabs.watchtower.scope=prod
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning
      # Contact points are the ONE monitor config that still carries a secret
      # (the admin mail address), so it is rendered by Ansible — but into
      # ./rendered/, never over the tracked file. This mount shadows the raw
      # Jinja copy that git keeps in ./provisioning: history/
      # 2026-11-18_monitor-render-out-of-checkout.md explains why rendering over
      # a tracked path broke idempotency and left Grafana one restart away from
      # a provisioning crash-loop.
      - ./rendered/contact-points.yml:/etc/grafana/provisioning/alerting/contact-points.yml:ro
      # Datasources are rendered for the same reason (2026-11-20): the Prometheus
      # datasource now points at https://prometheus.lehel.xyz with HTTP basic
      # auth, so the file holds a credential. The tracked
      # provisioning/datasources/datasources.yml is the Jinja SOURCE; this mount
      # shadows it with the resolved copy, exactly like contact-points.yml above.
      - ./rendered/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # Identity + mail secrets come from grafana.env (vault-rendered). Kept here
      # only structural (non-secret) settings.
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_FROM_NAME=Grafana Monitor
      - GF_SMTP_SKIP_VERIFY=false
      # Feature toggles
      - GF_FEATURE_TOGGLES_ENABLE=provisioning,kubernetesDashboards
      # Enable unified alerting
      - GF_UNIFIED_ALERTING_ENABLED=true
      # Server URL configuration for email notifications. Scheme follows the
      # host's entrypoint (https in production, http on servyy-test) so the test
      # host's verification is not redirected to a listener it does not have.
      - GF_SERVER_ROOT_URL=${MONITOR_PUBLIC_URL}
      - GF_SERVER_DOMAIN=${SERVICE_HOST}
    networks:
      - backend
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
    depends_on:
      - loki

  loki:
    image: grafana/loki:latest
    profiles: ["ui"]
    restart: unless-stopped
    # 512m: ~184-362M resident while indexing; the cap bounds a jammed
    # ingestion backlog instead of letting it displace app pages.
    mem_limit: 512m
    container_name: ${COMPOSE_PROJECT_NAME}.loki
    labels:
      # Re-exposed on 2026-11-20 because servy's promtail/fail2ban/Prometheus now
      # live on the other host. Unlike the 2026-09 attempt this route carries
      # real auth: `monitor-loki-auth@file` (basicAuth usersFile rendered from
      # secrets.yml) plus an ipAllowList of the two trusted hosts. websecure only
      # — no `web` router, so plaintext :80 falls through to the catchall 404.
      # Order matters: auth first, allow second, so an unauthenticated request is
      # 401 and an authenticated one from a stranger is 403.
      - traefik.enable=true
      - traefik.http.routers.monitor-loki.rule=Host(`${MONITOR_LOKI_HOST}`)
      - traefik.http.routers.monitor-loki.entrypoints=${MONITOR_TRAEFIK_ENTRYPOINT}
      - traefik.http.routers.monitor-loki.tls=${MONITOR_TRAEFIK_TLS}
      - traefik.http.routers.monitor-loki.tls.certresolver=${MONITOR_TRAEFIK_CERTRESOLVER}
      - traefik.http.routers.monitor-loki.middlewares=monitor-loki-auth@file,monitor-loki-allow@docker
      - traefik.http.routers.monitor-loki.service=monitor-loki
      - traefik.http.services.monitor-loki.loadbalancer.server.port=3100
      - traefik.http.middlewares.monitor-loki-allow.ipallowlist.sourcerange=${MONITOR_LOKI_ALLOW}
      - com.centurylinklabs.watchtower.scope=prod
    volumes:
      - ./loki.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - backend
      - proxy
    # Note: Loki image is scratch-based with no shell/wget/curl
    # Health is monitored by Prometheus scraping loki:3100/metrics

  promtail:
    image: grafana/promtail:latest
    profiles: ["collect"]
    restart: unless-stopped
    container_name: ${COMPOSE_PROJECT_NAME}.promtail
    labels:
      - traefik.enable=false
      - com.centurylinklabs.watchtower.scope=prod
    volumes:
      - ./promtail.yml:/etc/promtail/config.yml
      # Rendered from plays/vars/secrets.yml by user.yml (mode 0644; promtail runs
      # as root but the file is a host-side secret rendered out of the checkout).
      # The client config references it by path, so the secret never lands in the
      # container's environment or in `docker inspect`.
      - ./rendered/loki-password:/etc/promtail/loki-password:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
      - promtail_data:/var/lib/promtail
    environment:
      # Interpolated by compose from monitor/.env; promtail expands ${LOKI_PUSH_URL}
      # in promtail.yml (`-config.expand-env=true` below). Points at the
      # authenticated loki.lehel.xyz route on production and at the local Traefik
      # on servyy-test, so the auth path is exercised before the prod deploy.
      - LOKI_PUSH_URL=${LOKI_PUSH_URL}
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    networks:
      # `backend` is internal: true (no route off the host). Since 2026-11-20
      # promtail pushes to Loki on codey through the public authenticated route,
      # so it needs an external network too — `proxy` is the existing one.
      - backend
      - proxy

  prometheus:
    image: prom/prometheus:latest
    profiles: ["collect"]
    restart: unless-stopped
    # 768m: ~192M resident + 21M swap while the 2.25G TSDB is idle;
    # a heavy range query on the 45-container dashboards needs the headroom.
    mem_limit: 768m
    container_name: ${COMPOSE_PROJECT_NAME}.prometheus
    labels:
      # Query API for the Grafana datasource on codey (2026-11-20). Prometheus has
      # no auth of its own, so this route is basicAuth + ipAllowList and, like
      # Loki's, websecure only. The `/metrics` endpoint answers to authenticated
      # scraping, but the only scrape of it is `prometheus` scraping itself over
      # localhost, so nothing else depends on the route.
      - traefik.enable=true
      - traefik.http.routers.monitor-prometheus.rule=Host(`${MONITOR_PROMETHEUS_HOST}`)
      - traefik.http.routers.monitor-prometheus.entrypoints=${MONITOR_TRAEFIK_ENTRYPOINT}
      - traefik.http.routers.monitor-prometheus.tls=${MONITOR_TRAEFIK_TLS}
      - traefik.http.routers.monitor-prometheus.tls.certresolver=${MONITOR_TRAEFIK_CERTRESOLVER}
      - traefik.http.routers.monitor-prometheus.middlewares=monitor-prometheus-auth@file,monitor-prometheus-allow@docker
      - traefik.http.routers.monitor-prometheus.service=monitor-prometheus
      - traefik.http.services.monitor-prometheus.loadbalancer.server.port=9090
      - traefik.http.middlewares.monitor-prometheus-allow.ipallowlist.sourcerange=${MONITOR_PROMETHEUS_ALLOW}
      - com.centurylinklabs.watchtower.scope=prod
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      # Recording rules (container_memory_near_limit and future ones). Read-only:
      # they are repo artefacts, never written by the server.
      - ./rules:/etc/prometheus/rules:ro
      # Rendered by user.yml from the cross-host credential: the Loki scrape
      # target (host + scheme per environment) and the basic-auth password the
      # scrape sends. Prometheus runs as uid 65534 — see
      # world_readable_paths_by_service.monitor in plays/vars/default.yml.
      - ./rendered/loki-target.json:/etc/prometheus/rendered/loki-target.json:ro
      - ./rendered/loki-password:/etc/prometheus/rendered/loki-password:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - backend
      - proxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]

  pushgateway:
    # Floating: this used to be pinned and the pin then failed to roll out (prod
    # was still on v1.6.2 while the repo said v1.11.5, because watchtower only
    # re-pulls the tag a container already has). Prometheus images publish no
    # `vX.Y` tag, so `latest` is the only float available.
    image: prom/pushgateway:latest
    profiles: ["collect"]
    restart: unless-stopped
    container_name: ${COMPOSE_PROJECT_NAME}.pushgateway
    labels:
      - com.centurylinklabs.watchtower.scope=prod
    volumes:
      - pushgateway_data:/pushgateway
    command:
      - "--persistence.file=/pushgateway/metrics"
      - "--persistence.interval=5m"
    networks:
      - backend
    expose:
      - "9091"

  pushgateway-bridge:
    image: alpine/socat:latest
    profiles: ["collect"]
    restart: unless-stopped
    container_name: ${COMPOSE_PROJECT_NAME}.pushgateway-bridge
    depends_on:
      - pushgateway
    command: TCP-LISTEN:9091,reuseaddr,fork TCP:pushgateway:9091
    ports:
      - "127.0.0.1:9091:9091"
    networks:
      - backend
      - pushgateway_publish

  node-exporter:
    image: prom/node-exporter:latest
    profiles: ["collect"]
    restart: unless-stopped
    container_name: ${COMPOSE_PROJECT_NAME}.node-exporter
    labels:
      - traefik.enable=false
      - com.centurylinklabs.watchtower.scope=prod
    # No `ports:` here: Prometheus scrapes node-exporter over the docker network
    # (node-exporter:9100). Publishing it bound 0.0.0.0 and made it reachable from
    # the internet whenever the container was next recreated.
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points="^/(sys|proc|dev|host|etc)($$|/)"'
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9100/metrics"]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    profiles: ["collect"]
    restart: unless-stopped
    container_name: ${COMPOSE_PROJECT_NAME}.cadvisor
    labels:
      - traefik.enable=false
      - com.centurylinklabs.watchtower.scope=prod
    command:
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --disable_metrics=advtcp,cpu_topology,memory_numa,sched
    # No `ports:` here either: Prometheus scrapes cadvisor over the docker
    # network (cadvisor:8080). Same 0.0.0.0 exposure as node-exporter above.
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - backend

volumes:
  prometheus_data: { }
  grafana_data: { }
  loki_data: { }
  promtail_data: { }
  pushgateway_data: { }

networks:
  backend:
    internal: true
  proxy:
    external: true
  # Plain (non-internal) network so pushgateway-bridge's published host port
  # actually gets wired up - Docker silently no-ops `ports:` publishing for a
  # container whose ONLY network is `internal: true` (confirmed by direct
  # reproduction: HostConfig.PortBindings shows the requested mapping, but
  # NetworkSettings.Ports stays null and the port never accepts connections
  # until the container also joins a non-internal network). Used only by
  # pushgateway-bridge; backend stays internal for every other service.
  pushgateway_publish: {}
