apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      # Plaintext on purpose: the Loki tenant id is not a secret (see the note in
      # monitor/promtail.yml). Committing it keeps this file out of the Ansible
      # render, so a checkout of the deploy dir cannot revert it to invalid Jinja
      # YAML — which would make Grafana 13 exit 1 on a provisioning error.
      httpHeaderValue1: servyy-logs-k8x9m2p4q7
