apiVersion: 1

# NOTE: ansible-rendered (plays/user.yml pre_tasks, monitor files). The
# `addresses` below are Jinja placeholders filled from the encrypted
# `monitor_admin_email` var — do not commit real addresses here.
# Contact points define where alert notifications are sent
# Email SMTP is already configured in docker-compose.yml:
#   - SMTP host: smtp.gmail.com:587
#   - From: (monitor_admin_email, via grafana.env)
#   - Password: (vault-rendered grafana.env)

contactPoints:
  # Standard email notifications for all alerts
  - orgId: 1
    name: email-admin
    receivers:
      - uid: email-admin
        type: email
        settings:
          addresses: {{ monitor_admin_email }}
        disableResolveMessage: false

  # Critical alerts with faster repeat interval
  - orgId: 1
    name: email-critical
    receivers:
      - uid: email-critical
        type: email
        settings:
          addresses: {{ monitor_admin_email }}
          singleEmail: true
          # NOTE: the double-brace expressions in subject are Grafana
          # templating, not Jinja — the quoted-brace escapes below keep the
          # ansible render from parsing them.
          subject: '[{{ '{{' }} .Status | toUpper }}] {{ '{{' }} .CommonLabels.severity | toUpper }}: {{ '{{' }} .GroupLabels.rulename }}'
        disableResolveMessage: false

# Do not delete any existing contact points
deleteContactPoints: []
