apiVersion: 1

# Notification policies define routing logic for alerts based on severity
# Group by SEVERITY ONLY (2026-11-25): all 65 rules have a unique alertname, so
# grouping by alertname made each rule its own mail. A datasource blip that errored
# 50 rules at once mailed ~50 times (plus ~50 resolves) instead of three mails.

policies:
  - orgId: 1
    # Default receiver for all alerts
    receiver: email-admin
    # One group per severity, not per rule — see the header.
    group_by: ['severity']
    # Wait time before sending first notification for a group
    group_wait: 30s
    # Wait time before sending additional notifications for new alerts in the group
    group_interval: 5m
    # Wait time before resending notifications for ongoing alerts
    repeat_interval: 12h

    # Routing rules based on severity labels
    routes:
      # CRITICAL alerts - immediate notification, repeated at most hourly
      - receiver: email-critical
        matchers:
          - severity = critical
        group_wait: 10s
        group_interval: 1m
        repeat_interval: 1h
        continue: false

      # HIGH severity alerts - grouped notifications, repeated every 4h
      - receiver: email-admin
        matchers:
          - severity = high
        group_wait: 1m
        group_interval: 5m
        repeat_interval: 4h
        continue: false

      # MEDIUM severity alerts - least frequent notifications
      - receiver: email-admin
        matchers:
          - severity = medium
        group_wait: 5m
        group_interval: 10m
        repeat_interval: 12h
        continue: false

# Do not delete existing notification policies
deletePolicies: []
