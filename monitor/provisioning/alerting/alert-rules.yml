  # Backup/maintenance log-freshness monitoring (migrated from Monit monit.system.check.j2)
  - orgId: 1
    name: log-freshness-alerts
    folder: Infrastructure
    interval: 1m
    rules:
      # MEDIUM: a maintenance/backup log is stale. The staleness thresholds per log
      # (8d docker-cleanup, 32d kernel-cleanup, 2h restic home, 2h restic ls-db,
      # 25h restic root/forget, 8d restic check) are evaluated here, matching
      # Monit's per-file timestamps.
      - uid: stale_maintenance_log
        title: Stale Maintenance/Backup Log
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: >-
                system_log_freshness_seconds{log="docker-cleanup"} > 691200 or
                system_log_freshness_seconds{log="kernel-cleanup"} > 2764800 or
                system_log_freshness_seconds{log="restic-backup-home"} > 7200 or
                system_log_freshness_seconds{log="restic-backup-ls-db"} > 7200 or
                system_log_freshness_seconds{log="restic-backup-root"} > 90000 or
                system_log_freshness_seconds{log="restic-forget"} > 90000 or
                system_log_freshness_seconds{log="restic-check"} > 691200
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [0.5]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: 'A maintenance or backup log is stale'
          description: '{{ if $labels.log }}The {{ $labels.log }} log has not been written recently{{ else }}A maintenance/backup log has not been written within its threshold - backup or cleanup job may have stopped{{ end }}. Check system-log-freshness.sh on the host.'
        labels:
          severity: medium
        isPaused: false

      # MEDIUM: the log-freshness probe itself failed
      - uid: log_freshness_probe_failure
        title: Log-Freshness Probe Failing
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: system_log_freshness_probe_success
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [0.5]
                    type: lt
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: 'Log-freshness probe is failing'
          description: 'The log-freshness probe could not read all monitored log files for 10+ minutes.'
        labels:
          severity: medium
        isPaused: false

      # MEDIUM: the log-freshness probe has stopped running entirely
      - uid: log_freshness_probe_stale
        title: Log-Freshness Probe Stale
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: time() - push_time_seconds{job="system_log_freshness"}
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [5400]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: 'Log-freshness probe has not pushed metrics recently'
          description: 'No successful push from system-log-freshness.timer in over 90 minutes - the timer may have stopped running.'
        labels:
          severity: medium
        isPaused: false

  # Restic snapshot-age monitoring (2026-10-08: log mtime cannot prove a backup
  # succeeded — a failing job still touches its log hourly. The 2026-09-10 stale
  # exclusive lock on restic-ls-db blocked every backup for 4 weeks with a
  # freshly-written log. These rules evaluate the newest-SNAPSHOT age pushed by
  # system-restic-snapshots.sh, so they fire on actual backup staleness.
  # Thresholds mirror system_probe/defaults/main.yml `system_probe_restic_repos`.
  - orgId: 1
    name: restic-snapshot-alerts
    folder: Infrastructure
    interval: 1m
    rules:
      # HIGH: prod DB has no successful backup in 2h. The `< 0` clause catches
      # the unverifiable state (restic error, unreachable repo) — the probe
      # reports -1 exactly so an uncheckable DB alerts instead of going quiet.
      - uid: stale_restic_db_snapshot
        title: Stale Restic DB Snapshot
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: >-
                restic_snapshot_age_seconds{repo="db"} > 7200 or
                restic_snapshot_age_seconds{repo="db"} < 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [0.5]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: 'No recent successful LeagueSphere DB backup'
          description: '{{ if $labels.repo }}The {{ $labels.repo }} restic repo has no successful snapshot within its threshold{{ else }}A restic repo has no successful snapshot within its threshold - backups may be failing (check for stale locks: restic list locks){{ end }}. Check system-restic-snapshots.sh on the host.'
        labels:
          severity: high
        isPaused: false

      # MEDIUM: home/root have no successful backup within their thresholds
      # (2h home hourly, 25h root daily).
      - uid: stale_restic_snapshot
        title: Stale Restic Snapshot
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: >-
                restic_snapshot_age_seconds{repo="home"} > 7200 or
                restic_snapshot_age_seconds{repo="home"} < 0 or
                restic_snapshot_age_seconds{repo="root"} > 90000 or
                restic_snapshot_age_seconds{repo="root"} < 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [0.5]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: 'No recent successful restic backup (home/root)'
          description: '{{ if $labels.repo }}The {{ $labels.repo }} restic repo has no successful snapshot within its threshold{{ else }}A restic repo has no successful snapshot within its threshold - backups may be failing (check for stale locks: restic list locks){{ end }}. Check system-restic-snapshots.sh on the host.'
        labels:
          severity: medium
        isPaused: false

      # MEDIUM: the snapshot-age probe itself is broken (restic/python3 missing)
      - uid: restic_snapshot_probe_failure
        title: Restic Snapshot Probe Failing
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: restic_snapshot_probe_success
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [0.5]
                    type: lt
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: 'Restic snapshot-age probe is failing'
          description: 'The snapshot-age probe could not run properly for 10+ minutes (restic or python3 missing on the host).'
        labels:
          severity: medium
        isPaused: false

      # MEDIUM: the snapshot-age probe has stopped running entirely
      - uid: restic_snapshot_probe_stale
        title: Restic Snapshot Probe Stale
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: time() - push_time_seconds{job="restic_snapshot_freshness"}
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [5400]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: 'Restic snapshot-age probe has not pushed metrics recently'
          description: 'No successful push from system-restic-snapshots.timer in over 90 minutes - the timer may have stopped running.'
        labels:
          severity: medium
        isPaused: false

  # Storagebox monitoring (migrated from Monit monit.storagebox.check.j2)
  - orgId: 1
    name: storagebox-alerts
    folder: Infrastructure
    interval: 1m
    rules:
      # CRITICAL: the storagebox mount is not present
      - uid: storagebox_unmounted
        title: Storagebox Not Mounted
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: system_storagebox_mounted
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [0.5]
                    type: lt
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: 'Storagebox is not mounted'
          description: 'The storagebox mount (/mnt/storagebox) is not mounted - restic backups and restore targets will fail. Investigate immediately.'
        labels:
          severity: critical
        isPaused: false

      # MEDIUM: storagebox space usage above 50% (matches Monit threshold)
      - uid: storagebox_high_usage
        title: Storagebox Space High
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: system_storagebox_usage_pct
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [50]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: 'Storagebox space usage is high'
          description: 'Storagebox usage is {{ if $values.B }}{{ printf "%.1f" $values.B.Value }}%{{ else }}above 50%{{ end }} - check retention/pruning or add storage.'
        labels:
          severity: medium
        isPaused: false

      # MEDIUM: the storagebox probe failed to run
      - uid: storagebox_probe_failure
        title: Storagebox Probe Failing
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: system_storagebox_probe_success
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [0.5]
                    type: lt
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: 'Storagebox probe is failing'
          description: 'The storagebox probe could not determine mount/usage state for 10+ minutes.'
        labels:
          severity: medium
        isPaused: false

      # MEDIUM: the storagebox probe has stopped running entirely
      - uid: storagebox_probe_stale
        title: Storagebox Probe Stale
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: time() - push_time_seconds{job="system_storagebox"}
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [5400]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: 'Storagebox probe has not pushed metrics recently'
          description: 'No successful push from system-storagebox.timer in over 90 minutes - the timer may have stopped running.'
        labels:
          severity: medium
        isPaused: false

  # Per-service container health monitoring (migrated from Monit monit.container.check.j2)
  - orgId: 1
    name: container-health-alerts
    folder: Infrastructure
    interval: 1m
    rules:
      # MEDIUM: a docker-compose container is not running
      - uid: container_not_running
        title: Container Not Running
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: system_container_running
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [0.5]
                    type: lt
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: 'Docker container is not running'
          description: 'Container {{ $labels.name }} (service {{ $labels.service }}) is not running - the service may have crashed or exited.'
        labels:
          severity: medium
        # Alert instances are keyed per container name. When a container is
        # retired the probe stops emitting its series, and without this the
        # instance keeps its last state forever (job-search retirement
        # 2026-10-27 and the opencode probe entry both left a permanent
        # "Alerting" for a container that no longer exists). Resolve after 3
        # consecutive missing evaluations (~3m).
        missingSeriesEvalsToResolve: 3
        isPaused: false

      # CRITICAL: majority of monitored containers down at once (host-wide signal,
      # distinct from single-container failures covered by container_not_running).
      # Uses the average running fraction so one or two dead containers do not
      # page; a Docker daemon failure or host-wide outage drives it to 0.
      - uid: containers_all_down
        title: All Containers Down
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: avg(system_container_running)
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [0.5]
                    type: lt
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: 'Majority of monitored containers are down'
          description: 'Less than half of the monitored containers are running - Docker daemon may be down or the host is under stress. Check container_not_running alerts for per-container detail.'
        labels:
          severity: critical
        isPaused: false

      # MEDIUM: the container-health probe itself is broken (e.g. Docker daemon
      # unreachable) - distinct from individual containers being down
      - uid: container_health_probe_failure
        title: Container-Health Probe Failing
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: system_container_health_probe_success
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [0.5]
                    type: lt
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: 'Container-health probe is failing'
          description: 'The container-health probe could not reach the Docker daemon for 10+ minutes - container-down alerts may be unreliable.'
        labels:
          severity: medium
        isPaused: false

      # MEDIUM: the container-health probe has stopped running entirely
      - uid: container_health_probe_stale
        title: Container-Health Probe Stale
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: time() - push_time_seconds{job="system_container_health"}
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [5400]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: 'Container-health probe has not pushed metrics recently'
          description: 'No successful push from system-container-health.timer in over 90 minutes - the timer may have stopped running.'
        labels:
          severity: medium
        isPaused: false
