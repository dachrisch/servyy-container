apiVersion: 1

# Alert rules for security and infrastructure monitoring
# Integrates with fail2ban crawler rate limiting (deployed 2025-11-26)

groups:
  # Security-focused alert rules
  - orgId: 1
    name: security-alerts
    folder: Security
    interval: 1m
    rules:
      # CRITICAL: Service experiencing high error rate
      - uid: service_errors_critical
        title: Service Errors Critical
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(rate(traefik_service_requests_total{code=~"5.."}[5m]))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [10]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: 'High rate of 5xx errors detected'
          description: 'Service experiencing {{ if $values.B }}{{ printf "%.1f" $values.B.Value }} errors/sec{{ else }}high error rate{{ end }} - immediate investigation required'
        labels:
          severity: critical
        isPaused: false

      # CRITICAL: SSH brute force attack in progress
      - uid: ssh_brute_force_attack
        title: SSH Brute Force Attack
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum(count_over_time({job="system"} |~ "fail2ban.*\\[sshd\\].*Ban"[5m]))'
              queryType: range
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [5]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: 'SSH brute force attack detected'
          description: '{{ if $values.B }}{{ printf "%.0f" $values.B.Value }} SSH ban(s) in last 5 minutes{{ else }}SSH bans detected in last 5 minutes{{ end }} - active brute force attack detected'
        labels:
          severity: critical
        isPaused: false

      # HIGH: Excessive rate limiting (possible DoS attack)
      - uid: excessive_rate_limiting
        title: Excessive Rate Limiting
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(rate(traefik_service_requests_total{code="429"}[5m]))
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [100]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: 'Excessive HTTP 429 rate limiting'
          description: '{{ if $values.B }}{{ printf "%.0f" $values.B.Value }} rate limit (429) responses/sec{{ else }}Excessive rate limiting{{ end }} for 10 minutes - possible DoS attack'
        labels:
          severity: high
        isPaused: false

      # HIGH: Crawler soft ban spike (rate limiting working as intended but high volume)
      - uid: crawler_soft_ban_spike
        title: Crawler Soft Ban Spike
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum(count_over_time({job="system"} |~ "fail2ban.*\\[traefik-crawler-soft\\].*Ban"[10m]))'
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [20]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: 'High volume of crawler rate limit bans'
          description: '{{ if $values.B }}{{ printf "%.0f" $values.B.Value }} crawler IPs{{ else }}Multiple crawler IPs{{ end }} banned in 10 minutes - rate limiting active'
        labels:
          severity: high
        isPaused: false

      # HIGH: Security injection attempts detected
      - uid: injection_attempts
        title: Security Injection Attempts
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum(count_over_time({job="docker"} |~ "(?i)(sql.*injection|union.*select|<script|javascript:|eval\\(|exec\\()"[15m]))'
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [50]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: 'SQL injection or XSS attempts detected'
          description: '{{ if $values.B }}{{ printf "%.0f" $values.B.Value }} injection attempts{{ else }}Injection attempts detected{{ end }} in 15 minutes - security probe detected'
        labels:
          severity: high
        isPaused: false

  # System resource monitoring alert rules (migrated from Monit monit.system.check.j2)
  - orgId: 1
    name: system-resources-alerts
    folder: Infrastructure
    interval: 1m
    rules:
      # HIGH: 5-minute load average too high
      - uid: high_load_average_5m
        title: High System Load (5 min)
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: node_load5
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [6]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: 'System load average (5 min) is critically high'
          description: 'Load average (5 min) is {{ if $values.B }}{{ printf "%.2f" $values.B.Value }}{{ else }}high{{ end }} - check for runaway processes or resource contention'
        labels:
          severity: high
        isPaused: false

      # HIGH: 15-minute load average too high
      - uid: high_load_average_15m
        title: High System Load (15 min)
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: node_load15
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [3]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: 'System load average (15 min) is elevated'
          description: 'Load average (15 min) is {{ if $values.B }}{{ printf "%.2f" $values.B.Value }}{{ else }}elevated{{ end }} - sustained load above expected baseline'
        labels:
          severity: high
        isPaused: false

      # CRITICAL: Memory usage above 80% (matches Monit threshold)
      - uid: high_memory_usage
        title: High Memory Usage
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: '(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [80]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: 'System memory usage is critically high'
          description: 'Memory usage is {{ if $values.B }}{{ printf "%.1f" $values.B.Value }}%{{ else }}above 80%{{ end }} - possible OOM risk, investigate running services'
        labels:
          severity: critical
        isPaused: false

      # MEDIUM: Swap usage above 50% (matches Monit threshold)
      - uid: high_swap_usage
        title: High Swap Usage
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: '(1 - node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes) * 100'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [50]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: 'System swap usage is high'
          description: 'Swap usage is {{ if $values.B }}{{ printf "%.1f" $values.B.Value }}%{{ else }}above 50%{{ end }} - indicates memory pressure'
        labels:
          severity: medium
        isPaused: false

      # HIGH: user CPU usage above 80% (matches Monit monit.system.check.j2)
      - uid: high_cpu_user
        title: High CPU Usage (user)
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'sum by (instance) (rate(node_cpu_seconds_total{mode="user"}[5m])) * 100'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [80]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: 'High user CPU usage'
          description: 'User CPU usage is {{ if $values.B }}{{ printf "%.2f" $values.B.Value }}%{{ else }}above 80%{{ end }} - compute-heavy workload or runaway process'
        labels:
          severity: high
        isPaused: false

      # HIGH: system CPU usage above 20% (matches Monit monit.system.check.j2)
      - uid: high_cpu_system
        title: High CPU Usage (system)
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'sum by (instance) (rate(node_cpu_seconds_total{mode="system"}[5m])) * 100'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [20]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: 'High system CPU usage'
          description: 'System (kernel) CPU usage is {{ if $values.B }}{{ printf "%.2f" $values.B.Value }}%{{ else }}above 20%{{ end }} - possible kernel-level issue'
        labels:
          severity: high
        isPaused: false

      # HIGH: I/O wait CPU above 80% (matches Monit monit.system.check.j2)
      - uid: high_cpu_iowait
        title: High CPU I/O Wait
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'sum by (instance) (rate(node_cpu_seconds_total{mode="iowait"}[5m])) * 100'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [80]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: 'High CPU I/O wait'
          description: 'CPU I/O wait is {{ if $values.B }}{{ printf "%.2f" $values.B.Value }}%{{ else }}above 80%{{ end }} - storage subsystem may be saturated'
        labels:
          severity: high
        isPaused: false

      # HIGH: total CPU usage (user + system + iowait) above 200% (matches Monit
      # monit.system.check.j2; multi-core hosts can exceed 100%)
      - uid: high_cpu_total
        title: High Total CPU Usage
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'sum by (instance) (rate(node_cpu_seconds_total{mode=~"user|system|iowait"}[5m])) * 100'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [200]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: 'High total CPU usage'
          description: 'Total CPU usage (user+system+iowait) is {{ if $values.B }}{{ printf "%.2f" $values.B.Value }}%{{ else }}above 200%{{ end }} - system is heavily loaded'
        labels:
          severity: high
        isPaused: false

      # MEDIUM: Root filesystem usage above 90% (matches Monit threshold)
      - uid: high_root_disk_usage
        title: High Root Disk Usage
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: '(1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|fuse.lxcfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|fuse.lxcfs"}) * 100'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [90]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: 'Root filesystem usage is critically high'
          description: 'Root filesystem usage is {{ if $values.B }}{{ printf "%.1f" $values.B.Value }}%{{ else }}above 90%{{ end }} - cleanup needed to avoid disk full'
        labels:
          severity: medium
        isPaused: false

      # CRITICAL: Root filesystem usage above 95% (escalation tier, matches Monit
      # "> 95% for 2 cycles"; fires before the disk fills completely)
      - uid: critical_root_disk_usage
        title: Root Disk Almost Full
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: '(1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|fuse.lxcfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|fuse.lxcfs"}) * 100'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [95]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: 'Root filesystem is almost full'
          description: 'Root filesystem usage is {{ if $values.B }}{{ printf "%.1f" $values.B.Value }}%{{ else }}above 95%{{ end }} - immediate cleanup required to avoid disk full'
        labels:
          severity: critical
        isPaused: false

      # HIGH: extension volume usage above 80% (replaces Monit's has_10g_volume
      # check filesystem 10g_volume > 80% then alert). DORMANT: paused by default
      # because lehel.xyz has has_10g_volume=false. A host with a secondary
      # physical volume should unpause this rule (and tune the mount filter).
      - uid: extension_disk_high_usage
        title: High Extension Drive Usage
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: '(1 - node_filesystem_avail_bytes{mountpoint!="/",fstype!~"tmpfs|fuse.lxcfs"} / node_filesystem_size_bytes{mountpoint!="/",fstype!~"tmpfs|fuse.lxcfs"}) * 100'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [80]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: 'Extension drive usage is high'
          description: 'A non-root filesystem (e.g. extension volume) is {{ if $values.B }}{{ printf "%.1f" $values.B.Value }}%{{ else }}above 80%{{ end }} - check disk usage and retention'
        labels:
          severity: high
        isPaused: true

  # Infrastructure monitoring alert rules
  - orgId: 1
    name: infrastructure-alerts
    folder: Infrastructure
    interval: 1m
    rules:
      # MEDIUM: Container is down
      - uid: container_down
        title: Container Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'up{job="cadvisor"} == 0'
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [0.5]
                    type: lt
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: 'Container is down'
          description: 'Container {{ $labels.name }} is not responding for 2 minutes'
        labels:
          severity: medium
        isPaused: false

      # MEDIUM: Disk space running low
      - uid: high_disk_usage
        title: High Disk Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: '(node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|fuse.lxcfs"}) * 100 < 10'
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [10]
                    type: lt
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: 'Disk space running low'
          description: '{{ if $values.B }}Only {{ printf "%.1f" $values.B.Value }}% disk space remaining{{ else }}Low disk space{{ end }} on {{ $labels.mountpoint }} - cleanup needed'
        labels:
          severity: medium
        isPaused: false

      # MEDIUM: Unusual traffic spike
      - uid: unusual_traffic_spike
        title: Unusual Traffic Spike
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'sum(rate(traefik_service_requests_total[5m]))'
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [1000]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: 'Unusual traffic spike detected'
          description: '{{ if $values.B }}{{ printf "%.0f" $values.B.Value }} requests/sec{{ else }}High traffic volume{{ end }} for 10 minutes - significantly above baseline'
        labels:
          severity: medium
        isPaused: false

  # LeagueSphere maintenance/games monitoring
  - orgId: 1
    name: leaguesphere-alerts
    folder: LeagueSphere
    interval: 1m
    rules:
      # CRITICAL: maintenance mode is blocking real, in-progress games
      - uid: leaguesphere_maintenance_blocking_games
        title: Maintenance Mode Blocking Live Games
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: leaguesphere_maintenance_blocking_games
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [0.5]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: 'LeagueSphere maintenance mode is blocking live games'
          description: 'Maintenance mode is active while games are in progress today - real users are locked out during a live game. Disable maintenance mode or confirm this is intentional immediately.'
        labels:
          severity: critical
        isPaused: false

      # MEDIUM: the probe itself can't reach prod / parse its response
      - uid: leaguesphere_maintenance_probe_success
        title: LeagueSphere Maintenance Probe Failing
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: leaguesphere_probe_success
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [0.5]
                    type: lt
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: 'LeagueSphere maintenance/games probe is failing'
          description: 'The hourly maintenance-mode/games probe could not reach or parse a response from LeagueSphere for 10+ minutes - check ls-maintenance-probe.service on lehel.xyz.'
        labels:
          severity: medium
        isPaused: false

      # MEDIUM: the probe has stopped running entirely (timer dead, not just failing)
      - uid: leaguesphere_maintenance_probe_stale
        title: LeagueSphere Maintenance Probe Stale
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: time() - push_time_seconds{job="leaguesphere_maintenance_probe"}
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [5400]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: 'LeagueSphere maintenance probe has not pushed metrics recently'
          description: 'No successful push from ls-maintenance-probe.timer in over 90 minutes - the hourly timer on lehel.xyz may have stopped running.'
        labels:
          severity: medium
        isPaused: false

  # Backup/maintenance log-freshness monitoring (migrated from Monit monit.system.check.j2)
  - orgId: 1
    name: log-freshness-alerts
    folder: Infrastructure
    interval: 1m
    rules:
      # MEDIUM: a maintenance/backup log is stale. The staleness thresholds per log
      # (8d docker-cleanup, 32d kernel-cleanup, 2h restic home, 25h restic root/forget,
      # 8d restic check) are evaluated here, matching Monit's per-file timestamps.
      - uid: stale_maintenance_log
        title: Stale Maintenance/Backup Log
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: >-
                system_log_freshness_seconds{log="docker-cleanup"} > 691200 or
                system_log_freshness_seconds{log="kernel-cleanup"} > 2764800 or
                system_log_freshness_seconds{log="restic-backup-home"} > 7200 or
                system_log_freshness_seconds{log="restic-backup-root"} > 90000 or
                system_log_freshness_seconds{log="restic-forget"} > 90000 or
                system_log_freshness_seconds{log="restic-check"} > 691200
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [0.5]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: 'A maintenance or backup log is stale'
          description: '{{ if $labels.log }}The {{ $labels.log }} log has not been written recently{{ else }}A maintenance/backup log has not been written within its threshold - backup or cleanup job may have stopped{{ end }}. Check system-log-freshness.sh on the host.'
        labels:
          severity: medium
        isPaused: false

      # MEDIUM: the log-freshness probe itself failed
      - uid: log_freshness_probe_failure
        title: Log-Freshness Probe Failing
