  # Per-service container health monitoring (migrated from Monit monit.container.check.j2)
  - orgId: 1
    name: container-health-alerts
    folder: Infrastructure
    interval: 1m
    rules:
      # MEDIUM: a docker-compose container is not running
      - uid: container_not_running
        title: Container Not Running
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              # Backend containers have their own CRITICAL rules below
              # (backend_container_not_running / backend_container_unhealthy): a
              # data-layer outage must not page twice for one container.
              expr: system_container_running{tier!="backend"}
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [0.5]
                    type: lt
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: 'Docker container is not running'
          description: 'Container {{ $labels.name }} (service {{ $labels.service }}) is not running - the service may have crashed or exited.'
        labels:
          severity: medium
        # Alert instances are keyed per container name. When a container is
        # retired the probe stops emitting its series, and without this the
        # instance keeps its last state forever (job-search retirement
        # 2026-10-27 and the opencode probe entry both left a permanent
        # "Alerting" for a container that no longer exists). Resolve after 3
        # consecutive missing evaluations (~3m).
        missingSeriesEvalsToResolve: 3
        isPaused: false

      # CRITICAL, where a single app container is MEDIUM above: `shared` is the
      # data layer for leagues-finance, finance (Firefly), queen and dontforget —
      # one dead container takes all four down. Selects on tier, so future backend
      # services (a second db, a queue) are covered without touching this rule.
      - uid: backend_container_not_running
        title: Backend Container Not Running
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: system_container_running{tier="backend"}
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [0.5]
                    type: lt
        noDataState: OK
        execErrState: Error
        # 10m, not 1m: the probe pushes every 5 min with up to 5 min of
        # RandomizedDelaySec, so consecutive pushes are 0-10 min apart - and
        # Pushgateway keeps serving the last pushed value until the next PUT, so
        # a phantom 0 stays visible for up to that whole gap. 10m covers the
        # typical gap and absorbs one bad push unless the next one is also ~10
        # min late (the retry handles a failed inspect, not a wrong push). Cost:
        # a real stop pages 10-20 min later (0-10 min to the next push, then the
        # 10 min of `for`).
        for: 10m
        annotations:
          summary: 'Backend container {{ $labels.name }} is not running'
          description: 'Container {{ $labels.name }} (service {{ $labels.service }}) is not running. The shared data layer backs leagues-finance, finance (Firefly), queen and dontforget: expect errors in all of them until it is back. Check `docker logs --tail 50 {{ $labels.name }}` for the exit reason and `docker inspect {{ $labels.name }}` for the exit code / OOMKilled flag.'
        labels:
          severity: critical
        missingSeriesEvalsToResolve: 3
        isPaused: false

      # MEDIUM: an app container is running, but its own healthcheck reports
      # unhealthy. Before this rule nothing fired: an unhealthy container keeps
      # .State.Running true, so every liveness signal stayed green while the
      # service stopped answering. The backend equivalent below is CRITICAL.
      # `for: 10m` because a container needs ~2.5min (5 x 30s) to be marked
      # unhealthy at all, and because pushes are 5-10 min apart - a shorter
      # window would page on a normal restart or a single bad push.
      - uid: container_unhealthy
        title: Container Unhealthy
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: system_container_healthy{tier!="backend"}
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [0.5]
                    type: lt
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: 'Container {{ $labels.name }} is unhealthy'
          description: 'The container has been reporting unhealthy (or still starting) for 10+ minutes (service {{ $labels.service }}) - it runs while not answering, which is the difference between "up" and "responding". Run `docker inspect {{ $labels.name }}` and read State.Health.Log for the failing probe output.'
        labels:
          severity: medium
        missingSeriesEvalsToResolve: 3
        isPaused: false

      # CRITICAL, mirroring the not-running / unhealthy pairing above: the shared
      # healthchecks are protocol level (mongosh ping, valkey-cli ping,
      # pg_isready), so "unhealthy for 10 minutes" means the data layer is not
      # answering for leagues-finance, finance (Firefly), queen and dontforget -
      # the same blast radius as a stopped container, hence the same severity. The app-tier
      # equivalent above stays MEDIUM: a single app that is up but degraded is
      # not host-fatal.
      - uid: backend_container_unhealthy
        title: Backend Container Unhealthy
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: system_container_healthy{tier="backend"}
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [0.5]
                    type: lt
        noDataState: OK
        execErrState: Error
        # Time-to-page is the sibling's 10-20 min plus the ~2.5 min the shared
        # healthcheck needs before it reports unhealthy at all.
        for: 10m
        annotations:
          summary: 'Backend container {{ $labels.name }} is unhealthy'
          description: 'The shared data layer (service {{ $labels.service }}) has been reported unhealthy by its own healthcheck for 10+ minutes (or has not finished starting), so leagues-finance, finance (Firefly), queen and dontforget are erroring against it. It is still running - "up but not answering". Read State.Health.Log via `docker inspect {{ $labels.name }}` before restarting it; an unclean mongo shutdown costs recovery time.'
        labels:
          severity: critical
        missingSeriesEvalsToResolve: 3
        isPaused: false

      # CRITICAL: majority of monitored containers down at once (host-wide signal,
      # distinct from single-container failures covered by container_not_running).
      # Uses the average running fraction so one or two dead containers do not
      # page; a Docker daemon failure or host-wide outage drives it to 0.
      - uid: containers_all_down
        title: All Containers Down
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: avg(system_container_running)
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [0.5]
                    type: lt
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: 'Majority of monitored containers are down'
          description: 'Less than half of the monitored containers are running - Docker daemon may be down or the host is under stress. Check container_not_running alerts for per-container detail.'
        labels:
          severity: critical
        isPaused: false

      # MEDIUM: the container-health probe itself is broken (e.g. Docker daemon
      # unreachable) - distinct from individual containers being down
      - uid: container_health_probe_failure
        title: Container-Health Probe Failing
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: system_container_health_probe_success
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [0.5]
                    type: lt
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: 'Container-health probe is failing'
          description: 'The container-health probe could not reach the Docker daemon for 10+ minutes - container-down alerts may be unreliable.'
        labels:
          severity: medium
        isPaused: false

      # MEDIUM: the container-health probe has stopped running entirely
      - uid: container_health_probe_stale
        title: Container-Health Probe Stale
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: time() - push_time_seconds{job="system_container_health"}
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [5400]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: 'Container-health probe has not pushed metrics recently'
          description: 'No successful push from system-container-health.timer in over 90 minutes - the timer may have stopped running.'
        labels:
          severity: medium
        isPaused: false

  - orgId: 1
    name: tmp-alerts
    folder: Infrastructure
    interval: 1m
    rules:
      # MEDIUM: /tmp is filling up. It is a 3.8 GB tmpfs here and has no
      # node_filesystem_* series, so this probe (system_tmp.sh) is its only
      # watcher. At 82 % on 2026-11-18 every restic home snapshot started failing
      # with "disk quota exceeded" - warn well before that.
      - uid: system_tmp_usage_high
        title: /tmp Usage High
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: system_tmp_usage_pct
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [70]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: '/tmp is {{ if $values.B }}{{ printf "%.0f" $values.B.Value }}{{ else }}over 70{{ end }}% full'
          description: '/tmp is a 3.8 GB tmpfs on this host. Above 70 % a stray large file can fill it and break every restic snapshot ("disk quota exceeded"). Find the consumer (du -sh /tmp/*) and remove it.'
        labels:
          severity: medium
        isPaused: false

      # HIGH: /tmp is at or above 90 %. Backups and anything else that stages in
      # $TMPDIR are already at risk; this is the "act now" state.
      - uid: system_tmp_usage_critical
        title: /tmp Usage Critical
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: system_tmp_usage_pct
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [90]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: '/tmp is {{ if $values.B }}{{ printf "%.0f" $values.B.Value }}{{ else }}over 90{{ end }}% full'
          description: '/tmp is effectively full. Expect restic snapshots and anything else using $TMPDIR to fail immediately. Free space now (du -sh /tmp/*).'
        labels:
          severity: high
        isPaused: false
