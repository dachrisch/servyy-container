apiVersion: 1

# Alert rules for security and infrastructure monitoring
# Integrates with fail2ban crawler rate limiting (deployed 2025-11-26)

groups:
  # Security-focused alert rules
  - orgId: 1
    name: security-alerts
    folder: Security
    interval: 1m
    rules:
      # CRITICAL: Service experiencing high error rate
      - uid: service_errors_critical
        title: Service Errors Critical
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(rate(traefik_service_requests_total{code=~"5.."}[5m]))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [10]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: 'High rate of 5xx errors detected'
          description: 'Service experiencing {{ if $values.B }}{{ printf "%.1f" $values.B.Value }} errors/sec{{ else }}high error rate{{ end }} - immediate investigation required'
        labels:
          severity: critical
        isPaused: false

      # CRITICAL: SSH brute force attack in progress
      - uid: ssh_brute_force_attack
        title: SSH Brute Force Attack
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum(count_over_time({job="system"} |~ "fail2ban.*\\[sshd\\].*Ban"[5m]))'
              queryType: range
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [5]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: 'SSH brute force attack detected'
          description: '{{ if $values.B }}{{ printf "%.0f" $values.B.Value }} SSH ban(s) in last 5 minutes{{ else }}SSH bans detected in last 5 minutes{{ end }} - active brute force attack detected'
        labels:
          severity: critical
        isPaused: false

      # HIGH: Excessive rate limiting (possible DoS attack)
      - uid: excessive_rate_limiting
        title: Excessive Rate Limiting
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(rate(traefik_service_requests_total{code="429"}[5m]))
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [100]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: 'Excessive HTTP 429 rate limiting'
          description: '{{ if $values.B }}{{ printf "%.0f" $values.B.Value }} rate limit (429) responses/sec{{ else }}Excessive rate limiting{{ end }} for 10 minutes - possible DoS attack'
        labels:
          severity: high
        isPaused: false

      # HIGH: Crawler soft ban spike (rate limiting working as intended but high volume)
      - uid: crawler_soft_ban_spike
        title: Crawler Soft Ban Spike
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum(count_over_time({job="system"} |~ "fail2ban.*\\[traefik-crawler-soft\\].*Ban"[10m]))'
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [20]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: 'High volume of crawler rate limit bans'
          description: '{{ if $values.B }}{{ printf "%.0f" $values.B.Value }} crawler IPs{{ else }}Multiple crawler IPs{{ end }} banned in 10 minutes - rate limiting active'
        labels:
          severity: high
        isPaused: false

      # HIGH: Security injection attempts detected
      - uid: injection_attempts
        title: Security Injection Attempts
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum(count_over_time({job="docker"} |~ "(?i)(sql.*injection|union.*select|<script|javascript:|eval\\(|exec\\()"[15m]))'
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [50]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: 'SQL injection or XSS attempts detected'
          description: '{{ if $values.B }}{{ printf "%.0f" $values.B.Value }} injection attempts{{ else }}Injection attempts detected{{ end }} in 15 minutes - security probe detected'
        labels:
          severity: high
        isPaused: false

  # System resource monitoring alert rules (migrated from Monit monit.system.check.j2)
  - orgId: 1
    name: system-resources-alerts
    folder: Infrastructure
    interval: 1m
    rules:
      # HIGH: 5-minute load average above 2x the host's CPU count.
      # Expressed per core so the rule keeps its meaning across a resize. The
      # old absolute `> 6` sat inside this host's normal operating range
      # (idle baseline ~0.8 load per core: node_load5 counts *runnable
      # threads*, and the box carries ~1,850 of them), so it fired 3x/day and
      # was noise — history/2026-10-30_load-alert-tuning.md.
      - uid: high_load_average_5m
        title: High System Load (5 min)
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'node_load5 / count without (cpu, mode) (node_cpu_seconds_total{mode="idle"})'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [2]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: 'System load average (5 min) is more than 2x the CPU count'
          description: 'Load average (5 min) is {{ if $values.B }}{{ printf "%.2f" $values.B.Value }}{{ else }}more than 2.0{{ end }} per CPU (>2.0 = every core claimed twice over) - check for runaway processes or resource contention'
        labels:
          severity: high
        isPaused: false

      # HIGH: 15-minute load average above 1.5x the host's CPU count.
      # Same per-core normalisation as the 5-minute rule; 1.5 is the
      # sustained-queueing line (6.0 on this 4-core host, against a ~3.2
      # all-day baseline and ~1.7 during the 2026-10-30 leaguesphere.app
      # memory-cap episode that this rule should still catch).
      - uid: high_load_average_15m
        title: High System Load (15 min)
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'node_load15 / count without (cpu, mode) (node_cpu_seconds_total{mode="idle"})'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [1.5]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: 'System load average (15 min) is elevated'
          description: 'Load average (15 min) is {{ if $values.B }}{{ printf "%.2f" $values.B.Value }}{{ else }}elevated{{ end }} per CPU (>1.5 = sustained queueing) - sustained load above expected baseline'
        labels:
          severity: high
        isPaused: false

      # CRITICAL: Memory usage above 80% (matches Monit threshold)
      - uid: high_memory_usage
        title: High Memory Usage
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: '(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [80]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: 'System memory usage is critically high'
          description: 'Memory usage is {{ if $values.B }}{{ printf "%.1f" $values.B.Value }}%{{ else }}above 80%{{ end }} - possible OOM risk, investigate running services'
        labels:
          severity: critical
        isPaused: false

      # MEDIUM: Swap usage above 80% of the swap device.
      # Not 50%: on this host swap occupancy is steady-state cold pages (the
      # kernel keeps ~3.5 of 6.3 GiB parked there with swappiness 20), so the
      # old 50% threshold was a permanent coin flip — it fired repeatedly on
      # 2026-10-30 while memory PSI sat at 0. Actual pressure is alerted on by
      # node_memory_pressure_full / node_memory_pressure_some /
      # node_swap_out_thrash below; this rule now only reports "the cushion is
      # nearly gone".
      - uid: high_swap_usage
        title: High Swap Usage
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: '(1 - node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes) * 100'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [80]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: 'System swap usage is critically high'
          description: 'Swap usage is {{ if $values.B }}{{ printf "%.1f" $values.B.Value }}%{{ else }}above 80%{{ end }} - the emergency cushion is nearly gone'
        labels:
          severity: medium
        isPaused: false

      # HIGH: user CPU usage above 80% (matches Monit monit.system.check.j2)
      - uid: high_cpu_user
        title: High CPU Usage (user)
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'avg by (instance) (rate(node_cpu_seconds_total{mode="user"}[5m])) * 100'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [80]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: 'High user CPU usage'
          description: 'User CPU usage is {{ if $values.B }}{{ printf "%.2f" $values.B.Value }}%{{ else }}above 80%{{ end }} - compute-heavy workload or runaway process'
        labels:
          severity: high
        isPaused: false

      # HIGH: system CPU usage above 30% (per-core average).
      # Was 20%, i.e. permanently half-tripped: ~13% of every core runs in
      # kernel mode all day on this host (45 containers, ~2.8 docker exec
      # healthchecks/s). 30% leaves room for normal churn and still catches a
      # kernel-level problem.
      - uid: high_cpu_system
        title: High CPU Usage (system)
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'avg by (instance) (rate(node_cpu_seconds_total{mode="system"}[5m])) * 100'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [30]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: 'High system CPU usage'
          description: 'System (kernel) CPU usage is {{ if $values.B }}{{ printf "%.2f" $values.B.Value }}%{{ else }}above 20%{{ end }} - possible kernel-level issue'
        labels:
          severity: high
        isPaused: false

      # HIGH: I/O wait CPU above 80% (matches Monit monit.system.check.j2)
      - uid: high_cpu_iowait
        title: High CPU I/O Wait
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'avg by (instance) (rate(node_cpu_seconds_total{mode="iowait"}[5m])) * 100'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [80]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: 'High CPU I/O wait'
          description: 'CPU I/O wait is {{ if $values.B }}{{ printf "%.2f" $values.B.Value }}%{{ else }}above 80%{{ end }} - storage subsystem may be saturated'
        labels:
          severity: high
        isPaused: false

      # HIGH: total CPU usage (user + system + iowait) above 80% of the host's
      # capacity. Normalised to percent-of-cores instead of the old absolute
      # `> 200` (= 50% of this 4-core host, which is where it sits all day:
      # 46.6% today, 48.5% yesterday), so it only fires when the box is
      # actually running out of CPU.
      - uid: high_cpu_total
        title: High Total CPU Usage
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: '100 * sum without (cpu, mode) (rate(node_cpu_seconds_total{mode=~"user|system|iowait"}[5m])) / count without (cpu, mode) (node_cpu_seconds_total{mode="idle"})'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [80]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: 'High total CPU usage'
          description: 'Total CPU usage (user+system+iowait) is {{ if $values.B }}{{ printf "%.1f" $values.B.Value }}%{{ else }}above 80%{{ end }} of capacity - system is heavily loaded'
        labels:
          severity: high
        isPaused: false

      # HIGH: CPU pressure — the fraction of time at least one task was
      # runnable but had to wait for a core.
      # This is the rule that actually describes "the host feels loaded";
      # node_load5/15 do not, because load counts ~1,850 runnable-thread
      # candidates on this box and therefore carries a high idle baseline.
      # PSI measures the waiting itself: ~13-16% on a healthy day, 56% during
      # the 2026-10-29 memory-pressure incident.
      - uid: node_cpu_pressure_high
        title: High CPU Pressure (PSI)
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'rate(node_pressure_cpu_waiting_seconds_total[5m]) * 100'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [50]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: 'Tasks are waiting for CPU more than half the time'
          description: 'CPU pressure is {{ if $values.B }}{{ printf "%.1f" $values.B.Value }}%{{ else }}above 50%{{ end }} - some task was runnable but waiting for a core for more than half of the last 15m'
        labels:
          severity: high
        isPaused: false

      # MEDIUM: Root filesystem usage above 90% (matches Monit threshold)
      - uid: high_root_disk_usage
        title: High Root Disk Usage
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: '(1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|fuse.lxcfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|fuse.lxcfs"}) * 100'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [90]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: 'Root filesystem usage is critically high'
          description: 'Root filesystem usage is {{ if $values.B }}{{ printf "%.1f" $values.B.Value }}%{{ else }}above 90%{{ end }} - cleanup needed to avoid disk full'
        labels:
          severity: medium
        isPaused: false

      # CRITICAL: Root filesystem usage above 95% (escalation tier, matches Monit
      # "> 95% for 2 cycles"; fires before the disk fills completely)
      - uid: critical_root_disk_usage
        title: Root Disk Almost Full
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: '(1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|fuse.lxcfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|fuse.lxcfs"}) * 100'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [95]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: 'Root filesystem is almost full'
          description: 'Root filesystem usage is {{ if $values.B }}{{ printf "%.1f" $values.B.Value }}%{{ else }}above 95%{{ end }} - immediate cleanup required to avoid disk full'
        labels:
          severity: critical
        isPaused: false

      # HIGH: extension volume usage above 80% (replaces Monit's has_10g_volume
      # check filesystem 10g_volume > 80% then alert). DORMANT: paused by default
      # because lehel.xyz has has_10g_volume=false. A host with a secondary
      # physical volume should unpause this rule (and tune the mount filter).
      - uid: extension_disk_high_usage
        title: High Extension Drive Usage
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: '(1 - node_filesystem_avail_bytes{mountpoint!="/",fstype!~"tmpfs|fuse.lxcfs"} / node_filesystem_size_bytes{mountpoint!="/",fstype!~"tmpfs|fuse.lxcfs"}) * 100'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [80]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: 'Extension drive usage is high'
          description: 'A non-root filesystem (e.g. extension volume) is {{ if $values.B }}{{ printf "%.1f" $values.B.Value }}%{{ else }}above 80%{{ end }} - check disk usage and retention'
        labels:
          severity: high
        isPaused: true

      # CRITICAL: a container's cgroup OOM killer fired. This is the alert the
      # 2026-10-29 incident was missing: 702 oom-kills in seven days, all of them
      # moodle.moodle (php-fpm children reaped inside a too-small mem_limit), and
      # nobody noticed because the dashboards were gone and no rule watched the
      # kernel's own counter. `increase()` over 30m (not `rate()`) because OOM
      # kills are rare, discrete events — a rate would round them to zero.
      - uid: container_oom_killed
        title: Container OOM Kill
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum by (name) (increase(container_oom_events_total{name!=""}[30m]))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: 'Container {{ $labels.name }} was OOM-killed'
          description: 'The cgroup OOM killer fired {{ if $values.B }}{{ printf "%.0f" $values.B.Value }}{{ else }}at least once{{ end }} time(s) in the last 30 minutes for {{ $labels.name }}. Working set has outgrown mem_limit: raise the limit or cut the process count that runs inside it. 702 such kills between 2026-10-22 and 2026-10-29 all came from moodle.moodle (100 php-fpm children x 512M memory_limit inside a 768m container).'
        labels:
          severity: critical
        isPaused: false

      # CRITICAL: memory PSI "full" — every runnable task stalled on memory.
      # The average load and MemFree rules cannot see this: MemFree sits at
      # ~200M permanently because page cache occupies the rest, so the host looks
      # fine while work waits on reclaim. PSI is the metric that actually says
      # "work is blocked". `node_pressure_memory_stalled_seconds_total` is
      # aggregate stall time; rate*100 = percent of wall-clock time fully stalled.
      - uid: node_memory_pressure_full
        title: Memory Pressure Stalled (full)
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: rate(node_pressure_memory_stalled_seconds_total[5m]) * 100
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [5]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: 'All tasks stalled on memory for {{ if $values.B }}{{ printf "%.1f" $values.B.Value }}{{ else }}over 5{{ end }}% of the time'
          description: 'PSI memory "full" above 5% for 5 minutes: every non-idle task sat waiting on page reclaim, not just some of them. On this host that means swap is backing hot pages. Check `sar -S`/pswpout, then the capped containers whose working set is near their limit.'
        labels:
          severity: critical
        isPaused: false

      # HIGH: memory PSI "some" — at least one task stalled on reclaim. Earlier
      # warning tier for the same failure mode; measured baseline is 0.2-0.5%.
      - uid: node_memory_pressure_some
        title: Memory Pressure Stalled (some)
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: rate(node_pressure_memory_waiting_seconds_total[5m]) * 100
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [10]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: 'Some tasks stalled on memory for {{ if $values.B }}{{ printf "%.1f" $values.B.Value }}{{ else }}over 10{{ end }}% of the time'
          description: 'PSI memory "some" above 10% for 10 minutes (baseline on this host is 0.2-0.5%). Retained page cache is no longer sufficient and the kernel is reclaiming. Correlate with swap-out and the per-container working-set ratio.'
        labels:
          severity: high
        isPaused: false

      # HIGH: swap-out thrashing. node_vmstat_pswpout counts pages (4 KiB) written
      # to swap; rate() = pages/s. 500 pages/s over 15 minutes is ~2 MiB/s of
      # steady-state swap traffic — that is not an emergency cushion any more, it
      # is the backing store. Measured 2026-10-29 while 2.4 GiB was swapped:
      # ~250 pages/s, i.e. this rule stays quiet until thrash roughly doubles.
      - uid: node_swap_out_thrash
        title: Heavy Swap-Out (thrashing)
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: rate(node_vmstat_pswpout[5m])
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [500]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: 'Host is writing {{ if $values.B }}{{ printf "%.0f" $values.B.Value }}{{ else }}over 500{{ end }} pages/s to swap'
          description: 'Sustained swap-out (~2 MiB/s) for 15 minutes. Hot pages are being evicted, so every request touching them pays disk latency. `vm.swappiness` should be 20 (roles/system/tasks/swap.yml); if reclaim persists, the host is genuinely out of RAM.'
        labels:
          severity: high
        isPaused: false

      # MEDIUM: a capped container is close to its mem_limit. This is the early
      # warning that would have preceded every one of the moodle OOM kills. Only
      # containers that actually declare a limit are considered (`and` on
      # container_spec_memory_limit_bytes), and the < 1e12 filter drops the
      # sentinel value cAdvisor reports for uncapped containers, which would
      # otherwise divide by ~9 exabytes and stay silent anyway.
      - uid: container_memory_near_limit
        title: Container Near Memory Limit
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'max by (name) ((container_memory_working_set_bytes{name!=""} / clamp_min(container_spec_memory_limit_bytes{name!=""}, 1)) and (container_spec_memory_limit_bytes{name!=""} > 0) and (container_spec_memory_limit_bytes{name!=""} < 1e12))'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [0.9]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: 'Container {{ $labels.name }} is at {{ if $values.B }}{{ printf "%.0f" $values.B.Value }}%{{ else }}over 90%{{ end }} of its memory limit'
          description: 'Working set has been above 90% of mem_limit for 15 minutes. Either the limit is too small for the process count inside the container (moodle: 5 x 256M php-fpm children in 1.5G) or a leak is growing. The OOM kill is usually minutes away.'
        labels:
          severity: medium
        isPaused: false

  # Infrastructure monitoring alert rules
  - orgId: 1
    name: infrastructure-alerts
    folder: Infrastructure
    interval: 1m
    rules:
      # MEDIUM: Container is down
      - uid: container_down
        title: Container Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'up{job="cadvisor"} == 0'
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [0.5]
                    type: lt
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: 'Container is down'
          description: 'Container {{ $labels.name }} is not responding for 2 minutes'
        labels:
          severity: medium
        isPaused: false

      # MEDIUM: Disk space running low
      - uid: high_disk_usage
        title: High Disk Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: '(node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|fuse.lxcfs"}) * 100 < 10'
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [10]
                    type: lt
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: 'Disk space running low'
          description: '{{ if $values.B }}Only {{ printf "%.1f" $values.B.Value }}% disk space remaining{{ else }}Low disk space{{ end }} on {{ $labels.mountpoint }} - cleanup needed'
        labels:
          severity: medium
        isPaused: false

      # MEDIUM: Unusual traffic spike
      - uid: unusual_traffic_spike
        title: Unusual Traffic Spike
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'sum(rate(traefik_service_requests_total[5m]))'
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [1000]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: 'Unusual traffic spike detected'
          description: '{{ if $values.B }}{{ printf "%.0f" $values.B.Value }} requests/sec{{ else }}High traffic volume{{ end }} for 10 minutes - significantly above baseline'
        labels:
          severity: medium
        isPaused: false

