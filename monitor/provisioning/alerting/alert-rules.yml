              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [0.5]
                    type: lt
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: 'Log-freshness probe is failing'
          description: 'The log-freshness probe could not read all monitored log files for 10+ minutes.'
        labels:
          severity: medium
        isPaused: false

      # MEDIUM: the log-freshness probe has stopped running entirely
      - uid: log_freshness_probe_stale
        title: Log-Freshness Probe Stale
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: time() - push_time_seconds{job="system_log_freshness"}
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [5400]
                    type: gt
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: 'Log-freshness probe has not pushed metrics recently'
          description: 'No successful push from system-log-freshness.timer in over 90 minutes - the timer may have stopped running.'
