services:
  www:
    image: bumblecode/web:www
    container_name: ${COMPOSE_PROJECT_NAME}.www
    labels:
      - traefik.enable=true
      # redirect service
      - traefik.http.routers.${SERVICE_NAME}-http.entrypoints=web
      - traefik.http.routers.${SERVICE_NAME}-http.rule=Host(`bumbleflies.de`) || Host(`www.bumbleflies.de`)
      - traefik.http.routers.${SERVICE_NAME}-http.middlewares=${SERVICE_NAME}-https
      - traefik.http.middlewares.${SERVICE_NAME}-https.redirectscheme.scheme=https

      # true service
      - traefik.http.routers.${SERVICE_NAME}.tls=true
      - traefik.http.routers.${SERVICE_NAME}.rule=Host(`${SERVICE_HOST}`)
      - traefik.http.routers.${SERVICE_NAME}.tls.certresolver=letsencryptdnsresolver
      - traefik.http.routers.${SERVICE_NAME}.middlewares=crawler-ratelimit@file
      # prod resolver
      - traefik.http.routers.${SERVICE_NAME}_prod.tls=true
      - traefik.http.routers.${SERVICE_NAME}_prod.rule=Host(`bumbleflies.de`) || Host(`www.bumbleflies.de`)
      - traefik.http.routers.${SERVICE_NAME}_prod.tls.certresolver=letsencrypthttpresolver
      - traefik.http.routers.${SERVICE_NAME}_local_qualified.rule=Host(`${SERVICE_NAME}.${LOCAL_HOSTNAME}`)
      - traefik.http.routers.${SERVICE_NAME}_local_qualified.entrypoints=web
      - com.centurylinklabs.watchtower.scope=dev

      # domain redirects (preserved from legacy)
      - traefik.http.routers.accceu-redirect.rule=HostRegexp(`^accceu([0-9][0-9])\.[^\/]+`)
      - traefik.http.routers.accceu-redirect.middlewares=accceu-redirect
      - traefik.http.middlewares.accceu-redirect.redirectregex.regex=accceu([0-9][0-9])\.([^\/]*)\/(.*)
      - traefik.http.middlewares.accceu-redirect.redirectregex.replacement=$$2/accceu$$1
      - traefik.http.middlewares.accceu-redirect.redirectregex.permanent=true
    environment:
      - PUID=${UID}
      - PGID=${GID}
    networks:
      - proxy
    healthcheck:
      test: wget --quiet --tries=1 --spider http://localhost/ || exit 1
      interval: 30s
    restart: unless-stopped

  bnb:
    image: bumblecode/bnb:latest
    container_name: ${COMPOSE_PROJECT_NAME}.bnb
    # The bumblecode images ship a 10s healthcheck; override only the interval
    # (Docker keeps the image's test and merges per field). Each check is a
    # docker exec, ~2.8/s host-wide, and this 4-core box is queue-bound:
    # history/2026-10-30_load-alert-tuning.md.
    healthcheck:
      interval: 30s
    env_file:
      - bnb.env
    labels:
      - traefik.enable=true
      # redirect service (plain http → https; without this, http hits the global 404 page)
      - traefik.http.routers.${SERVICE_NAME}-bnb-http.entrypoints=web
      - traefik.http.routers.${SERVICE_NAME}-bnb-http.rule=Host(`bricksnbytes.bumbleflies.de`) || Host(`bricksnbytes.de`) || Host(`www.bricksnbytes.de`)
      - traefik.http.routers.${SERVICE_NAME}-bnb-http.middlewares=${SERVICE_NAME}-bnb-https
      - traefik.http.middlewares.${SERVICE_NAME}-bnb-https.redirectscheme.scheme=https
      - traefik.http.routers.${SERVICE_NAME}-bnb.tls=true
      - traefik.http.routers.${SERVICE_NAME}-bnb.rule=Host(`bricksnbytes.bumbleflies.de`) || Host(`bricksnbytes.de`) || Host(`www.bricksnbytes.de`)
      - traefik.http.routers.${SERVICE_NAME}-bnb.tls.certresolver=letsencrypthttpresolver
      - traefik.http.services.${SERVICE_NAME}-bnb.loadbalancer.server.port=80
      - traefik.http.routers.${SERVICE_NAME}_bnb_local_qualified.rule=Host(`bricksnbytes.${SERVICE_NAME}.${LOCAL_HOSTNAME}`)
      - traefik.http.routers.${SERVICE_NAME}_bnb_local_qualified.entrypoints=web
      - com.centurylinklabs.watchtower.scope=dev
    networks:
      - proxy
    restart: unless-stopped

  edu:
    image: bumblecode/edu:latest
    container_name: ${COMPOSE_PROJECT_NAME}.edu
    healthcheck:
      interval: 30s
    labels:
      - traefik.enable=true
      # redirect service (plain http → https; without this, http hits the global 404 page)
      - traefik.http.routers.${SERVICE_NAME}-edu-http.entrypoints=web
      - traefik.http.routers.${SERVICE_NAME}-edu-http.rule=Host(`edu.bumbleflies.de`)
      - traefik.http.routers.${SERVICE_NAME}-edu-http.middlewares=${SERVICE_NAME}-edu-https
      - traefik.http.middlewares.${SERVICE_NAME}-edu-https.redirectscheme.scheme=https
      - traefik.http.routers.${SERVICE_NAME}-edu.tls=true
      - traefik.http.routers.${SERVICE_NAME}-edu.rule=Host(`edu.bumbleflies.de`)
      - traefik.http.routers.${SERVICE_NAME}-edu.tls.certresolver=letsencrypthttpresolver
      - traefik.http.services.${SERVICE_NAME}-edu.loadbalancer.server.port=80
      - traefik.http.routers.${SERVICE_NAME}_edu_local_qualified.rule=Host(`edu.${SERVICE_NAME}.${LOCAL_HOSTNAME}`)
      - traefik.http.routers.${SERVICE_NAME}_edu_local_qualified.entrypoints=web
      - com.centurylinklabs.watchtower.scope=dev
    networks:
      - proxy
    restart: unless-stopped

  live:
    image: bumblecode/live:latest
    container_name: ${COMPOSE_PROJECT_NAME}.live
    healthcheck:
      interval: 30s
    env_file:
      - live.env
    labels:
      - traefik.enable=true
      # redirect service (plain http → https; without this, http hits the global 404 page)
      - traefik.http.routers.${SERVICE_NAME}-live-http.entrypoints=web
      - traefik.http.routers.${SERVICE_NAME}-live-http.rule=Host(`live.bumbleflies.de`)
      - traefik.http.routers.${SERVICE_NAME}-live-http.middlewares=${SERVICE_NAME}-live-https
      - traefik.http.middlewares.${SERVICE_NAME}-live-https.redirectscheme.scheme=https
      - traefik.http.routers.${SERVICE_NAME}-live.tls=true
      - traefik.http.routers.${SERVICE_NAME}-live.rule=Host(`live.bumbleflies.de`)
      - traefik.http.routers.${SERVICE_NAME}-live.tls.certresolver=letsencrypthttpresolver
      - traefik.http.services.${SERVICE_NAME}-live.loadbalancer.server.port=3000
      - traefik.http.routers.${SERVICE_NAME}_live_local_qualified.rule=Host(`live.${SERVICE_NAME}.${LOCAL_HOSTNAME}`)
      - traefik.http.routers.${SERVICE_NAME}_live_local_qualified.entrypoints=web
      - com.centurylinklabs.watchtower.scope=dev
    volumes:
      # Room persistence for live.bumbleflies.de (DATA_DIR=/data). Without this
      # the room state dies on every watchtower recreate and the room rotates —
      # killing all sent links and forcing an OBS re-import.
      - live-data:/data
    networks:
      - proxy
    restart: unless-stopped

networks:
  proxy:
    external: true

volumes:
  live-data: {}
