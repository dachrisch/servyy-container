<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background-color:#E8E9E3;
    background-image:
      linear-gradient(to right,rgba(14,26,37,.055) 1px,transparent 1px),
      linear-gradient(to bottom,rgba(14,26,37,.055) 1px,transparent 1px);
    background-size:24px 24px;
    color:#0E1A25;
    font-family:"Inter Tight",system-ui,sans-serif;
    display:flex;flex-direction:column;
    padding:56px 64px 0;
    position:relative;
  }
  .top{display:flex;align-items:baseline;justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:15px;letter-spacing:.2em;text-transform:uppercase}
  .top .l{font-weight:500}
  .top .r{font-size:12px;letter-spacing:.16em;color:#3D4A55}
  .rule{height:1px;background:#0E1A25;margin:22px 0 0}
  h1{font-size:82px;line-height:.94;letter-spacing:-.038em;font-weight:600;margin:46px 0 0;max-width:15ch}
  h1 em{font-style:normal;color:#CE5019}
  p{margin:26px 0 0;font-size:26px;line-height:1.35;color:#3D4A55;max-width:32ch;letter-spacing:-.01em}
  .cta{display:inline-flex;align-items:center;gap:14px;align-self:flex-start;margin-top:46px;background:#0E1A25;color:#E8E9E3;font-family:"IBM Plex Mono",monospace;font-size:15px;letter-spacing:.16em;text-transform:uppercase;padding:17px 26px}
  .cta svg{width:16px;height:16px}
  .foot{margin-top:auto;background:#0E1A25;color:#E8E9E3;display:flex;align-items:center;justify-content:space-between;padding:20px 64px;margin-left:-64px;margin-right:-64px;font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
  .foot span:last-child{color:#8FB6CC}
</style>
</head>
<body>
  <div class="top">
    <span class="l">Höfer Architekten</span>
    <span class="r">München</span>
  </div>
  <div class="rule"></div>
  <h1>Brandschutz, der einer Begehung <em>standhält</em>.</h1>
  <p>Konzepte, Nachweise und Mängelberichte für Bestand und Neubau.</p>

  <div class="cta">
    Begehung anfragen
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </div>

  <div class="foot">
    <span>Architekt · Sachverständiger · Fachplaner Brandschutz</span>
    <span>höfer-architekten.de</span>
  </div>
</body>
</html>
