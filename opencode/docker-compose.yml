services:
  opencode:
    image: ghcr.io/anomalyco/opencode:2.2.2
    container_name: opencode.web
    restart: unless-stopped
    entrypoint: [ "/bin/sh", "/scripts/startup.sh" ]
    environment:
      # Prepend /opencode/bin to PATH so gh wrapper is used before real gh binary
      PATH: /opencode/bin:${PATH:-/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin}
      # prune-sessions.py retention: only sessions/tool-output/snapshots older than 7 days are pruned
      OPENCODE_PRUNE_HOURS: "168"
    env_file:
      - .env
      - opencode.env
    volumes:
      - opencode_root:/root
      - shared_dev_checkouts:/root/dev
      - ./scripts:/scripts:ro
      - ./.ssh:/root/.ssh
      - ./bin:/opencode/bin:ro
      - ./skills:/root/.config/opencode/skills:ro
      - ./plugins:/root/.config/opencode/plugins:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy
    healthcheck:
      # Two assertions: liveness, then the auth contract. V2 answers /health
      # 200 without auth (V1 answered 401), so the old `grep '401 Unauthorized'`
      # probe both conflated liveness with auth and hid curl's exit status
      # behind the pipeline. An unauthenticated /api/info must still be 401 —
      # that is what catches a boot with a missing or rotated
      # OPENCODE_SERVER_PASSWORD.
      test:
        - CMD-SHELL
        - >-
          curl -fsS -o /dev/null http://127.0.0.1:4096/health &&
          curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4096/api/info | grep -qx 401
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.http.routers.${SERVICE_NAME}_root.rule=Host(`${SERVICE_ROOT_HOST}`)
      - traefik.http.routers.${SERVICE_NAME}_root.entrypoints=websecure
      - traefik.http.routers.${SERVICE_NAME}_root.tls=true
      - traefik.http.routers.${SERVICE_NAME}_root.tls.certresolver=letsencryptdnsresolver
      - traefik.http.routers.${SERVICE_NAME}_root.service=${SERVICE_NAME}
      - traefik.http.routers.${SERVICE_NAME}_root_redirect.rule=Host(`${SERVICE_ROOT_HOST}`)
      - traefik.http.routers.${SERVICE_NAME}_root_redirect.entrypoints=web
      - traefik.http.routers.${SERVICE_NAME}_root_redirect.middlewares=${SERVICE_NAME}_https_redirect
      - traefik.http.middlewares.${SERVICE_NAME}_https_redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.${SERVICE_NAME}_https_redirect.redirectscheme.permanent=true
      - traefik.http.routers.${SERVICE_NAME}.tls=true
      - traefik.http.routers.${SERVICE_NAME}.rule=Host(`${SERVICE_HOST}`)
      - traefik.http.routers.${SERVICE_NAME}.entrypoints=websecure
      - traefik.http.routers.${SERVICE_NAME}.tls.certresolver=letsencryptdnsresolver
      - traefik.http.routers.${SERVICE_NAME}.service=${SERVICE_NAME}
      - traefik.http.services.${SERVICE_NAME}.loadbalancer.server.port=4096
      - traefik.http.routers.${SERVICE_NAME}_local_qualified.rule=Host(`${SERVICE_NAME}.${LOCAL_HOSTNAME}`)
      - traefik.http.routers.${SERVICE_NAME}_local_qualified.entrypoints=web
      - com.centurylinklabs.watchtower.scope=prod
      # Ofelia (portainer.ofelia) auto-discovers these labels and runs the
      # job inside this container. prune-sessions keeps the session DB small;
      # output lands in `docker logs portainer.ofelia`.
      - ofelia.enabled=true
      - ofelia.job-exec.prune-sessions.schedule=0 4 * * *
      - ofelia.job-exec.prune-sessions.command=python3 /scripts/prune-sessions.py
      # npm's package cache has no size cap or eviction policy of its own and
      # is fully regenerable, so just clear it weekly (offset from the
      # nightly prune-sessions run above). Sunday is 7, NOT 0: this Ofelia
      # build rejects DOW 0/SUN at registration (job silently never runs).
      - ofelia.job-exec.npm-cache-clean.schedule=0 5 * * 7
      - ofelia.job-exec.npm-cache-clean.command=npm cache clean --force

volumes:
  opencode_root:
  # Fixed, explicit name so claude-hub (a separate compose project) can
  # reference this same physical volume via `external: true`. Shared
  # checkouts under /root/dev only -- opencode's own /root (opencode_root)
  # stays private. See history/2026-09-22_claude-hub-service.md.
  shared_dev_checkouts:
    name: codey_dev_checkouts

networks:
  proxy:
    external: true
