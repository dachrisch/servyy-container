services:
  # One-shot dependency updater. The systemd timer runs
  # `docker compose run --rm renovate`; nothing stays running and no port is
  # published. All credentials come from renovate.env, rendered by Ansible from
  # git-crypt secrets.yml (never read from Vaultwarden at runtime).
  renovate:
    image: renovate/renovate:44.263.3
    env_file:
      - renovate.env
    init: true
    restart: "no"
