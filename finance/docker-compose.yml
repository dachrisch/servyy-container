name: ${SERVICE_NAME}

services:
  firefly:
    image: fireflyiii/core:latest
    container_name: ${COMPOSE_PROJECT_NAME}.firefly
    restart: unless-stopped
    env_file:
      - finance.env
      - .env
    environment:
      APP_ENV: production
      APP_URL: "https://${SERVICE_HOST}"
      DB_CONNECTION: pgsql
      # Cross-project host: postgres moved to the shared project (no data moved).
      DB_HOST: shared.db
      DB_PORT: 5432
      DB_DATABASE: firefly
      DB_USERNAME: firefly
      TRUSTED_PROXIES: "**"
    volumes:
      - ${DOCKER_DATA_ROOT}/finance/upload:/var/www/html/storage/upload
    networks:
      - proxy
      - backend
      - shared_backend
    labels:
      - traefik.enable=true
      - traefik.http.routers.${SERVICE_NAME}.rule=Host(`${SERVICE_HOST}`)
      - traefik.http.routers.${SERVICE_NAME}.entrypoints=websecure
      - traefik.http.routers.${SERVICE_NAME}.tls=true
      - traefik.http.routers.${SERVICE_NAME}.tls.certresolver=letsencryptdnsresolver
      - traefik.http.services.${SERVICE_NAME}.loadbalancer.server.port=8080
      - com.centurylinklabs.watchtower.scope=prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  importer:
    image: fireflyiii/data-importer:latest
    container_name: ${COMPOSE_PROJECT_NAME}.importer
    # Image ships a 10s healthcheck; override only the interval (Docker keeps
    # the image's test). Each check is a docker exec, ~2.8/s host-wide, and this
    # 4-core box is queue-bound: history/2026-10-30_load-alert-tuning.md.
    healthcheck:
      interval: 30s
    restart: unless-stopped
    env_file:
      - finance.env
      - .env
    environment:
      FIREFLY_III_URL: "http://firefly:8080"
      VANITY_URL: "https://${SERVICE_HOST}"
      TRUSTED_PROXIES: "**"
    volumes:
      - ./import:/import:ro
    networks:
      - proxy
      - backend
    depends_on:
      - firefly
    labels:
      - traefik.enable=true
      - traefik.http.routers.${SERVICE_NAME}-importer.rule=Host(`${SERVICE_HOST_IMPORTER}`)
      - traefik.http.routers.${SERVICE_NAME}-importer.entrypoints=websecure
      - traefik.http.routers.${SERVICE_NAME}-importer.tls=true
      - traefik.http.routers.${SERVICE_NAME}-importer.tls.certresolver=letsencryptdnsresolver
      - traefik.http.services.${SERVICE_NAME}-importer.loadbalancer.server.port=8080
      - com.centurylinklabs.watchtower.scope=prod
      - ofelia.enabled=true
      - ofelia.job-exec.daily-import.schedule=0 0 5 * * *
      - ofelia.job-exec.daily-import.command=/bin/bash -c /import/run-import.sh

  queen:
    # bumbleflies finance & ops app. GATED: deploy only where the
    # finance_services host var includes queen (test-only until prod approval).
    image: bumblecode/queen:latest
    container_name: ${COMPOSE_PROJECT_NAME}.queen
    restart: unless-stopped
    env_file:
      - finance.env
      - .env
      - queen.env
    networks:
      - proxy
      - backend
      - shared_backend
    labels:
      - traefik.enable=true
      - traefik.http.routers.queen.rule=Host(`${QUEEN_SERVICE_HOST:-queen.bumbleflies.de}`)
      - traefik.http.routers.queen.entrypoints=${QUEEN_TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.queen.tls=${QUEEN_TRAEFIK_TLS:-true}
      - traefik.http.routers.queen.tls.certresolver=${QUEEN_TRAEFIK_CERTRESOLVER:-letsencryptdnsresolver}
      - traefik.http.services.queen.loadbalancer.server.port=3000
      # dev scope: 5-min poll so queen releases roll out promptly (prod scope polls 2h)
      - com.centurylinklabs.watchtower.scope=dev
      - ofelia.enabled=true
      - ofelia.job-exec.daily-reconcile.schedule=0 30 7 * * *
      - ofelia.job-exec.daily-reconcile.command=node dist/src/server/cron/reconcile.js
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  backend:
    internal: true
  proxy:
    external: true
  # Owned by the shared project — deploy shared FIRST.
  shared_backend:
    name: shared_backend
    external: true
