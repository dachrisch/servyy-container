services:
  reverse-proxy:
    # Floating on the 3.7 minor line (was `3.7.16`; that in turn replaced the
    # `3.6.1` which sat through ~24 patch releases of security and bug fixes
    # unnoticed). Patches are safe here, minor/major are NOT: Traefik parses its
    # *static* configuration strictly, so an option a newer image dropped is a
    # fatal startup error — an option an older image does not know is one too.
    # Never let this cross a minor line on its own. watchtower scope=prod pulls
    # 3.7.x within ~2 h of a release.
    # Migration notes reviewed for 3.6.1 → 3.7.16: v3.7.16/3.7.15 (CONNECT →
    # 501), 3.7.13 (h2c upgrade headers no longer forwarded, rootless targets
    # → 400), 3.7.12 (aliasHeadersStrategy), 3.7.7 (bare Host(`*`) becomes a
    # catch-all), 3.6.19 (basicAuth with an empty user list is now an error),
    # 3.6.16 (Docker API ≥ 1.40 required — hosts run 29.1.3), plus the
    # encoded-character default flip in 3.6.7 that keeps today's permissive
    # behaviour. Everything that touches us is handled in
    # traefik.yaml/dynamic.yaml; the rest is Kubernetes-only.
    # Rollback: pin the previous patch (`traefik:3.7.16`) back and run
    # `docker compose up -d --force-recreate` (see traefik/AGENTS.md).
    image: traefik:3.7
    container_name: ${COMPOSE_PROJECT_NAME}.traefik
    # ~152M resident + 11M swap measured 2026-10-29. 384m, not the tighter 256m
    # first considered: this is the one container whose death takes every site on
    # the host down with it, so it gets room for a config-reload / connection
    # burst while still bounding a real leak (2.5x current).
    mem_limit: 384m
    ports:
      - "80:80"
      - "443:443"
      # Metrics are scraped by Prometheus over the docker network (traefik.traefik:8082),
      # so publishing the port only added an internet-facing endpoint to 0.0.0.0.
    volumes:
      # To persist certificates
      - traefik-certificates:/letsencrypt
      # So that Traefik can listen to the Docker events
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yaml:/etc/traefik/traefik.yaml
      - ./dynamic.yaml:/etc/traefik/dynamic.yaml
      # Dashboard basicAuth users file, rendered from
      # plays/vars/.traefik_dashboard_password by the traefik_dashboard_auth
      # role. Writable file + file provider watch:true means password rotations
      # take effect on Traefik's next reload — no container restart.
      - ./dashboard-auth.htpasswd:/etc/traefik/dashboard-auth.htpasswd:ro
    networks:
      - proxy
    # Porkbun API keys for the DNS-01 ACME resolver live in traefik.env
    # (rendered from vars/secrets.yml), never in this file.
    env_file:
      - ./traefik.env
    labels:
      - traefik.enable=true
      - traefik.http.services.${SERVICE_NAME}.loadbalancer.server.port=888 # required by swarm but not used.
      - traefik.http.routers.${SERVICE_NAME}.rule=Host(`${SERVICE_HOST}`)
      - traefik.http.routers.${SERVICE_NAME}.entrypoints=websecure
      - traefik.http.routers.${SERVICE_NAME}.tls.certresolver=letsencryptdnsresolver
      - traefik.http.routers.${SERVICE_NAME}.service=api@internal
      - traefik.http.routers.${SERVICE_NAME}.middlewares=traefik-auth@file
      - traefik.http.routers.${SERVICE_NAME}_local_qualified.rule=Host(`${SERVICE_NAME}.${LOCAL_HOSTNAME}`)
      - traefik.http.routers.${SERVICE_NAME}_local_qualified.entrypoints=web
      - traefik.http.routers.${SERVICE_NAME}_local_qualified.service=api@internal
      - com.centurylinklabs.watchtower.scope=prod
    healthcheck:
      test: traefik healthcheck --ping
    restart: unless-stopped

  # Branded error pages: per-service 404/5xx pages for unknown or unreachable
  # Host routes. Referenced from dynamic.yaml (services error-pages +
  # error-pages-404, routers catchall-web/catchall-websecure, entrypoint
  # middleware error-pages@file) — never exposed via its own router, so
  # traefik.enable stays false.
  error-pages:
    # Floating on 4.2: this only renders the template, so patch releases are
    # uneventful and security fixes should not wait for a manual bump.
    image: ghcr.io/tarampampam/error-pages:4.2
    container_name: ${COMPOSE_PROJECT_NAME}.error-pages
    # Image ships a 10s healthcheck; override only the interval (Docker keeps
    # the image's test). Each check is a docker exec, ~2.8/s host-wide, and this
    # 4-core box is queue-bound: history/2026-10-30_load-alert-tuning.md.
    healthcheck:
      interval: 30s
    networks:
      - proxy
    volumes:
      # Custom page template (per-service slogans/illustrations). Loaded once
      # at startup; any change here recreates this container on next deploy.
      # If the mount is missing the container fails to start — Traefik then
      # falls back to its plain statuses (no loop, but no branded pages),
      # so verify the mount after deploying.
      - ./error-pages.html:/error-pages.html:ro
    environment:
      # Custom template with per-service slogans/illustrations (mounted
      # above). When set, TEMPLATE_NAME is ignored — it stays only as a
      # documented fallback and plays no active role.
      HTML_TEMPLATE: /error-pages.html
      # Built-in theme (app-down/cats/connection/ghost/hacker-terminal/l7/
      # lost-in-space/noise/orient/shuffle/win98). Ghost is clean + localized.
      TEMPLATE_NAME: ghost
      # Required: catchall routers use this as a direct backend, so the HTTP
      # status must match the rendered page (404 stays 404, not 200).
      SEND_SAME_HTTP_CODE: "true"
      # Must stay true: the server only populates the request host (.Host,
      # used for per-service dispatch in the custom template) when details
      # are enabled. Traefik's errors middleware forwards the original Host on
      # the 5xx path too, so down pages are named as well. The template
      # deliberately renders NO details table, so no request data (client IP,
      # headers) ever leaks into the page.
      SHOW_DETAILS: "true"
      # The ghost theme only renders its fixed "Go to homepage" link when this
      # is non-empty — and an explicitly empty value is honored as empty
      # (verified in upstream flag parsing + template conditional), so the
      # dead generic link stays hidden. Custom-labeled links below take its
      # place instead (their labels are freely wordable, unlike homepage's).
      HOMEPAGE_URL: ""
      # bumbleflies-flavored links + GitHub contribute invite. Absolute URLs
      # only. (Format: LABEL=URL||LABEL=URL…)
      ADD_LINK: "Buzz back home=https://bumbleflies.de||Fly with us on GitHub=https://github.com/bumbleflies"
      # JSON to stdout matches the Loki pipeline; warn keeps 4xx/5xx noise down.
      LOG_LEVEL: warn
      LOG_FORMAT: json
    labels:
      - traefik.enable=false
      - com.centurylinklabs.watchtower.scope=prod
    restart: unless-stopped

volumes:
  traefik-certificates:
networks:
  proxy:
    external: true

