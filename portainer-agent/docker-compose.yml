# portainer-agent/docker-compose.yml
# Portainer Agent (slave) running on codey.lehel.xyz.
# Exposed at a.codey.lehel.xyz via Traefik with an IP allowlist so only the
# Portainer Server (master, servy/lehel.xyz) can reach it. No raw host ports published.
services:
  agent:
    image: portainer/agent:latest
    container_name: ${COMPOSE_PROJECT_NAME}.agent
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    environment:
      AGENT_PORT: "9001"
      AGENT_SECRET: ${AGENT_SECRET}
    # Explicit agent name. portainer/agent has no -n/--name flag, so it reports
    # its container hostname (portainer.agent, which contains a dot) and Portainer
    # rejects it as an invalid environment name. Setting the container hostname to
    # a dot-free value makes the agent report "codey".
    hostname: codey
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${SERVICE_NAME}.rule=Host(`${SERVICE_HOST}`)"
      - "traefik.http.routers.${SERVICE_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${SERVICE_NAME}.tls.certresolver=letsencryptdnsresolver"
      - "traefik.http.routers.${SERVICE_NAME}.middlewares=${SERVICE_NAME}-master-allow"
      # Only the Portainer Server (master) may reach the agent. The master's
      # IPv4 egress (49.13.6.173) is allowed directly. Its IPv6 egress is
      # SNAT-masked by the host to the docker gateway (172.18.0.1) because
      # Traefik's container is IPv4-only, so the whole internal proxy network
      # (172.18.0.0/16) is also permitted -- this lets the master through over
      # IPv6 without opening the agent to the public internet (external clients
      # still show their real IPs and are denied). The agent additionally
      # validates the server's signed requests.
      - "traefik.http.middlewares.${SERVICE_NAME}-master-allow.ipallowlist.sourcerange=${MASTER_IP}/32,172.18.0.0/16"
      - "traefik.http.services.${SERVICE_NAME}.loadbalancer.server.port=9001"
      # Tell Traefik the backend itself speaks HTTPS (default scheme is http://,
      # which is why the agent returned "Client sent an HTTP request to an HTTPS
      # server"). Combined with the serverstransport below (which skips cert
      # verification for the agent's self-signed cert), Traefik does the TLS hop.
      - "traefik.http.services.${SERVICE_NAME}.loadbalancer.server.scheme=https"
      # Agent serves HTTPS (use_tls=true) on 9001; Traefik must use TLS for the
      # internal hop. portainer-agent-tls is defined in traefik/dynamic.yaml.
      - "traefik.http.services.${SERVICE_NAME}.loadbalancer.serverstransport=portainer-agent-tls@file"
    # No in-container healthcheck: the portainer/agent image is distroless and
    # ships no wget/shell, so a wget-based check can never pass and Traefik would
    # treat the (working) container as unhealthy and drop the backend server.
    # Traefik therefore routes to it unconditionally.

  # openserbia/watchtower: maintained fork of containrrr/watchtower (archived
  # upstream). Adds health-check gating with automatic rollback. DOCKER_API_VERSION
  # is deliberately unset so the fork can negotiate the daemon API version.
  # Tag floats on `latest`: the fork publishes no 1.x tags, so a pin can only
  # ever be a hand-copied digest. Accepted cost — a bad upstream release takes
  # the updater itself down, and nothing pinned is left to fall back to.
  watchtower-prod:
    restart: unless-stopped
    image: openserbia/watchtower:latest
    container_name: ${COMPOSE_PROJECT_NAME}.watchtower-prod
    labels:
      - traefik.enable=false
      - com.centurylinklabs.watchtower.scope=prod
    environment:
      WATCHTOWER_SCOPE: "prod"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: 7200
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_HEALTH_CHECK_GATED: "true"
      WATCHTOWER_HEALTH_CHECK_TIMEOUT: "2m"
      WATCHTOWER_WARN_ON_HEAD_FAILURE: "never"
      WATCHTOWER_COMPOSE_DEPENDS_ON: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro

  watchtower-dev:
    restart: unless-stopped
    image: openserbia/watchtower:latest
    container_name: ${COMPOSE_PROJECT_NAME}.watchtower-dev
    labels:
      - traefik.enable=false
      - com.centurylinklabs.watchtower.scope=dev
    environment:
      WATCHTOWER_SCOPE: "dev"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: 300
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_HEALTH_CHECK_GATED: "true"
      WATCHTOWER_HEALTH_CHECK_TIMEOUT: "2m"
      WATCHTOWER_WARN_ON_HEAD_FAILURE: "never"
      WATCHTOWER_COMPOSE_DEPENDS_ON: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro

  # Local Ofelia scheduler (mirrors servy's portainer/docker-compose.yml).
  # Ofelia's --docker discovery is daemon-local, so codey containers' labels
  # (opencode prune/npm-clean, claude-hub reaper/force-cleanup) need a
  # scheduler on THIS daemon -- servy's Ofelia can never see them. Schedules
  # are UTC (TZ below). See history/2026-09-27_codey-ofelia-scheduler.md.
  ofelia-scheduler:
    image: mcuadros/ofelia:latest
    container_name: ${COMPOSE_PROJECT_NAME}.ofelia
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: "UTC"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pidof", "ofelia"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - traefik.enable=false
      - com.centurylinklabs.watchtower.scope=prod
      - ofelia.enabled=true
      - ofelia.job-local.heartbeat.schedule=@every 1h
      - ofelia.job-local.heartbeat.command=date

networks:
  proxy:
    external: true
