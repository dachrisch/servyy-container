services:
  hub:
    image: node:26-alpine
    container_name: ${COMPOSE_PROJECT_NAME}.hub
    restart: unless-stopped
    entrypoint: [ "/bin/sh", "/scripts/startup.sh" ]
    environment:
      # The 2026-09-25 fix (SHELL=/bin/sh) stopped working: this CLI version's Bash tool doesn't
      # just check that $SHELL is set, it scans /bin and /usr/bin for an actual bash or zsh binary
      # (confirmed by extracting strings from the installed CLI binary: "... is not a valid
      # bash/zsh path, falling back to detection" / "No suitable shell found ..."). /bin/sh on
      # node:24-alpine is a BusyBox ash symlink, which this check rejects regardless of $SHELL.
      # startup.sh's unpinned `npm install -g @anthropic-ai/claude-code` means this container
      # always runs whatever CLI version is newest, so a tightened check like this can regress
      # with no local change at all -- which is what happened here. Real fix: an actual bash
      # binary (installed in startup.sh) plus both env vars the CLI honors, in priority order --
      # CLAUDE_CODE_SHELL is checked first as an explicit override, SHELL as the fallback. See
      # history/2026-09-25_claude-hub-shell-env-fix.md and
      # history/2026-09-26_claude-hub-worktree-dispatch-rework.md.
      - CLAUDE_CODE_SHELL=/bin/bash
      - SHELL=/bin/bash
      # No in-place CLI self-updates: startup.sh's `npm install -g` at container boot is the only
      # upgrade path. A mid-flight npm-global update swaps the claude binary under running
      # sessions: the --bg daemon notices the mtime change and self-restarts (it re-adopts live
      # workers, so sessions survive), but while npm replaces the /usr/local/bin/claude symlink
      # every CLI call fails with ENOENT -- which is how the reaper printed
      # `reaper-blocked agents_failed: spawnSync /usr/local/bin/claude ENOENT` on 2026-09-29.
      # See history/2026-09-29_claude-hub-ssh-rewrite-and-bg-retire.md.
      - DISABLE_AUTOUPDATER=1
      # Vendored dispatch/lifecycle scripts (see claude-hub/vendor/VENDORED.md) read/expect these
      # two -- both our own naming, not the third-party source's. See
      # history/2026-09-26_claude-hub-worktree-dispatch-rework.md.
      - CLAUDE_HUB_VENDOR_ROOT=/opt/vendor
      - CLAUDE_HUB_CONFIG=/root/.claude/claude-hub.json
    env_file:
      - .env
      - claude-hub.env
    volumes:
      - claude_hub_root:/root
      - shared_dev_checkouts:/root/dev
      - ./scripts:/scripts:ro
      - ./skills:/root/.claude/skills:ro
      - ./vendor:/opt/vendor:ro
    healthcheck:
      test: ["CMD-SHELL", "tmux has-session -t hub"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - traefik.enable=false
      # Container housekeeping runs on codey's Ofelia scheduler
      # (portainer-agent.ofelia) -- the single scheduler for codey container
      # jobs. Schedules are UTC. Reaper parks idle sessions hourly (reversible
      # via revive); force-cleanup's 04:00 UTC preserves the old systemd
      # timer's Sun 06:00 host-local fire instant. Sunday is 7, NOT 0: this
      # Ofelia build rejects DOW 0/SUN at registration (job silently never
      # runs). See history/2026-09-27_codey-ofelia-scheduler.md.
      - ofelia.enabled=true
      - ofelia.job-exec.hub-reaper.schedule=@every 1h
      - ofelia.job-exec.hub-reaper.command=node /opt/vendor/skills/session-reaper/scripts/session-reaper.mjs --action run --text
      - ofelia.job-exec.hub-force-cleanup.schedule=0 4 * * 7
      - ofelia.job-exec.hub-force-cleanup.command=sh /scripts/force-cleanup-stale.sh

volumes:
  claude_hub_root:
  # Shared with opencode's checkouts at /root/dev (opencode/docker-compose.yml
  # defines the volume; must be deployed before/with claude-hub for this
  # external reference to resolve -- see
  # history/2026-09-22_claude-hub-service.md). claude-hub's own /root/worktrees
  # stays private on claude_hub_root, not shared.
  shared_dev_checkouts:
    external: true
    name: codey_dev_checkouts
