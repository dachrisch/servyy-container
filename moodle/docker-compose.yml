# Moodle (OFFD / Flag Academy) — https://offd.de
#
# Replaces the €15/month FTP-only shared-hosting instance Christoph maintains by
# hand. Plan, verified baseline and runbook: docs/plans/2026-10-27-moodle-offd-hosting.md
#
# Uses the maintained `erseco/alpine-moodle` image (nginx + php-fpm + cron in one
# container, configured entirely through env vars) instead of a self-built image,
# so image/PHP patches are a tag bump we can automate — see AGENTS.md.
#
# Served at the ROOT of its hostname, not at a subpath: upstream Moodle does not
# support path-based serving (erseco docs, issue #127), and the prebuilt image
# owns its docroot. That decision is why the imported DB needs a one-time
# wwwroot search-replace; see the plan's Task 5.
name: moodle

services:
  db:
    # mariadb:12.3 — floats patches inside the 12.3 line (the pinned digest was
    # 12.3.3, the same build photoprism.mariadb runs). Never cross a major:
    # MariaDB cannot open a newer data dir, and this volume holds Moodle's data.
    # No watchtower label, so a bump arrives with a deploy, not unattended.
    image: mariadb:12.3
    container_name: ${COMPOSE_PROJECT_NAME}.db
    restart: unless-stopped
    env_file:
      - db.env
    command:
      # Moodle is happy with utf8mb4/unicode_ci; the buffer pool is capped so a
      # large query cannot push the host into swap (servy runs LeagueSphere prod
      # on the same 8 GB).
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
    volumes:
      # Existing server storage (prod: <service dir>/data), never the CIFS
      # Storage Box: no safe fsync/locking for InnoDB, and it is the backup
      # target. No `user:` override — the image entrypoint takes ownership.
      - ${MOODLE_DATA_ROOT}/mariadb:/var/lib/mysql
    networks:
      - internal
    # 1G: 256M InnoDB buffer pool + connections + the 1.6G imported dataset's
    # working set. At 768m a third of the buffer pool lived in swap.
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 30s
      timeout: 5s
      retries: 5

  # The service name is NOT cosmetic: Compose registers it as a DNS alias on the
  # `proxy` network, which every other service on this host shares. It must be
  # globally unique here.
  #
  # 2026-10-27: this was named `app` and took leaguesphere.app down for ~10
  # minutes. leaguesphere's frontend re-resolves `app:8000` every 5 s; with the
  # alias `app` claimed by two containers, DNS round-robined it onto this
  # Moodle, which 502'd, so Traefik withdrew LeagueSphere's routers. Deliberately
  # NOT renamed to `web` (also generic: bnb-office.web, dontforget.web); the
  # unique alias `moodle` cannot collide.
  moodle:
    # Renovate watches this tag (docker-compose manager) and opens PRs for
    # v4.5.x patch bumps. `v4.5.12` was deliberately NOT used even though it
    # matches live offd.de's version: that image was built 2026-07-29 and ships
    # PHP 8.3.15 (Dec 2024) — exposed to a pile of PHP CVEs including the
    # 2026-10-21 criticals. v4.5.15 ships PHP 8.3.36 (patched). Migrating
    # 4.5.12 → 4.5.15 is a patch-level DB upgrade the image runs itself.
    image: erseco/alpine-moodle:v4.5.15
    container_name: ${COMPOSE_PROJECT_NAME}.moodle
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      # DB_* / SITE_URL / SSLPROXY / MOODLE_* / SMTP_* — rendered by Ansible.
      - app.env
    volumes:
      # dataroot only: the code tree stays immutable in the image, and plugins
      # are declared through the PLUGINS env var (app.env.j2) instead of drifting
      # inside a mutable html volume.
      - ${MOODLE_DATA_ROOT}/moodledata:/var/www/moodledata
      # php-fpm pool limits: the image ships pm.max_children = 100 against a
      # per-request memory_limit inside this container's mem_limit, which is how
      # the imported site produced 702 cgroup OOM kills in a week. Loaded after
      # the image's www.conf (zz- prefix), so it wins.
      - ./php-fpm-limits.conf:/etc/php83/php-fpm.d/zz-limits.conf:ro
    networks:
      - internal
      - proxy
    # 1.5G: 5 php-fpm children x 256M memory_limit + nginx + the image's cron
    # loop inside one container. 768m could not hold two real course pages.
    mem_limit: 1.5g
    healthcheck:
      # TCP reachability of nginx. Deliberately not an HTTP 2xx probe: during
      # first-boot install and during an upgrade Moodle answers 303/503 while
      # being perfectly healthy.
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 8080) ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    labels:
      - traefik.enable=true
      - traefik.http.routers.${SERVICE_NAME}.rule=Host(`${SERVICE_HOST}`)
      - traefik.http.routers.${SERVICE_NAME}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${SERVICE_NAME}.tls=${TRAEFIK_TLS:-true}
      # HTTP-01, not the default DNS-01: that resolver is bound to Porkbun, and
      # neither offd.de (All-Inkl) nor leaguesphere.app (GoDaddy) is in scope —
      # same reason as bnb-office.
      - traefik.http.routers.${SERVICE_NAME}.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypthttpresolver}
      # nginx runs unprivileged on 8080 inside the container.
      - traefik.http.services.${SERVICE_NAME}.loadbalancer.server.port=8080
      # http -> https
      - traefik.http.routers.${SERVICE_NAME}-http.entrypoints=web
      # Gated on TLS: on servyy-test (TRAEFIK_TLS=false) the host has no https
      # listener at all, so a redirect would blackhole every request. The rule
      # falls back to a reserved non-matching host, same trick as bnb-office.
      - traefik.http.routers.${SERVICE_NAME}-http.rule=Host(`${TRAEFIK_HTTP_REDIRECT_HOST:-moodle-http-redirect.invalid}`)
      - traefik.http.routers.${SERVICE_NAME}-http.middlewares=${SERVICE_NAME}-https-redirect
      - traefik.http.middlewares.${SERVICE_NAME}-https-redirect.redirectscheme.scheme=https

networks:
  internal:
    internal: true
  proxy:
    external: true
