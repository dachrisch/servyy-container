services:
  groceries:
    image: dachrisch/groceries-order-tracking:latest
    container_name: ${COMPOSE_PROJECT_NAME}.groceries
    restart: unless-stopped
    env_file:
      - .env           # Generic variables (SERVICE_HOST, etc.)
      - groceries.env  # Service-specific secrets
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.${SERVICE_NAME}.tls=true
      - traefik.http.routers.${SERVICE_NAME}.rule=Host(`${SERVICE_HOST}`)
      - traefik.http.routers.${SERVICE_NAME}.tls.certresolver=letsencryptdnsresolver
      # No error-pages-404@file here on purpose: the app's SPA serves its own
      # 200 page for every browser path, so the only 404s are JSON API
      # responses ({"error":"API endpoint not found"}) — branding those with an
      # HTML page would corrupt them for API clients.
      - traefik.http.routers.${SERVICE_NAME}.middlewares=crawler-ratelimit@file
      - traefik.http.routers.${SERVICE_NAME}_local_qualified.rule=Host(`${SERVICE_NAME}.${LOCAL_HOSTNAME}`)
      - traefik.http.routers.${SERVICE_NAME}_local_qualified.entrypoints=web
      - com.centurylinklabs.watchtower.scope=dev
    healthcheck:
      test: node healthcheck.js
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  proxy:
    external: true
