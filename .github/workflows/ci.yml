---
name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

# A new push to a PR supersedes the previous run; cancel it instead of paying
# for two suites. Pushes to master are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every heavy job below is conditional on the paths a change touches, and a
  # SKIPPED job creates no check run at all - which is why the single required
  # status check is the always-running `gate` at the bottom, never an individual
  # job or a matrix entry. Never add `paths:` to the workflow trigger either: the
  # workflow would then not report at all on a docs-only PR and the required
  # check would wait forever instead of passing.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-26.04
    permissions:
      # job-level permissions replace the workflow defaults, so `contents` must
      # be granted explicitly or checkout has no token
      contents: read
      pull-requests: read
    outputs:
      ansible: ${{ steps.changed.outputs.ansible }}
      python: ${{ steps.changed.outputs.python }}
      compose: ${{ steps.changed.outputs.compose }}
      opencode: ${{ steps.changed.outputs.opencode }}
      ci: ${{ steps.changed.outputs.ci }}
      yamllint: ${{ steps.changed.outputs.yamllint }}
      ansible_files: ${{ steps.files.outputs.ansible_files }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Push events diff `github.event.before`..`after`; both commits have to
          # be in the clone or the detector sees no change on master.
          fetch-depth: 0

      - name: Classify the change
        id: changed
        uses: dorny/paths-filter@v4
        with:
          # The default quantifier is `some`, under which a leading `!` means "a
          # file that is NOT this" and therefore matches every non-markdown
          # file's opposite - measured 2026-11-20: a lone
          # .github/workflows/README.md returned ansible=true and ci=true and
          # ran the whole suite. `every` requires ONE file to satisfy every
          # pattern, which is the "code path and not a doc" semantics meant here.
          predicate-quantifier: every
          filters: |
            ansible:
              - 'ansible/**'
              - '!**/*.md'
            python:
              - '**/*.py'
            compose:
              - '**/docker-compose*.yml'
            opencode:
              - 'opencode/**'
              - '!**/*.md'
            ci:
              - '.github/**'
              - '!**/*.md'
            yamllint:
              - '.yamllint.yml'

      # Second pass, list mode: the molecule planner needs the actual paths under
      # ansible/, not a boolean. dorny/paths-filter publishes the list to
      # `<filter>_files` (so `ansible_files`), while `ansible` stays the boolean.
      - name: List changed ansible paths
        id: files
        uses: dorny/paths-filter@v4
        with:
          list-files: json
          filters: |
            ansible:
              - 'ansible/**'

  # The lints read ansible/ (yamllint only ever looks at ansible/plays), so they
  # are meaningless - and skipped - for a compose or docs change.
  lint-yaml:
    name: Lint YAML
    needs: [changes]
    if: >-
      needs.changes.outputs.ansible == 'true' || needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.yamllint == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install yamllint
        run: pip install yamllint==1.38.0

      - name: Build yamllint ignore for git-crypt encrypted files
        run: |
          : > /tmp/yamllint-encrypted.txt
          for f in $(git ls-files | grep -E '\.ya?ml$'); do
            a=$(git check-attr filter -- "$f" 2>/dev/null | awk '{print $3}' || true)
            if [ "$a" = "git-crypt" ]; then
              echo "$f" >> /tmp/yamllint-encrypted.txt
            fi
          done
          python3 - <<'PY'
          import yaml
          with open('.yamllint.yml') as fh:
              cfg = yaml.safe_load(fh)
          with open('/tmp/yamllint-encrypted.txt') as fh:
              extra = [l.strip() for l in fh if l.strip()]
          existing = cfg.get('ignore', '')
          if isinstance(existing, str):
              lines = [l for l in existing.splitlines() if l.strip()]
          else:
              lines = list(existing)
          cfg['ignore'] = '\n'.join(lines + extra) + '\n'
          with open('.yamllint.yml', 'w') as fh:
              yaml.safe_dump(cfg, fh, sort_keys=False)
          PY

      - name: YAML Lint
        run: yamllint -c .yamllint.yml ansible/plays

  lint-ansible:
    name: Ansible Lint
    needs: [changes]
    if: needs.changes.outputs.ansible == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd ansible
          pip install ansible-lint ansible>=2.11 dnspython jmespath
          ansible-galaxy install -r requirements.yml

      - name: Stub git-crypt encrypted files
        run: .github/scripts/stub-gitcrypt-files.sh

      - name: Run ansible-lint
        run: |
          cd ansible
          ansible-lint --force-color --show-relpath

  lint-python:
    name: Lint Python (Custom Modules)
    needs: [changes]
    # `compose` belongs here: the architecture selftest below parses every
    # */docker-compose.yml, and it is the ONLY CI coverage a compose edit has.
    if: >-
      needs.changes.outputs.ansible == 'true' || needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.compose == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install linting tools
        run: pip install flake8 pylint pyyaml

      # The map itself is git-crypt encrypted, so CI cannot read it (and must not
      # be given the key). What CI CAN prove is that the derivation still parses
      # every compose file — the part that breaks silently when a service is added
      # or a label changes shape. Drift against the map is checked where the key
      # lives: `python3 architecture/render.py --verify --verify-host …`.
      - name: Architecture renderer self-test
        run: python3 architecture/render.py --selftest

      - name: Flake8
        run: |
          cd ansible
          # Only lint directories that exist
          if [ -d "plugins" ]; then
            flake8 library/ plugins/ --max-line-length=120
          else
            flake8 library/ --max-line-length=120
          fi

      - name: Pylint
        run: |
          cd ansible
          # Disable pylint warnings for existing code patterns
          pylint library/json_patch.py --disable=C0103,R0912,R0915,C0209,W0613,R1705,W0707,R1720,R1710,W0612,R0911,C0116,R1735 --fail-under=6.0

  test-opencode-scripts:
    name: OpenCode boot script contracts
    needs: [changes]
    # Only the container's boot scripts can break this; docs edits cannot.
    if: >-
      needs.changes.outputs.opencode == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: apk bootstrap contract tests
        run: sh opencode/tests/test_apk_bootstrap.sh

  syntax-check:
    name: Ansible Syntax Check
    needs: [changes]
    if: needs.changes.outputs.ansible == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        playbook:
          - servyy.yml
          - plays/system.yml
          - plays/user.yml
          - plays/leaguesphere.yml
          - plays/testing.yml
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Ansible
        run: |
          pip install ansible>=2.11 dnspython jmespath
          ansible-galaxy install -r ansible/requirements.yml

      - name: Create mock encrypted files
        run: |
          # Create placeholder encrypted files for syntax check
          mkdir -p ansible/plays/vars

          # Remove encrypted files first to ensure clean slate
          rm -f ansible/plays/vars/secrets.yml
          rm -f ansible/plays/vars/secret_leaguesphere.yaml
          rm -f ansible/plays/vars/ssh_jail.yaml
          rm -f ansible/plays/roles/user/defaults/main.yaml
          rm -f ansible/plays/roles/testing/defaults/main.yaml

          # Mock secrets.yml
          cat > ansible/plays/vars/secrets.yml <<'EOF'
          ---
          storagebox_credentials:
            host: "mock.example.com"
            share: "backup"
            user: "mockuser"
            pass: "mockpass"
          servyy_git_repo:
            hostname: "git.example.com"
            username: "mockuser"
            password: "mockpass"
          create_user: testuser
          EOF

          # Mock secret_leaguesphere.yaml
          cat > ansible/plays/vars/secret_leaguesphere.yaml <<'EOF'
          ---
          ls:
            user: lsuser
          ssh_chroot_jail_path: /test/jail
          ssh_chroot_jail_group_name: testgroup
          EOF

          # Mock ssh_jail.yaml (overwrite encrypted file)
          cat > ansible/plays/vars/ssh_jail.yaml <<'EOF'
          ---
          ssh_chroot_jail_users: []
          extra_ssh_chroot_jail_dirs: []
          EOF

          # Mock encrypted role defaults
          cat > ansible/plays/roles/user/defaults/main.yaml <<'EOF'
          ---
          # Mock defaults for CI testing
          docker:
            services: []
          EOF

          cat > ansible/plays/roles/testing/defaults/main.yaml <<'EOF'
          ---
          # Mock defaults for CI testing
          testing:
            extra_hosts: []
          EOF

          # Mock encrypted ls_* role files (LeagueSphere deployment)
          # These roles are git-crypt encrypted - remove and recreate with stubs
          for role in ls_setup ls_app_dev ls_app_stage ls_app_prod ls_access ls_db_sync ls_app ls_demo; do
            # Remove encrypted role directory completely
            rm -rf ansible/plays/roles/$role

            # Recreate with minimal stub structure
            mkdir -p ansible/plays/roles/$role/{tasks,defaults,handlers,templates}

            cat > ansible/plays/roles/$role/tasks/main.yml <<'EOFR'
          ---
          # Mock task file for CI testing
          - name: Mock task for $role
            debug:
              msg: "This is a mock role for CI testing"
          EOFR

            cat > ansible/plays/roles/$role/defaults/main.yml <<'EOFR'
          ---
          # Mock defaults for CI testing
          EOFR

            cat > ansible/plays/roles/$role/handlers/main.yml <<'EOFR'
          ---
          # Mock handlers for CI testing
          EOFR
          done

      - name: Stub remaining git-crypt encrypted files
        run: .github/scripts/stub-gitcrypt-files.sh

      - name: Syntax check ${{ matrix.playbook }}
        run: |
          cd ansible
          ansible-playbook ${{ matrix.playbook }} --syntax-check -i testing

  # Deliberately unconditional: it is ~20s, and a docs-only PR is exactly how
  # a secret ends up committed inside a .md file. The one job that must never be
  # path-gated is the one that watches the plaintext.
  git-crypt-validation:
    name: Validate git-crypt Encryption
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install git-crypt
        run: sudo apt-get update && sudo apt-get install -y git-crypt

      - name: Run validation script
        run: .github/scripts/validate-git-crypt.sh

  test-custom-modules:
    name: Test Custom Modules
    needs: [changes]
    if: >-
      needs.changes.outputs.ansible == 'true' || needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install test dependencies
        run: pip install ansible>=2.11

      - name: Run unit tests
        run: |
          cd ansible/library
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run opencode script tests
        run: |
          cd opencode/scripts
          python -m unittest test_prune_sessions -v

      - name: Run fail2ban blocklist regex tests
        run: |
          cd ansible/tests/fail2ban
          python -m unittest -v test_blocklist_regex

      # WP-8R R8: `dbops dump-due` decides who the one db-backup@<tier> unit
      # dumps. The test renders the real template and proves the three behaviours
      # the unit depends on: nothing due on an immediate re-run, a missed run is
      # caught up, and a tenant owned by another mechanism is never returned.
      - name: Run dbops dump-due tests
        run: |
          cd ansible/tests/dbops_dump_due
          python -m unittest -v test_dump_due

      # WP-8R follow-up: the dump root holds `new/` + `current/` and nothing
      # else, because a loose file there is in no snapshot and no probe (a 107 MB
      # PhotoPrism dump sat invisible for a day). Proves `dbops dump` stages into
      # new/ and that `dbops verify` reads current/, from the rendered script.
      - name: Run dbops dump-layout tests
        run: |
          cd ansible/tests/dbops_dump_layout
          python -m unittest -v test_dump_layout

      # WP-8R follow-up: the MariaDB scratch readiness must not accept the
      # TEMPORARY init server ("ready for connections", @@port = 0) as ready —
      # measured: the firefly drill's readiness returned, the temp server stopped
      # immediately after, and the import died with ERROR 2002. Replays the real
      # startup timeline against the rendered drill script.
      - name: Run restore-drill readiness race test
        run: |
          cd ansible/tests/restore_drill_ready
          python -m unittest -v test_ready

      # The db-access reaper judged a person's whole ledger history: MIN(created_at)
      # over every row with the same deterministic db_user, so a session minted
      # today was 'past-cap' because a row from a week ago was still there
      # (measured 2026-11-20: dropped 3m50s after activation). Renders the real
      # template and pins the cap to the rows that back the account.
      - name: Run db-access reap verdict tests
        run: |
          cd ansible/tests/dbaccess_reap
          python -m unittest -v test_reap_verdict

      # Path gating is only safe if the matrix it selects is trustworthy. These
      # pin that the baseline scenarios run on every ansible change, that shared
      # or unattributable paths widen to the full matrix, and that this
      # repository's manifest and its molecule/ directories agree in both
      # directions - a scenario without an entry used to mean it silently never
      # ran (portainer_rbac/default).
      - name: Run molecule matrix planner tests
        run: |
          cd ansible/tests/ci_matrix
          python -m unittest -v test_molecule_matrix

  # Turns "which files changed" into the molecule matrix. The eight `baseline`
  # entries - exactly the contexts the master ruleset used to require by name -
  # run on every ansible change; the rest join only when their own role changed.
  # Shared ansible paths, a .github/ change, an unknown role, or any drift
  # between the manifest and the roles on disk widen it to everything.
  molecule-plan:
    name: Plan Molecule Matrix
    needs: [changes]
    if: needs.changes.outputs.ansible == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-26.04
    outputs:
      include: ${{ steps.plan.outputs.include }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Plan the matrix
        id: plan
        env:
          ANSIBLE_FILES: ${{ needs.changes.outputs.ansible_files }}
          CI_CHANGED: ${{ needs.changes.outputs.ci }}
        run: >-
          python3 .github/scripts/molecule_matrix.py
          --manifest .github/molecule-matrix.yml
          --changed-files-json "$ANSIBLE_FILES"
          --ci-changed "$CI_CHANGED"
          --github-output "$GITHUB_OUTPUT"

  molecule-test:
    name: Molecule Test (${{ matrix.role }}/${{ matrix.scenario }})
    needs: [changes, molecule-plan, lint-yaml, lint-ansible, lint-python, syntax-check]
    if: needs.changes.outputs.ansible == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      # A skipped `molecule-plan` publishes no outputs, and `fromJSON('')` is a
      # fatal expression error, so fall back to a one-entry sentinel that the
      # `if` above never lets run. The planner itself never emits an empty list
      # (the baseline guarantees >= 8 entries).
      matrix:
        include: ${{ fromJSON(needs.molecule-plan.outputs.include || '[{"role":"skip","scenario":"skip"}]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Molecule and dependencies
        run: |
          pip install molecule molecule-plugins[docker] ansible>=2.11 dnspython jmespath docker
          ansible-galaxy install -r ansible/requirements.yml

      - name: Create mock encrypted files
        run: |
          # Create placeholder encrypted files for testing
          mkdir -p ansible/plays/vars

          # Remove encrypted files first to ensure clean slate
          rm -f ansible/plays/vars/secrets.yml
          rm -f ansible/plays/vars/secret_leaguesphere.yaml
          rm -f ansible/plays/vars/ssh_jail.yaml
          rm -f ansible/plays/roles/user/defaults/main.yaml
          rm -f ansible/plays/roles/testing/defaults/main.yaml

          # Mock secrets.yml
          cat > ansible/plays/vars/secrets.yml <<'EOF'
          ---
          storagebox_credentials:
            host: "mock.example.com"
            share: "backup"
            user: "mockuser"
            pass: "mockpass"
          servyy_git_repo:
            hostname: "git.example.com"
            username: "mockuser"
            password: "mockpass"
          create_user: testuser
          monit:
            email: "test@example.com"
            smtp:
              host: "smtp.example.com"
              port: 587
              account: "testuser"
              password: "testpass"
          restic:
            logs:
              backup_home: "/var/log/restic-backup-home.log"
              backup_root: "/var/log/restic-backup-root.log"
              forget: "/var/log/restic-forget.log"
              check: "/var/log/restic-check.log"
          storagebox:
            mount: "/mnt/storagebox"
          EOF

          # Mock secret_leaguesphere.yaml
          cat > ansible/plays/vars/secret_leaguesphere.yaml <<'EOF'
          ---
          ls:
            user: lsuser
          ssh_chroot_jail_path: /test/jail
          ssh_chroot_jail_group_name: testgroup
          EOF

          # Mock ssh_jail.yaml
          cat > ansible/plays/vars/ssh_jail.yaml <<'EOF'
          ---
          ssh_chroot_jail_users: []
          extra_ssh_chroot_jail_dirs: []
          EOF

          # Mock encrypted role defaults
          cat > ansible/plays/roles/user/defaults/main.yaml <<'EOF'
          ---
          # Mock defaults for CI testing
          docker:
            services: []
          EOF

          cat > ansible/plays/roles/testing/defaults/main.yaml <<'EOF'
          ---
          # Mock defaults for CI testing
          testing:
            extra_hosts: []
          EOF

          # Mock encrypted ls_* role files
          for role in ls_setup ls_app_dev ls_app_stage ls_app_prod ls_access ls_db_sync ls_app; do
            rm -rf ansible/plays/roles/$role
            mkdir -p ansible/plays/roles/$role/{tasks,defaults,handlers,templates}

            cat > ansible/plays/roles/$role/tasks/main.yml <<'EOFR'
          ---
          # Mock task file for CI testing
          - name: Mock task for $role
            debug:
              msg: "This is a mock role for CI testing"
          EOFR

            cat > ansible/plays/roles/$role/defaults/main.yml <<'EOFR'
          ---
          # Mock defaults for CI testing
          EOFR

            cat > ansible/plays/roles/$role/handlers/main.yml <<'EOFR'
          ---
          # Mock handlers for CI testing
          EOFR
          done

      - name: Run Molecule test (${{ matrix.role }}/${{ matrix.scenario }})
        run: |
          cd ansible/plays/roles/${{ matrix.role }}
          molecule test --scenario-name ${{ matrix.scenario }}
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          ANSIBLE_LIBRARY: ${{ github.workspace }}/ansible/library

  # The single required status check ("CI Gate" on the master ruleset).
  #
  # Every job above is path-conditional and a skipped job publishes no check run,
  # so requiring jobs by name means requiring checks that will never appear on a
  # docs-only PR - the "Expected - waiting for status" deadlock. This job always
  # runs, reads the real results of the jobs it needs, and reports one verdict:
  # success/skipped pass, failure/cancelled fail. It also means adding or
  # renaming a job no longer needs a ruleset edit, which is how the old ruleset
  # came to require 8 of 16 molecule entries.
  gate:
    name: CI Gate
    if: always()
    needs:
      - changes
      - lint-yaml
      - lint-ansible
      - lint-python
      - syntax-check
      - git-crypt-validation
      - test-custom-modules
      - test-opencode-scripts
      - molecule-plan
      - molecule-test
    runs-on: ubuntu-26.04
    steps:
      - name: Aggregate results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS"])
          if not needs:
              print("CI Gate: no upstream job results were reported", file=sys.stderr)
              sys.exit(1)

          width = max(len(job) for job in needs)
          bad = {}
          for job in sorted(needs):
              result = needs[job].get("result", "unknown")
              print(f"{job:<{width}}  {result}")
              if result not in ("success", "skipped"):
                  bad[job] = result

          if bad:
              summary = ", ".join(f"{job}={res}" for job, res in sorted(bad.items()))
              print(f"\nCI Gate: FAILED - {summary}", file=sys.stderr)
              sys.exit(1)
          print("\nCI Gate: every needed job succeeded or was not required for these paths")
          PY
