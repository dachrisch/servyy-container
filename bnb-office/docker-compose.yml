# BricksnBytes office app (IBS — Imperiales Sicherheitsbüro), issue
# bumbleflies/bricksnbytes#105. App image is built from the backoffice/
# folder of bumbleflies/bricksnbytes (PHP 8.3 + Apache, published as
# bumblecode/ibs). Storage is a project-internal MariaDB sidecar —
# deliberately NOT the shared data layer: relational schema (FKs,
# transactions), gapless invoice numbers, and it holds third-party
# personal data that must stay isolated from our own service upgrades
# (dontforget.mongo / job-search-mongodb precedent).
name: bnb-office

services:
  db:
    # Pinned to the digest already running on servy (mariadb:lts,
    # 12.3.3-MariaDB via photoprism.mariadb) — zero image pull on prod.
    image: mariadb@sha256:f4054da26e3a9dd6c8b5cc97363e544408b15c0fb369d7359c25dc04826eb6e1
    container_name: ${COMPOSE_PROJECT_NAME}.db
    restart: unless-stopped
    env_file:
      - db.env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: bumblecode/ibs:latest
    container_name: ${COMPOSE_PROJECT_NAME}.web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
      - app.env
    environment:
      DB_HOSTNAME: ${COMPOSE_PROJECT_NAME}.db
      DB_PORT: "3306"
    volumes:
      # Pre-migration safety dumps from the image entrypoint.
      - web_backups:/backups
    networks:
      - internal
      - proxy
    mem_limit: 192m
    labels:
      - traefik.enable=true
      - traefik.http.routers.${SERVICE_NAME}.rule=Host(`${SERVICE_HOST}`)
      - traefik.http.routers.${SERVICE_NAME}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${SERVICE_NAME}.tls=${TRAEFIK_TLS:-true}
      # HTTP-01, not the default DNS-01: that resolver is bound to Porkbun
      # and bricksnbytes.de is at Strato, so DNS-01 cannot issue for it
      # (same reason as dontforget's BUMBLEFLIES_HOST router).
      - traefik.http.routers.${SERVICE_NAME}.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypthttpresolver}
      - traefik.http.services.${SERVICE_NAME}.loadbalancer.server.port=80
      # Alternative public host (TRAEFIK_ALT_HOST, e.g. ibs.bumbleflies.de) as a
      # SEPARATE router so its Let's Encrypt certificate issues on its own: the
      # primary host's cert is blocked until its DNS is pointed here, and a
      # combined router (Host(a) || Host(b)) would fail both names together.
      - traefik.http.routers.${SERVICE_NAME}-alt.rule=Host(`${TRAEFIK_ALT_HOST}`)
      - traefik.http.routers.${SERVICE_NAME}-alt.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${SERVICE_NAME}-alt.tls=${TRAEFIK_TLS:-true}
      - traefik.http.routers.${SERVICE_NAME}-alt.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypthttpresolver}
      - traefik.http.routers.${SERVICE_NAME}-alt.service=${SERVICE_NAME}
      - traefik.http.routers.${SERVICE_NAME}-http.entrypoints=web
      - traefik.http.routers.${SERVICE_NAME}-http.rule=Host(`${TRAEFIK_HTTP_REDIRECT_HOST:-ibs-http-redirect.invalid}`)
      - traefik.http.routers.${SERVICE_NAME}-http.middlewares=${SERVICE_NAME}-https-redirect
      - traefik.http.middlewares.${SERVICE_NAME}-https-redirect.redirectscheme.scheme=https
      - com.centurylinklabs.watchtower.scope=dev

networks:
  internal:
    internal: true
  proxy:
    external: true

volumes:
  db_data:
  web_backups:
