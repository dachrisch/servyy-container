# BricksnBytes office app (IBS — Imperiales Sicherheitsbüro), issue
# bumbleflies/bricksnbytes#105. App image is built from the backoffice/
# folder of bumbleflies/bricksnbytes (PHP 8.3 + Apache, published as
# bumblecode/ibs).
#
# DATABASE: the BUSINESS TIER, `db-business.mariadb`, reached on the internal
# `db_business_backend` network. The project-internal MariaDB sidecar this file
# used to own is deliberately gone: the data was copied onto the tier in WP-5a
# and the app points there since WP-5b (2026-11-18). The old `bnb-office.db`
# container is STOPPED, not deleted, for a week of rollback — `docker start
# bnb-office.db` plus reverting this file's DB_HOSTNAME is the whole rollback.
# Do not `docker rm` it: its volume becomes unreferenced, and the daily
# `docker system prune --volumes` would then delete the rollback data.
#
# Why a separate MariaDB server at all (rather than the shared data layer or an
# app-owned sidecar): the schema is relational (FKs, transactions), invoice
# numbers must stay gapless, and it holds another company's personal data that
# must stay isolated from our own service upgrades. The tier keeps MariaDB's
# DEFAULT transaction isolation for the same reason (see
# db-business/docker-compose.yml).
#
# Plan: docs/plans/2026-11-17_db-tier-topology.md (Phase 4) and
# docs/plans/2026-11-18_db-tier-work-packages.md (WP-5).
name: bnb-office

services:
  web:
    image: bumblecode/ibs:latest
    container_name: ${COMPOSE_PROJECT_NAME}.web
    restart: unless-stopped
    env_file:
      - .env
      - app.env
    environment:
      # Where the app reaches its database. Rendered into the project .env from
      # `bnb_office_db_host` (prod: db-business.mariadb; default:
      # ${COMPOSE_PROJECT_NAME}.db, i.e. the old sidecar name, so a host without
      # the override still resolves to a real server). Not hardcoded here any
      # more: the server now lives in another compose project, so the name is an
      # inventory decision, not this file's.
      DB_HOSTNAME: ${DB_HOSTNAME}
      DB_PORT: "3306"
    volumes:
      # Pre-migration safety dumps from the image entrypoint.
      - web_backups:/backups
    networks:
      - backend
      - proxy
    mem_limit: 192m
    # The image ships a 10s healthcheck; override the interval only — Docker
    # keeps the image's test and merges the rest per field. Every check is a
    # `docker exec` and this host runs ~2.8/s, which is part of why its load
    # sits at ~2x the core count: history/2026-10-30_load-alert-tuning.md.
    healthcheck:
      interval: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.${SERVICE_NAME}.rule=Host(`${SERVICE_HOST}`)
      - traefik.http.routers.${SERVICE_NAME}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${SERVICE_NAME}.tls=${TRAEFIK_TLS:-true}
      # HTTP-01, not the default DNS-01: that resolver is bound to Porkbun
      # and bricksnbytes.de is at Strato, so DNS-01 cannot issue for it.
      # (bricksnbytes.bumbleflies.de, on the same router, would be fine.)
      - traefik.http.routers.${SERVICE_NAME}.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypthttpresolver}
      - traefik.http.services.${SERVICE_NAME}.loadbalancer.server.port=80
      # Alternative public host (TRAEFIK_ALT_HOST, e.g. ibs.bumbleflies.de) as a
      # SEPARATE router so its Let's Encrypt certificate issues on its own: the
      # primary host's cert is blocked until its DNS is pointed here, and a
      # combined router (Host(a) || Host(b)) would fail both names together.
      - traefik.http.routers.${SERVICE_NAME}-alt.rule=Host(`${TRAEFIK_ALT_HOST}`)
      - traefik.http.routers.${SERVICE_NAME}-alt.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${SERVICE_NAME}-alt.tls=${TRAEFIK_TLS:-true}
      - traefik.http.routers.${SERVICE_NAME}-alt.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypthttpresolver}
      - traefik.http.routers.${SERVICE_NAME}-alt.service=${SERVICE_NAME}
      - traefik.http.routers.${SERVICE_NAME}-http.entrypoints=web
      - traefik.http.routers.${SERVICE_NAME}-http.rule=Host(`${TRAEFIK_HTTP_REDIRECT_HOST:-ibs-http-redirect.invalid}`)
      - traefik.http.routers.${SERVICE_NAME}-http.middlewares=${SERVICE_NAME}-https-redirect
      - traefik.http.middlewares.${SERVICE_NAME}-https-redirect.redirectscheme.scheme=https
      - com.centurylinklabs.watchtower.scope=dev

networks:
  # The business tier's own network, owned by db-business/docker-compose.yml
  # (`internal: true` there: the database is reachable from attached containers
  # only, never from the host or the internet).
  backend:
    name: db_business_backend
    external: true
  proxy:
    external: true

volumes:
  web_backups:
