services:
  finance-api:
    image: dachrisch/league.finance:latest
    container_name: ${COMPOSE_PROJECT_NAME}.finance-api
    # Image ships a 10s healthcheck; override only the interval (Docker keeps
    # the image's test). Each check is a docker exec, ~2.8/s host-wide, and this
    # 4-core box is queue-bound: history/2026-10-30_load-alert-tuning.md.
    healthcheck:
      interval: 30s
    restart: unless-stopped
    env_file:
      - .env
      - leagues-finance.env
    networks:
      - proxy
      - leaguesphere_database
      - shared_backend
    labels:
      - traefik.enable=true
      - com.centurylinklabs.watchtower.scope=dev
      - traefik.http.routers.${SERVICE_NAME}.tls=true
      - traefik.http.routers.${SERVICE_NAME}.rule=Host(`finance.leaguesphere.app`)
      - traefik.http.routers.${SERVICE_NAME}.tls.certresolver=letsencrypthttpresolver
      - traefik.http.routers.${SERVICE_NAME}.middlewares=crawler-ratelimit@file

networks:
  proxy:
    external: true
  leaguesphere_database:
    external: true
  # Owned by the shared project — deploy shared FIRST.
  shared_backend:
    name: shared_backend
    external: true
